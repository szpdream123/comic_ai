openapi: 3.1.0
info:
  title: Comic AI and QianFanSync Marketing API
  version: v1
  description: >-
    Signed executor API. All timestamps are UTC RFC3339 values. Requests and
    responses never contain platform cookies, passwords, tokens, or database credentials.
servers:
  - url: https://comic-ai.example.invalid
paths:
  /api/integrations/qianfan/capabilities:
    post: { operationId: registerCapabilities, parameters: [ { $ref: '#/components/parameters/MarketingVersion' }, { $ref: '#/components/parameters/WorkerId' }, { $ref: '#/components/parameters/KeyId' }, { $ref: '#/components/parameters/Timestamp' }, { $ref: '#/components/parameters/Nonce' }, { $ref: '#/components/parameters/BodySha256' }, { $ref: '#/components/parameters/Signature' } ], requestBody: { required: true, content: { application/json: { schema: { $ref: './marketing-qianfan-v1.schema.json#/$defs/CapabilitiesRequest' } } } }, responses: { '200': { description: Executor registered, content: { application/json: { schema: { $ref: './marketing-qianfan-v1.schema.json#/$defs/CapabilitiesResponse' } } } }, '401': { $ref: '#/components/responses/SignatureRejected' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /api/integrations/qianfan/publish-jobs/next:
    post: { operationId: claimNextPublishJob, parameters: [ { $ref: '#/components/parameters/MarketingVersion' }, { $ref: '#/components/parameters/WorkerId' }, { $ref: '#/components/parameters/KeyId' }, { $ref: '#/components/parameters/Timestamp' }, { $ref: '#/components/parameters/Nonce' }, { $ref: '#/components/parameters/BodySha256' }, { $ref: '#/components/parameters/Signature' } ], requestBody: { required: true, content: { application/json: { schema: { $ref: './marketing-qianfan-v1.schema.json#/$defs/NextRequest' } } } }, responses: { '200': { description: Leased job or no task, content: { application/json: { schema: { oneOf: [ { $ref: './marketing-qianfan-v1.schema.json#/$defs/LeasedPublishJob' }, { $ref: './marketing-qianfan-v1.schema.json#/$defs/NoPublishJob' } ] } } }, '401': { $ref: '#/components/responses/SignatureRejected' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /api/integrations/qianfan/publish-jobs/{jobId}/ack:
    post: { operationId: acknowledgeDownloadedPublishJob, parameters: [ { $ref: '#/components/parameters/JobId' }, { $ref: '#/components/parameters/MarketingVersion' }, { $ref: '#/components/parameters/WorkerId' }, { $ref: '#/components/parameters/KeyId' }, { $ref: '#/components/parameters/Timestamp' }, { $ref: '#/components/parameters/Nonce' }, { $ref: '#/components/parameters/BodySha256' }, { $ref: '#/components/parameters/Signature' } ], requestBody: { required: true, content: { application/json: { schema: { $ref: './marketing-qianfan-v1.schema.json#/$defs/AckRequest' } } } }, responses: { '200': { description: Delivery acknowledged, content: { application/json: { schema: { $ref: './marketing-qianfan-v1.schema.json#/$defs/AckResponse' } } } }, '401': { $ref: '#/components/responses/SignatureRejected' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /api/integrations/qianfan/publish-jobs/{jobId}/heartbeat:
    post: { operationId: heartbeatPublishJob, parameters: [ { $ref: '#/components/parameters/JobId' }, { $ref: '#/components/parameters/MarketingVersion' }, { $ref: '#/components/parameters/WorkerId' }, { $ref: '#/components/parameters/KeyId' }, { $ref: '#/components/parameters/Timestamp' }, { $ref: '#/components/parameters/Nonce' }, { $ref: '#/components/parameters/BodySha256' }, { $ref: '#/components/parameters/Signature' } ], requestBody: { required: true, content: { application/json: { schema: { $ref: './marketing-qianfan-v1.schema.json#/$defs/HeartbeatRequest' } } } }, responses: { '200': { description: Lease extended, content: { application/json: { schema: { $ref: './marketing-qianfan-v1.schema.json#/$defs/HeartbeatResponse' } } } }, '401': { $ref: '#/components/responses/SignatureRejected' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /api/integrations/qianfan/publish-jobs/{jobId}/events:
    post: { operationId: reportPublishEvent, parameters: [ { $ref: '#/components/parameters/JobId' }, { $ref: '#/components/parameters/MarketingVersion' }, { $ref: '#/components/parameters/WorkerId' }, { $ref: '#/components/parameters/KeyId' }, { $ref: '#/components/parameters/Timestamp' }, { $ref: '#/components/parameters/Nonce' }, { $ref: '#/components/parameters/BodySha256' }, { $ref: '#/components/parameters/Signature' } ], requestBody: { required: true, content: { application/json: { schema: { $ref: './marketing-qianfan-v1.schema.json#/$defs/EventRequest' } } } }, responses: { '200': { description: Event accepted or duplicate, content: { application/json: { schema: { $ref: './marketing-qianfan-v1.schema.json#/$defs/EventResponse' } } } }, '401': { $ref: '#/components/responses/SignatureRejected' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /api/integrations/qianfan/publish-jobs/{jobId}/cancel-state:
    get: { operationId: getPublishJobCancelState, parameters: [ { $ref: '#/components/parameters/JobId' }, { $ref: '#/components/parameters/AttemptId' }, { $ref: '#/components/parameters/MarketingVersion' }, { $ref: '#/components/parameters/WorkerId' }, { $ref: '#/components/parameters/KeyId' }, { $ref: '#/components/parameters/Timestamp' }, { $ref: '#/components/parameters/Nonce' }, { $ref: '#/components/parameters/BodySha256' }, { $ref: '#/components/parameters/Signature' } ], responses: { '200': { description: Current cancellation state, content: { application/json: { schema: { $ref: './marketing-qianfan-v1.schema.json#/$defs/CancelStateResponse' } } } }, '401': { $ref: '#/components/responses/SignatureRejected' } } }
  /api/integrations/qianfan/analytics:
    post: { operationId: reportMarketingAnalytics, parameters: [ { $ref: '#/components/parameters/MarketingVersion' }, { $ref: '#/components/parameters/WorkerId' }, { $ref: '#/components/parameters/KeyId' }, { $ref: '#/components/parameters/Timestamp' }, { $ref: '#/components/parameters/Nonce' }, { $ref: '#/components/parameters/BodySha256' }, { $ref: '#/components/parameters/Signature' } ], requestBody: { required: true, content: { application/json: { schema: { $ref: './marketing-qianfan-v1.schema.json#/$defs/AnalyticsRequest' } } } }, responses: { '200': { description: Observation accepted or duplicate, content: { application/json: { schema: { $ref: './marketing-qianfan-v1.schema.json#/$defs/AnalyticsResponse' } } } }, '401': { $ref: '#/components/responses/SignatureRejected' }, '409': { $ref: '#/components/responses/Conflict' } } }
components:
  parameters:
    JobId: { name: jobId, in: path, required: true, schema: { $ref: './marketing-qianfan-v1.schema.json#/$defs/Identifier' } }
    AttemptId: { name: attemptId, in: query, required: true, schema: { $ref: './marketing-qianfan-v1.schema.json#/$defs/Identifier' } }
    MarketingVersion: { name: X-Marketing-Version, in: header, required: true, schema: { const: v1 } }
    WorkerId: { name: X-Marketing-Worker-Id, in: header, required: true, schema: { $ref: './marketing-qianfan-v1.schema.json#/$defs/Identifier' } }
    KeyId: { name: X-Marketing-Key-Id, in: header, required: true, schema: { $ref: './marketing-qianfan-v1.schema.json#/$defs/Identifier' } }
    Timestamp: { name: X-Marketing-Timestamp, in: header, required: true, schema: { type: string, pattern: '^[0-9]{13}$' } }
    Nonce: { name: X-Marketing-Nonce, in: header, required: true, schema: { $ref: './marketing-qianfan-v1.schema.json#/$defs/EventId' } }
    BodySha256: { name: X-Marketing-Content-SHA256, in: header, required: true, schema: { $ref: './marketing-qianfan-v1.schema.json#/$defs/Sha256' } }
    Signature: { name: X-Marketing-Signature, in: header, required: true, schema: { type: string, pattern: '^v1=[A-Za-z0-9_-]+$' } }
  responses:
    SignatureRejected: { description: HMAC, timestamp, key, or nonce validation failed }
    Conflict: { description: Idempotency, lifecycle, or lease conflict }
