      function renderUserPagination() {
        const panel = document.getElementById("user-pagination");
        if (!panel) return;
        const pageSize = Number(state.userPageSize) || 20;
        const total = Math.max(0, Number(state.userTotal) || 0);
        const totalPages = Math.max(1, Math.ceil(total / pageSize));
        const currentPage = Math.min(Math.max(1, Number(state.userPage) || 1), totalPages);
        panel.innerHTML = total
          ? `<span class="metric-note">第 ${currentPage} / ${totalPages} 页 · 共 ${total} 条</span>
              <button class="btn ghost" type="button" onclick="setUserPage(${currentPage - 1})" ${currentPage <= 1 ? "disabled" : ""}>上一页</button>
              <button class="btn ghost" type="button" onclick="setUserPage(${currentPage + 1})" ${currentPage >= totalPages ? "disabled" : ""}>下一页</button>`
          : "";
      }

      function scheduleUserKeywordSearch() {
        refreshUserTable();
        renderUserPagination();
        if (userSearchDebounceTimer) {
          clearTimeout(userSearchDebounceTimer);
        }
        userSearchDebounceTimer = setTimeout(async () => {
          const requestToken = ++userSearchRequestToken;
          await loadUsers();
          if (requestToken !== userSearchRequestToken) return;
          refreshUserTable();
          renderUserPagination();
        }, 180);
      }

      function setUserPage(page) {
        const nextPage = Math.max(1, Number(page) || 1);
        if (nextPage === Number(state.userPage || 1)) return;
        state.userPage = nextPage;
        loadUsers().then(renderShell);
      }

      function bindUserFilterControls() {
        if (state.page !== "users") return;
        document.getElementById("user-search-input")?.addEventListener("input", (event) => {
          updateUserFilter("keyword", event.currentTarget.value);
        });
        document.getElementById("user-status-filter")?.addEventListener("change", (event) => {
          updateUserFilter("status", event.currentTarget.value);
        });
        document.getElementById("user-membership-tier-filter")?.addEventListener("change", (event) => {
          updateUserFilter("membershipTier", event.currentTarget.value);
        });
      }

      function isPersonalCreditOwnerAccount(user) {
        return user?.accountType === "owner_account" &&
          !user?.teamRole &&
          !user?.teamGroupName;
      }

      function isPersonalUserAccount(user) {
        return isPersonalCreditOwnerAccount(user);
      }

      function hasSubaccountLimitConfigTarget(user) {
        return Boolean(user?.userId) && Number(user?.subaccountCount || 0) > 0;
      }

      function userMembershipTierKey(user) {
        const tier = String(user?.membershipTier || "").trim();
        return tier === "experience" || tier === "professional" ? tier : "none";
      }

      function userMembershipStatusLabel(userOrTier) {
        const tier = typeof userOrTier === "string" ? userOrTier : userMembershipTierKey(userOrTier);
        return {
          none: "非会员",
          experience: "体验会员",
          professional: "专业会员",
        }[tier] || "非会员";
      }

      function frontendRoleLabel(role) {
        return {
          owner_admin: "团队主账号",
          creator: "普通成员",
          admin: "团队管理员",
          group_admin: "小组负责人",
          animator_plus: "创作成员",
          animator: "创作成员",
          sub_account: "子账户",
        }[role] || role || "-";
      }

      function usersPage() {
        const visibleUsers = filteredUsers();
        const filters = state.userFilters || {};
        const pageSize = Number(state.userPageSize) || 20;
        const totalCount = Math.max(0, Number(state.userTotal) || 0);
        const totalPages = Math.max(1, Math.ceil(totalCount / pageSize));
        const currentPage = Math.min(Math.max(1, Number(state.userPage) || 1), totalPages);
        state.userPage = currentPage;
        return `<div class="toolbar"><div class="filters">
          <input id="user-search-input" value="${escapeAttribute(filters.keyword || "")}" placeholder="搜索用户 / 手机号 / 邮箱" />
          <select id="user-status-filter">${userFilterStatusOptions(filters.status || "all")}</select>
          <select id="user-membership-tier-filter">${userFilterMembershipTierOptions(filters.membershipTier || "all")}</select>
          <span class="metric-note" id="user-visible-count">显示 ${visibleUsers.length.toLocaleString()} / ${totalCount.toLocaleString()}</span>
        </div><div class="filters"><button class="btn ghost" title="刷新用户管理列表" onclick="refreshUserCreditPage()">刷新</button></div></div>
          <div class="table-wrap users dense"><table><thead><tr><th>用户ID</th><th>邀请码</th><th>用户名</th><th>手机号</th><th>会员状态</th><th>可用积分</th><th>冻结积分</th><th>登录时间</th><th>状态</th><th class="actions">操作</th></tr></thead><tbody id="user-table-body">
          ${userRowsHtml(visibleUsers)}
        </tbody></table></div>
        <div class="resource-pagination" id="user-pagination">${totalCount ? `<span class="metric-note">第 ${currentPage} / ${totalPages} 页 · 共 ${totalCount} 条</span>
          <button class="btn ghost" type="button" onclick="setUserPage(${currentPage - 1})" ${currentPage <= 1 ? "disabled" : ""}>上一页</button>
          <button class="btn ghost" type="button" onclick="setUserPage(${currentPage + 1})" ${currentPage >= totalPages ? "disabled" : ""}>下一页</button>` : ""}</div>`;
      }

      function userRowsHtml(users) {
        return users.length
          ? users.map((user) => `${userRow(user)}${userModelRequestInlineRow(user)}`).join("")
          : `<tr><td colspan="10">${state.userLoadError || "暂无用户数据"}</td></tr>`;
      }

      function userModelRequestInlineRow(user) {
        const inlineState = state.userModelRequestInline || {};
        if (inlineState.expandedUserId !== user.userId) return "";
        const rowState = inlineState.rowsByUserId?.[user.userId];
        let content = `<span class="metric-note">正在加载模型记录...</span>`;
        if (rowState?.error) {
          content = `<span class="error-text">${escapeHtml(rowState.error)}</span>`;
        } else if (rowState?.loaded) {
          content = renderUserModelRequestPanel(rowState.data || [], {
            title: `模型记录（${escapeHtml(user.displayName || user.userId)}）`,
          });
        }
        return `<tr class="user-model-request-inline-row"><td colspan="10"><div class="card" style="padding:16px;margin:8px 0 4px;border:1px solid var(--line);box-shadow:none;">${content}</div></td></tr>`;
      }

      function membershipPlanSortOrder(plan) {
        const rawValue = plan.displayMetadata?.sortOrder;
        const value = Number(plan.displayMetadata?.sortOrder);
        if (typeof rawValue === "number" && Number.isFinite(value)) return value;
        if (typeof rawValue === "string" && rawValue.trim() && Number.isFinite(value)) return value;
        return Number.MAX_SAFE_INTEGER;
      }

      function membershipPlanCompare(left, right) {
        return membershipPlanSortOrder(left) - membershipPlanSortOrder(right) ||
          Number(left.amountMinor || 0) - Number(right.amountMinor || 0) ||
          String(left.code || "").localeCompare(String(right.code || ""));
      }

      function directRechargePackageCompare(left, right) {
        return Number(left.sortOrder || 0) - Number(right.sortOrder || 0) ||
          Number(left.amountMinor || 0) - Number(right.amountMinor || 0) ||
          String(left.code || "").localeCompare(String(right.code || ""));
      }

      function renderMembershipPage() {
        const activeTab = normalizedMembershipBenefitTab(state.membershipBenefitTab);
        if (activeTab === "directRecharge") return renderDirectRechargePage();
        const plans = [...(state.membershipPlans || [])]
          .filter((plan) => activeTab === "internal" ? plan.visibility === "internal" : plan.visibility !== "internal")
          .sort(membershipPlanCompare);
        const rows = plans.length
          ? plans.map((plan) => renderMembershipPlanRow(plan, activeTab === "public")).join("")
          : `<tr><td colspan="11">${state.membershipLoadError || (activeTab === "internal" ? "暂无新用户权益模板" : "暂无会员权益套餐")}</td></tr>`;
        return `<section class="section" id="membership-plans">
          <div class="toolbar">
            <div>
              <h3>${activeTab === "internal" ? "新用户权益" : "会员权益"}</h3>
              <div class="metric-note">${activeTab === "internal" ? "仅维护邀请新人、邀请人奖励等内部体验模板；不会展示到前台会员套餐页。" : "仅维护公开售卖会员套餐；内部新人权益模板不会展示在这里。"}</div>
            </div>
            <div class="filters">
              <button class="btn ghost" onclick="loadMembershipPlans().then(renderShell)">刷新</button>
              <button class="btn primary" onclick="openMembershipPlanDrawer('', state.membershipBenefitTab || 'public')" ${permissionAttrs("membership.plan.write")}>${activeTab === "internal" ? "新增权益模板" : "新增套餐"}</button>
            </div>
          </div>
          ${renderMembershipBenefitTabs(activeTab)}
          ${activeTab === "internal" ? renderInviteRewardConfigPanel() : ""}
          <div class="table-wrap membership-plans dense">
            <table>
              <thead><tr><th class="reorder-column">排序</th><th>套餐</th><th>类型</th><th>场景</th><th>档位</th><th>周期</th><th>价格</th><th>赠送积分</th><th>席位</th><th>状态</th><th class="actions">操作</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </section>`;
      }

      function renderMembershipPlanRow(plan, draggable = false) {
        const statusTone = plan.status === "active" ? "green" : plan.status === "archived" ? "warn" : "";
        const reorderAttrs = draggable
          ? `data-reorder-id="${escapeAttribute(plan.id)}" data-reorder-kind="membership" ondragover="allowPackageReorderDrop(event,'membership','${escapeAttribute(plan.id)}')" ondragleave="leavePackageReorderDrop(event)" ondrop="dropPackageReorder(event,'membership','${escapeAttribute(plan.id)}')"`
          : "";
        return `<tr ${reorderAttrs}>
          <td class="reorder-column">${packageReorderHandle("membership", plan.id, draggable)}</td>
          <td>${escapeHtml(plan.displayName || "-")}<div class="metric-note">${escapeHtml(plan.code || "-")}</div></td>
          <td><span class="tag ${plan.visibility === "internal" ? "warn" : "green"}">${membershipVisibilityLabel(plan.visibility)}</span></td>
          <td>${membershipUsageSceneLabel(plan.usageScene)}</td>
          <td><span class="tag ${plan.tier === "professional" ? "blue" : ""}">${membershipTierLabel(plan.tier)}</span></td>
          <td>${membershipPeriodLabel(plan)}</td>
          <td>${membershipMoney(plan.amountMinor, plan.currency)}</td>
          <td>${Number(plan.giftCredits || 0).toLocaleString()}</td>
          <td>${Number(plan.seatLimit || 1).toLocaleString()}</td>
          <td><span class="tag ${statusTone}">${membershipStatusLabel(plan.status)}</span></td>
          <td class="actions"><div class="actions-row"><button class="icon-btn" title="编辑套餐" onclick="openMembershipPlanDrawer('${escapeAttribute(plan.id)}')" ${permissionAttrs("membership.plan.write")}>编</button><button class="icon-btn" title="删除套餐" onclick="deleteMembershipPlan('${escapeAttribute(plan.id)}')" ${permissionAttrs("membership.plan.write")}>删</button></div></td>
        </tr>`;
      }

      function renderDirectRechargePage() {
        const packages = [...(state.directRechargePackages || [])].sort(directRechargePackageCompare);
        const rows = packages.length
          ? packages.map(renderDirectRechargePackageRow).join("")
          : `<tr><td colspan="7">${state.directRechargeLoadError || "暂无积分套餐"}</td></tr>`;
        return `<section class="section" id="direct-recharge-packages">
          <div class="toolbar">
            <div>
              <h3>积分套餐</h3>
              <div class="metric-note">仅配置会员可购买的积分直充档位；不赠送会员权益，不延长会员有效期。</div>
            </div>
            <div class="filters">
              <button class="btn ghost" onclick="loadDirectRechargePackages().then(renderShell)">刷新</button>
              <button class="btn primary" onclick="openDirectRechargePackageDrawer()" ${permissionAttrs("membership.plan.write")}>新增档位</button>
            </div>
          </div>
          ${renderMembershipBenefitTabs("directRecharge")}
          <div class="table-wrap direct-recharge-packages dense">
            <table>
              <thead><tr><th class="reorder-column">排序</th><th>档位</th><th>价格</th><th>积分</th><th>标签</th><th>状态</th><th class="actions">操作</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </section>`;
      }

      function renderDirectRechargePackageRow(item) {
        const statusTone = item.status === "active" ? "green" : item.status === "archived" ? "warn" : "";
        return `<tr data-reorder-id="${escapeAttribute(item.id)}" data-reorder-kind="directRecharge" ondragover="allowPackageReorderDrop(event,'directRecharge','${escapeAttribute(item.id)}')" ondragleave="leavePackageReorderDrop(event)" ondrop="dropPackageReorder(event,'directRecharge','${escapeAttribute(item.id)}')">
          <td class="reorder-column">${packageReorderHandle("directRecharge", item.id, true)}</td>
          <td>${escapeHtml(item.displayName || "-")}<div class="metric-note">${escapeHtml(item.code || "-")}</div><div class="metric-note">${escapeHtml(item.subtitle || "")}</div></td>
          <td>${membershipMoney(item.amountMinor, item.currency)}</td>
          <td>${Number(item.credits || item.baseCredits || 0).toLocaleString()}</td>
          <td>${item.badge ? `<span class="tag blue">${escapeHtml(item.badge)}</span>` : "-"}</td>
          <td><span class="tag ${statusTone}">${membershipStatusLabel(item.status)}</span></td>
          <td class="actions"><div class="actions-row"><button class="icon-btn" title="编辑档位" onclick="openDirectRechargePackageDrawer('${escapeAttribute(item.id)}')" ${permissionAttrs("membership.plan.write")}>编</button><button class="icon-btn" title="删除档位" onclick="deleteDirectRechargePackage('${escapeAttribute(item.id)}')" ${permissionAttrs("membership.plan.write")}>删</button></div></td>
        </tr>`;
      }

      function packageReorderHandle(kind, itemId, enabled) {
        if (!enabled) return `<span class="metric-note" aria-hidden="true">—</span>`;
        const disabled = packageReorderSaving || !hasPermission("membership.plan.write");
        return `<button
          class="package-reorder-handle"
          type="button"
          draggable="${disabled ? "false" : "true"}"
          aria-label="拖动调整套餐顺序"
          aria-disabled="${disabled ? "true" : "false"}"
          title="按住拖动调整展示顺序"
          onclick="event.preventDefault()"
          ondragstart="startPackageReorder(event,'${kind}','${escapeAttribute(itemId)}')"
          ondragend="finishPackageReorder()"
        >⠿</button>`;
      }

      function startPackageReorder(event, kind, itemId) {
        if (packageReorderSaving || !hasPermission("membership.plan.write")) {
          event.preventDefault();
          return;
        }
        activePackageReorder = { kind, itemId: String(itemId) };
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", String(itemId));
        event.currentTarget.closest("tr")?.classList.add("is-package-reorder-dragging");
      }

      function allowPackageReorderDrop(event, kind, targetId) {
        if (packageReorderSaving || !activePackageReorder || activePackageReorder.kind !== kind) return;
        if (activePackageReorder.itemId === String(targetId)) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = "move";
        clearPackageReorderDropIndicators();
        const bounds = event.currentTarget.getBoundingClientRect();
        const placement = event.clientY > bounds.top + bounds.height / 2 ? "after" : "before";
        event.currentTarget.classList.add(placement === "after" ? "is-package-reorder-after" : "is-package-reorder-before");
      }

      function leavePackageReorderDrop(event) {
        if (event.currentTarget.contains(event.relatedTarget)) return;
        event.currentTarget.classList.remove("is-package-reorder-before", "is-package-reorder-after");
      }

      function clearPackageReorderDropIndicators() {
        document.querySelectorAll(".is-package-reorder-before, .is-package-reorder-after").forEach((row) => {
          row.classList.remove("is-package-reorder-before", "is-package-reorder-after");
        });
      }

      function finishPackageReorder() {
        activePackageReorder = null;
        clearPackageReorderDropIndicators();
        document.querySelectorAll(".is-package-reorder-dragging").forEach((row) => {
          row.classList.remove("is-package-reorder-dragging");
        });
      }

      async function dropPackageReorder(event, kind, targetId) {
        event.preventDefault();
        const dragged = activePackageReorder;
        const placement = event.currentTarget.classList.contains("is-package-reorder-after") ? "after" : "before";
        finishPackageReorder();
        if (packageReorderSaving || !dragged || dragged.kind !== kind || dragged.itemId === String(targetId)) return;
        const items = packageReorderItems(kind);
        const draggedItem = items.find((item) => String(item.id) === dragged.itemId);
        const withoutDragged = items.filter((item) => String(item.id) !== dragged.itemId);
        const targetIndex = withoutDragged.findIndex((item) => String(item.id) === String(targetId));
        if (!draggedItem || targetIndex < 0) return;
        withoutDragged.splice(targetIndex + (placement === "after" ? 1 : 0), 0, draggedItem);
        await persistPackageOrder(kind, withoutDragged);
      }

      function packageReorderItems(kind) {
        if (kind === "membership") {
          return [...(state.membershipPlans || [])]
            .filter((plan) => plan.visibility !== "internal")
            .sort(membershipPlanCompare);
        }
        if (kind === "directRecharge") {
          return [...(state.directRechargePackages || [])].sort(directRechargePackageCompare);
        }
        return [];
      }

      function updatePackageReorderState(kind, updates) {
        const sortById = new Map(updates.map(({ item, sortOrder }) => [String(item.id), sortOrder]));
        if (kind === "membership") {
          state.membershipPlans = (state.membershipPlans || []).map((plan) => sortById.has(String(plan.id))
            ? { ...plan, displayMetadata: { ...(plan.displayMetadata || {}), sortOrder: sortById.get(String(plan.id)) } }
            : plan);
          return;
        }
        state.directRechargePackages = (state.directRechargePackages || []).map((item) => sortById.has(String(item.id))
          ? { ...item, sortOrder: sortById.get(String(item.id)) }
          : item);
      }

      async function persistPackageOrder(kind, items) {
        if (packageReorderSaving) return;
        const updates = items.map((item, index) => ({
          item,
          sortOrder: (index + 1) * 10,
        }));
        const changed = updates.filter(({ item, sortOrder }) => kind === "membership"
          ? membershipPlanSortOrder(item) !== sortOrder
          : Number(item.sortOrder || 0) !== sortOrder);
        if (!changed.length) return;
        packageReorderSaving = true;
        updatePackageReorderState(kind, updates);
        renderShell();
        let feedbackMessage = "套餐展示顺序已更新";
        try {
          if (kind === "membership") {
            await api("/api/admin/membership/plans/reorder", {
              method: "POST",
              headers: { "idempotency-key": adminIdempotencyKey("membership-plan-reorder") },
              body: JSON.stringify({
                items: changed.map(({ item, sortOrder }) => ({ id: item.id, sortOrder })),
              }),
            });
            await loadMembershipPlans();
          } else {
            await api("/api/admin/direct-recharge/packages/reorder", {
              method: "POST",
              headers: { "idempotency-key": adminIdempotencyKey("direct-recharge-reorder") },
              body: JSON.stringify({
                items: changed.map(({ item, sortOrder }) => ({ id: item.id, sortOrder })),
              }),
            });
            await loadDirectRechargePackages();
          }
        } catch (error) {
          if (kind === "membership") await loadMembershipPlans();
          else await loadDirectRechargePackages();
          feedbackMessage = error.payload?.error?.message || error.message || "套餐顺序保存失败，请重试";
        } finally {
          packageReorderSaving = false;
          renderShell();
        }
        showToast(feedbackMessage);
      }

      function normalizedMembershipBenefitTab(tab) {
        return tab === "internal" || tab === "directRecharge" ? tab : "public";
      }

      function renderMembershipBenefitTabs(activeTab) {
        return `<div class="tabs compact">
          <button class="tab ${activeTab === "public" ? "active" : ""}" onclick="setMembershipBenefitTab('public')">会员权益</button>
          <button class="tab ${activeTab === "internal" ? "active" : ""}" onclick="setMembershipBenefitTab('internal')">新用户权益</button>
          <button class="tab ${activeTab === "directRecharge" ? "active" : ""}" onclick="setMembershipBenefitTab('directRecharge')">积分套餐</button>
        </div>`;
      }

      function directRechargePackageById(packageId) {
        return (state.directRechargePackages || []).find((item) => String(item.id) === String(packageId)) || null;
      }

      function membershipPlanById(planId) {
        return (state.membershipPlans || []).find((plan) => String(plan.id) === String(planId)) || null;
      }

      function membershipTierRank(tier) {
        return tier === "experience" ? 1 : tier === "professional" ? 2 : 9;
      }

      function membershipPeriodRank(unit, count) {
        const unitRank = { day: 1, month: 2, quarter: 3, year: 4 }[unit] || 9;
        return unitRank * 1000 + Number(count || 0);
      }

      function membershipTierLabel(tier) {
        return { experience: "基础版", professional: "专业版" }[tier] || tier || "-";
      }

      function membershipStatusLabel(status) {
        return { active: "启用", inactive: "停用", archived: "归档" }[status] || status || "-";
      }

      function membershipVisibilityLabel(visibility) {
        return { public: "会员权益", internal: "新用户权益" }[visibility] || visibility || "会员权益";
      }

      function membershipUsageSceneLabel(scene) {
        return {
          purchase: "公开售卖",
          invite_new_user: "新人体验",
          invite_inviter: "邀请人奖励",
          manual_gift: "运营赠送",
          test: "测试",
        }[scene] || scene || "公开售卖";
      }

      function setMembershipBenefitTab(tab) {
        state.membershipBenefitTab = normalizedMembershipBenefitTab(tab);
        renderShell();
        if (state.membershipBenefitTab === "directRecharge") {
          ensureAdminPageData("directRecharge").catch(() => undefined);
        }
      }

      function renderInviteRewardConfigPanel() {
        const config = state.inviteRewardConfig || {};
        const internalPlans = (state.membershipPlans || [])
          .filter((plan) => plan.visibility === "internal" && plan.status === "active")
          .sort((a, b) => String(a.displayName || "").localeCompare(String(b.displayName || "")));
        const planOptions = [["", "不发放会员模板"], ...internalPlans.map((plan) => [plan.id, `${plan.displayName || plan.code} · ${membershipUsageSceneLabel(plan.usageScene)}`])];
        return `<form class="card" id="invite-reward-config-form" style="margin:12px 0 16px;padding:16px;border:1px solid var(--line);box-shadow:none;">
          <div class="toolbar">
            <div>
              <h4>邀请奖励配置</h4>
              <div class="metric-note">所有首次注册用户都会获得所选新人模板权益；邀请码额外用于邀请人奖励和充值返利。</div>
            </div>
          </div>
          <div class="form-grid">
            <label class="field"><span>新用户权益模板</span><select name="newUserPlanId">${optionPairs(planOptions, config.newUserPlanId || "")}</select></label>
            <label class="field"><span>邀请人权益模板</span><select name="inviterPlanId">${optionPairs(planOptions, config.inviterPlanId || "")}</select></label>
            <label class="field"><span>充值返利比例（%）</span><input name="rebatePercent" type="number" min="0" max="100" step="0.001" value="${Number(config.rebatePercent ?? 3)}" /></label>
            <label class="field"><span>返利有效期（天）</span><input name="rebateWindowDays" type="number" min="0" step="1" value="${Number(config.rebateWindowDays ?? 30)}" /></label>
            <label class="field"><span>单个被邀请用户累计返利金额上限（分）</span><input name="perInvitedUserRebateCapMinor" type="number" min="0" step="1" value="${config.perInvitedUserRebateCapMinor ?? config.perInviterPeriodRebateCapMinor ?? ""}" placeholder="留空不限制" /><small>每个被邀请用户独立累计，达到上限或超过返利有效期后停止返利，不影响其他被邀请用户。</small></label>
          </div>
          <div class="error-text" id="invite-reward-config-error">${escapeHtml(state.inviteRewardLoadError || "")}</div>
          <button class="btn primary" type="submit" ${permissionAttrs("membership.plan.write")}>保存邀请奖励配置</button>
        </form>`;
      }

      function bindInviteRewardConfigForm() {
        const form = document.getElementById("invite-reward-config-form");
        if (!form) return;
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const error = document.getElementById("invite-reward-config-error");
          error.textContent = "";

      function membershipPlanPayloadFromForm(form) {
        const id = String(form.get("id") || "").trim();
        const amountYuan = Number(form.get("amountYuan") || 0);
        const entitlements = membershipEntitlementsFromForm(form);
        const displayMetadata = parseJsonTextarea(form, "displayMetadata");
        const displayNote = String(form.get("displayNote") || "").trim();
        if (displayNote) displayMetadata.note = displayNote;
        else delete displayMetadata.note;
        const recommendationLabel = String(form.get("recommendationLabel") || "").trim();
        if (recommendationLabel) displayMetadata.recommendationLabel = recommendationLabel;
        else delete displayMetadata.recommendationLabel;
        const isRecommended = form.get("isRecommended") === "on"
          && String(form.get("visibility") || "public") === "public";
        if (isRecommended) displayMetadata.isRecommended = true;
        else delete displayMetadata.isRecommended;
        displayMetadata.features = membershipDisplayFeaturesFromForm(form, entitlements);
        const payload = {
          code: String(form.get("code") || "").trim(),
          displayName: String(form.get("displayName") || "").trim(),
          tier: String(form.get("tier") || "professional"),
          periodUnit: String(form.get("periodUnit") || "month"),
          periodCount: Number(form.get("periodCount") || 1),
          amountMinor: Math.round(amountYuan * 100),
          currency: String(form.get("currency") || "CNY"),
          giftCredits: Number(form.get("giftCredits") || 0),
          seatLimit: Number(form.get("seatLimit") || 0),
          entitlements,
          priorityRules: parseJsonTextarea(form, "priorityRules"),
          displayMetadata,
          visibility: String(form.get("visibility") || "public"),
          usageScene: String(form.get("usageScene") || "purchase"),
          status: String(form.get("status") || "inactive"),
          validFrom: String(form.get("validFrom") || "").trim() || null,
          validUntil: String(form.get("validUntil") || "").trim() || null,
          reason: String(form.get("reason") || "").trim(),
        };
        if (id) payload.id = id;
        if (!payload.code || !payload.displayName || !payload.reason) {
          throw new Error("套餐编码、展示名称、变更原因必填");
        }
        if (!Number.isInteger(payload.periodCount) || payload.periodCount < 1) {
          throw new Error("周期数量必须是正整数");
        }
        if (!Number.isInteger(payload.amountMinor) || payload.amountMinor < 1) {
          throw new Error("价格分必须是正整数");
        }
        if (!Number.isInteger(payload.giftCredits) || payload.giftCredits < 0) {
          throw new Error("赠送积分必须是非负整数");
        }
        if (!Number.isInteger(payload.seatLimit) || payload.seatLimit < 0) {
          throw new Error("席位上限必须是 0 或正整数");
        }
        return payload;
      }

        const raw = String(form.get("displayFeatures") || "").trim();
        if (!raw) return [];
        const selectedEntitlementSet = new Set(selectedEntitlements);
        const knownFeatureLabelToValue = membershipKnownEntitlementLabelMap();
        return raw.split(/\r?\n/)
          .map((line) => line.trim())
          .filter((line) => {
            if (!line) return false;
            const value = knownFeatureLabelToValue.get(line);
            return !value || selectedEntitlementSet.has(value);
          });
      }

      async function readPromptCoverFile(input, formId) {
        const file = input.files?.[0];
        if (!file) return;
        if (!file.type.startsWith("image/")) {
          showToast("请选择图片文件");
          input.value = "";
          return;
        }
        try {
          input.disabled = true;
          const uploaded = await uploadAdminImage(file, "/api/admin/prompt-covers/uploads");
          const form = document.getElementById(formId);
          const valueInput = form?.querySelector('input[name="cover_image_url"]');
          const storageObjectIdInput = form?.querySelector('input[name="cover_storage_object_id"]');
          if (valueInput) valueInput.value = uploaded.sourceUrl || uploaded.previewUrl || "";
          if (storageObjectIdInput) storageObjectIdInput.value = uploaded.storageObjectId || "";
          const preview = form?.querySelector(".prompt-cover-upload .prompt-cover-thumb");

        state.userModelRequestInline = {
          ...inlineState,
          expandedUserId: userId,
          rowsByUserId: {
            ...(inlineState.rowsByUserId || {}),
            [userId]: inlineState.rowsByUserId?.[userId] || {

              loading: true,
              error: "",
              data: [],

          },

      async function loadUserModelRequestPanel(userId, elementId, options = {}) {
        const target = document.getElementById(elementId);
        if (!target) return;
        const page = Math.max(1, Number(options.page ?? 1));
        const pageSize = Math.max(1, Number(options.pageSize ?? 15));
        const modelType = String(options.modelType || "all");
        target.innerHTML = `<span class="metric-note">正在加载模型记录...</span>`;
        try {
          const params = new URLSearchParams({
            page: String(page),
            pageSize: String(pageSize),
          });
          if (modelType && modelType !== "all") {
            params.set("modelType", modelType);
          }
          const modelRequestResult = await api(`/api/admin/users/${userId}/model-requests?${params.toString()}`);
          target.innerHTML = renderUserModelRequestPanel(modelRequestResult.data || [], {
            title: `模型记录（共 ${Number(modelRequestResult.meta?.total || 0)} 条）`,
            userId,
            elementId,
            page,
            pageSize,
            modelType,
            meta: modelRequestResult.meta || {},
          });
        } catch (err) {
          target.innerHTML = `<span class="error-text">${err.payload?.error?.message || "模型记录加载失败"}</span>`;
        }
      }

      function riskWorkspaceSummary() {
        const tasks = riskTaskItems();
        const openRisks = state.risks.risks.filter((risk) => risk.status === "open");
        const paymentIssues = state.risks.paymentIssues.filter((issue) => issue.status !== "resolved");
        const queueHealth = state.generationQueueHealth;
        const queueFailedCount = (queueHealth?.queues || []).reduce((sum, queue) => sum + queueAttentionCount(queue), 0);
        const degradedQueues = (queueHealth?.queues || []).filter((queue) => queue.status !== "healthy" || Number(queue.counts?.failed || 0) > 0).length;
        const criticalRisks = openRisks.filter((risk) => risk.severity === "critical").length;
        const actionableTasks = tasks.filter((task) => taskOpsActions(task).length > 0).length;
        const totalAttention = openRisks.length + tasks.length + paymentIssues.length + queueFailedCount;
        if (criticalRisks > 0 || paymentIssues.length > 0) {
          return { tone: "danger", label: "需要立即处置", description: `发现 ${criticalRisks.toLocaleString()} 项高风险支付事件和 ${paymentIssues.length.toLocaleString()} 笔积分补发事项，请先处理资金与用户权益。`, openRisks: openRisks.length, criticalRisks, taskCount: tasks.length, actionableTasks, paymentIssueCount: paymentIssues.length, queueFailedCount, degradedQueues, totalAttention };
        }
        if (totalAttention > 0) {
          return { tone: "warning", label: "存在待办事项", description: `当前有 ${totalAttention.toLocaleString()} 项支付、生产任务或队列异常，可在下方按推荐动作处理。`, openRisks: openRisks.length, criticalRisks, taskCount: tasks.length, actionableTasks, paymentIssueCount: paymentIssues.length, queueFailedCount, degradedQueues, totalAttention };
        }
        return { tone: "success", label: "当前无异常", description: "支付、积分、生产任务与生成队列均没有待处理异常。", openRisks: 0, criticalRisks: 0, taskCount: 0, actionableTasks: 0, paymentIssueCount: 0, queueFailedCount, degradedQueues, totalAttention: 0 };
      }

      function riskTaskItems() {
        if (hasPermission("ops.task.retry") && !state.adminOpsLoadError) {
          return Array.isArray(state.adminOpsItems?.tasks) ? state.adminOpsItems.tasks : [];
        }
        return Array.isArray(state.risks.taskExceptions) ? state.risks.taskExceptions : [];
      }

      function riskWorkspaceTab(tab, label, count) {
        const active = state.riskWorkspaceTab === tab;
        return `<button class="risk-tab ${active ? "active" : ""}" role="tab" aria-selected="${active}" onclick="setRiskWorkspaceTab('${tab}')">${label} · ${Number(count || 0).toLocaleString()}</button>`;
      }

      function setRiskWorkspaceTab(tab) {
        state.riskWorkspaceTab = ["queue", "tasks", "queues", "agent", "payments", "repairs", "audit"].includes(tab) ? tab : "queue";
        renderShell();
      }

      function openDeadLetterWorkbench() {
        state.riskWorkspaceTab = "queues";
        state.riskSearch = "";
        navigate("risks");
      }

      function queueAttentionCount(queue) {
        const counts = queue?.counts || {};
        return queue?.role === "dead_letter"
          ? Number(counts.waiting || 0) + Number(counts.delayed || 0) + Number(counts.failed || 0)
          : Number(counts.failed || 0);
      }

      function updateRiskSearch(value) {
        state.riskSearch = value || "";
        const content = document.getElementById("risk-workspace-content");
        if (content) content.innerHTML = riskWorkspaceContent();
      }

      function riskWorkspaceContent() {
        if (state.riskWorkspaceTab === "tasks") return riskTasksView();
        if (state.riskWorkspaceTab === "queues") return riskQueuesView();
        if (state.riskWorkspaceTab === "agent") return riskCanvasAgentView();
        if (state.riskWorkspaceTab === "payments") return riskPaymentsView();
        if (state.riskWorkspaceTab === "repairs") return riskRepairsView();
        if (state.riskWorkspaceTab === "audit") return riskAuditView();
        return riskQueueView();
      }

      function riskSearchMatches(...values) {
        const keyword = String(state.riskSearch || "").trim().toLowerCase();
        if (!keyword) return true;
        return values.some((value) => String(value ?? "").toLowerCase().includes(keyword));
      }

      function riskQueueView() {
        const risks = state.risks.risks.filter((risk) => risk.status === "open" && riskSearchMatches(risk.riskType, risk.orderId, risk.paymentIntentId, risk.decision, compactJson(risk.metadata)));
        const repairs = state.risks.paymentIssues.filter((issue) => issue.status !== "resolved" && riskSearchMatches(issue.orderNo, issue.orderId, issue.successfulPaymentIntentId));
        const tasks = riskTaskItems().filter((task) => riskSearchMatches(task.taskType, task.id, task.failureCode, task.providerName, task.queueName, task.externalRequestId));
        const rows = [
          ...risks.map(riskQueuePaymentRiskRow),
          ...repairs.map(riskQueueRepairRow),
          ...tasks.map(riskQueueTaskRow),
        ];
        return `<section class="risk-panel">
          <div class="risk-panel-head"><div class="risk-panel-title"><h3>按影响优先处理</h3><p>资金与用户权益优先，其次处理生产任务和队列异常</p></div><span class="risk-count-note">${rows.length.toLocaleString()} 项匹配结果</span></div>
          ${rows.length ? `<div class="table-wrap compact"><table class="risk-table"><thead><tr><th>类型</th><th>异常对象</th><th>处置建议</th><th>更新时间</th><th class="actions">操作</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>` : riskEmptyState("没有匹配的待办事项", "调整搜索条件，或切换到其他视图查看历史记录")}
        </section>`;
      }

      function riskQueuePaymentRiskRow(risk) {
        return `<tr><td><span class="risk-queue-kind danger">支付风险</span></td><td class="risk-primary"><div class="risk-title">${escapeHtml(riskTypeLabel(risk.riskType))}</div><div class="risk-code">${escapeHtml(risk.riskType)}</div><div class="risk-context">${escapeHtml(riskContextSummary(risk))}</div></td><td><span class="tag ${riskSeverityTone(risk.severity)}">${riskSeverityLabel(risk.severity)}</span><div class="risk-context">${escapeHtml(riskDecisionLabel(risk.decision))}</div></td><td class="risk-time">${escapeHtml(formatAdminDateTime(risk.updatedAt || risk.createdAt))}</td><td class="actions"><button class="btn ghost risk-action" onclick="openRiskReviewDrawer('${escapeAttribute(risk.id)}')" ${permissionAttrs("risk.review")}>复核</button></td></tr>`;
      }

      function riskQueueRepairRow(issue) {
        return `<tr><td><span class="risk-queue-kind danger">用户权益</span></td><td class="risk-primary"><div class="risk-title">支付成功但积分未到账</div><div class="risk-code">${escapeHtml(issue.orderNo || issue.orderId)}</div><div class="risk-context">应补发 ${Number(issue.credits || 0).toLocaleString()} 积分 · ${money(issue.amountMinor)}</div></td><td><span class="tag warn">立即补发</span><div class="risk-context">支付证据已由后端完成交叉核验</div></td><td class="risk-time">${escapeHtml(formatAdminDateTime(issue.paidAt))}</td><td class="actions"><button class="btn primary risk-action" onclick="openPaymentRepairDrawer('${escapeAttribute(issue.orderId)}')" ${permissionAttrs("risk.review")}>补发</button></td></tr>`;
      }

      function riskQueueTaskRow(task) {
        const recommendation = taskRecommendedAction(task);
        return `<tr><td><span class="risk-queue-kind ${task.status === "result_unknown" || task.status === "manual_review_required" ? "danger" : "neutral"}">生产任务</span></td><td class="risk-primary"><div class="risk-title">${escapeHtml(taskTypeLabel(task.taskType))}</div><div class="risk-code">${escapeHtml(task.id)}</div><div class="risk-context">${escapeHtml(taskFailureLabel(task.failureCode))} · ${escapeHtml(task.providerName || "未记录供应商")}</div></td><td><span class="tag ${recommendation.tone}">${escapeHtml(recommendation.label)}</span><div class="risk-context">${escapeHtml(recommendation.note)}</div></td><td class="risk-time">${escapeHtml(formatAdminDateTime(task.updatedAt))}</td><td class="actions"><button class="btn ghost risk-action" onclick="openTaskOpsDrawer('${escapeAttribute(task.id)}')" ${permissionAttrs("ops.task.retry")}>处置</button></td></tr>`;
      }

      function riskTasksView() {
        const tasks = riskTaskItems().filter((task) => riskSearchMatches(task.taskType, task.id, task.failureCode, task.providerName, task.queueName, task.externalRequestId));
        const rows = tasks.length ? tasks.map(taskExceptionRow).join("") : `<tr><td colspan="7">${escapeHtml(state.adminOpsLoadError || "暂无异常生产任务")}</td></tr>`;
        return `<section class="risk-panel"><div class="risk-panel-head"><div class="risk-panel-title"><h3>生产任务异常</h3><p>依据失败阶段执行重新排队、重新归档、重新落库或人工结算</p></div><span class="risk-count-note">${tasks.length.toLocaleString()} 项</span></div><div class="table-wrap compact"><table class="risk-table"><thead><tr><th>任务</th><th>失败阶段</th><th>供应商</th><th>队列</th><th>状态 / 尝试</th><th>更新时间</th><th class="actions">操作</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
      }

      function riskCanvasAgentView() {
        const metrics = state.canvasAgentMetrics;
        if (!metrics) return `<section class="risk-panel"><div class="risk-panel-head"><div class="risk-panel-title"><h3>Canvas Agent</h3><p>最近 24 小时模型、工具、审批与异常指标</p></div></div>${riskEmptyState("无法读取 Canvas Agent 指标", state.canvasAgentMetricsLoadError || "当前账号没有任务运维权限")}</section>`;
        const summary = metrics.summary || {};
        const models = (metrics.models || []).filter((model) => riskSearchMatches(model.modelCode));
        const failures = (metrics.recentFailures || []).filter((item) => riskSearchMatches(item.taskId, item.canvasId, item.modelCode, item.failureCode, item.status));
        const modelRows = models.length
          ? models.map((model) => `<tr><td><div class="risk-title">${escapeHtml(model.modelCode)}</div></td><td>${Number(model.taskCount || 0).toLocaleString()}</td><td>${Number(model.succeededCount || 0).toLocaleString()}</td><td>${Number(model.failedCount || 0).toLocaleString()}</td><td>${Number(model.totalTokens || 0).toLocaleString()}</td></tr>`).join("")
          : `<tr><td colspan="5">暂无模型调用</td></tr>`;
        const failureRows = failures.length
          ? failures.map((item) => `<tr><td><div class="risk-title">${escapeHtml(item.taskId)}</div><div class="risk-code">Canvas ${escapeHtml(item.canvasId)}</div></td><td>${escapeHtml(item.modelCode)}</td><td>${escapeHtml(item.mode)}</td><td><span class="tag warn">${escapeHtml(taskStatusLabel(item.status))}</span></td><td>${escapeHtml(item.failureCode || "-")}</td><td class="risk-time">${escapeHtml(formatAdminDateTime(item.updatedAt))}</td></tr>`).join("")
          : `<tr><td colspan="6">最近窗口内没有 Agent 失败任务</td></tr>`;
        return `<div class="risk-agent-workspace">
          <section class="dashboard-kpi-strip" aria-label="Canvas Agent 指标">
            ${dashboardKpi("Agent 任务", Number(summary.totalTasks || 0).toLocaleString(), `成功率 ${percent(Number(summary.successRate || 0))}`, "A1")}
            ${dashboardKpi("待审批", Number(summary.pendingApprovals || 0).toLocaleString(), `${Number(summary.waitingExternalTasks || 0).toLocaleString()} 个等待外部结果`, "A2")}
            ${dashboardKpi("Token", Number(summary.totalTokens || 0).toLocaleString(), `${Number(summary.modelRoundCount || 0).toLocaleString()} 个模型轮次`, "A3")}
            ${dashboardKpi("Policy 拒绝", Number(summary.policyDenyCount || 0).toLocaleString(), `${Number(summary.toolCallCount || 0).toLocaleString()} 次工具调用`, "A4")}
          </section>
          <section class="risk-panel"><div class="risk-panel-head"><div class="risk-panel-title"><h3>模型使用</h3><p>${Number(metrics.windowHours || 24).toLocaleString()} 小时窗口 · 模型耗时 ${Number(summary.modelDurationMs || 0).toLocaleString()} ms · 工具耗时 ${Number(summary.toolDurationMs || 0).toLocaleString()} ms</p></div></div><div class="table-wrap compact"><table><thead><tr><th>模型</th><th>任务</th><th>成功</th><th>失败/待复核</th><th>Token</th></tr></thead><tbody>${modelRows}</tbody></table></div></section>
          <section class="risk-panel"><div class="risk-panel-head"><div class="risk-panel-title"><h3>最近失败</h3><p>仅展示任务元数据，不展示消息、密钥或 Provider 请求正文</p></div><span class="risk-count-note">${failures.length.toLocaleString()} 项</span></div><div class="table-wrap compact"><table><thead><tr><th>任务</th><th>模型</th><th>模式</th><th>状态</th><th>失败码</th><th>更新时间</th></tr></thead><tbody>${failureRows}</tbody></table></div></section>
        </div>`;
      }

      function riskQueuesView() {
        const health = state.generationQueueHealth;
        if (!health) return `<section class="risk-panel"><div class="risk-panel-head"><div class="risk-panel-title"><h3>生成队列</h3><p>查看 Redis、Worker 和 BullMQ 队列状态</p></div></div>${riskEmptyState("无法读取生成队列", state.generationQueueLoadError || "当前账号没有队列运维权限")}</section>`;
        const queues = health.queues || [];
        const queueRows = queues
          .filter((queue) => riskSearchMatches(queue.name, queue.role, queue.error))
          .map((queue) => `<tr><td><div class="risk-title">${escapeHtml(queueRoleLabel(queue.role))}</div><div class="risk-code">${escapeHtml(queue.name)}</div></td><td><span class="tag ${queue.status === "healthy" ? "green" : "warn"}">${queue.status === "healthy" ? "可用" : "需关注"}</span></td><td>${Number(queue.counts?.waiting || 0).toLocaleString()}</td><td>${Number(queue.counts?.active || 0).toLocaleString()}</td><td>${Number(queue.counts?.delayed || 0).toLocaleString()}</td><td>${Number(queue.counts?.failed || 0).toLocaleString()}</td><td class="risk-context">${escapeHtml(queue.role === "dead_letter" ? "隔离仓库，无需消费者" : queue.error || "-")}</td></tr>`)
          .join("");
        const deadLetterQueue = queues.find((queue) => queue.role === "dead_letter");
        const deadLetterJobs = (deadLetterQueue?.failedJobs || [])
          .filter((job) => riskSearchMatches(deadLetterQueue?.name, job.id, job.name, job.failureReason, queueJobTaskId(job)))
          .map((job) => deadLetterRow(deadLetterQueue, job))
          .join("");
        const failedRows = queues
          .filter((queue) => queue.role !== "dead_letter")
          .flatMap((queue) => (queue.failedJobs || []).map((job) => ({ queue, job })))
          .filter(({ queue, job }) => riskSearchMatches(queue.name, job.id, job.name, job.failureReason))
          .map(({ queue, job }) => `<tr><td><div class="risk-title">${escapeHtml(job.name || "失败队列任务")}</div><div class="risk-code">${escapeHtml(job.id)}</div></td><td>${escapeHtml(queueRoleLabel(queue.role))}<div class="risk-code">${escapeHtml(queue.name)}</div></td><td>${Number(job.attemptsMade || 0).toLocaleString()}</td><td class="risk-context">${escapeHtml(job.failureReason || "未记录失败原因")}</td><td class="risk-time">${escapeHtml(formatAdminDateTime(job.finishedAt || job.processedAt || job.timestamp))}</td><td class="actions"><button class="btn ghost risk-action" onclick="openQueueJobDrawer('${escapeAttribute(queue.name)}','${escapeAttribute(job.id)}')" ${permissionAttrs("ops.task.retry")}>操作</button></td></tr>`)
          .join("");
        const deadLetterCount = deadLetterQueue ? queueAttentionCount(deadLetterQueue) : 0;
        return `<section class="risk-panel">
          <div class="risk-panel-head"><div class="risk-panel-title"><h3>生成基础设施</h3><p>Redis ${health.redis?.status === "healthy" ? "在线" : "不可用"} · Worker ${health.workersEnabled ? "已启用" : "未启用"} · Dispatcher ${health.outboxDispatcher?.status === "healthy" ? "运行中" : "离线"}</p></div><span class="dashboard-status ${health.status === "healthy" ? "success" : "warning"}">${health.status === "healthy" ? "队列可用" : "队列降级"}</span></div>
          <div class="table-wrap compact"><table class="risk-table"><thead><tr><th>队列</th><th>状态</th><th>等待</th><th>执行中</th><th>延迟</th><th>失败</th><th>说明</th></tr></thead><tbody>${queueRows || `<tr><td colspan="7">暂无队列数据</td></tr>`}</tbody></table></div>
          <div class="risk-panel-head" style="margin-top:20px;"><div class="risk-panel-title"><h3>死信处理工作台</h3><p>先核对业务任务和供应商状态，再恢复任务或归档死信；禁止无校验批量重放</p></div><span class="risk-count-note">${deadLetterCount.toLocaleString()} 条待处理</span></div>
          <div class="table-wrap compact"><table class="risk-table"><thead><tr><th>业务任务</th><th>任务 / 供应商</th><th>失败原因</th><th>进入时间</th><th>建议动作</th><th class="actions">操作</th></tr></thead><tbody>${deadLetterJobs || `<tr><td colspan="6">暂无待处理死信</td></tr>`}</tbody></table></div>
          <div class="risk-panel-head" style="margin-top:20px;"><div class="risk-panel-title"><h3>其他失败队列任务</h3><p>这里展示 BullMQ 保留的失败记录，不等同于当前队列积压</p></div></div>
          <div class="table-wrap compact"><table class="risk-table"><thead><tr><th>队列任务</th><th>所在队列</th><th>尝试</th><th>失败原因</th><th>完成时间</th><th class="actions">操作</th></tr></thead><tbody>${failedRows || `<tr><td colspan="6">暂无其他失败队列任务</td></tr>`}</tbody></table></div>
        </section>`;
      }

      function queueJobTaskId(job) {
        return String(job?.data?.sourceJobData?.taskId || job?.data?.taskId || "");
      }

      function queueJobTask(job) {
        const taskId = queueJobTaskId(job);
        return taskId ? riskTaskItems().find((task) => String(task.id) === taskId) : null;
      }

      function deadLetterRecommendation(job, task) {
        if (!task) return { label: "核对后归档", note: "未找到业务任务，请先检查审计记录", tone: "blue" };
        if (task.providerStatus === "succeeded" && task.externalRequestId) return { label: "重建终态", note: "供应商已成功，先恢复产物最终化", tone: "warn" };
        if (["submitted", "accepted", "running", "result_unknown"].includes(task.providerStatus) && task.externalRequestId) return { label: "恢复轮询", note: "沿用外部请求 ID，不重新提交生成", tone: "blue" };
        if (["failed", "canceled"].includes(task.providerStatus)) return { label: "归档死信", note: "供应商已明确失败，无需再次执行", tone: "green" };
        return { label: "人工核对", note: "供应商结果不足，暂不开放重放", tone: "warn" };
      }

      function deadLetterRow(queue, job) {
        const taskId = queueJobTaskId(job);
        const task = queueJobTask(job);
        const recommendation = deadLetterRecommendation(job, task);
        return `<tr><td><div class="risk-title">${escapeHtml(taskId || "未关联业务任务")}</div><div class="risk-code">${escapeHtml(job.data?.sourceJobName || job.name || "generation.dead_letter")}</div></td><td><div class="dead-letter-task-state"><strong>${escapeHtml(task ? taskStatusLabel(task.status) : "任务状态未知")}</strong><span class="risk-context">供应商 ${escapeHtml(task?.providerStatus || "未知")} · ${escapeHtml(task?.providerName || "未记录")}</span></div></td><td class="risk-context">${escapeHtml(job.failureReason || "未记录失败原因")}</td><td class="risk-time">${escapeHtml(formatAdminDateTime(job.finishedAt || job.processedAt || job.timestamp))}</td><td><span class="tag ${recommendation.tone}">${escapeHtml(recommendation.label)}</span><div class="risk-context">${escapeHtml(recommendation.note)}</div></td><td class="actions"><button class="btn ghost risk-action" onclick="openQueueJobDrawer('${escapeAttribute(queue.name)}','${escapeAttribute(job.id)}')" ${permissionAttrs("ops.task.retry")}>处置</button></td></tr>`;
      }

      function riskPaymentsView() {
        const risks = state.risks.risks.filter((risk) => (state.riskStatusFilter === "all" || risk.status === state.riskStatusFilter) && riskSearchMatches(risk.riskType, risk.orderId, risk.paymentIntentId, risk.decision, compactJson(risk.metadata)));
        const rows = risks.length ? risks.map(paymentRiskRow).join("") : `<tr><td colspan="7">${escapeHtml(state.riskLoadError || "没有匹配的支付风险")}</td></tr>`;
        return `<section class="risk-panel"><div class="risk-panel-head"><div class="risk-panel-title"><h3>支付风险事件</h3><p>核对回调金额、币种、商户订单与供应商事件后记录复核结论</p></div><div class="risk-panel-actions"><select class="risk-status-filter" onchange="updateRiskStatusFilter(this.value)">${riskStatusOptions()}</select><button class="btn ghost" onclick="downloadRiskExport('risks')" ${permissionAttrs("risk.export")}>导出风险</button></div></div><div class="table-wrap compact"><table class="risk-table"><thead><tr><th>风险</th><th>订单 / 支付单</th><th>等级</th><th>决策</th><th>状态</th><th>发生时间</th><th class="actions">操作</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
      }

      function riskRepairsView() {
        const issues = state.risks.paymentIssues.filter((issue) => riskSearchMatches(issue.orderNo, issue.orderId, issue.successfulPaymentIntentId));
        const rows = issues.length ? issues.map(paymentIssueRow).join("") : `<tr><td colspan="7">暂无待补发积分订单</td></tr>`;
        return `<section class="risk-panel"><div class="risk-panel-head"><div class="risk-panel-title"><h3>支付积分补发</h3><p>仅列出支付意图、金额、币种和支付事件均已交叉验证，但积分账本缺失的订单</p></div><span class="risk-count-note">${issues.length.toLocaleString()} 笔</span></div><div class="table-wrap compact"><table class="risk-table"><thead><tr><th>订单</th><th>支付凭据</th><th>积分</th><th>金额</th><th>支付时间</th><th>状态</th><th class="actions">操作</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
      }

      function riskAuditView() {
        const events = state.auditEvents.filter((event) => riskSearchMatches(event.eventType, event.targetType, event.targetId, event.reason, event.adminDisplayName));
        const rows = events.length ? events.map(auditEventRow).join("") : `<tr><td colspan="6">暂无匹配的审计记录</td></tr>`;
        return `<section class="risk-panel"><div class="risk-panel-head"><div class="risk-panel-title"><h3>处置审计追踪</h3><p>所有复核、重试、人工结算、队列操作与导出行为均保留记录</p></div><div class="risk-panel-actions"><button class="btn ghost" onclick="downloadRiskExport('audit-events')" ${permissionAttrs("risk.export")}>导出审计</button></div></div><div class="table-wrap compact"><table class="risk-table"><thead><tr><th>动作</th><th>管理员</th><th>对象</th><th>原因</th><th>时间</th><th class="actions">操作</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
      }

      function riskEmptyState(title, note) {
        return `<div class="risk-empty"><div><strong>${escapeHtml(title)}</strong><span>${escapeHtml(note)}</span></div></div>`;
      }

      function smsRecordsPage() {
        const pageSize = Number(state.smsRecordPageSize) || 20;
        const totalCount = Math.max(0, Number(state.smsRecordTotal) || 0);
        const totalPages = Math.max(1, Math.ceil(totalCount / pageSize));
        const currentPage = Math.min(Math.max(1, Number(state.smsRecordPage) || 1), totalPages);
        state.smsRecordPage = currentPage;
        const rows = state.smsRecords.length
          ? state.smsRecords.map((item) => `
            <tr>
              <td>${escapeHtml(formatAdminDateTime(item.createdAt))}</td>
              <td>${escapeHtml(item.phone || "-")}</td>
              <td><span class="tag blue">${escapeHtml(item.verificationCode || "-")}</span></td>
              <td>${escapeHtml(item.ipAddress || "-")}</td>
              <td><div class="metric-note">${escapeHtml(item.smsContent || "-")}</div></td>
              <td><span class="tag ${item.status === "sent" ? "green" : item.status === "test" ? "blue" : "warn"}">${item.status === "sent" ? "成功" : item.status === "test" ? "测试" : "失败"}</span></td>
            </tr>
          `).join("")
          : `<tr><td colspan="6">${state.smsRecordLoadError || "暂无短信记录"}</td></tr>`;
        return `<section class="card">
          <div class="toolbar">
            <h3>短信记录</h3>
            <div class="filters">
              <select onchange="updateSmsRecordRange(this.value)">${smsRecordRangeOptions(state.smsRecordRange || "all")}</select>
              <button class="btn ghost" onclick="loadSmsRecords().then(renderShell)">刷新</button>
            </div>
          </div>
          <div class="metric-note">默认隐藏测试样例号，可按天或按月过滤。列表展示手机号、验证码、IP 与短信内容。</div>
          <div class="table-wrap dense"><table><thead><tr><th>时间</th><th>手机号</th><th>验证码</th><th>IP</th><th>短信内容</th><th>状态</th></tr></thead><tbody>${rows}</tbody></table></div>
          <div class="resource-pagination">${totalCount ? `<span class="metric-note">第 ${currentPage} / ${totalPages} 页 · 共 ${totalCount} 条</span>
            <button class="btn ghost" type="button" onclick="setSmsRecordPage(${currentPage - 1})" ${currentPage <= 1 ? "disabled" : ""}>上一页</button>
            <button class="btn ghost" type="button" onclick="setSmsRecordPage(${currentPage + 1})" ${currentPage >= totalPages ? "disabled" : ""}>下一页</button>` : ""}</div>
        </section>`;
      }

      function setSmsRecordPage(page) {
        const nextPage = Math.max(1, Number(page) || 1);
        if (nextPage === Number(state.smsRecordPage || 1)) return;
        state.smsRecordPage = nextPage;
        loadSmsRecords().then(renderShell);
      }

      function formatBytes(value) {
        const bytes = Number(value || 0);
        if (!Number.isFinite(bytes) || bytes <= 0) return "-";
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        if (bytes < 1024 * 1024 * 1024) return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
        return `${(bytes / (1024 * 1024 * 1024)).toFixed(2)} GB`;
      }

      function updateResourceMediaFilter(value) {
        state.resourceMediaFilter = value || "all";
        state.resourcePage = 1;
        loadResources().then(renderShell);
      }

      function updateResourceRangeFilter(value) {
        state.resourceRangeFilter = value || "all";
        state.resourcePage = 1;
        loadResources().then(renderShell);
      }

      function updateResourceSearch(value) {
        state.resourceSearch = value || "";
        state.resourcePage = 1;
        loadResources().then(renderShell);
      }

      function setResourcePage(page) {
        const nextPage = Math.max(1, Number(page) || 1);
        state.resourcePage = nextPage;
        loadResources().then(renderShell);
      }

      function selectResource(resourceId) {
        state.resourceSelectedId = resourceId;
        renderShell();
      }

      function previewResource(resourceId) {
        const item = state.resources.find((entry) => entry.id === resourceId);
        if (!item) return;
        const previewUrl = storagePreviewUrl(item);
        if (!previewUrl) {
          showToast("当前资源没有可用预览链接");
          return;
        }
        state.resourceSelectedId = resourceId;
        state.resourcePreviewOpen = true;
        renderShell();
      }

      function closeResourcePreview() {
        if (!state.resourcePreviewOpen) return;
        state.resourcePreviewOpen = false;
        renderShell();
      }

      async function copyResourceUrl(url) {
        if (!url) return;
        await navigator.clipboard?.writeText(url).then(() => showToast("资源链接已复制")).catch(() => showToast("当前浏览器不支持自动复制"));
      }

      function openResourceUrl(url) {
        if (!url) return;
        window.open(url, "_blank", "noopener,noreferrer");
      }

      async function deleteResource(resourceId) {
        const item = state.resources.find((entry) => entry.id === resourceId);
        if (!item) return;
        if (!window.confirm(`确认删除资源“${item.fileName || item.objectKey || item.id}”吗？删除后将从云存储和资源列表中移除。`)) {
          return;
        }
        try {
          await api(`/api/admin/resources/${encodeURIComponent(resourceId)}`, {
            method: "DELETE",
            headers: { "idempotency-key": `admin-ui-resource-delete-${resourceId}-${Date.now()}` },
            body: JSON.stringify({ reason: "后台删除资源" }),
          });
          if (state.resourceSelectedId === resourceId) {
            state.resourceSelectedId = null;
          }
          state.resourcePreviewOpen = false;
          await loadResources();
          renderShell();
          showToast("资源已删除");
        } catch (error) {
          showToast(error.payload?.error?.message || "资源删除失败");
        }
      }

      function resourcePreviewCell(item) {
        const previewUrl = storagePreviewUrl(item);
        const label = resourceKindLabel(item);
        if (!previewUrl) {
          return `<div class="resource-thumb-btn" style="cursor:default;"><span class="resource-thumb-label">暂无预览</span></div>`;
        }
        const inner = label === "视频"
          ? `<video src="${escapeAttribute(previewUrl)}" muted playsinline preload="metadata"></video>`
          : `<img src="${escapeAttribute(previewUrl)}" alt="${escapeAttribute(item.fileName || item.objectKey || "资源预览")}" loading="lazy" referrerpolicy="no-referrer" />`;
        return `<button class="resource-thumb-btn" type="button" title="点击放大预览" onclick="event.stopPropagation();previewResource('${escapeAttribute(item.id)}')">${inner}</button>`;
      }

      function resourceTableRow(item) {
        const previewUrl = storagePreviewUrl(item);
        const active = state.resourceSelectedId === item.id ? "active" : "";
        const fileLabel = item.fileName || item.objectKey || "未命名资源";
        const linkValue = previewUrl || item.sourceUrl || item.downloadUrl || "";
        return `<tr class="${active}" onclick="selectResource('${escapeAttribute(item.id)}')">
          <td class="preview-col">${resourcePreviewCell(item)}</td>
          <td class="resource-link-cell">
            <button class="resource-link-button resource-link-primary" type="button" onclick="event.stopPropagation();selectResource('${escapeAttribute(item.id)}')">${escapeHtml(fileLabel)}</button>
            <div class="resource-link-secondary">${escapeHtml(linkValue || `${item.bucket || "-"} / ${item.objectKey || "-"}`)}</div>
          </td>
          <td class="size-col">${formatBytes(item.sizeBytes)}</td>
          <td class="type-col">
            <div><span class="tag ${resourceKindTone(item)}">${resourceKindLabel(item)}</span></div>

          </td>
          <td class="user-col">${escapeHtml(item.actorDisplayName || "-")}</td>
          <td class="phone-col">${escapeHtml(item.actorPhoneE164 || "-")}</td>
          <td class="time-col">${escapeHtml(formatAdminDateTime(item.createdAt))}</td>
          <td class="actions">
            <div class="resource-row-actions">
              <button class="icon-btn" type="button" title="打开原始链接" onclick="event.stopPropagation();openResourceUrl('${escapeAttribute(linkValue)}')">开</button>
              <button class="icon-btn" type="button" title="复制链接" onclick="event.stopPropagation();copyResourceUrl('${escapeAttribute(linkValue)}')">复</button>
