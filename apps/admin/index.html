              <label class="field"><span>\u534f\u8bae\u540d\u79f0</span><input name="title" value="${escapeAttribute(defaultTitle)}" placeholder="\u8bf7\u8f93\u5165\u534f\u8bae\u540d\u79f0" required /></label>
              <label class="field"><span>\u534f\u8bae\u7c7b\u578b</span>
                <input id="legal-document-type-input" name="type" value="${escapeAttribute(defaultType)}" placeholder="\u4f8b\u5982\uff1aservice\u3001privacy\u3001recharge_terms" required />
              </label>
            </div>
            <div class="legal-document-type-presets">
              ${typeChoices.map((option) => `<button class="btn ghost" type="button" data-legal-type-preset="${escapeAttribute(option.value)}">${escapeHtml(option.label)}</button>`).join("")}
            </div>
            <p class="legal-document-note">\u53ef\u4ee5\u76f4\u63a5\u8f93\u5165\u65b0\u7684\u534f\u8bae\u7c7b\u578b\uff0c\u4e0d\u53d7\u9650\u4e8e\u4e0a\u65b9\u5feb\u6377\u9009\u9879\u3002</p>
            <div class="legal-document-toolbar">
              <div class="legal-document-toolbar-group">
                <button class="btn ghost" type="button" data-legal-command="bold" data-legal-active-command="bold" title="\u52a0\u7c97">B</button>
                <button class="btn ghost" type="button" data-legal-command="italic" data-legal-active-command="italic" title="\u659c\u4f53">I</button>
                <button class="btn ghost" type="button" data-legal-command="underline" data-legal-active-command="underline" title="\u4e0b\u5212\u7ebf">U</button>
                <button class="btn ghost" type="button" data-legal-command="strikeThrough" data-legal-active-command="strikeThrough" title="\u5220\u9664\u7ebf">S</button>
              </div>
              <span class="legal-document-toolbar-separator" aria-hidden="true"></span>
              <div class="legal-document-toolbar-group">
                <button class="btn ghost" type="button" data-legal-block="h1" data-legal-active-block="h1" title="\u4e00\u7ea7\u6807\u9898">H1</button>
                <button class="btn ghost" type="button" data-legal-block="h2" data-legal-active-block="h2" title="\u4e8c\u7ea7\u6807\u9898">H2</button>
                <button class="btn ghost" type="button" data-legal-block="h3" data-legal-active-block="h3" title="\u4e09\u7ea7\u6807\u9898">H3</button>
                <button class="btn ghost" type="button" data-legal-block="p" data-legal-active-block="p" title="\u6b63\u6587">\u6b63\u6587</button>
              </div>
              <span class="legal-document-toolbar-separator" aria-hidden="true"></span>
              <div class="legal-document-toolbar-group">
                <button class="btn ghost" type="button" data-legal-command="justifyLeft" title="\u5de6\u5bf9\u9f50">\u5de6</button>
                <button class="btn ghost" type="button" data-legal-command="justifyCenter" title="\u5c45\u4e2d">\u4e2d</button>
                <button class="btn ghost" type="button" data-legal-command="justifyRight" title="\u53f3\u5bf9\u9f50">\u53f3</button>
              </div>
              <span class="legal-document-toolbar-separator" aria-hidden="true"></span>
              <div class="legal-document-toolbar-group">
                <button class="btn ghost" type="button" data-legal-command="insertUnorderedList" data-legal-active-command="insertUnorderedList" title="\u65e0\u5e8f\u5217\u8868">\u65e0\u5e8f</button>
                <button class="btn ghost" type="button" data-legal-command="insertOrderedList" data-legal-active-command="insertOrderedList" title="\u6709\u5e8f\u5217\u8868">\u6709\u5e8f</button>
                <button class="btn ghost" type="button" data-legal-block="blockquote" data-legal-active-block="blockquote" title="\u5f15\u7528">\u5f15\u7528</button>
                <button class="btn ghost" type="button" data-legal-command="outdent" title="\u51cf\u5c11\u7f29\u8fdb">\u51cf\u7f29</button>
                <button class="btn ghost" type="button" data-legal-command="indent" title="\u589e\u52a0\u7f29\u8fdb">\u589e\u7f29</button>
              </div>
              <span class="legal-document-toolbar-separator" aria-hidden="true"></span>
              <div class="legal-document-toolbar-group">
                <button class="btn ghost" type="button" data-legal-link="true" title="\u63d2\u5165\u94fe\u63a5">\u94fe\u63a5</button>
                <button class="btn ghost" type="button" data-legal-command="unlink" title="\u53d6\u6d88\u94fe\u63a5">\u53bb\u94fe</button>
                <button class="btn ghost" type="button" data-legal-command="removeFormat" title="\u6e05\u9664\u683c\u5f0f">\u6e05\u9664</button>
              </div>
            </div>
            <p class="legal-document-note">\u652f\u6301\u7b80\u5355\u5bcc\u6587\u672c\uff1a\u6807\u9898\u3001\u52a0\u7c97\u3001\u5217\u8868\u3001\u94fe\u63a5\u548c\u5f15\u7528\u3002\u53f3\u4fa7\u9884\u89c8\u533a\u4f1a\u540c\u6b65\u53cd\u6620\u767b\u5f55\u9875\u7684\u5b9e\u9645\u5c55\u73b0\u3002</p>
            <div class="legal-document-editor-layout">
              <div class="legal-document-editor-shell">
                <h4>\u5bcc\u6587\u672c\u7f16\u8f91</h4>
                <div id="legal-document-editor" class="agreement-rich-text legal-document-surface is-editor" contenteditable="true">${initialContentHtml}</div>
                <textarea id="legal-document-html" name="contentHtml" hidden>${escapeHtml(initialContentHtml)}</textarea>
              </div>
              <div class="legal-document-preview-shell">
                <div class="legal-document-preview-head">
                  <h4>\u9884\u89c8</h4>
                  <span class="metric-note">\u6839\u636e\u767b\u5f55\u9875\u5f39\u7a97\u6837\u5f0f\u5b9e\u65f6\u9884\u6f14</span>
                </div>
                <div id="legal-document-preview" class="agreement-rich-text legal-document-surface">${initialContentHtml}</div>
              </div>
            </div>
            <div class="error-text" id="legal-document-error"></div>
            <div class="toolbar legal-document-actions">
              <button class="btn ghost" type="button" onclick="closeDrawer()">\u53d6\u6d88</button>
              <button class="btn primary" type="submit">\u4fdd\u5b58\u534f\u8bae</button>
            </div>
          </form>
        </aside>`;

        const form = document.getElementById("legal-document-form");
        const editor = document.getElementById("legal-document-editor");
        const preview = document.getElementById("legal-document-preview");
        const htmlInput = document.getElementById("legal-document-html");
        const error = document.getElementById("legal-document-error");
        const titleInput = form.elements.namedItem("title");
        const typeInput = form.elements.namedItem("type");
        let savedSelection = null;

        const saveSelection = () => {
          const selection = window.getSelection();
          if (!selection || selection.rangeCount === 0) return;
          const range = selection.getRangeAt(0);
          if (!editor.contains(range.commonAncestorContainer)) return;
          savedSelection = range.cloneRange();
        };

        const restoreSelection = () => {
          if (!savedSelection) return false;
          const selection = window.getSelection();
          if (!selection) return false;
          selection.removeAllRanges();
          selection.addRange(savedSelection);
          return true;
        };

        const focusEditor = () => {
          editor.focus();
          if (!restoreSelection()) {
            const range = document.createRange();
            range.selectNodeContents(editor);
            range.collapse(false);
            const selection = window.getSelection();
            selection?.removeAllRanges();
            selection?.addRange(range);
            saveSelection();
          }
        };

        const activeBlockTag = () => {
          const selection = window.getSelection();
          if (!selection || selection.rangeCount === 0) return "";
          let node = selection.anchorNode;
          if (!node) return "";
          if (node.nodeType === Node.TEXT_NODE) node = node.parentElement;
          while (node && node !== editor) {
            const tagName = node.nodeName?.toLowerCase?.() || "";
            if (["h1", "h2", "h3", "p", "blockquote"].includes(tagName)) return tagName;
            node = node.parentElement;
          }
          return "p";
        };

        const syncEditor = () => {
          const safeHtml = sanitizeRichTextHtml(editor.innerHTML);
          htmlInput.value = safeHtml;
          preview.innerHTML = safeHtml;
        };

        const syncToolbarState = () => {
          drawer.querySelectorAll("[data-legal-active-command]").forEach((button) => {
            const command = button.dataset.legalActiveCommand;
            let active = false;
            try {
              active = !!document.queryCommandState(command);
            } catch {
              active = false;
            }
            button.classList.toggle("is-active", active);
          });
          const blockTag = activeBlockTag();
          drawer.querySelectorAll("[data-legal-active-block]").forEach((button) => {
            button.classList.toggle("is-active", button.dataset.legalActiveBlock === blockTag);
          });
        };

        const runEditorCommand = (command, value = null) => {
          focusEditor();
          document.execCommand(command, false, value);
          saveSelection();
          syncEditor();
          syncToolbarState();
        };

        drawer.querySelectorAll("[data-legal-command]").forEach((button) => {
          button.addEventListener("mousedown", (event) => {
            event.preventDefault();
            saveSelection();
          });
          button.addEventListener("click", (event) => {
            event.preventDefault();
            runEditorCommand(button.dataset.legalCommand);
          });
        });
        drawer.querySelectorAll("[data-legal-block]").forEach((button) => {
          button.addEventListener("mousedown", (event) => {
            event.preventDefault();
            saveSelection();
          });
          button.addEventListener("click", (event) => {
            event.preventDefault();
            runEditorCommand("formatBlock", button.dataset.legalBlock);
          });
        });
        drawer.querySelectorAll("[data-legal-link]").forEach((button) => {
          button.addEventListener("mousedown", (event) => {
            event.preventDefault();
            saveSelection();
          });
          button.addEventListener("click", (event) => {
            event.preventDefault();
            focusEditor();
            const url = window.prompt("\u8bf7\u8f93\u5165\u94fe\u63a5\u5730\u5740", "https://");
            if (!url) return;
            document.execCommand("createLink", false, url);
            saveSelection();
            syncEditor();
            syncToolbarState();
          });
        });
        editor.addEventListener("mouseup", () => {
          saveSelection();
          syncToolbarState();
        });
        editor.addEventListener("keyup", () => {
          saveSelection();
          syncToolbarState();
        });
        editor.addEventListener("focus", () => {
          saveSelection();
          syncToolbarState();
        });
        editor.addEventListener("input", syncEditor);
        syncToolbarState();
        syncEditor();

        const syncTypePresetState = () => {
          const selectedType = String(typeInput?.value || "").trim();
          drawer.querySelectorAll("[data-legal-type-preset]").forEach((button) => {
            button.classList.toggle("is-active", button.dataset.legalTypePreset === selectedType);
          });
        };

        drawer.querySelectorAll("[data-legal-type-preset]").forEach((button) => {
          button.addEventListener("click", () => {
            if (!typeInput) return;
            typeInput.value = button.dataset.legalTypePreset || "";
            syncTypePresetState();
            typeInput.focus();
          });
        });
        typeInput?.addEventListener("input", syncTypePresetState);
        syncTypePresetState();

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const docType = String(typeInput?.value || "").trim();
          const docTitle = String(titleInput?.value || "").trim();
          if (!docType) {
            error.textContent = "请输入协议类型";
            return;
          }

      async function loadOfficialAssets() {
        const store = officialAssetState();
        setPageLoading("officialAssets", true);
        try {
          const params = new URLSearchParams();
          if (store.category && store.category !== "all") params.set("category", store.category);
          if (store.status && store.status !== "all") params.set("status", store.status);
          if (store.keyword) params.set("q", store.keyword);
          const suffix = params.toString() ? `?${params.toString()}` : "";
          const result = await api(`/api/admin/official-assets${suffix}`);
          store.data = Array.isArray(result.data) ? result.data : [];
          store.meta = result.meta || { total: store.data.length };
          store.loadError = "";
          clearPageForbidden("officialAssets");
        } catch (error) {
          if (!setPageForbidden("officialAssets", error)) {
            store.loadError = error.payload?.error?.message || "官方资产库加载失败";
          }
          store.data = [];

          setPageLoading("officialAssets", false);
        }

      function officialAssetPayloadFromForm(formElement) {
        const form = new FormData(formElement);
        const detailViewItems = parseOfficialAssetJson(form.get("detailViewItems"), "详情图组必须是 JSON 数组");
        const metaRows = parseOfficialAssetJson(form.get("metaRows"), "详情页元信息必须是 JSON 数组");
        return {
          name: String(form.get("name") || "").trim(),
          category: String(form.get("category") || "character"),
          folder: String(form.get("folder") || "").trim(),
          description: String(form.get("description") || "").trim(),
          tags: String(form.get("tags") || "").split(",").map((item) => item.trim()).filter(Boolean),
          previewUrl: String(form.get("previewUrl") || "").trim(),
          storageObjectKey: String(form.get("storageObjectKey") || "").trim(),
          mimeType: String(form.get("mimeType") || "").trim(),
          width: Number(form.get("width") || 1024),
          height: Number(form.get("height") || 1024),
          sortOrder: Number(form.get("sortOrder") || 100),
          display: {
            kicker: String(form.get("displayKicker") || "").trim(),
            title: String(form.get("displayTitle") || "").trim(),
            description: String(form.get("displayDescription") || "").trim(),
            metaRows,
          },
          detailViewItems,
        };
      }

      function parseOfficialAssetJson(value, message) {
        const text = String(value || "").trim();
        if (!text) return [];
        try {
          const parsed = JSON.parse(text);
          if (!Array.isArray(parsed)) throw new Error("not_array");
          return parsed;
        } catch {
          throw new Error(message);
        }
      }

      function officialAssetDetailItemsFromForm(form) {
        const textarea = form?.querySelector('textarea[name="detailViewItems"]');
        if (!textarea) return [];
        try {
          return parseOfficialAssetJson(textarea.value, "详情图组必须是 JSON 数组");
        } catch {
          return [];
        }
      }

      function renderOfficialAssetMainPreview(form) {
        const target = document.getElementById("official-asset-main-preview");
        if (!target) return;
        const previewUrl = form?.querySelector('input[name="previewUrl"]')?.value || "";
        if (!previewUrl) {
          target.innerHTML = `<div class="metric-note">暂无主图，上传后会在这里预览。</div>`;
          return;
        }
        target.innerHTML = `<article class="official-asset-main-preview-card">
          <img src="${escapeAttribute(previewUrl)}" alt="主图" loading="lazy" />
          <span>主图</span>
        </article>`;
      }

      function renderOfficialAssetDetailPreview(form) {
        const target = document.getElementById("official-asset-detail-preview");
        if (!target) return;
        const items = officialAssetDetailItemsFromForm(form);
        const imageItems = items.filter((item) => item?.imageUrl || item?.thumbnailUrl);
        if (!imageItems.length) {
          target.innerHTML = `<div class="metric-note">暂无详情图，上传后会在这里预览。</div>`;
          return;
        }
        target.innerHTML = items.map((item, itemIndex) => ({ item, itemIndex })).filter(({ item }) => item?.imageUrl || item?.thumbnailUrl).map(({ item, itemIndex }, index) => {
          const imageUrl = item.thumbnailUrl || item.imageUrl || "";
          const label = item.label || item.key || `详情图 ${index + 1}`;
          return `<article class="official-asset-detail-preview-card">
            <button type="button" class="official-asset-detail-remove" aria-label="删除图片" title="删除图片" onclick="removeOfficialAssetDetailItem(this.closest('form'), ${itemIndex})" ${permissionAttrs("settings.write")}>×</button>
            <img src="${escapeAttribute(imageUrl)}" alt="${escapeAttribute(label)}" loading="lazy" />
            <span class="official-asset-detail-label" contenteditable="true" role="textbox" aria-label="当前角度" oninput="updateOfficialAssetDetailItemLabel(this.closest('form'), ${itemIndex}, this.textContent)" onblur="normalizeOfficialAssetDetailItemLabel(this, this.closest('form'), ${itemIndex})" onkeydown="if(event.key === 'Enter'){event.preventDefault();this.blur();}">${escapeHtml(label)}</span>
          </article>`;
        }).join("");
      }

      function updateOfficialAssetDetailItemLabel(form, itemIndex, value) {
        const textarea = form?.querySelector('textarea[name="detailViewItems"]');
        const index = Number(itemIndex);
        if (!textarea || !Number.isInteger(index)) return "";
        const items = officialAssetDetailItemsFromForm(form);
        if (index < 0 || index >= items.length) return "";
        const existing = items[index] || {};
        const fallback = existing.key || `详情图 ${index + 1}`;
        const label = String(value || "").replace(/\s+/g, " ").trim() || fallback;
        items[index] = { ...existing, label };
        textarea.value = JSON.stringify(items, null, 2);
        return label;
      }

      function normalizeOfficialAssetDetailItemLabel(element, form, itemIndex) {
        const label = updateOfficialAssetDetailItemLabel(form, itemIndex, element?.textContent || "");

      async function uploadAdminImage(file, uploadPath) {
        if (!file) return null;
        if (!String(file.type || "").startsWith("image/")) {
          throw new Error("请选择图片文件");
        }
        const fileName = file.name || "admin-image.png";
        const response = await fetch(resolveAdminApiUrl(`${uploadPath}?fileName=${encodeURIComponent(fileName)}`), {
          method: "POST",
          credentials: "include",
          headers: { "content-type": file.type || "application/octet-stream" },
          body: file,
        });
        const rawBody = await response.text().catch(() => "");
        let payload = {};
        try {
          payload = rawBody ? JSON.parse(rawBody) : {};
        } catch {
          payload = { message: rawBody };
        }
        if (!response.ok) {
          throw Object.assign(new Error(adminApiErrorMessage(payload, response)), { payload, status: response.status });
        }
        return payload.data || payload;
      }

          if (keyInput) keyInput.value = uploaded.storageObjectKey || "";

      function syncOfficialAssetMainDetailItem(form, uploaded, previousPreviewUrl = "") {
        const textarea = form.querySelector('textarea[name="detailViewItems"]');
        if (!textarea) return;
        let items = [];
        try {
          items = parseOfficialAssetJson(textarea.value, "详情图组必须是 JSON 数组");
        } catch {
          items = [];
        }
        const nextUrl = uploaded.previewUrl || uploaded.sourceUrl || "";
        const nextItem = {
          key: "main",
          label: "主图",
          imageUrl: nextUrl,
          thumbnailUrl: nextUrl,
          sortOrder: 10,
          isDefault: true,
        };
        if (!items.length) {
          textarea.value = JSON.stringify([nextItem], null, 2);
          return;
        }
        const updatedItems = items.map((item, index) => {
          const isMain = index === 0 || item?.key === "main" || item?.isDefault === true;
          const canReplace = isMain && (!item?.imageUrl || item.imageUrl === previousPreviewUrl);
          return canReplace ? { ...item, ...nextItem, key: item?.key || "main", label: item?.label || "主图" } : item;
        });
        textarea.value = JSON.stringify(updatedItems, null, 2);
      }

      function appendOfficialAssetDetailItem(form, uploaded, file) {
        const textarea = form.querySelector('textarea[name="detailViewItems"]');
        if (!textarea) return;
        const items = parseOfficialAssetJson(textarea.value, "详情图组必须是 JSON 数组");
        const imageUrl = uploaded.previewUrl || uploaded.sourceUrl || "";
        const label = String(file?.name || "详情图").replace(/\.[^.]+$/, "") || "详情图";
        items.push({
          key: `detail-${Date.now()}`,
          label,
          imageUrl,
          thumbnailUrl: imageUrl,
          sortOrder: (items.length + 1) * 10,
          isDefault: !items.some((item) => item?.isDefault),
        });
        textarea.value = JSON.stringify(items, null, 2);
      }

      function readOfficialAssetImageSize(file) {
        return new Promise((resolve) => {
          if (!file || typeof Image === "undefined" || typeof URL === "undefined" || !URL.createObjectURL) {
            resolve({ width: 0, height: 0 });
            return;
          }
          const objectUrl = URL.createObjectURL(file);
          const image = new Image();
          image.onload = () => {
            URL.revokeObjectURL(objectUrl);
            resolve({ width: image.naturalWidth || 0, height: image.naturalHeight || 0 });
          };
          image.onerror = () => {
            URL.revokeObjectURL(objectUrl);
            resolve({ width: 0, height: 0 });
          };
          image.src = objectUrl;
        });
      }

      function parameterTemplates() {
        const value = parameterTemplateConfig().value || {};
        const configuredTemplates = Array.isArray(value.templates) ? value.templates : [];
        const merged = new Map(
          DEFAULT_MODEL_PARAMETER_TEMPLATES
            .map((template) => normalizeParameterTemplate(template))
            .map((template) => [template.key, template]),
        );
        configuredTemplates
          .map((template) => normalizeParameterTemplate(template))
          .forEach((template) => {
            const existing = merged.get(template.key);
            merged.set(template.key, existing
              ? {
                ...existing,
                ...template,
                mediaTypes: template.mediaTypes.length ? template.mediaTypes : existing.mediaTypes,
                options: template.options.length ? template.options : existing.options,
              }
              : template);
          });
        return [...merged.values()]
          .sort((left, right) => Number(left.sortOrder || 100) - Number(right.sortOrder || 100) || left.key.localeCompare(right.key));
      }

      function normalizeParameterTemplate(template = {}) {
        return {
          key: String(template.key || "").trim(),
          label: String(template.label || template.key || "").trim(),
          type: String(template.type || "string").trim(),
          mediaTypes: Array.isArray(template.mediaTypes) ? template.mediaTypes.map(String) : ["image", "video"],
          required: template.required === true,
          visible: template.visible !== false,
          options: Array.isArray(template.options) ? template.options.map(String) : [],

          sortOrder: Number(template.sortOrder || 100),

      async function deleteParameterTemplate(templateKey) {
        if (!window.confirm("\u786e\u8ba4\u5220\u9664\u8fd9\u4e2a\u53c2\u6570\u6a21\u677f\u5417\uff1f")) return;
        const templates = parameterTemplates().filter((item) => item.key !== templateKey);
        await saveParameterTemplates(templates, `\u5220\u9664\u53c2\u6570\u6a21\u677f ${templateKey}`);
        renderShell();
        showToast("\u53c2\u6570\u6a21\u677f\u5df2\u5220\u9664");
      }

      async function saveParameterTemplates(templates, reason) {
        const config = parameterTemplateConfig();
        const result = await api(`/api/admin/settings/${encodeURIComponent(MODEL_PARAMETER_TEMPLATES_CONFIG_KEY)}`, {
          method: "PATCH",
          headers: { "idempotency-key": `admin-ui-parameter-template-${Date.now()}` },
          body: JSON.stringify({
            value: { templates: templates.map(normalizeParameterTemplate) },
            valueType: "json",
            scope: String(config.scope || "creator"),
            description: String(config.description || "\u6a21\u578b\u53c2\u6570\u6a21\u677f\u5e93"),
            reason: reason || "\u66f4\u65b0\u6a21\u578b\u53c2\u6570\u6a21\u677f\u5e93",
          }),
        });
        const savedConfig = result.data || {
          ...config,
          value: { templates: templates.map(normalizeParameterTemplate) },
          valueType: "json",
          scope: String(config.scope || "creator"),
          description: String(config.description || "\u6a21\u578b\u53c2\u6570\u6a21\u677f\u5e93"),
        };
        const configs = Array.isArray(state.settings.configs) ? [...state.settings.configs] : [];
        const index = configs.findIndex((item) => item.key === MODEL_PARAMETER_TEMPLATES_CONFIG_KEY);
        if (index >= 0) {
          configs[index] = savedConfig;
        } else {
          configs.push(savedConfig);
        }
        state.settings = settingsWithRuntimeConfigHints({
          ...(state.settings || {}),
          configs,
          secretReferences: state.settings?.secretReferences || [],
        });
      }

      function splitCsv(value) {
        return String(value || "").split(",").map((item) => item.trim()).filter(Boolean);
      }

        const rows = options.map((option) => parameterOptionEditorRow(option)).join("");
        return `<div class="parameter-option-editor" data-parameter-option-editor>
          <div class="parameter-option-editor-list" data-parameter-option-editor-list>
            ${rows || `<div class="parameter-option-editor-empty" data-parameter-option-editor-empty>\u6682\u65e0\u9009\u9879\uff0c\u53ef\u624b\u52a8\u6dfb\u52a0</div>`}
          </div>
          <div class="parameter-option-editor-add">
            <input data-parameter-option-new placeholder="\u8f93\u5165\u9009\u9879\uff0c\u4f8b\u5982 2048x2560" />
            <button class="btn ghost" type="button" onclick="addParameterTemplateOption(this)">\u6dfb\u52a0</button>
          </div>
        </div>`;
      }

      function parameterOptionEditorRow(value = "") {
        return `<div class="parameter-option-editor-row" data-parameter-option-row>
          <span class="parameter-option-editor-index" data-parameter-option-index>1</span>
          <input name="options" value="${escapeAttribute(value)}" placeholder="\u9009\u9879\u503c" />
          <span class="parameter-option-row-actions">
            <button class="icon-btn" type="button" title="\u4e0a\u79fb" onclick="moveParameterTemplateOption(this, -1)">↑</button>

      function refreshParameterOptionEditor(editor) {
        const list = editor?.querySelector("[data-parameter-option-editor-list]");
        if (!list) return;
        list.querySelectorAll("[data-parameter-option-editor-empty]").forEach((item) => item.remove());
        const rows = [...list.querySelectorAll("[data-parameter-option-row]")];
        rows.forEach((row, index) => {
          const marker = row.querySelector("[data-parameter-option-index]");
          if (marker) marker.textContent = String(index + 1);
        });
        if (!rows.length) {
          list.insertAdjacentHTML("beforeend", `<div class="parameter-option-editor-empty" data-parameter-option-editor-empty>\u6682\u65e0\u9009\u9879\uff0c\u53ef\u624b\u52a8\u6dfb\u52a0</div>`);
        }
      }

      function addParameterTemplateOption(button) {
        const editor = button.closest("[data-parameter-option-editor]");
        const input = editor?.querySelector("[data-parameter-option-new]");
        const list = editor?.querySelector("[data-parameter-option-editor-list]");
        const value = String(input?.value || "").trim();
        if (!editor || !list || !value) return;
        list.querySelectorAll("[data-parameter-option-editor-empty]").forEach((item) => item.remove());
        list.insertAdjacentHTML("beforeend", parameterOptionEditorRow(value));
        input.value = "";
        refreshParameterOptionEditor(editor);
      }

      function moveParameterTemplateOption(button, direction) {
        const row = button.closest("[data-parameter-option-row]");
        const editor = button.closest("[data-parameter-option-editor]");
        if (!row || !editor) return;
        if (direction < 0 && row.previousElementSibling?.matches("[data-parameter-option-row]")) {
          row.parentNode.insertBefore(row, row.previousElementSibling);
        }
        if (direction > 0 && row.nextElementSibling?.matches("[data-parameter-option-row]")) {
          row.parentNode.insertBefore(row.nextElementSibling, row);
        }
        refreshParameterOptionEditor(editor);
      }

      function removeParameterTemplateOption(button) {
        const editor = button.closest("[data-parameter-option-editor]");
        button.closest("[data-parameter-option-row]")?.remove();
        refreshParameterOptionEditor(editor);
      }

      function readParameterOptionEditorValues(form) {
        const seen = new Set();
        return [...form.querySelectorAll("[data-parameter-option-row] input[name='options']")]
          .map((input) => input.value.trim())
          .filter((value) => {
            if (!value || seen.has(value)) return false;
            seen.add(value);
            return true;
          });
      }

      function defaultModelAdapter(mediaType, providerName = "") {
        const provider = String(providerName || "").trim().toLowerCase();
        const isVideo = mediaType === "video";
        const isText = mediaType === "text";
        return isText
          ? (isCumobProviderName(providerName) ? "cumob_chat" : "openai_compatible_chat")
          : isVideo
          ? (
            isBananaRouterProviderName(providerName)
              ? "banana_router"
              : isLingdongProviderName(providerName)
              ? "lingdong_api"
              : provider.includes("aliyun") || provider.includes("bailian")
              ? "aliyun_bailian_video"
              : isGlobalAiOpcProviderName(providerName)
              ? "globalaiopc_video"
              : provider.includes("saier") || provider.includes("塞尔")
              ? "saier_video"
              : provider.includes("volc") || provider.includes("doubao") || provider.includes("jimeng")
              ? "volcengine_ark_video"
              : "custom_http"
          )
          : (
            isBananaRouterProviderName(providerName)
              ? "banana_router"
              : provider === "openai"
              ? "openai_images"
              : isLingdongProviderName(providerName)
              ? "lingdong_api"
              : isGlobalAiOpcProviderName(providerName)
              ? "global_ai_opc_image"
              : "custom_http"

      }

      function inferModelAdapter(model = {}) {
        const mediaType = String(model.mediaType || "image");
        const protocol = String(model.providerProtocol || "").trim().replaceAll("-", "_");
        if (protocol && protocol !== "custom_http") return protocol;
        const config = model.providerConfig || {};
        const requestFormat = String(config.requestFormat || "").trim();
        const apiKeyEnv = String(config.apiKeyEnv || "").trim().toLowerCase().replace(/[^a-z0-9]/g, "");
        const providerName = String(model.providerName || "").trim().toLowerCase();
        if (requestFormat.startsWith("banana_router_") || apiKeyEnv === "bananarouterapikey") return "banana_router";
        if (mediaType === "image") {
          if (requestFormat === "cumob_image" || apiKeyEnv.includes("cumob")) return "cumob_image";
          if (requestFormat.startsWith("global_ai_opc_") || apiKeyEnv === "globalaiopcapikey") return "global_ai_opc_image";
          if (requestFormat === "volcengine_ark_image" || requestFormat === "volcengine_ark_images_generation") return "volcengine_ark_image";
        }
        if (mediaType === "video") {
          if (requestFormat.startsWith("globalaiopc_") || requestFormat.startsWith("global_ai_opc_video")) return "globalaiopc_video";
          if (requestFormat === "saier_openai_video" || providerName.includes("saier") || providerName.includes("塞尔") || apiKeyEnv === "saierapikey") return "saier_video";
          if (providerName.includes("extra token") || apiKeyEnv.includes("extratoken") || apiKeyEnv.includes("extratoekn")) return "extra_token_video";
          if (requestFormat === "dashscope_video_synthesis") return "aliyun_bailian_video";
          if (requestFormat === "volcengine_ark_contents_generation") return "volcengine_ark_video";
        }
        return protocol || defaultModelAdapter(mediaType, model.providerName);
      }

      function schemaFromSelectedParameterTemplates(form, existingSchema = {}, existingDefaults = {}) {
        const schema = {};
        const defaults = {};
        const editableKeys = new Set(parameterTemplates().map((template) => template.key));
        Object.entries(existingSchema || {}).forEach(([key, value]) => {
          if (!editableKeys.has(key) && value && typeof value === "object" && !Array.isArray(value)) {
            schema[key] = { ...value };
            if (Object.prototype.hasOwnProperty.call(existingDefaults || {}, key)) {
              defaults[key] = existingDefaults[key];
            }
          } else if (MODEL_CANONICAL_MEDIA_PARAMETER_KEYS.has(key) && value && typeof value === "object" && !Array.isArray(value)) {
            schema[key] = { ...value, visible: false };
          }
        });
        parameterTemplates().forEach((template) => {
          if (!form.get(`parameterSupported:${template.key}`)) return;
          const required = Boolean(form.get(`parameterRequired:${template.key}`));
          const selectedOptionValues = form.getAll(`parameterOptions:${template.key}`).map(String).filter(Boolean);
          const options = selectedOptionValues.length ? selectedOptionValues : splitCsv(form.get(`parameterOptions:${template.key}`));
          const defaultValue = String(form.get(`parameterDefault:${template.key}`) || "").trim();
          const parameter = {
            ...(existingSchema[template.key] && typeof existingSchema[template.key] === "object" ? existingSchema[template.key] : {}),
            label: template.label,
            type: template.type,
            required,
            visible: true,
          };
          if (options.length) {
            parameter.options = options;
            parameter.adminEditableOptions = true;
          }
          schema[template.key] = parameter;
          if (defaultValue !== "") {
            if (template.type === "integer" || template.type === "number") {
              defaults[template.key] = Number(defaultValue);
            } else if (template.type === "boolean") {
              defaults[template.key] = defaultValue === "true";
            } else {
              defaults[template.key] = defaultValue;
            }
          }
        });
        return { schema, defaults };
      }

      function parameterOptionSelectMarkup(template, selectedOptions) {
        const availableOptions = [...new Set([...(template.options || []), ...(selectedOptions || [])].map(String).filter(Boolean))];
        if (!availableOptions.length) {
          return `<span class="metric-note">\u65e0\u56fa\u5b9a\u9009\u9879</span>`;
        }
        const selected = new Set(selectedOptions.length ? selectedOptions : availableOptions);
        return `<div class="parameter-option-picker" data-parameter-options="${escapeAttribute(template.key)}">
          <details>
            <summary><span data-parameter-option-summary="${escapeAttribute(template.key)}">${selected.size ? `\u5df2\u9009 ${selected.size} \u9879` : "\u9009\u62e9\u9009\u9879"}</span></summary>
            <div class="parameter-option-menu">
              ${availableOptions.map((option) => `<label class="parameter-option-item"><input name="parameterOptions:${escapeAttribute(template.key)}" type="checkbox" value="${escapeAttribute(option)}" ${selected.has(option) ? "checked" : ""} /> <span>${escapeHtml(option)}</span></label>`).join("")}
            </div>
          </details>
        </div>`;
      }

      function parameterSelectedValuesMarkup(parameterKey, selectedOptions) {
        const values = selectedOptions.filter(Boolean);
        if (!values.length) {
          return `<div class="parameter-selected-values" data-parameter-selected-values="${escapeAttribute(parameterKey)}"><span class="parameter-empty-note">\u524d\u53f0\u6682\u65e0\u53ef\u9009\u503c</span></div>`;
        }
        return `<div class="parameter-selected-values" data-parameter-selected-values="${escapeAttribute(parameterKey)}">${values.map((value) => `<span class="parameter-value-chip">${escapeHtml(value)}</span>`).join("")}</div>`;
      }

      function parameterDefaultSelectMarkup(template, selectedOptions, defaultValue) {
        const values = selectedOptions.filter(Boolean);
        const selectedValue = String(defaultValue || "");
        if (!values.length) {
          return `<select name="parameterDefault:${escapeAttribute(template.key)}" data-parameter-default-select="${escapeAttribute(template.key)}" disabled><option value="">\u65e0\u9ed8\u8ba4\u503c</option></select>`;
        }
        const options = [`<option value="">\u4e0d\u8bbe\u7f6e</option>`]
          .concat(values.map((value) => `<option value="${escapeAttribute(value)}" ${String(value) === selectedValue ? "selected" : ""}>${escapeHtml(value)}</option>`));
        return `<select name="parameterDefault:${escapeAttribute(template.key)}" data-parameter-default-select="${escapeAttribute(template.key)}">${options.join("")}</select>`;
      }

      function editableModelParameterTemplates(mediaType) {
        return parameterTemplates()
          .filter((template) => template.mediaTypes.includes(mediaType))
          .filter((template) => !MODEL_CANONICAL_MEDIA_PARAMETER_KEYS.has(template.key))
          .filter((template) => !MODEL_HIDDEN_PARAMETER_BINDING_KEYS.has(template.key));
      }

      function defaultModelParameterKeys(mediaType, useDefaultSelections = false) {
        if (!useDefaultSelections) return [];
        if (mediaType === "text") return ["scriptPrompt", "scriptGenre", "episodeCount", "scriptStyle"];
        if (mediaType === "video") return ["ratio", "resolution", "durationSec", "orientation"];
        return ["aspectRatio", "quality", "count", "size", "responseFormat"];
      }

      function parameterCreditInputsMarkup(template, options, pricing = {}) {
        if (template.key !== "resolution") return `<span class="metric-note">-</span>`;
        const table = pricing?.resolutionCredits && typeof pricing.resolutionCredits === "object" && !Array.isArray(pricing.resolutionCredits)
          ? pricing.resolutionCredits
          : {};
        const values = options.filter(Boolean);
        if (!values.length) return `<span class="metric-note">先选择分辨率</span>`;
        return `<div class="parameter-selected-values" data-parameter-credit-values="${escapeAttribute(template.key)}">${values.map((resolution) => {
          const value = table[resolution] ?? "";
          return `<label class="parameter-value-chip" style="gap:6px;"><span>${escapeHtml(resolution)}</span><input name="resolutionCredit:${escapeAttribute(resolution)}" type="number" min="0" step="0.01" value="${escapeAttribute(value === "" ? "" : String(value))}" placeholder="积分" style="width:84px;height:26px;padding:2px 6px;" /></label>`;
        }).join("")}</div>`;
      }

      function parameterTemplateSelectionRows(mediaType, schema = {}, defaultParams = {}, useDefaultSelections = false, pricing = {}) {
        const defaultSupportedKeys = defaultModelParameterKeys(mediaType, useDefaultSelections);
        const rows = editableModelParameterTemplates(mediaType)
          .map((template) => {
            const current = schema[template.key] || {};
            const supported = Object.prototype.hasOwnProperty.call(schema, template.key) || defaultSupportedKeys.includes(template.key);
            const required = current.required ?? template.required;
            const options = Array.isArray(current.options) ? current.options : template.options;
            const defaultValue = defaultParams[template.key] ?? template.defaultValue ?? "";
            return `<tr>
              <td><label class="parameter-visible-toggle"><input name="parameterSupported:${escapeAttribute(template.key)}" type="checkbox" ${supported ? "checked" : ""} /> ${escapeHtml(template.label)}</label>${required ? `<input name="parameterRequired:${escapeAttribute(template.key)}" type="hidden" value="1" />` : ""}</td>
              <td><span class="tag blue">${escapeHtml(parameterTypeLabel(template.type))}</span></td>
              <td>${parameterOptionSelectMarkup(template, options)}</td>
              <td>${parameterSelectedValuesMarkup(template.key, options)}</td>
              <td>${parameterDefaultSelectMarkup(template, options, defaultValue)}</td>
              <td>${parameterCreditInputsMarkup(template, options, pricing)}</td>
            </tr>`;
          }).join("");
        return rows || `<tr><td colspan="6">\u53c2\u6570\u6a21\u677f\u5e93\u6682\u65e0\u53ef\u9009\u53c2\u6570</td></tr>`;
      }

      function formatFrontendParameterPreviewValue(template, value) {
        if (template.key === "resolution") return escapeHtml(String(value).toUpperCase());
        if (template.key === "durationSec") return `${escapeHtml(value)}\u79d2`;
        return escapeHtml(value);
      }

      function normalizeFrontendParameterDefault(template, value) {
        if (value === undefined || value === null || value === "") return undefined;
        return template.type === "integer" || template.type === "number" ? Number(value) : value;
      }

      function frontendParameterPreviewControls(mediaType, schema = {}, defaultParams = {}, useDefaultSelections = false) {
        const defaultSupportedKeys = defaultModelParameterKeys(mediaType, useDefaultSelections);
        return editableModelParameterTemplates(mediaType)
          .map((template) => {
            const current = schema[template.key] || {};
            const supported = Object.prototype.hasOwnProperty.call(schema, template.key) || defaultSupportedKeys.includes(template.key);
            if (!supported) return null;
            const options = Array.isArray(current.options) ? current.options : template.options;
            const defaultValue = defaultParams[template.key] ?? template.defaultValue ?? "";
            return { template, options, defaultValue };
          })
          .filter(Boolean);
      }

      function modelFrontendParameterPreviewMarkup(mediaType, schema = {}, defaultParams = {}, useDefaultSelections = false, modelLabel = "", modelCode = "") {
        const controls = frontendParameterPreviewControls(mediaType, schema, defaultParams, useDefaultSelections);
        const parameterEntries = controls
          .map(({ template, defaultValue }) => [template.key, normalizeFrontendParameterDefault(template, defaultValue)])
          .filter(([, value]) => value !== undefined && !(typeof value === "number" && Number.isNaN(value)));
        const parameters = Object.fromEntries(parameterEntries);
        const controlMarkup = controls.length
          ? controls.map(({ template, options, defaultValue }) => {
              const values = options.filter(Boolean);
              return `<div class="model-front-preview-control">
                <b>${escapeHtml(template.label)}</b>
                ${values.length
                  ? `<div class="model-front-preview-options">${values.map((value) => `<span class="${String(value) === String(defaultValue) ? "active" : ""}">${formatFrontendParameterPreviewValue(template, value)}</span>`).join("")}</div>`
                  : `<div class="model-front-preview-input">\u524d\u53f0\u8f93\u5165</div>`}
              </div>`;
            }).join("")
          : `<div class="model-front-preview-empty">\u672a\u9009\u62e9\u4efb\u4f55\u524d\u53f0\u53c2\u6570\uff0c\u751f\u6210\u65f6\u53ea\u63d0\u4ea4\u56fa\u5b9a\u7684\u63d0\u793a\u8bcd\u548c\u7d20\u6750\u5b57\u6bb5\u3002</div>`;
        const previewJson = JSON.stringify({
          model: modelCode || "\u6a21\u578b\u7f16\u7801",
          parameters,
        }, null, 2);
        return `<div class="model-front-preview-phone">
          <h4 class="model-front-preview-title">${escapeHtml(modelLabel || modelCode || "\u524d\u53f0\u751f\u6210\u9762\u677f")}</h4>
          ${controlMarkup}
        </div>
        <pre class="model-front-preview-json">${escapeHtml(previewJson)}</pre>`;
      }

      function cssAttributeValue(value) {
        return String(value).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
      }

      function updateParameterSelectedPreview(parameterKey) {
        const form = document.getElementById("model-editor-form");
        if (!form) return;
        const values = new FormData(form).getAll(`parameterOptions:${parameterKey}`).map(String).filter(Boolean);
        const selectorKey = cssAttributeValue(parameterKey);
        const preview = document.querySelector(`[data-parameter-selected-values="${selectorKey}"]`);
        if (preview) {
          preview.innerHTML = values.length
            ? values.map((value) => `<span class="parameter-value-chip">${escapeHtml(value)}</span>`).join("")
            : `<span class="parameter-empty-note">\u524d\u53f0\u6682\u65e0\u53ef\u9009\u503c</span>`;
        }
        const summary = document.querySelector(`[data-parameter-option-summary="${selectorKey}"]`);
        if (summary) {
          summary.textContent = values.length ? `\u5df2\u9009 ${values.length} \u9879` : "\u9009\u62e9\u9009\u9879";
        }
        updateParameterDefaultOptions(parameterKey, values);
        updateParameterCreditOptions(parameterKey, values);
      }

      function updateParameterCreditOptions(parameterKey, values) {
        if (parameterKey !== "resolution") return;
        const form = document.getElementById("model-editor-form");
        const target = document.querySelector(`[data-parameter-credit-values="${cssAttributeValue(parameterKey)}"]`);
        if (!form || !target) return;
        const pricing = {
          resolutionCredits: resolutionCreditsFromForm(new FormData(form)),
        };
        target.outerHTML = parameterCreditInputsMarkup({ key: "resolution" }, values, pricing);
      }

      function updateParameterDefaultOptions(parameterKey, values) {
        const selectorKey = cssAttributeValue(parameterKey);
        const select = document.querySelector(`[data-parameter-default-select="${selectorKey}"]`);
        if (!select) return;
        const currentValue = select.value;
        if (!values.length) {
          select.innerHTML = `<option value="">\u65e0\u9ed8\u8ba4\u503c</option>`;
          select.value = "";
          select.disabled = true;
          return;
        }
        select.disabled = false;
        select.innerHTML = [`<option value="">\u4e0d\u8bbe\u7f6e</option>`]
          .concat(values.map((value) => `<option value="${escapeAttribute(value)}">${escapeHtml(value)}</option>`))
          .join("");
        select.value = values.includes(currentValue) ? currentValue : "";
      }

      function updateModelFrontendParameterPreview(existingSchema = {}, useDefaultSelections = false) {
        const formElement = document.getElementById("model-editor-form");
        const target = document.getElementById("model-frontend-parameter-preview");
        if (!formElement || !target) return;
        const form = new FormData(formElement);
        const kind = modelKindOption(String(form.get("modelKind") || ""));
        const selected = schemaFromSelectedParameterTemplates(form, existingSchema);
        const previewDefaults = { ...selected.defaults };
        parameterTemplates().forEach((template) => {
          const fieldName = `parameterDefault:${template.key}`;
          if (form.has(`parameterSupported:${template.key}`) && form.has(fieldName)) {
            previewDefaults[template.key] = String(form.get(fieldName) || "").trim();
          }
        });
        target.innerHTML = modelFrontendParameterPreviewMarkup(
          kind.mediaType,
          selected.schema,
          previewDefaults,
          false,
          String(form.get("displayName") || ""),
          String(form.get("modelCode") || ""),
        );
      }

      function providerNameForSecretKey(secretKey) {
        const key = String(secretKey || "").trim();
        if (!key) return "";
        const secret = (state.settings.secretReferences || []).find((item) => item.envName === key);
        return String(secret?.providerName || "").trim();
      }

      function resolveVideoTaskModes(kind, existing) {
        if (kind.mediaType !== "video") return kind.taskModes;
        if (kind.videoCategory !== "reference") return kind.taskModes;
        const existingTaskModes = Array.isArray(existing?.taskModes) ? existing.taskModes.map(String) : [];
        const preservedModes = existingTaskModes.filter((taskMode) => [
          "video.text_to_video",
          "video.video_to_video",
          "video.image_video_to_video",
        ].includes(taskMode));
        return [...new Set([...kind.taskModes, ...preservedModes])];
      }

      function videoSupportedModesByTaskModes(videoCategory, taskModes) {
        const supportedModes = [];
        if (videoCategory === "first_frame") supportedModes.push("first_frame");
        if (videoCategory === "first_last_frame") supportedModes.push("first_last_frame");
        if (videoCategory === "reference") supportedModes.push("reference");
        if (taskModes.includes("video.text_to_video")) supportedModes.push("text_to_video");
        if (taskModes.includes("video.image_to_video")) supportedModes.push("image_to_video");
        if (taskModes.includes("video.first_last_frame_to_video")) supportedModes.push("first_last_frame_to_video");
        if (taskModes.includes("video.reference_image_to_video")) supportedModes.push("reference_image_to_video");
        if (taskModes.includes("video.video_to_video")) supportedModes.push("video_to_video");
        if (taskModes.includes("video.image_video_to_video")) supportedModes.push("image_video_to_video");
        return [...new Set(supportedModes)];
      }

      const MODEL_KIND_OPTIONS = [
        { value: "image.text_to_image", mediaType: "image", label: "\u6587\u751f\u56fe", taskModes: ["image.generate"] },
        { value: "image.reference_image", mediaType: "image", label: "\u53c2\u8003\u751f\u56fe", taskModes: ["image.edit", "image.reference_generate", "image.image_to_image"] },
        { value: "video.first_frame", mediaType: "video", label: "\u9996\u5e27\u751f\u89c6\u9891", videoCategory: "first_frame", taskModes: ["video.image_to_video"] },
        { value: "video.first_last_frame", mediaType: "video", label: "\u9996\u5c3e\u5e27\u751f\u89c6\u9891", videoCategory: "first_last_frame", taskModes: ["video.first_last_frame_to_video", "video.image_to_video"] },
        { value: "video.reference", mediaType: "video", label: "\u53c2\u8003\u751f\u89c6\u9891", videoCategory: "reference", taskModes: ["video.reference_image_to_video", "video.image_to_video"] },
        { value: "text.script", mediaType: "text", label: "\u5267\u672c\u6a21\u578b", taskModes: ["text.script"] },
      ];

      function modelKindOption(value) {
        return MODEL_KIND_OPTIONS.find((item) => item.value === value) || MODEL_KIND_OPTIONS[0];
      }

      function inferModelKind(model = {}) {
        const mediaType = String(model.mediaType || "image");
        const uiConfig = model.uiConfig || {};
        const modes = Array.isArray(model.taskModes) ? model.taskModes.map(String) : [];
        const supportedModes = Array.isArray(uiConfig.supportedModes) ? uiConfig.supportedModes.map(String) : [];
        const allModes = [...modes, ...supportedModes];
        if (mediaType === "text") {
          const configuredKind = String(uiConfig.modelKind || "");
          if (configuredKind === "text.script" || allModes.some((mode) => mode.includes("script"))) return "text.script";
          return "text.script";
        }
        if (mediaType === "video") {
          const category = String(uiConfig.modelKind || uiConfig.videoCategory || "");
          if (category === "video.first_last_frame" || category === "first_last_frame" || allModes.some((mode) => mode.includes("first_last"))) return "video.first_last_frame";
          if (category === "video.reference" || category === "reference" || allModes.some((mode) => mode.includes("reference"))) return "video.reference";
          return "video.first_frame";
        }
        if (String(uiConfig.modelKind || "").startsWith("image.")) return String(uiConfig.modelKind);
        if (allModes.some((mode) => mode.includes("reference") || mode.includes("image_to_image") || mode.includes("multi_reference") || mode.includes("edit"))) {
          return "image.reference_image";
        }
        return "image.text_to_image";
      }

      function modelKindOptionsMarkup(selectedValue) {
        return MODEL_KIND_OPTIONS.map((item) => `<option value="${escapeAttribute(item.value)}" ${item.value === selectedValue ? "selected" : ""}>${escapeHtml(item.label)}</option>`).join("");
      }

      function modelKindLabel(model) {
        return modelKindOption(inferModelKind(model)).label;
      }

          <form id="model-editor-form">

              <div class="form-grid">
                <label class="field"><span>\u6a21\u578b\u7f16\u7801</span><input name="modelCode" value="${escapeAttribute(base.modelCode)}" required /></label>
                <label class="field"><span>\u5c55\u793a\u540d\u79f0</span><input name="displayName" value="${escapeAttribute(base.displayName)}" required /></label>
                <input name="providerName" type="hidden" value="${escapeAttribute(base.providerName || providerNameForSecretKey(selectedApiKeyEnv) || "custom")}" />
                <label class="field"><span>\u771f\u5b9e\u6a21\u578b\u540d</span><input name="providerModel" value="${escapeAttribute(base.providerModel)}" required /></label>
                <label class="field"><span>\u8bf7\u6c42\u8def\u5f84</span><input name="requestPath" value="${escapeAttribute(selectedRequestPath)}" placeholder="/v1/images/generations" /></label>
                <label class="field"><span>\u7c7b\u578b</span><select name="modelKind">${modelKindOptionsMarkup(selectedModelKind)}</select></label>
                <label class="field"><span>\u8bf7\u6c42\u9002\u914d\u5668</span><select name="providerAdapter">${modelAdapterOptionsMarkup(modelKindOption(selectedModelKind).mediaType, selectedModelAdapter, base.providerName)}</select></label>
                <label class="field"><span>\u8ba1\u8d39\u6a21\u5f0f</span><select name="billingMode"><option value="fixed" ${String(base.pricing?.billingMode || "fixed") !== "duration" ? "selected" : ""}>\u56fa\u5b9a\u8ba1\u8d39</option><option value="duration" ${String(base.pricing?.billingMode || "fixed") === "duration" ? "selected" : ""}>\u65f6\u957f\u8ba1\u8d39</option></select></label>
                ${modelKindOption(selectedModelKind).mediaType === "video" ? "" : `<label class="field"><span>\u79ef\u5206</span><input name="baseCredits" type="number" min="1" step="1" value="${Number(base.pricing?.baseCredits || 90)}" required /></label>`}
                <label class="field" data-canvas-agent-pricing-field ${modelKindOption(selectedModelKind).mediaType === "text" ? "" : "hidden"}><span>\u753b\u5e03\u534f\u4f5c\u8ba1\u8d39\u6a21\u5f0f</span><select name="canvasAgentBillingMode"><option value="token" selected>\u6309\u603b Token \u8ba1\u8d39</option></select></label>
                <label class="field" data-canvas-agent-pricing-field ${modelKindOption(selectedModelKind).mediaType === "text" ? "" : "hidden"}><span>\u753b\u5e03\u534f\u4f5c Token \u5355\u4ef7\uff08\u79ef\u5206 / 100\u4e07 Token\uff09</span><input name="canvasAgentTokenCreditsPerMillion" type="number" min="0.000001" step="0.000001" value="${escapeAttribute(base.pricing?.canvasAgentTokenCreditsPerMillion ?? base.pricing?.tokenCreditsPerMillion ?? "")}" ${modelKindOption(selectedModelKind).mediaType === "text" ? "required" : ""} /></label>
                <label class="field"><span>API \u5bc6\u94a5</span><select name="modelApiKeyEnv">${modelSecretReferenceOptions(selectedApiKeyEnv, base.providerName)}</select></label>
                <label class="field"><span>\u5907\u6ce8</span><input name="remark" value="${escapeAttribute(base.remark || "")}" /></label>
              </div>
            </section>
            <section class="card" style="box-shadow:none;border:1px solid var(--border);">
              <div class="toolbar">
                <h4>\u6a21\u578b\u53c2\u6570\u7ed1\u5b9a</h4>
                <button class="btn ghost" type="button" onclick="navigate('parameterTemplates')">\u7ba1\u7406\u53c2\u6570\u6a21\u677f</button>
              </div>
              <div class="model-parameter-binding-layout">
                <div class="table-wrap dense" id="model-parameter-template-list">
                  <table><thead><tr><th>\u524d\u53f0\u663e\u793a</th><th>\u524d\u53f0\u63a7\u4ef6</th><th>\u53ef\u9009\u503c</th><th>\u63d0\u4ea4\u9884\u89c8</th><th>\u9ed8\u8ba4\u503c</th><th>\u79ef\u5206</th></tr></thead><tbody>${parameterTemplateSelectionRows(modelKindOption(selectedModelKind).mediaType, base.parameterSchema || {}, base.defaultParams || {}, !isEdit, base.pricing || {})}</tbody></table>
                </div>
                <aside class="model-front-parameter-preview">
                  <div class="model-front-preview-head">

                    <span>\u6839\u636e\u5f53\u524d\u7ed1\u5b9a\u548c\u9ed8\u8ba4\u503c\u5373\u65f6\u9884\u89c8\u3002</span>
                  </div>
                  <div id="model-frontend-parameter-preview">${modelFrontendParameterPreviewMarkup(modelKindOption(selectedModelKind).mediaType, base.parameterSchema || {}, base.defaultParams || {}, !isEdit, base.displayName, base.modelCode)}</div>
