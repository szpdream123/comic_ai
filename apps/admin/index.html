<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>后台管理</title>
    <style>
      :root {
        --navy: #12243d;
        --navy-2: #1b3559;
        --bg: #eef4f9;
        --panel: #ffffff;
        --line: #d9e3ee;
        --text: #1f2d3d;
        --muted: #6b7c90;
        --primary: #246bfe;
        --primary-soft: #e8f0ff;
        --danger: #d92d20;
        --warning: #b7791f;
        --success: #15803d;
        --radius: 8px;
        font-family: "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", sans-serif;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      .hidden { display: none !important; }

      .login-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(180deg, rgba(255,255,255,.72), rgba(238,244,249,.9)),
          var(--bg);
      }
      .login-card {
        width: min(420px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 32px;
        box-shadow: 0 20px 50px rgba(18, 36, 61, .12);
      }
      .login-card h1 { margin: 0 0 8px; font-size: 26px; }
      .login-card p { margin: 0 0 28px; color: var(--muted); }
      .field { display: grid; gap: 8px; margin-bottom: 16px; }
      .field label { font-size: 13px; color: #30445f; font-weight: 600; }
      .field input, .field select, .field textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px 12px;
        background: #fff;
        outline: none;
      }
      .field input:focus, .field select:focus, .field textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-soft);
      }
      .login-options {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: -4px 0 14px;
      }
      .remember-option {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
      }
      .remember-option input {
        width: 16px;
        height: 16px;
        accent-color: var(--primary);
      }
      .btn {
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 9px 12px;
        background: #f7f9fc;
        color: var(--text);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 36px;
      }
      .btn.primary { background: var(--primary); color: #fff; }
      .btn.danger { color: var(--danger); background: #fff5f5; border-color: #ffd0d0; }
      .btn.ghost { background: transparent; border-color: var(--line); }
      .btn.full { width: 100%; }
      .btn[disabled] { opacity: .58; cursor: not-allowed; }
      .error-text { color: var(--danger); font-size: 13px; min-height: 18px; }
      .toast-message {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 12;
        max-width: min(360px, calc(100vw - 36px));
        padding: 12px 14px;
        border: 1px solid #bde8c8;
        border-radius: 8px;
        background: #f0fff4;
        color: var(--success);
        box-shadow: 0 18px 40px rgba(18, 36, 61, .14);
      }

      .admin-shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 236px minmax(0, 1fr);
      }
      .sidebar {
        background: var(--navy);
        color: #dce8f7;
        padding: 18px 14px;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .brand {
        height: 48px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
        font-weight: 700;
        color: #fff;
      }
      .brand-mark {
        width: 30px;
        height: 30px;
        border-radius: 6px;
        background: var(--primary);
        display: grid;
        place-items: center;
      }
      .nav { margin-top: 18px; display: grid; gap: 4px; }
      .nav button {
        width: 100%;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #dce8f7;
        text-align: left;
        padding: 11px 12px;
      }
      .nav button.active, .nav button:hover {
        background: var(--navy-2);
        color: #fff;
      }
      .main { min-width: 0; display: grid; grid-template-rows: 60px minmax(0, 1fr); }
      .topbar {
        background: rgba(255,255,255,.88);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 22px;
        position: sticky;
        top: 0;
        z-index: 3;
      }
      .topbar h2 { margin: 0; font-size: 18px; }
      .account-menu { display: flex; align-items: center; gap: 10px; color: var(--muted); }
      .content { padding: 20px; min-width: 0; }
      .page-grid { min-width: 0; }
      .state-panel {
        min-height: 260px;
        display: grid;
        place-items: center;
        gap: 8px;
        text-align: center;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        color: var(--muted);
      }
      .state-panel strong { color: var(--text); font-size: 16px; }
      .state-panel[data-state="forbidden"] { border-color: #ffd0d0; background: #fffafa; }

      .grid { display: grid; gap: 14px; }
      .cards { grid-template-columns: repeat(4, minmax(150px, 1fr)); }
      .dashboard-cards { grid-template-columns: repeat(4, minmax(180px, 1fr)); }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px;
      }
      .section-stack { display: grid; gap: 14px; }
      .legal-document-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .agreements-layout {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(280px, .65fr);
        gap: 14px;
        align-items: start;
      }
      .agreements-card {
        display: grid;
        gap: 14px;
      }
      .agreements-side-panel {
        display: grid;
        gap: 12px;
      }
      .resources-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 14px;
        align-items: start;
      }
      .resources-list {
        display: grid;
        gap: 12px;
      }
      .resource-table-wrap {
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        background: #fff;
      }
      .resource-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      .resource-table thead th {
        background: #f7fafe;
        color: #48617d;
        font-size: 13px;
        font-weight: 700;
        padding: 12px 10px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      .resource-table tbody td {
        padding: 12px 10px;
        border-bottom: 1px solid #edf2f8;
        vertical-align: middle;
      }
      .resource-table tbody tr:last-child td {
        border-bottom: 0;
      }
      .resource-table tbody tr:hover {
        background: #f9fbff;
      }
      .resource-table tbody tr.active {
        background: #eef4ff;
      }
      .resource-table .actions {
        width: 168px;
      }
      .resource-table .preview-col {
        width: 140px;
      }
      .resource-table .size-col {
        width: 110px;
      }
      .resource-table .type-col {
        width: 120px;
      }
      .resource-table .user-col {
        width: 132px;
      }
      .resource-table .phone-col {
        width: 146px;
      }
      .resource-table .time-col {
        width: 168px;
      }
      .resource-thumb-btn {
        width: 112px;
        height: 76px;
        padding: 0;
        border: 1px solid #d7e3f4;
        border-radius: 10px;
        background: linear-gradient(180deg, #f8fbff, #eef4fb);
        overflow: hidden;
        display: grid;
        place-items: center;
        color: #6b7c90;
      }
      .resource-thumb-btn img,
      .resource-thumb-btn video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .resource-thumb-label {
        font-size: 12px;
        color: var(--muted);
      }
      .resource-link-cell {
        min-width: 0;
      }
      .resource-link-primary {
        font-weight: 700;
        color: #17324f;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .resource-link-secondary {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
        word-break: break-all;
      }
      .resource-row-actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .resource-link-button {
        border: 0;
        padding: 0;
        background: transparent;
        color: var(--primary);
        text-align: left;
      }
      .resource-link-button:hover {
        text-decoration: underline;
      }
      .resource-card {
        display: grid;
        grid-template-columns: 120px minmax(0, 1fr);
        gap: 12px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: linear-gradient(180deg, rgba(36, 107, 254, .03), #fff);
        transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      }
      .resource-card:hover {
        transform: translateY(-1px);
        border-color: #bfd1ee;
        box-shadow: 0 10px 24px rgba(18, 36, 61, .08);
      }
      .resource-card.active {
        border-color: #7fb0ff;
        box-shadow: 0 0 0 3px rgba(36, 107, 254, .12);
      }
      .resource-preview {
        width: 120px;
        height: 120px;
        border-radius: 10px;
        overflow: hidden;
        background: #eff5fc;
        border: 1px solid #d9e6f7;
        display: grid;
        place-items: center;
        color: #7b8aa2;
      }
      .resource-preview img,
      .resource-preview video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .resource-meta {
        display: grid;
        gap: 8px;
        min-width: 0;
      }
      .resource-title {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        min-width: 0;
      }
      .resource-title strong {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .resource-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .resource-inspector {
        display: grid;
        gap: 12px;
      }
      .resource-inspector-preview {
        min-height: 260px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: linear-gradient(180deg, #f7fbff, #ffffff);
        overflow: hidden;
      }
      .resource-inspector-preview img,
      .resource-inspector-preview video {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        background: #0f172a;
      }
      .resource-inspector-empty {
        min-height: 260px;
        display: grid;
        place-items: center;
        text-align: center;
        color: var(--muted);
        border: 1px dashed var(--line);
        border-radius: 12px;
        background: #fbfcfe;
        padding: 18px;
      }
      .resource-stat-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
      }
      .resource-stat {
        padding: 12px;
        border: 1px solid #e2eaf4;
        border-radius: 10px;
        background: #fbfdff;
      }
      .resource-pagination {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .resource-pagination .metric-note {
        margin-right: 4px;
      }
      .resource-preview-modal {
        position: fixed;
        inset: 0;
        z-index: 16;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
        background: rgba(8, 15, 29, .76);
        backdrop-filter: blur(4px);
      }
      .resource-preview-dialog {
        width: min(1100px, calc(100vw - 56px));
        max-height: calc(100vh - 56px);
        border-radius: 18px;
        border: 1px solid rgba(214, 228, 246, .22);
        background: #081221;
        box-shadow: 0 24px 60px rgba(0, 0, 0, .28);
        overflow: hidden;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
      }
      .resource-preview-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px;
        background: rgba(8, 18, 33, .92);
        color: #e7eef8;
        border-bottom: 1px solid rgba(214, 228, 246, .12);
      }
      .resource-preview-title {
        min-width: 0;
      }
      .resource-preview-title strong {
        display: block;
        font-size: 15px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .resource-preview-title span {
        display: block;
        margin-top: 4px;
        color: #9fb2c8;
        font-size: 12px;
        word-break: break-all;
      }
      .resource-preview-stage {
        min-height: 420px;
        max-height: calc(100vh - 136px);
        display: grid;
        place-items: center;
        padding: 18px;
        background:
          radial-gradient(circle at top, rgba(36, 107, 254, .18), transparent 42%),
          #081221;
      }
      .resource-preview-stage img,
      .resource-preview-stage video {
        max-width: 100%;
        max-height: calc(100vh - 180px);
        border-radius: 14px;
        display: block;
        object-fit: contain;
        background: #020814;
      }
      .resource-preview-close {
        border: 1px solid rgba(214, 228, 246, .18);
        background: rgba(255, 255, 255, .04);
        color: #fff;
      }
      .legal-document-status,
      .legal-document-type {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
      }
      .legal-document-preview-panel {
        display: grid;
        gap: 10px;
      }
      .legal-document-preview-panel h4 {
        margin: 0;
        font-size: 15px;
      }
      .legal-document-empty {
        min-height: 220px;
        display: grid;
        place-items: center;
        text-align: center;
        color: var(--muted);
        border: 1px dashed var(--line);
        border-radius: 8px;
        background: #fbfcfe;
        padding: 18px;
      }
      .legal-document-card {
        display: grid;
        gap: 14px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: linear-gradient(180deg, rgba(36, 107, 254, .03), rgba(255,255,255,.98));
      }
      .legal-document-card-head,
      .legal-document-preview-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }
      .legal-document-card-head h4,
      .legal-document-preview-head h4,
      .legal-document-editor-shell h4 { margin: 0; font-size: 15px; }
      .legal-document-card-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .legal-document-pill {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        padding: 0 10px;
        border: 1px solid #d8e5ff;
        border-radius: 999px;
        background: #f4f8ff;
        color: #35527a;
        font-size: 12px;
      }
      .legal-document-preview-shell,
      .legal-document-editor-shell { display: grid; gap: 8px; }
      .drawer-panel.legal-document-drawer-panel {
        width: min(max(68vw, 980px), 100%);
        min-height: 100vh;
        max-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: 24px 24px 20px;
      }
      .legal-document-form {
        display: flex;
        flex: 1;
        min-height: 0;
        flex-direction: column;
        gap: 12px;
      }
      .legal-document-editor-shell,
      .legal-document-preview-shell {
        min-height: 0;
        grid-template-rows: auto 1fr;
      }
      .legal-document-surface {
        min-height: 460px;
        height: 100%;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: var(--text);
        overflow: auto;
        line-height: 1.75;
        font-size: 14px;
      }
      .legal-document-surface,
      .legal-document-surface * {
        color: #0f172a;
      }
      .legal-document-surface.is-editor {
        min-height: 460px;
        outline: none;
        color: #0f172a;
        caret-color: #0f172a;
        background: #ffffff;
        overflow-wrap: anywhere;
      }
      .legal-document-surface.is-editor:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-soft);
      }
      .legal-document-surface.is-editor:empty::before {
        content: "请输入协议内容";
        color: #94a3b8;
      }
      .legal-document-surface p,
      .legal-document-surface h1,
      .legal-document-surface h2,
      .legal-document-surface h3,
      .legal-document-surface blockquote,
      .legal-document-surface ul,
      .legal-document-surface ol {
        margin-top: 0;
      }
      .legal-document-surface p,
      .legal-document-surface li,
      .legal-document-surface blockquote,
      .legal-document-surface div,
      .legal-document-surface span {
        color: #334155;
      }
      .legal-document-surface p {
        margin: 0 0 16px;
        text-align: left;
      }
      .legal-document-surface ul,
      .legal-document-surface ol {
        margin: 0 0 16px 22px;
        padding: 0;
      }
      .legal-document-surface li {
        margin: 0 0 8px;
      }
      .legal-document-surface h1,
      .legal-document-surface h2,
      .legal-document-surface h3,
      .legal-document-surface strong,
      .legal-document-surface b {
        color: #0f172a;
      }
      .legal-document-surface h1 {
        margin: 0 0 20px;
        font-size: 30px;
        line-height: 1.3;
        text-align: center;
      }
      .legal-document-surface h2 {
        margin: 28px 0 14px;
        font-size: 22px;
        line-height: 1.4;
      }
      .legal-document-surface h3 {
        margin: 22px 0 12px;
        font-size: 18px;
        line-height: 1.45;
      }
      .legal-document-surface blockquote {
        margin: 0 0 16px;
        padding: 10px 14px;
        border-left: 4px solid #bfd3ff;
        background: #f8fbff;
        color: #475569;
      }
      .legal-document-surface a {
        color: var(--primary);
      }
      .legal-document-summary-text {
        min-height: 84px;
        padding: 12px 14px;
        border: 1px solid #e4edf8;
        border-radius: 10px;
        background: #f8fbff;
        color: #4f6076;
        font-size: 13px;
        line-height: 1.75;
        white-space: pre-wrap;
      }
      .legal-document-editor-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 14px;
        align-items: stretch;
        flex: 1;
        min-height: 0;
      }
      .legal-document-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #f8fbff;
      }
      .legal-document-toolbar-group {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .legal-document-toolbar-separator {
        width: 1px;
        min-height: 28px;
        background: #d9e4f5;
        margin: 0 2px;
      }
      .legal-document-toolbar .btn {
        min-width: 44px;
        padding: 8px 10px;
      }
      .legal-document-toolbar .btn.is-active {
        border-color: #a9c7ff;
        background: #e8f1ff;
        color: #1d4ed8;
        box-shadow: inset 0 0 0 1px rgba(37, 99, 235, .12);
      }
      .legal-document-note {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
      }
      .legal-document-actions {
        margin-top: auto;
        padding-top: 4px;
      }
      .metric-label { color: var(--muted); font-size: 13px; }
      .metric-value { font-size: 26px; margin-top: 8px; font-weight: 700; }
      .metric-note { margin-top: 8px; color: var(--muted); font-size: 12px; }
      .trend-bars {
        height: 156px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
        gap: 10px;
        align-items: end;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f8fbff;
        padding: 12px;
      }
      .trend-bar {
        min-width: 0;
        height: 100%;
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        gap: 5px;
        align-items: end;
        color: var(--muted);
        font-size: 12px;
      }
      .trend-bar span,
      .trend-bar em {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .trend-bar em {
        color: var(--text);
        font-style: normal;
        font-weight: 700;
      }
      .trend-bar i { justify-self: start; font-style: normal; }
      .trend-bar b {
        display: block;
        width: 100%;
        min-height: 18px;
        border-radius: 6px 6px 3px 3px;
        background: linear-gradient(180deg, #246bfe, #8fb5ff);
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .model-tab-list {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .model-tab-btn {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;

      function readRememberedLogin() {
        try {
          const saved = localStorage.getItem(rememberedLoginStorageKey);
          if (!saved) return { enabled: false, loginName: "", password: "" };
          const parsed = JSON.parse(saved);
          return {
            enabled: Boolean(parsed?.enabled),
            loginName: typeof parsed?.loginName === "string" ? parsed.loginName : "",
            password: typeof parsed?.password === "string" ? parsed.password : "",
          };
        } catch {
          return { enabled: false, loginName: "", password: "" };
        }
      }

      function saveRememberedLogin(loginName, password) {
        localStorage.setItem(rememberedLoginStorageKey, JSON.stringify({
          enabled: true,
          loginName: String(loginName || ""),
          password: String(password || ""),
        }));
      }

      function clearRememberedLogin() {
        localStorage.removeItem(rememberedLoginStorageKey);
      }

      function routeFromPath() {
        const path = location.pathname;
        if (path.includes("/models/new") || /^\/admin\/models\/[^/]+/.test(path)) return "models";
        if (path.includes("/models")) return "models";
        if (path.includes("/users")) return "users";
        if (path.includes("/membership")) return "membership";
        if (path.includes("/direct-recharge")) return "directRecharge";
        if (path.includes("/prompts")) return "prompts";
        if (path.includes("/risks") || path.includes("/audit-events")) return "risks";
        if (path.includes("/sms-records")) return "smsRecords";
        if (path.includes("/resources")) return "resources";
        if (path.includes("/settings") || path.includes("/admin-accounts")) return "settings";
        if (path.includes("/account")) return "account";
        return "dashboard";
      }

      function resolveAdminApiUrl(path) {
        if (typeof window === "undefined" || /^https?:\/\//i.test(path)) {
          return path;
        }
        const backendOwnedPath = /^\/(?:api|uploads|vendor)(?:\/|$)/.test(path);
        const localHttpHost = /^(?:localhost|127\.0\.0\.1|\[::1\])(?::\d+)?$/i.test(
          window.location.host ?? "",
        );
        const isAlternateDevPort = /^(?:4311|4312|4313|4314|4315|4399)$/.test(window.location.port ?? "");
        const origin =
          window.location.protocol === "file:" ||
          (backendOwnedPath && localHttpHost && isAlternateDevPort)
            ? "http://127.0.0.1:4310"
            : window.location.origin;
        return new URL(path, origin).toString();
      }

      function storagePreviewUrl(item) {
        return item?.previewUrl || item?.sourceUrl || item?.downloadUrl || "";
      }

      function resourceKindLabel(item) {
        return item?.mediaKind === "video" || String(item?.contentType || "").startsWith("video/")
          ? "视频"
          : "图片";
      }

      function resourceKindTone(item) {
        return item?.mediaKind === "video" || String(item?.contentType || "").startsWith("video/")
          ? "warn"
          : "blue";
      }

      async function api(path, options = {}) {
        const response = await fetch(resolveAdminApiUrl(path), {
          credentials: "include",
          headers: { "content-type": "application/json", ...(options.headers || {}) },
          ...options,
        });
        const rawBody = await response.text().catch(() => "");
        let payload = {};
        try {
          payload = rawBody ? JSON.parse(rawBody) : {};
        } catch {
          payload = { error: { message: rawBody } };
        }
        if (!response.ok) throw Object.assign(new Error(adminApiErrorMessage(payload, response)), { payload, status: response.status });
        return payload;
      }

      function adminApiErrorMessage(payload, response) {
        if (response.status === 401) return "后台登录已过期，请重新登录";
        if (response.status === 403) return "当前管理员无权限执行该操作";
        if (response.status === 404) return "接口不存在，请确认后端服务已更新";
        if (response.status >= 500) return "服务器处理失败，请查看后端日志";
        const error = payload?.error;
        if (error?.message) return error.message;
        if (typeof error === "string") {
          return {
            idempotency_key_required: "请求缺少幂等键，请刷新页面后重试",
            invalid_json: "请求数据格式不正确",
          }[error] || error;
        }
        return "请求失败";
      }

      function adminIdempotencyKey(scope = "mutation") {
        const safeScope = String(scope || "mutation")
          .toLowerCase()
          .replace(/[^a-z0-9._-]+/g, "-")
          .replace(/^-+|-+$/g, "") || "mutation";
        return `admin-ui-${safeScope}-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      }

      function hasPermission(permission) {
        const permissions = state.session?.permissions || [];
        return permissions.includes(permission);
      }

      function permissionAttrs(permission) {
        if (hasPermission(permission)) {
          return `data-required-permission="${permission}"`;
        }
        return `data-required-permission="${permission}" disabled aria-disabled="true" title="无权限执行该操作"`;
      }

      function userStatusAllowsAction(user, action) {
        const status = user?.status || "active";
        if (action === "view") return true;
        if (status === "active") {
          return ["credit", "profile", "reveal", "disable", "archive", "teamLimit"].includes(action);
        }
        if (status === "disabled") {
          return action === "enable";
        }
        return false;
      }

      function userStatusBlockedTitle(user) {
        return user?.status === "archived"
          ? "账户已归档，仅允许查看历史记录"
          : "账户禁用期间仅允许查看或启用";
      }

      function userActionAttrs(user, action, permission) {
        const requiredPermission = permission ? `data-required-permission="${permission}"` : "";
        if (!userStatusAllowsAction(user, action)) {
          return `${requiredPermission} disabled aria-disabled="true" title="${userStatusBlockedTitle(user)}"`;
        }
        return permission ? permissionAttrs(permission) : "";
      }

      function guardUserAction(user, action) {
        if (userStatusAllowsAction(user, action)) return true;
        showToast(userStatusBlockedTitle(user));
        return false;
      }

      function setPageLoading(page, loading) {
        state.loadingPages[page] = Boolean(loading);
      }

      function setPageForbidden(page, error) {
        const code = error?.payload?.error?.code;
        if (code === "admin_forbidden" || error?.status === 403) {
          state.forbiddenPages[page] = error.payload?.error?.message || "无权限访问该页面";
          return true;
        }
        delete state.forbiddenPages[page];
        return false;
      }

      function clearPageForbidden(page) {
        delete state.forbiddenPages[page];
      }

      function renderPageState(page) {

          return `<section class="state-panel" data-state="loading"><strong>正在加载后台数据</strong><span>${pages[page] || "后台页面"}</span></section>`;
        }
        if (state.forbiddenPages[page]) {
          return `<section class="state-panel" data-state="forbidden"><strong>无权限访问该页面</strong><span>${state.forbiddenPages[page]}</span></section>`;
        }
        return "";

      function setSubmitting(form, submitting, submittingText = "正在提交") {
        form.setAttribute("data-submitting", submitting ? "true" : "false");
        form.querySelectorAll("button").forEach((button) => {
          if (submitting) {
            button.disabled = true;
            button.dataset.originalText = button.dataset.originalText || button.textContent;
            button.textContent = submittingText;
          } else if (button.dataset.originalText) {
            button.disabled = false;
            button.textContent = button.dataset.originalText;
          } else {
            button.disabled = false;
          }
        });
      }

      function showToast(message = "操作成功") {
        const toast = document.getElementById("toast");
        if (!toast) return;
        toast.textContent = message || "操作成功";
        toast.classList.remove("hidden");
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => toast.classList.add("hidden"), 2400);
      }

      async function runAdminMutation(form, errorElement, action, successMessage = "操作成功") {
        if (form.dataset.submitting === "true") return;
        errorElement.textContent = "";
        setSubmitting(form, true);
        try {
          const result = await action();
          showToast(successMessage || "操作成功");
          return result;
        } catch (err) {
          errorElement.textContent = err.payload?.error?.message || err.message || "操作失败";
          throw err;
        } finally {
          setSubmitting(form, false);
        }
      }

        } catch {
          history.replaceState(null, "", "/admin/login");
          renderLogin("后台登录已过期，请重新登录");
        }
      }

      async function bootstrapAdminLoginRoute() {
        app.innerHTML = `<main class="content"><section class="state-panel" data-state="loading"><strong>正在加载后台数据</strong><span>正在校验后台登录态</span></section></main>`;

      function renderLogin(message = "") {
        const remembered = readRememberedLogin();
        app.innerHTML = `
          <main class="login-page">
            <section class="login-card">
              <h1>后台管理</h1>
              <p>请输入管理员账号进入运营后台</p>

                <div class="field">
                  <label for="login-password">密码</label>
                  <input id="login-password" name="password" type="password" autocomplete="current-password" value="${escapeAttribute(remembered.password)}" required />

                <div class="login-options">

              </form>
            </section>
          </main>
        `;
        document.getElementById("login-form").addEventListener("submit", async (event) => {
          event.preventDefault();
          const form = new FormData(event.currentTarget);
          const error = document.getElementById("login-error");
          error.textContent = "";
          setSubmitting(event.currentTarget, true, "正在登录");
          try {
            const result = await api("/api/admin/auth/login", {
              method: "POST",
              body: JSON.stringify({
                loginName: form.get("loginName"),
                password: form.get("password"),
              }),
            });
            if (form.get("remember")) {
              saveRememberedLogin(form.get("loginName"), form.get("password"));
            } else {
              clearRememberedLogin();
            }
            state.session = result.data;
            history.replaceState(null, "", "/admin/dashboard");
            state.page = "dashboard";
            renderShell();
            preloadAdminShellData();
            ensureAdminPageData(state.page).catch(() => undefined);
          } catch (err) {
            error.textContent = err.payload?.error?.code === "admin_account_locked"

              : err.payload?.error?.message || "登录失败";
          } finally {
            setSubmitting(event.currentTarget, false);
          }
        });
      }

      async function loadModels() {
        setPageLoading("models", true);
        try {
          const pageSize = 100;
          let page = 1;
          let total = 0;
          const models = [];
          do {
            const result = await api(`/api/admin/models?page=${page}&pageSize=${pageSize}`);
            const rows = Array.isArray(result.data) ? result.data : [];
            const meta = result.meta || {};
            models.push(...rows);
            total = Number(meta.total || rows.length || 0);
            page += 1;
            if (rows.length === 0) break;
          } while (models.length < total);
          state.models = models;
          state.selectedModelId = state.selectedModelId || state.models[0]?.id || null;
          state.modelLoadError = "";
          clearPageForbidden("models");
        } catch (error) {
          setPageForbidden("models", error);
          state.modelLoadError = error.payload?.error?.message || "模型配置加载失败";
          state.models = [];
        } finally {
          setPageLoading("models", false);
        }
      }

      async function loadUsers() {
        setPageLoading("users", true);
        try {
          const keyword = String(state.userFilters?.keyword || "").trim();
          const params = new URLSearchParams({
            page: String(Math.max(1, Number(state.userPage) || 1)),
            pageSize: String(Number(state.userPageSize) || 20),
          });
          if (keyword) params.set("keyword", keyword);
          const result = await api(`/api/admin/users?${params.toString()}`);
          state.users = result.data || [];
          state.userTotal = Number(result.meta?.total || (result.data || []).length || 0);
          const pageSize = Number(result.meta?.pageSize || state.userPageSize || 20);
          const totalPages = Math.max(1, Math.ceil(state.userTotal / pageSize));
          state.userPageSize = pageSize;
          state.userPage = Math.min(Math.max(1, Number(result.meta?.page || state.userPage || 1)), totalPages);
          state.userLoadError = "";
          clearPageForbidden("users");
        } catch (error) {
          setPageForbidden("users", error);
          state.userLoadError = error.payload?.error?.message || "用户列表加载失败";
          state.users = [];
          state.userTotal = 0;
          state.userPage = 1;
        } finally {
          setPageLoading("users", false);
        }
      }

      async function loadSettings() {
        setPageLoading("settings", true);
        try {
          const [settingsResult, accountsResult] = await Promise.all([
            api("/api/admin/settings"),
            api("/api/admin/admin-accounts"),
          ]);
          state.settings = settingsWithRuntimeConfigHints(settingsResult.data || { configs: [], secretReferences: [] });
          state.adminAccounts = accountsResult.data || [];
          state.settingsLoadError = "";
          clearPageForbidden("settings");
        } catch (error) {

          state.settingsLoadError = error.payload?.error?.message || "系统设置加载失败";
          state.settings = { configs: [], secretReferences: [] };
          state.adminAccounts = [];
        } finally {
          setPageLoading("settings", false);
        }
      }

      function settingsWithRuntimeConfigHints(settings) {
        const configs = Array.isArray(settings.configs) ? [...settings.configs] : [];
        for (const hint of runtimeConfigHints) {
          if (!configs.some((config) => config.key === hint.key)) configs.push(hint);
        }
        configs.sort((left, right) => {
          const scopeOrder = String(left.scope || "").localeCompare(String(right.scope || ""));
          return scopeOrder || String(left.key || "").localeCompare(String(right.key || ""));
        });
        return {
          ...settings,
          configs,
          secretReferences: Array.isArray(settings.secretReferences) ? settings.secretReferences : [],
        };
      }

      function sanitizeRichTextHtml(html) {
        const template = document.createElement("template");
        template.innerHTML = String(html || "");
        const blockedTags = new Set(["SCRIPT", "STYLE", "IFRAME", "OBJECT", "EMBED", "LINK", "META"]);
        const blockTags = new Set(["P", "DIV", "SECTION", "ARTICLE", "HEADER", "FOOTER", "H1", "H2", "H3", "BLOCKQUOTE"]);
        const allowedTags = new Set(["P", "BR", "STRONG", "B", "EM", "I", "U", "S", "H1", "H2", "H3", "BLOCKQUOTE", "UL", "OL", "LI", "A"]);

        const unwrapElement = (element) => {
          const parent = element.parentNode;
          if (!parent) return;
          while (element.firstChild) {
            parent.insertBefore(element.firstChild, element);
          }
          element.remove();
        };

        const replaceTag = (element, tagName) => {
          const replacement = document.createElement(tagName);
          while (element.firstChild) {
            replacement.appendChild(element.firstChild);
          }
          element.replaceWith(replacement);
          return replacement;
        };

        Array.from(template.content.querySelectorAll("*")).forEach((originalElement) => {
          let element = originalElement;
          if (blockedTags.has(element.tagName)) {
            element.remove();
            return;
          }

          if (element.tagName === "SPAN" || element.tagName === "FONT") {
            unwrapElement(element);
            return;
          }

          if (element.tagName === "DIV") {
            const hasNestedBlocks = Array.from(element.children).some((child) => blockTags.has(child.tagName));
            if (hasNestedBlocks) {
              unwrapElement(element);
              return;
            }
            element = replaceTag(element, "p");
          }

          if (!allowedTags.has(element.tagName)) {
            unwrapElement(element);
            return;
          }

          Array.from(element.attributes).forEach((attribute) => {
            const attributeName = attribute.name.toLowerCase();
            if (/^on/i.test(attributeName)) {
              element.removeAttribute(attribute.name);
              return;
            }
            if (element.tagName === "A" && attributeName === "href") {
              if (/^\s*javascript:/i.test(attribute.value)) {
                element.removeAttribute(attribute.name);
              }
              return;
            }
            element.removeAttribute(attribute.name);
          });

          if (element.tagName === "A") {
            element.setAttribute("target", "_blank");
            element.setAttribute("rel", "noopener noreferrer");
            if (!element.getAttribute("href")) {
              unwrapElement(element);
              return;
            }
          }

          if (blockTags.has(element.tagName)) {
            const text = element.textContent.replace(/\u00a0/g, " ").trim();
            if (!text && !element.querySelector("ul,ol,li")) {
              element.remove();
            }
          }
        });

        Array.from(template.content.childNodes).forEach((node) => {
          if (node.nodeType !== Node.TEXT_NODE) return;
          const text = node.textContent.replace(/\u00a0/g, " ").trim();
          if (!text) {
            node.remove();
            return;
          }
          const paragraph = document.createElement("p");
          paragraph.textContent = text;
          node.replaceWith(paragraph);
        });

        return template.innerHTML;
      }

          <div class="toolbar">
            <div>
              <h3>${escapeHtml(config?.title || "协议文档")}</h3>
              <div class="metric-note">${escapeHtml(config?.description || "")}</div>
            </div>
            <button class="btn primary" onclick="openLegalDocumentDrawer('${configKey}')" ${permissionAttrs("settings.write")}>编辑</button>
          </div>
          <div class="grid" style="grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);align-items:start;">
            <div>
              <div class="metric-note">版本 ${escapeHtml(documentValue.versionLabel || "-")}</div>
              <div class="json-box" style="background:#fff;color:var(--text);border-color:var(--line);min-height:180px;">${escapeHtml(previewText)}</div>
            </div>
              <div class="agreement-rich-text" style="border:1px solid var(--line);border-radius:8px;padding:14px;min-height:180px;background:#fff;color:var(--text);overflow:auto;">
              ${sanitizeRichTextHtml(documentValue.contentHtml)}
            </div>
          </div>
          <div class="metric-note" style="margin-top:10px;">配置键：${escapeHtml(runtimeConfig?.key || configKey)}</div>
        </section>`;
      }

      function filteredUsers() {
        const filters = state.userFilters || {};
        const keyword = String(filters.keyword || "").trim().toLowerCase();
        const status = filters.status || "all";
        const accountType = filters.accountType || "all";
        return state.users.filter((user) => {
          const haystack = [
            user.userId,
            user.displayName,
            user.phone,
            user.email,
            user.organizationName,
            user.teamGroupName,
            user.teamRole,
            user.membershipRole,
            frontendAccountTypeLabel(user),
          ].filter(Boolean).join(" ").toLowerCase();
          if (keyword && !haystack.includes(keyword)) return false;
          if (status !== "all" && user.status !== status) return false;
          if (accountType !== "all" && frontendAccountTypeKey(user) !== accountType) return false;
          return true;
        });
      }

      const updateUserFilter = (key, value) => {
        state.userFilters = { ...(state.userFilters || {}), [key]: value };
        state.userPage = 1;
        if (key === "keyword") {
          scheduleUserKeywordSearch();
          return;
        }
        refreshUserTable();
        renderUserPagination();
      };

      function refreshUserTable() {
        const visibleUsers = filteredUsers();
        const body = document.getElementById("user-table-body");
        const count = document.getElementById("user-visible-count");
        if (body) body.innerHTML = userRowsHtml(visibleUsers);
        if (count) {
          const total = Number(state.userTotal || state.users.length || 0);
          count.textContent = `显示 ${visibleUsers.length.toLocaleString()} / ${total.toLocaleString()}`;
        }
      }

      function renderUserPagination() {
        const panel = document.getElementById("user-pagination");
        if (!panel) return;
        const pageSize = Number(state.userPageSize) || 20;
        const total = Math.max(0, Number(state.userTotal) || 0);
        const totalPages = Math.max(1, Math.ceil(total / pageSize));
        const currentPage = Math.min(Math.max(1, Number(state.userPage) || 1), totalPages);
        panel.innerHTML = total
          ? `<span class="metric-note">第 ${currentPage} / ${totalPages} 页 · 共 ${total} 条</span>
              <button class="btn ghost" type="button" onclick="setUserPage(${currentPage - 1})" ${currentPage <= 1 ? "disabled" : ""}>上一页</button>
              <button class="btn ghost" type="button" onclick="setUserPage(${currentPage + 1})" ${currentPage >= totalPages ? "disabled" : ""}>下一页</button>`
          : "";
      }

      function scheduleUserKeywordSearch() {
        refreshUserTable();
        renderUserPagination();
        if (userSearchDebounceTimer) {
          clearTimeout(userSearchDebounceTimer);
        }
        userSearchDebounceTimer = setTimeout(async () => {
          const requestToken = ++userSearchRequestToken;
          await loadUsers();
          if (requestToken !== userSearchRequestToken) return;
          refreshUserTable();
          renderUserPagination();
        }, 180);
      }

      function setUserPage(page) {
        const nextPage = Math.max(1, Number(page) || 1);
        if (nextPage === Number(state.userPage || 1)) return;
        state.userPage = nextPage;
        loadUsers().then(renderShell);
      }

      function bindUserFilterControls() {
        if (state.page !== "users") return;
        document.getElementById("user-search-input")?.addEventListener("input", (event) => {
          updateUserFilter("keyword", event.currentTarget.value);
        });
        document.getElementById("user-status-filter")?.addEventListener("change", (event) => {
          updateUserFilter("status", event.currentTarget.value);
        });
        document.getElementById("user-account-type-filter")?.addEventListener("change", (event) => {
          updateUserFilter("accountType", event.currentTarget.value);
        });
      }

      function teamOrganizationIds() {
        return new Set(state.users
          .filter((user) => (
            user.teamGroupName ||
            user.teamRole ||
            user.accountType === "team_permission_account" ||
            user.accountType === "subaccount" ||
            Number(user.subaccountCount || 0) > 0
          ))
          .map((user) => user.organizationId)
          .filter(Boolean));
      }

      function frontendAccountTypeKey(user) {
        if (!user) return "normal_user";
        if (
          user.teamGroupName ||
          user.teamRole ||
          user.accountType === "team_permission_account" ||
          user.accountType === "subaccount" ||
          Number(user.subaccountCount || 0) > 0
        ) {
          return "team_user";
        }
        if (user.organizationId && teamOrganizationIds().has(user.organizationId)) return "team_user";
        return "normal_user";
      }

      function isTeamUserAccount(user) {
        return Boolean(user?.organizationId) &&
          frontendAccountTypeKey(user) === "team_user" &&
          (
            user.accountType === "owner_account" ||
            user.accountType === "team_permission_account" ||
            user.teamRole === "admin" ||
            user.teamRole === "group_admin" ||
            Number(user.subaccountCount || 0) > 0
          );
      }

      function frontendAccountTypeLabel(userOrType) {
        const accountType = typeof userOrType === "string" ? userOrType : frontendAccountTypeKey(userOrType);
        return {
          normal_user: "普通用户",
          team_user: "团队用户",
        }[accountType] || "普通用户";
      }

      function frontendRoleLabel(role) {
        return {
          owner_admin: "团队主账号",
          creator: "普通成员",
          admin: "团队管理员",
          group_admin: "小组负责人",
          animator_plus: "创作成员",
          animator: "创作成员",
          sub_account: "子账户",
        }[role] || role || "-";
      }

      function usersPage() {
        const visibleUsers = filteredUsers();
        const filters = state.userFilters || {};
        const pageSize = Number(state.userPageSize) || 20;
        const totalCount = Math.max(0, Number(state.userTotal) || 0);
        const totalPages = Math.max(1, Math.ceil(totalCount / pageSize));
        const currentPage = Math.min(Math.max(1, Number(state.userPage) || 1), totalPages);
        state.userPage = currentPage;
        return `<div class="toolbar"><div class="filters">
          <input id="user-search-input" value="${escapeAttribute(filters.keyword || "")}" placeholder="搜索用户 / 手机号 / 邮箱" />
          <select id="user-status-filter">${userFilterStatusOptions(filters.status || "all")}</select>
          <select id="user-account-type-filter">${userFilterAccountTypeOptions(filters.accountType || "all")}</select>
          <span class="metric-note" id="user-visible-count">显示 ${visibleUsers.length.toLocaleString()} / ${totalCount.toLocaleString()}</span>
        </div><div class="filters"><button class="btn ghost" title="刷新用户积分列表" onclick="refreshUserCreditPage()">刷新</button></div></div>
          <div class="table-wrap users dense"><table><thead><tr><th>用户ID</th><th>邀请码</th><th>用户名</th><th>手机号</th><th>前端账户类型</th><th>可用积分</th><th>冻结积分</th><th>登录时间</th><th>状态</th><th class="actions">操作</th></tr></thead><tbody id="user-table-body">
          ${userRowsHtml(visibleUsers)}
        </tbody></table></div>
        <div class="resource-pagination" id="user-pagination">${totalCount ? `<span class="metric-note">第 ${currentPage} / ${totalPages} 页 · 共 ${totalCount} 条</span>
          <button class="btn ghost" type="button" onclick="setUserPage(${currentPage - 1})" ${currentPage <= 1 ? "disabled" : ""}>上一页</button>
          <button class="btn ghost" type="button" onclick="setUserPage(${currentPage + 1})" ${currentPage >= totalPages ? "disabled" : ""}>下一页</button>` : ""}</div>`;
      }

      function userRowsHtml(users) {
        return users.length
          ? users.map((user) => `${userRow(user)}${userModelRequestInlineRow(user)}`).join("")
          : `<tr><td colspan="10">${state.userLoadError || "暂无用户数据"}</td></tr>`;
      }

      function userModelRequestInlineRow(user) {
        const inlineState = state.userModelRequestInline || {};
        if (inlineState.expandedUserId !== user.userId) return "";
        const rowState = inlineState.rowsByUserId?.[user.userId];
        let content = `<span class="metric-note">正在加载模型请求记录...</span>`;
        if (rowState?.error) {
          content = `<span class="error-text">${escapeHtml(rowState.error)}</span>`;
        } else if (rowState?.loaded) {
          content = renderUserModelRequestPanel(rowState.data || [], {
            title: `模型请求记录（${escapeHtml(user.displayName || user.userId)}）`,
          });
        }
        return `<tr class="user-model-request-inline-row"><td colspan="10"><div class="card" style="padding:16px;margin:8px 0 4px;border:1px solid var(--line);box-shadow:none;">${content}</div></td></tr>`;
      }

      function renderMembershipPage() {
        const activeTab = state.membershipBenefitTab || "public";
        const plans = [...(state.membershipPlans || [])]
          .filter((plan) => activeTab === "internal" ? plan.visibility === "internal" : plan.visibility !== "internal")
          .sort((left, right) =>
          membershipTierRank(left.tier) - membershipTierRank(right.tier) ||
          membershipPeriodRank(left.periodUnit, left.periodCount) - membershipPeriodRank(right.periodUnit, right.periodCount) ||
          String(left.code || "").localeCompare(String(right.code || "")),
        );
        const rows = plans.length
          ? plans.map(renderMembershipPlanRow).join("")
          : `<tr><td colspan="10">${state.membershipLoadError || (activeTab === "internal" ? "暂无新用户权益模板" : "暂无会员权益套餐")}</td></tr>`;
        return `<section class="section" id="membership-plans">
          <div class="toolbar">
            <div>
              <h3>${activeTab === "internal" ? "新用户权益" : "会员权益"}</h3>
              <div class="metric-note">${activeTab === "internal" ? "仅维护邀请新人、邀请人奖励等内部体验模板；不会展示到前台会员套餐页。" : "仅维护公开售卖会员套餐；内部新人权益模板不会展示在这里。"}</div>
            </div>
            <div class="filters">
              <button class="btn ghost" onclick="loadMembershipPlans().then(renderShell)">刷新</button>
              <button class="btn primary" onclick="openMembershipPlanDrawer('', state.membershipBenefitTab || 'public')" ${permissionAttrs("membership.plan.write")}>${activeTab === "internal" ? "新增权益模板" : "新增套餐"}</button>
            </div>
          </div>
          <div class="tabs compact">
            <button class="tab ${activeTab === "public" ? "active" : ""}" onclick="setMembershipBenefitTab('public')">会员权益</button>
            <button class="tab ${activeTab === "internal" ? "active" : ""}" onclick="setMembershipBenefitTab('internal')">新用户权益</button>
          </div>
          ${activeTab === "internal" ? renderInviteRewardConfigPanel() : ""}
          <div class="table-wrap membership-plans dense">
            <table>
              <thead><tr><th>套餐</th><th>类型</th><th>场景</th><th>档位</th><th>周期</th><th>价格</th><th>赠送积分</th><th>席位</th><th>状态</th><th class="actions">操作</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </section>`;
      }

      function renderMembershipPlanRow(plan) {
        const statusTone = plan.status === "active" ? "green" : plan.status === "archived" ? "warn" : "";
        return `<tr>
          <td>${escapeHtml(plan.displayName || "-")}<div class="metric-note">${escapeHtml(plan.code || "-")}</div></td>
          <td><span class="tag ${plan.visibility === "internal" ? "warn" : "green"}">${membershipVisibilityLabel(plan.visibility)}</span></td>
          <td>${membershipUsageSceneLabel(plan.usageScene)}</td>
          <td><span class="tag ${plan.tier === "professional" ? "blue" : ""}">${membershipTierLabel(plan.tier)}</span></td>
          <td>${membershipPeriodLabel(plan)}</td>
          <td>${membershipMoney(plan.amountMinor, plan.currency)}</td>
          <td>${Number(plan.giftCredits || 0).toLocaleString()}</td>
          <td>${Number(plan.seatLimit || 1).toLocaleString()}</td>
          <td><span class="tag ${statusTone}">${membershipStatusLabel(plan.status)}</span></td>
          <td class="actions"><div class="actions-row"><button class="icon-btn" title="编辑套餐" onclick="openMembershipPlanDrawer('${escapeAttribute(plan.id)}')" ${permissionAttrs("membership.plan.write")}>编</button><button class="icon-btn" title="删除套餐" onclick="deleteMembershipPlan('${escapeAttribute(plan.id)}')" ${permissionAttrs("membership.plan.write")}>删</button></div></td>
        </tr>`;
      }

      function renderDirectRechargePage() {
        const packages = [...(state.directRechargePackages || [])].sort((left, right) =>
          Number(left.sortOrder || 0) - Number(right.sortOrder || 0) ||
          Number(left.amountMinor || 0) - Number(right.amountMinor || 0) ||
          String(left.code || "").localeCompare(String(right.code || "")),
        );
        const rows = packages.length
          ? packages.map(renderDirectRechargePackageRow).join("")
          : `<tr><td colspan="7">${state.directRechargeLoadError || "暂无直充积分档位"}</td></tr>`;
        return `<section class="section" id="direct-recharge-packages">
          <div class="toolbar">
            <div>
              <h3>直充积分档位</h3>
              <div class="metric-note">仅配置会员可购买的积分直充档位；不赠送会员权益，不延长会员有效期。</div>
            </div>
            <div class="filters">
              <button class="btn ghost" onclick="loadDirectRechargePackages().then(renderShell)">刷新</button>
              <button class="btn primary" onclick="openDirectRechargePackageDrawer()" ${permissionAttrs("membership.plan.write")}>新增档位</button>
            </div>
          </div>
          <div class="table-wrap direct-recharge-packages dense">
            <table>
              <thead><tr><th>档位</th><th>价格</th><th>积分</th><th>标签</th><th>排序</th><th>状态</th><th class="actions">操作</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </section>`;
      }

      function renderDirectRechargePackageRow(item) {
        const statusTone = item.status === "active" ? "green" : item.status === "archived" ? "warn" : "";
        return `<tr>
          <td>${escapeHtml(item.displayName || "-")}<div class="metric-note">${escapeHtml(item.code || "-")}</div><div class="metric-note">${escapeHtml(item.subtitle || "")}</div></td>
          <td>${membershipMoney(item.amountMinor, item.currency)}</td>
          <td>${Number(item.credits || item.baseCredits || 0).toLocaleString()}</td>
          <td>${item.badge ? `<span class="tag blue">${escapeHtml(item.badge)}</span>` : "-"}</td>
          <td>${Number(item.sortOrder || 0).toLocaleString()}</td>
          <td><span class="tag ${statusTone}">${membershipStatusLabel(item.status)}</span></td>
          <td class="actions"><div class="actions-row"><button class="icon-btn" title="编辑档位" onclick="openDirectRechargePackageDrawer('${escapeAttribute(item.id)}')" ${permissionAttrs("membership.plan.write")}>编</button><button class="icon-btn" title="删除档位" onclick="deleteDirectRechargePackage('${escapeAttribute(item.id)}')" ${permissionAttrs("membership.plan.write")}>删</button></div></td>
        </tr>`;
      }

      function directRechargePackageById(packageId) {
        return (state.directRechargePackages || []).find((item) => String(item.id) === String(packageId)) || null;
      }

      function membershipPlanById(planId) {
        return (state.membershipPlans || []).find((plan) => String(plan.id) === String(planId)) || null;
      }

      function membershipTierRank(tier) {
        return tier === "experience" ? 1 : tier === "professional" ? 2 : 9;
      }

      function membershipPeriodRank(unit, count) {
        const unitRank = { day: 1, month: 2, quarter: 3, year: 4 }[unit] || 9;
        return unitRank * 1000 + Number(count || 0);
      }

      function membershipTierLabel(tier) {
        return { experience: "体验版", professional: "专业版" }[tier] || tier || "-";
      }

      function membershipStatusLabel(status) {
        return { active: "启用", inactive: "停用", archived: "归档" }[status] || status || "-";
      }

      function membershipVisibilityLabel(visibility) {
        return { public: "会员权益", internal: "新用户权益" }[visibility] || visibility || "会员权益";
      }

      function membershipUsageSceneLabel(scene) {
        return {
          purchase: "公开售卖",
          invite_new_user: "新人体验",
          invite_inviter: "邀请人奖励",
          manual_gift: "运营赠送",
          test: "测试",
        }[scene] || scene || "公开售卖";
      }

      function setMembershipBenefitTab(tab) {
        state.membershipBenefitTab = tab === "internal" ? "internal" : "public";
        renderShell();
      }

      function renderInviteRewardConfigPanel() {
        const config = state.inviteRewardConfig || {};
        const internalPlans = (state.membershipPlans || [])
          .filter((plan) => plan.visibility === "internal" && plan.status === "active")
          .sort((a, b) => String(a.displayName || "").localeCompare(String(b.displayName || "")));
        const planOptions = [["", "不发放会员模板"], ...internalPlans.map((plan) => [plan.id, `${plan.displayName || plan.code} · ${membershipUsageSceneLabel(plan.usageScene)}`])];
        return `<form class="card" id="invite-reward-config-form" style="margin:12px 0 16px;padding:16px;border:1px solid var(--line);box-shadow:none;">
          <div class="toolbar">
            <div>
              <h4>邀请奖励配置</h4>
              <div class="metric-note">新用户通过邀请码注册后发放新人权益；返利比例按新用户实付充值金额计算。</div>
            </div>
          </div>
          <div class="form-grid">
            <label class="field"><span>新用户权益模板</span><select name="newUserPlanId">${optionPairs(planOptions, config.newUserPlanId || "")}</select></label>
            <label class="field"><span>新用户赠送积分</span><input name="newUserGiftCredits" type="number" min="0" step="1" value="${Number(config.newUserGiftCredits ?? 30)}" /></label>
            <label class="field"><span>邀请人权益模板</span><select name="inviterPlanId">${optionPairs(planOptions, config.inviterPlanId || "")}</select></label>
            <label class="field"><span>邀请人注册赠送积分</span><input name="inviterGiftCredits" type="number" min="0" step="1" value="${Number(config.inviterGiftCredits ?? 30)}" /></label>
            <label class="field"><span>充值返利比例（%）</span><input name="rebatePercent" type="number" min="0" max="100" step="0.001" value="${Number(config.rebatePercent ?? 3)}" /></label>
            <label class="field"><span>返利有效期（天）</span><input name="rebateWindowDays" type="number" min="0" step="1" value="${Number(config.rebateWindowDays ?? 30)}" /></label>
            <label class="field"><span>积分换算比例</span><input name="rebateCreditRate" type="number" min="0" step="1" value="${Number(config.rebateCreditRate ?? 100)}" /><small>100 表示 1 元返 100 积分。</small></label>
            <label class="field"><span>单新用户返利金额上限（分）</span><input name="perInvitedUserRebateCapMinor" type="number" min="0" step="1" value="${config.perInvitedUserRebateCapMinor ?? ""}" placeholder="留空不限制" /></label>
          </div>
          <div class="error-text" id="invite-reward-config-error">${escapeHtml(state.inviteRewardLoadError || "")}</div>
          <button class="btn primary" type="submit" ${permissionAttrs("membership.plan.write")}>保存邀请奖励配置</button>
        </form>`;
      }

      function bindInviteRewardConfigForm() {
        const form = document.getElementById("invite-reward-config-form");
        if (!form) return;
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const error = document.getElementById("invite-reward-config-error");
          error.textContent = "";
          const data = new FormData(form);
          const payload = {
            newUserPlanId: String(data.get("newUserPlanId") || "").trim() || null,
            newUserGiftCredits: Number(data.get("newUserGiftCredits") || 0),
            inviterPlanId: String(data.get("inviterPlanId") || "").trim() || null,
            inviterGiftCredits: Number(data.get("inviterGiftCredits") || 0),
            rebatePercent: Number(data.get("rebatePercent") || 0),
            rebateWindowDays: Number(data.get("rebateWindowDays") || 0),
            rebateCreditRate: Number(data.get("rebateCreditRate") || 0),
            perInvitedUserRebateCapMinor: String(data.get("perInvitedUserRebateCapMinor") || "").trim() || null,
          };
          await runAdminMutation(form, error, async () => {
            await api("/api/admin/invite-rewards/config", {
              method: "POST",
              body: JSON.stringify(payload),
            });
            await loadMembershipPlans();
            renderShell();
          }, "邀请奖励配置已保存").catch(() => undefined);
        });
      }

      function membershipPeriodUnitLabel(unit) {
        return { day: "天", month: "月", quarter: "季", year: "年" }[unit] || unit || "-";
      }

      function membershipPeriodLabel(plan) {
        return `${Number(plan.periodCount || 1).toLocaleString()} ${membershipPeriodUnitLabel(plan.periodUnit)}`;
      }

      function membershipMoney(amountMinor, currency = "CNY") {
        const amount = Number(amountMinor || 0) / 100;
        return `${currency || "CNY"} ${amount.toFixed(2)}`;
      }

      function membershipConfiguredPlanNotice(currentPlanId = "") {
        const plans = (state.membershipPlans || [])
          .filter((plan) => String(plan.id || "") !== String(currentPlanId || ""))
          .slice()
          .sort((a, b) => membershipTierRank(a.tier) - membershipTierRank(b.tier)
            || membershipPeriodRank(a.periodUnit, a.periodCount) - membershipPeriodRank(b.periodUnit, b.periodCount));
        if (!plans.length) {
          return "";
        }
        const items = plans.map((plan) => `
          <li>
            ${escapeHtml(plan.displayName || "-")}
            <span class="metric-note">${escapeHtml(plan.code || "-")} · ${membershipTierLabel(plan.tier)} · ${membershipPeriodLabel(plan)} · ${membershipMoney(plan.amountMinor, plan.currency)}</span>
          </li>
        `).join("");
        return `<div class="membership-plan-notice">
          <strong>已配置会员套餐</strong>
          <span>以下套餐已经存在，请配置其他套餐标识；如需调整，请返回列表编辑已有套餐。</span>
          <ul>${items}</ul>
        </div>`;
      }

      function membershipPlanConflictMessage(payload) {
        const code = payload?.["code"] ? `「${payload["code"]}」` : "";
        return `套餐标识${code}已经配置过了，请配置其他套餐标识；如需调整，请返回列表编辑已有套餐。`;
      }

      function directRechargePackageConflictMessage(payload) {
        const code = payload?.["code"] ? `「${payload["code"]}」` : "";
        return `直充积分档位编码${code}已经存在，请换一个编码；如需调整，请返回列表编辑已有档位。`;
      }

      const membershipEntitlementOptions = [
        ["canvas_access", "可使用画布功能"],

      function membershipPlanPayloadFromForm(form) {
        const id = String(form.get("id") || "").trim();

        const entitlements = membershipEntitlementsFromForm(form);
        const displayMetadata = parseJsonTextarea(form, "displayMetadata");

        const payload = {
          code: String(form.get("code") || "").trim(),
          displayName: String(form.get("displayName") || "").trim(),
          tier: String(form.get("tier") || "professional"),
          periodUnit: String(form.get("periodUnit") || "month"),
          periodCount: Number(form.get("periodCount") || 1),
          amountMinor: Math.round(amountYuan * 100),
          currency: String(form.get("currency") || "CNY"),
          giftCredits: Number(form.get("giftCredits") || 0),
          seatLimit: Number(form.get("seatLimit") || 0),
          entitlements,
          priorityRules: parseJsonTextarea(form, "priorityRules"),
          displayMetadata,
          visibility: String(form.get("visibility") || "public"),
          usageScene: String(form.get("usageScene") || "purchase"),
          status: String(form.get("status") || "inactive"),
          validFrom: String(form.get("validFrom") || "").trim() || null,
          validUntil: String(form.get("validUntil") || "").trim() || null,
          reason: String(form.get("reason") || "").trim(),
        };
        if (id) payload.id = id;
        if (!payload.code || !payload.displayName || !payload.reason) {
          throw new Error("套餐编码、展示名称、变更原因必填");
        }
        if (!Number.isInteger(payload.periodCount) || payload.periodCount < 1) {
          throw new Error("周期数量必须是正整数");
        }
        if (!Number.isInteger(payload.amountMinor) || payload.amountMinor < 1) {
          throw new Error("价格分必须是正整数");
        }
        if (!Number.isInteger(payload.giftCredits) || payload.giftCredits < 0) {
          throw new Error("赠送积分必须是非负整数");
        }
        if (!Number.isInteger(payload.seatLimit) || payload.seatLimit < 0) {
          throw new Error("席位上限必须是 0 或正整数");
        }
        return payload;
      }

      function membershipDisplayFeaturesFromForm(form, selectedEntitlements) {
        const raw = String(form.get("displayFeatures") || "").trim();
        if (!raw) return [];
        const selectedEntitlementSet = new Set(selectedEntitlements);
        const knownFeatureLabelToValue = membershipKnownEntitlementLabelMap();
        return raw.split(/\r?\n/)
          .map((line) => line.trim())
          .filter((line) => {
            if (!line) return false;
            const value = knownFeatureLabelToValue.get(line);
            return !value || selectedEntitlementSet.has(value);
          });
      }

      function parseJsonArrayTextarea(form, name) {
        const raw = String(form.get(name) || "").trim();
        if (!raw) return [];
        const value = JSON.parse(raw);
        if (!Array.isArray(value) || value.some((item) => typeof item !== "string")) {
          throw new Error(`${name} 必须是字符串数组 JSON`);
        }
        return value;
      }

        const template = selectedCharacterPromptTemplate();

          renderShell();
          return;
        }
        try {
          const raw = document.getElementById("character-compose-variables")?.value || "{}";
          const variables = JSON.parse(raw);
          const result = await api("/api/admin/character-prompt/compose", {
            method: "POST",
            body: JSON.stringify({
              template_id: template.id,
              variables,
            }),
          });
          state.characterPromptComposeResult = result.data?.composed_prompt || "";
          state.characterPromptComposeError = "";
        } catch (error) {
          state.characterPromptComposeError = error.payload?.error?.message || error.message || "人物提示词组装失败";
          state.characterPromptComposeResult = "";
        }
        renderShell();

        const nextItems = [
          ...items,
          {
            ...existing,
            id: `${existing.id}-copy-${Date.now()}`,
            label: `${existing.label} 副本`,
            sort_order: Number(existing.sort_order || existing.sortOrder || 0) + 10,
          },
        ];
        await saveBatchImagePromptTemplates(target, nextItems);
        renderShell();
        showToast(`${batchImagePromptDrawerTitle(target)}预设已复制`);

      async function moveBatchImagePromptTemplate(target, templateId, direction) {
        const items = [...getBatchImagePromptTemplates(target)].sort((a, b) => Number(a.sort_order || a.sortOrder || 0) - Number(b.sort_order || b.sortOrder || 0));
        const index = items.findIndex((item) => String(item.id) === String(templateId));
        const swapIndex = index + Number(direction || 0);
        if (index < 0 || swapIndex < 0 || swapIndex >= items.length) return;
        const current = items[index];
        const targetItem = items[swapIndex];
        const currentSort = Number(current.sort_order || current.sortOrder || 0);
        const targetSort = Number(targetItem.sort_order || targetItem.sortOrder || 0);
        items[index] = { ...targetItem, sort_order: currentSort, sortOrder: currentSort };
        items[swapIndex] = { ...current, sort_order: targetSort, sortOrder: targetSort };
        const nextItems = items.sort((a, b) => Number(a.sort_order || a.sortOrder || 0) - Number(b.sort_order || b.sortOrder || 0));
        await saveBatchImagePromptTemplates(target, nextItems);
        renderShell();
        showToast("排序已更新");
