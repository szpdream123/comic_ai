                <input value="${escapeAttribute(state.imagePromptKeyword || "")}" placeholder="搜索名称 / 编码 / 标签" oninput="updateImagePromptKeyword(this.value)" />
                <select onchange="updateImagePromptCategory(this.value)">${optionList(imagePromptKinds.map((item) => item.key), activeKind.key)}</select>
                <button class="btn primary" onclick="openImagePromptStyleDrawer()" ${permissionAttrs("storyboard_prompt:create")}>新增生图题词</button>
                <button class="btn ghost" onclick="loadImagePromptStyles(state.imagePromptCategory, state.imagePromptKeyword).then(renderShell)">刷新</button>
              </div>
            </div>
            <div class="table-wrap dense"><table><thead><tr><th class="prompt-cover-col">封面</th><th>名称</th><th>编码</th><th>分类</th><th>模型族</th><th>状态</th><th>默认</th><th>排序</th><th>提示词</th><th class="actions">操作</th></tr></thead><tbody>${rows}</tbody></table></div>
          </section>
          <aside class="card prompt-preview">
            <div class="toolbar"><h3 style="margin:0;">样式预览</h3><button class="btn ghost" onclick="copyPromptPreview()">复制</button></div>
            <div class="prompt-preview-box" id="prompt-preview">${imagePromptPreview(filtered)}</div>
            <h3 style="margin:0;">负向约束</h3>
            <textarea class="prompt-result-box" readonly>${escapeHtml((filtered[0]?.negative_prompt || filtered[0]?.negativePrompt || "避免文字、水印、logo、畸形手指、多手多脚、五官错位、肢体扭曲、人物融合、低清晰度、过曝、画面脏乱、主体不完整"))}</textarea>
          </aside>
        </section>`;
      }

      function imagePromptStyleRow(item) {
        const nextStatus = item.status === "enabled" ? "disabled" : "enabled";
        return `<tr>
          <td class="prompt-cover-col">${promptCoverMarkup(item, "图")}</td>
          <td><div class="prompt-title-cell">${escapeHtml(item.name || "-")}<div class="metric-note">${escapeHtml((item.tags || []).join(" / ") || "-")}</div></div></td>
          <td class="prompt-code-cell">${escapeHtml(item.code || "-")}</td>
          <td><span class="tag blue">${escapeHtml(item.category || "-")}</span></td>
          <td>${escapeHtml(item.model_family || item.modelFamily || "doubao")}</td>
          <td><span class="tag ${item.status === "enabled" ? "green" : "warn"}">${item.status === "enabled" ? "启用" : "停用"}</span></td>
          <td>${item.is_default || item.isDefault ? `<span class="tag green">默认</span>` : `<button class="btn ghost" onclick="setImagePromptStyleDefault('${escapeAttribute(item.id)}')" ${permissionAttrs("storyboard_prompt:update")}>设为默认</button>`}</td>
          <td>${Number(item.sort_order || item.sortOrder || 0)}</td>
          <td style="max-width:360px;">${escapeHtml(item.prompt_content || item.promptContent || "")}</td>
          <td class="actions"><div class="actions-row"><button class="icon-btn" title="编辑" onclick="openImagePromptStyleDrawer('${escapeAttribute(item.id)}')" ${permissionAttrs("storyboard_prompt:update")}>编</button><button class="icon-btn" title="复制" onclick="copyImagePromptStyle('${escapeAttribute(item.id)}')" ${permissionAttrs("storyboard_prompt:create")}>复</button><button class="icon-btn" title="${nextStatus === "disabled" ? "停用" : "启用"}" onclick="toggleImagePromptStyleStatus('${escapeAttribute(item.id)}','${nextStatus}')" ${permissionAttrs("storyboard_prompt:enable")}>${nextStatus === "disabled" ? "停" : "启"}</button></div></td>
        </tr>`;
      }

      function imagePromptPreview(items) {
        const selected = items.slice(0, 6);
        const sections = selected.map((item) => `【${item.name}】\n${item.prompt_content || item.promptContent || ""}`);
        return escapeHtml(sections.join("\n\n") || "暂无可预览的生图题词。");
      }

      function imagePromptStyleById(id) {
        return (state.imagePromptStyles || []).find((item) => String(item.id) === String(id));
      }

      function updateImagePromptCategory(category) {
        state.imagePromptCategory = imagePromptKinds.some((item) => item.key === category) ? category : "all";
        loadImagePromptStyles(state.imagePromptCategory, state.imagePromptKeyword).then(renderShell);
      }

      function updateImagePromptKeyword(value) {
        state.imagePromptKeyword = value || "";
        loadImagePromptStyles(state.imagePromptCategory, state.imagePromptKeyword).then(renderShell);
      }

      function formatShortDate(value) {
        if (!value) return "-";
        return new Date(value).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
      }

      function copyPromptPreview() {
        const text = document.getElementById("prompt-preview")?.textContent || "";
        navigator.clipboard?.writeText(text).then(() => showToast("预览已复制")).catch(() => showToast("当前浏览器不支持自动复制"));
      }

      function compactUserId(userId) {
        const value = String(userId || "");
        return value.length > 8 ? `${value.slice(0, 8)}...` : value;
      }

      function userRow(user) {
        const typeLabel = frontendAccountTypeLabel(user);
        const statusLabel = user.status === "active" ? "正常" : user.status === "archived" ? "归档" : "禁用";
        const nextStatus = user.status === "active" ? "disabled" : "active";
        const statusAction = nextStatus === "disabled" ? "disable" : "enable";
        return `<tr><td><div title="${escapeAttribute(user.userId)}">${escapeHtml(compactUserId(user.userId))}</div>${user.email ? `<div class="metric-note">${user.email}</div>` : ""}</td><td>${escapeHtml(user.inviteCode || "-")}</td><td>${escapeHtml(user.displayName || "未命名用户")}</td><td>${escapeHtml(user.phone || "-")}</td><td><span class="tag blue">${typeLabel}</span></td><td>${Number(user.availableCredits || 0).toLocaleString()}</td><td>${Number(user.frozenCredits || 0).toLocaleString()}</td><td>${user.lastLoginAt ? escapeHtml(formatAdminDateTime(user.lastLoginAt)) : "-"}</td><td><span class="tag ${user.status === "active" ? "green" : "warn"}">${statusLabel}</span></td><td class="actions"><div class="actions-row"><button class="btn ghost" onclick="openUserProfileDrawer('${user.userId}')" ${userActionAttrs(user, "profile", "user.write")}>修改</button><button class="btn ghost" onclick="openUserStatusDrawer('${user.userId}','${nextStatus}')" ${userActionAttrs(user, statusAction, "user.write")}>${nextStatus === "disabled" ? "禁用" : "启用"}</button><button class="btn ghost user-edit-btn" onclick="openUserActionDrawer('${user.userId}')">操作</button><button class="btn danger" onclick="openUserStatusDrawer('${user.userId}','archived')" ${userActionAttrs(user, "archive", "user.write")}>删除</button></div></td></tr>`;
      }

      async function toggleUserModelRequestInline(userId) {
        const inlineState = state.userModelRequestInline || { expandedUserId: null, rowsByUserId: {} };
        if (inlineState.expandedUserId === userId) {
          state.userModelRequestInline = {
            ...inlineState,
            expandedUserId: null,
          };
          refreshUserTable();
          return;
        }
        state.userModelRequestInline = {
          ...inlineState,
          expandedUserId: userId,
          rowsByUserId: {
            ...(inlineState.rowsByUserId || {}),
            [userId]: inlineState.rowsByUserId?.[userId] || {
              loaded: false,
              loading: true,
              error: "",
              data: [],
            },
          },
        };
        refreshUserTable();
        const currentRowState = state.userModelRequestInline.rowsByUserId?.[userId];
        if (currentRowState?.loaded || currentRowState?.loading) {
          return;
        }
        try {
          const result = await api(`/api/admin/users/${userId}/model-requests?pageSize=100`);
          state.userModelRequestInline = {
            ...(state.userModelRequestInline || {}),
            rowsByUserId: {
              ...(state.userModelRequestInline?.rowsByUserId || {}),
              [userId]: {
                loaded: true,
                loading: false,
                error: "",
                data: result.data || [],
              },
            },
          };
        } catch (error) {
          state.userModelRequestInline = {
            ...(state.userModelRequestInline || {}),
            rowsByUserId: {
              ...(state.userModelRequestInline?.rowsByUserId || {}),
              [userId]: {
                loaded: false,
                loading: false,
                error: error.payload?.error?.message || "模型请求记录加载失败",
                data: [],
              },
            },
          };
        }
        refreshUserTable();
      }

      function openUserActionDrawer(userId) {
        const user = state.users.find((item) => item.userId === userId);
        if (!user) return;
        const nextStatus = user.status === "active" ? "disabled" : "active";
        const statusAction = nextStatus === "disabled" ? "disable" : "enable";
        const statusLabel = user.status === "active" ? "正常" : user.status === "archived" ? "归档" : "禁用";
        const drawer = document.getElementById("drawer");
        drawer.classList.remove("hidden");
        drawer.innerHTML = `<aside class="drawer-panel">
          <div class="drawer-head"><h3>用户操作</h3><button class="icon-btn" onclick="closeDrawer()">×</button></div>
          <p style="color:var(--muted);line-height:1.7">${user.displayName || userId}</p>
          <div class="check-list">
            <div><span>前端账户类型</span><span class="tag blue">${frontendAccountTypeLabel(user)}</span></div>
            <div><span>当前状态</span><span class="tag ${user.status === "active" ? "green" : "warn"}">${statusLabel}</span></div>
            <div><span>可用积分</span><span>${Number(user.availableCredits || 0).toLocaleString()}</span></div>
            <div><span>冻结积分</span><span>${Number(user.frozenCredits || 0).toLocaleString()}</span></div>
            <div><span>任务预占积分</span><span>${Number(user.reservedCredits || 0).toLocaleString()}</span></div>
          </div>
          <div class="user-action-grid">
            <button class="btn ghost" onclick="openUserDetailDrawer('${user.userId}')" ${userActionAttrs(user, "view")}>查看账户与模型记录</button>
            <button class="btn ghost" onclick="openUserModelRequestDrawer('${user.userId}')" ${userActionAttrs(user, "view")}>只看模型记录</button>
            <button class="btn ghost" onclick="openCreditGrantDrawer('${user.userId}')" ${userActionAttrs(user, "credit", "credit.adjust")}>手动添加积分</button>
            <button class="btn ghost" onclick="openCreditDeductDrawer('${user.userId}')" ${userActionAttrs(user, "credit", "credit.adjust")}>手动扣减积分</button>
            <button class="btn ghost" onclick="openCreditSetBalanceDrawer('${user.userId}')" ${userActionAttrs(user, "credit", "credit.adjust")}>调整到目标积分</button>
            ${Number(user.frozenCredits || 0) > 0 ? `<button class="btn ghost" onclick="openFrozenCreditRestoreDrawer('${user.userId}')" ${userActionAttrs(user, "credit", "credit.adjust")}>强制解冻积分</button>` : ""}
            ${isTeamUserAccount(user) ? `<button class="btn ghost" onclick="openTeamLimitDrawer('${user.userId}')" ${userActionAttrs(user, "teamLimit", "user.write")}>团队额度</button>` : ""}
          </div>
        </aside>`;
      }

      function userDrawerHead(title, userId) {
        return `<div class="drawer-head"><div class="drawer-title-group"><button class="btn ghost drawer-back-btn" type="button" onclick="openUserActionDrawer('${userId}')">返回</button><h3>${title}</h3></div><button class="icon-btn" onclick="closeDrawer()">×</button></div>`;
      }

      async function loadUserModelRequestPanel(userId, elementId, pageSize = 100) {
        const target = document.getElementById(elementId);
        if (!target) return;
        target.innerHTML = `<span class="metric-note">正在加载模型请求记录...</span>`;
        try {
          const modelRequestResult = await api(`/api/admin/users/${userId}/model-requests?pageSize=${pageSize}`);
          target.innerHTML = renderUserModelRequestPanel(modelRequestResult.data || [], {
            title: `模型请求记录（最近 ${Number(modelRequestResult.meta?.total || (modelRequestResult.data || []).length || 0)} 条）`,
          });
        } catch (err) {
          target.innerHTML = `<span class="error-text">${err.payload?.error?.message || "模型请求记录加载失败"}</span>`;
        }
      }

      function risksPage() {
        const riskRows = state.risks.risks.length
          ? state.risks.risks.map(paymentRiskRow).join("")
          : `<tr><td colspan="5">${state.riskLoadError || "暂无支付风险"}</td></tr>`;
        const taskRows = state.risks.taskExceptions.length
          ? state.risks.taskExceptions.map(taskExceptionRow).join("")
          : `<tr><td colspan="5">暂无任务异常</td></tr>`;
        const paymentIssueRows = state.risks.paymentIssues.length
          ? state.risks.paymentIssues.map(paymentIssueRow).join("")
          : `<tr><td colspan="6">暂无支付积分修复项</td></tr>`;
        const auditRows = state.auditEvents.length
          ? state.auditEvents.map(auditEventRow).join("")
          : `<tr><td colspan="5">暂无审计日志</td></tr>`;
        return `<div class="grid" style="grid-template-columns:minmax(0,1fr);">
          <section class="card">
            <div class="toolbar"><h3>支付风险</h3><div class="filters"><select id="riskStatusFilter" onchange="updateRiskStatusFilter(this.value)">${optionList(["all", "open", "reviewed", "ignored_with_reason"], state.riskStatusFilter)}</select></div><button class="btn ghost" onclick="downloadRiskExport('risks')" ${permissionAttrs("risk.export")}>导出CSV</button><button class="btn ghost" onclick="loadRiskAudit().then(renderShell)">刷新</button></div>
            <div class="table-wrap compact"><table><thead><tr><th>风险类型</th><th>等级</th><th>决策</th><th>状态</th><th class="actions">操作</th></tr></thead><tbody>${riskRows}</tbody></table></div>
          </section>
          <section class="card">
            <h3>任务异常</h3>
            <div class="table-wrap compact"><table><thead><tr><th>任务</th><th>队列</th><th>供应商</th><th>状态</th><th class="actions">操作</th></tr></thead><tbody>${taskRows}</tbody></table></div>
          </section>
          <section class="card">
            <h3>支付积分修复</h3>
            <div class="table-wrap compact"><table><thead><tr><th>订单号</th><th>积分</th><th>金额</th><th>支付时间</th><th>状态</th><th class="actions">操作</th></tr></thead><tbody>${paymentIssueRows}</tbody></table></div>
          </section>
          <section class="card">
            <div class="toolbar"><h3>审计日志</h3><button class="btn ghost" onclick="downloadRiskExport('audit-events')" ${permissionAttrs("risk.export")}>导出CSV</button></div>
            <div class="table-wrap compact"><table><thead><tr><th>动作</th><th>对象</th><th>原因</th><th>时间</th><th class="actions">操作</th></tr></thead><tbody>${auditRows}</tbody></table></div>
          </section>
        </div>`;
      }

      function smsRecordsPage() {
        const pageSize = Number(state.smsRecordPageSize) || 20;
        const totalCount = Math.max(0, Number(state.smsRecordTotal) || 0);
        const totalPages = Math.max(1, Math.ceil(totalCount / pageSize));
        const currentPage = Math.min(Math.max(1, Number(state.smsRecordPage) || 1), totalPages);
        state.smsRecordPage = currentPage;
        const rows = state.smsRecords.length
          ? state.smsRecords.map((item) => `
            <tr>
              <td>${escapeHtml(formatAdminDateTime(item.createdAt))}</td>
              <td>${escapeHtml(item.phone || "-")}</td>
              <td><span class="tag blue">${escapeHtml(item.verificationCode || "-")}</span></td>
              <td>${escapeHtml(item.ipAddress || "-")}</td>
              <td><div class="metric-note">${escapeHtml(item.smsContent || "-")}</div></td>
              <td><span class="tag ${item.status === "sent" ? "green" : "warn"}">${item.status === "sent" ? "成功" : "失败"}</span></td>
            </tr>
          `).join("")
          : `<tr><td colspan="6">${state.smsRecordLoadError || "暂无短信记录"}</td></tr>`;
        return `<section class="card">
          <div class="toolbar">
            <h3>短信记录</h3>
            <div class="filters">
              <select onchange="updateSmsRecordRange(this.value)">${smsRecordRangeOptions(state.smsRecordRange || "all")}</select>
              <button class="btn ghost" onclick="loadSmsRecords().then(renderShell)">刷新</button>
            </div>
          </div>
          <div class="metric-note">默认隐藏测试样例号与本机调试记录，可按天或按月过滤。列表展示手机号、验证码、IP 与短信内容。</div>
          <div class="table-wrap dense"><table><thead><tr><th>时间</th><th>手机号</th><th>验证码</th><th>IP</th><th>短信内容</th><th>状态</th></tr></thead><tbody>${rows}</tbody></table></div>
          <div class="resource-pagination">${totalCount ? `<span class="metric-note">第 ${currentPage} / ${totalPages} 页 · 共 ${totalCount} 条</span>
            <button class="btn ghost" type="button" onclick="setSmsRecordPage(${currentPage - 1})" ${currentPage <= 1 ? "disabled" : ""}>上一页</button>
            <button class="btn ghost" type="button" onclick="setSmsRecordPage(${currentPage + 1})" ${currentPage >= totalPages ? "disabled" : ""}>下一页</button>` : ""}</div>
        </section>`;
      }

      function setSmsRecordPage(page) {
        const nextPage = Math.max(1, Number(page) || 1);
        if (nextPage === Number(state.smsRecordPage || 1)) return;
        state.smsRecordPage = nextPage;
        loadSmsRecords().then(renderShell);
      }

      function formatBytes(value) {
        const bytes = Number(value || 0);
        if (!Number.isFinite(bytes) || bytes <= 0) return "-";
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        if (bytes < 1024 * 1024 * 1024) return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
        return `${(bytes / (1024 * 1024 * 1024)).toFixed(2)} GB`;
      }

      function updateResourceMediaFilter(value) {
        state.resourceMediaFilter = value || "all";
        state.resourcePage = 1;
        loadResources().then(renderShell);
      }

      function updateResourceRangeFilter(value) {
        state.resourceRangeFilter = value || "all";
        state.resourcePage = 1;
        loadResources().then(renderShell);
      }

      function updateResourceSearch(value) {
        state.resourceSearch = value || "";
        state.resourcePage = 1;
        loadResources().then(renderShell);
      }

      function setResourcePage(page) {
        const nextPage = Math.max(1, Number(page) || 1);
        state.resourcePage = nextPage;
        loadResources().then(renderShell);
      }

      function selectResource(resourceId) {
        state.resourceSelectedId = resourceId;
        renderShell();
      }

      function previewResource(resourceId) {
        const item = state.resources.find((entry) => entry.id === resourceId);
        if (!item) return;
        const previewUrl = storagePreviewUrl(item);
        if (!previewUrl) {
          showToast("当前资源没有可用预览链接");
          return;
        }
        state.resourceSelectedId = resourceId;
        state.resourcePreviewOpen = true;
        renderShell();
      }

      function closeResourcePreview() {
        if (!state.resourcePreviewOpen) return;
        state.resourcePreviewOpen = false;
        renderShell();
      }

      async function copyResourceUrl(url) {
        if (!url) return;
        await navigator.clipboard?.writeText(url).then(() => showToast("资源链接已复制")).catch(() => showToast("当前浏览器不支持自动复制"));
      }

      function openResourceUrl(url) {
        if (!url) return;
        window.open(url, "_blank", "noopener,noreferrer");
      }

      async function deleteResource(resourceId) {
        const item = state.resources.find((entry) => entry.id === resourceId);
        if (!item) return;
        if (!window.confirm(`确认删除资源“${item.fileName || item.objectKey || item.id}”吗？删除后将从云存储和资源列表中移除。`)) {
          return;
        }
        try {
          await api(`/api/admin/resources/${encodeURIComponent(resourceId)}`, {
            method: "DELETE",
            headers: { "idempotency-key": `admin-ui-resource-delete-${resourceId}-${Date.now()}` },
            body: JSON.stringify({ reason: "后台删除资源" }),
          });
          if (state.resourceSelectedId === resourceId) {
            state.resourceSelectedId = null;
          }
          state.resourcePreviewOpen = false;
          await loadResources();
          renderShell();
          showToast("资源已删除");
        } catch (error) {
          showToast(error.payload?.error?.message || "资源删除失败");
        }
      }

      function resourcePreviewCell(item) {
        const previewUrl = storagePreviewUrl(item);
        const label = resourceKindLabel(item);
        if (!previewUrl) {
          return `<div class="resource-thumb-btn" style="cursor:default;"><span class="resource-thumb-label">暂无预览</span></div>`;
        }
        const inner = label === "视频"
          ? `<video src="${escapeAttribute(previewUrl)}" muted playsinline preload="metadata"></video>`
          : `<img src="${escapeAttribute(previewUrl)}" alt="${escapeAttribute(item.fileName || item.objectKey || "资源预览")}" loading="lazy" referrerpolicy="no-referrer" />`;
        return `<button class="resource-thumb-btn" type="button" title="点击放大预览" onclick="event.stopPropagation();previewResource('${escapeAttribute(item.id)}')">${inner}</button>`;
      }

      function resourceTableRow(item) {
        const previewUrl = storagePreviewUrl(item);
        const active = state.resourceSelectedId === item.id ? "active" : "";
        const fileLabel = item.fileName || item.objectKey || "未命名资源";
        const linkValue = previewUrl || item.sourceUrl || item.downloadUrl || "";
        return `<tr class="${active}" onclick="selectResource('${escapeAttribute(item.id)}')">
          <td class="preview-col">${resourcePreviewCell(item)}</td>
          <td class="resource-link-cell">
            <button class="resource-link-button resource-link-primary" type="button" onclick="event.stopPropagation();selectResource('${escapeAttribute(item.id)}')">${escapeHtml(fileLabel)}</button>
            <div class="resource-link-secondary">${escapeHtml(linkValue || `${item.bucket || "-"} / ${item.objectKey || "-"}`)}</div>
          </td>
          <td class="size-col">${formatBytes(item.sizeBytes)}</td>
          <td class="type-col">
            <div><span class="tag ${resourceKindTone(item)}">${resourceKindLabel(item)}</span></div>
            <div class="metric-note" style="margin-top:4px;">${escapeHtml(item.contentType || "-")}</div>
          </td>
          <td class="user-col">${escapeHtml(item.actorDisplayName || "-")}</td>
          <td class="phone-col">${escapeHtml(item.actorPhoneE164 || "-")}</td>
          <td class="time-col">${escapeHtml(formatAdminDateTime(item.createdAt))}</td>
          <td class="actions">
            <div class="resource-row-actions">
              <button class="icon-btn" type="button" title="打开原始链接" onclick="event.stopPropagation();openResourceUrl('${escapeAttribute(linkValue)}')">开</button>
              <button class="icon-btn" type="button" title="复制链接" onclick="event.stopPropagation();copyResourceUrl('${escapeAttribute(linkValue)}')">复</button>
              <button class="icon-btn danger" type="button" title="删除资源" onclick="event.stopPropagation();deleteResource('${escapeAttribute(item.id)}')" ${permissionAttrs("audit.read")}>删</button>
            </div>
          </td>
        </tr>`;
      }

      function resourcePreviewModal() {
        if (!state.resourcePreviewOpen) return "";
        const selected = state.resources.find((item) => item.id === state.resourceSelectedId) || null;
        if (!selected) return "";
        const previewUrl = storagePreviewUrl(selected);
        if (!previewUrl) return "";
        const isVideo = resourceKindLabel(selected) === "视频";
        const media = isVideo
          ? `<video controls autoplay playsinline preload="metadata" src="${escapeAttribute(previewUrl)}"></video>`

          : `<div class="resource-inspector-empty">${state.resourceLoadError || "暂无资源"}</div>`;
        const stats = state.resourceStats || {};
        return `<div class="section-stack resources-layout">
          <section class="card">
            <div class="toolbar">
              <div>
                <h3 style="margin:0;">资源列表</h3>

                <select onchange="updateResourceMediaFilter(this.value)">${resourceFilterOptions(state.resourceMediaFilter || "all", [{ value: "all", label: "全部资源" }, { value: "image", label: "图片" }, { value: "video", label: "视频" }])}</select>
                <select onchange="updateResourceRangeFilter(this.value)">${resourceFilterOptions(state.resourceRangeFilter || "all", [{ value: "all", label: "全部时间" }, { value: "day", label: "今日" }, { value: "month", label: "本月" }])}</select>

            </div>
            <div class="resource-stat-grid" style="margin-bottom:12px;">
              <div class="resource-stat"><div class="metric-note">资源总数</div><div>${Number(stats.total || 0)}</div></div>
              <div class="resource-stat"><div class="metric-note">图片总数</div><div>${Number(stats.imageCount || 0)}</div></div>
              <div class="resource-stat"><div class="metric-note">视频总数</div><div>${Number(stats.videoCount || 0)}</div></div>
              <div class="resource-stat"><div class="metric-note">图片占用</div><div>${formatBytes(Number(stats.imageBytes || 0))}</div></div>
              <div class="resource-stat"><div class="metric-note">视频占用</div><div>${formatBytes(Number(stats.videoBytes || 0))}</div></div>

            <div class="resources-list">${tableContent}</div>
            ${totalCount ? `<div class="resource-pagination">
              <span class="metric-note">第 ${currentPage} / ${totalPages} 页 · 共 ${totalCount} 条</span>
              <button class="btn ghost" type="button" onclick="setResourcePage(${currentPage - 1})" ${currentPage <= 1 ? "disabled" : ""}>上一页</button>
              <button class="btn ghost" type="button" onclick="setResourcePage(${currentPage + 1})" ${currentPage >= totalPages ? "disabled" : ""}>下一页</button>
            </div>` : ""}
          </section>

      function riskTable(name, severity, status) {
        return `<div class="table-wrap"><table><thead><tr><th>事件</th><th>等级</th><th>状态</th><th class="actions">操作</th></tr></thead><tbody><tr><td>${name}</td><td>${severity}</td><td><span class="tag warn">${status}</span></td><td class="actions"><button class="icon-btn" onclick="openDrawer('风险复核','填写处理结论并写入 audit_events。')">审</button></td></tr></tbody></table></div>`;

      async function updateRiskStatusFilter(value) {
        state.riskStatusFilter = value || "all";
        await loadRiskAudit();
        renderShell();
      }

      function paymentRiskRow(risk) {
        const severityLabel = risk.severity === "critical" ? "高" : risk.severity === "warning" ? "中" : "低";
        const statusLabel = risk.status === "open" ? "待处理" : risk.status === "reviewed" ? "已复核" : "已忽略";
        return `<tr><td>${risk.riskType}<div class="metric-note">${compactJson(risk.metadata)}</div></td><td><span class="tag ${risk.severity === "critical" ? "warn" : "blue"}">${severityLabel}</span></td><td>${risk.decision}</td><td><span class="tag ${risk.status === "open" ? "warn" : "green"}">${statusLabel}</span></td><td class="actions"><button class="icon-btn" onclick="openRiskReviewDrawer('${risk.id}')" ${permissionAttrs("risk.review")}>审</button></td></tr>`;

      function taskExceptionRow(task) {
        return `<tr><td>${task.taskType}<div class="metric-note">${task.failureCode || task.id}</div></td><td>${task.queueName}</td><td>${task.providerName || "-"}</td><td><span class="tag warn">${task.status}</span></td><td class="actions"><button class="icon-btn" onclick="openTaskRetryDrawer('${task.id}')" ${permissionAttrs("ops.task.retry")}>重</button></td></tr>`;

      function auditEventRow(event) {
        return `<tr><td>${event.eventType}</td><td>${event.targetType}<div class="metric-note">${event.targetId}</div></td><td>${event.reason || "-"}</td><td>${new Date(event.createdAt).toLocaleString("zh-CN")}</td><td class="actions"><button class="icon-btn" title="详情" onclick="openAuditEventDrawer('${event.id}')">详</button></td></tr>`;

        const url = new URL(
          scope === "audit-events" ? "/api/admin/exports/audit-events.csv" : "/api/admin/exports/risks.csv",

            <h4>请求上下文</h4>

              <div><span>userAgent</span><span style="word-break:break-all;">${userAgent}</span></div>

            <div class="toolbar"><h3>协议管理</h3><span class="metric-note">登录页协议由后台统一维护，支持富文本编辑与弹窗展示。</span></div>

          <section class="card">

          </section>
          <section class="card">
            <div class="toolbar"><h3>&#23494;&#38053;&#31649;&#29702;</h3><button class="btn primary" onclick="openSecretReferenceDrawer()" ${permissionAttrs("settings.write")}>&#26032;&#22686;&#23494;&#38053;</button></div>
            <div class="table-wrap settings compact"><table><thead><tr><th>&#24341;&#29992;&#21517;</th><th>&#23494;&#38053;&#26126;&#25991;</th><th>&#35831;&#27714;&#22495;&#21517;</th><th>&#20379;&#24212;&#21830;</th><th>&#29366;&#24577;</th><th class="actions">&#25805;&#20316;</th></tr></thead><tbody>${secretRows}</tbody></table></div>
          </section>
          <section class="card">
            <div class="toolbar"><h3>后台权限账户</h3><button class="btn primary" onclick="openAdminAccountDrawer()" ${permissionAttrs("admin_account.write")}>新增账户</button></div>
            <div class="table-wrap settings compact"><table><thead><tr><th>账号</th><th>显示名</th><th>角色</th><th>状态</th><th class="actions">操作</th></tr></thead><tbody>${accountRows}</tbody></table></div>
          </section>
        </div>`;
      }

      function configRow(config) {
        const value = compactJson(config.value);
        return `<tr><td>${config.key}<div class="metric-note">${config.description || "无说明"}</div></td><td>${config.scope}</td><td><span class="tag blue">${config.valueType}</span></td><td title="${escapeHtml(value)}">${escapeHtml(value)}</td><td class="actions"><div class="actions-row"><button class="icon-btn" onclick="openRuntimeConfigDrawer('${config.key}')" ${permissionAttrs("settings.write")}>改</button><button class="icon-btn" title="历史" onclick="openRuntimeConfigHistoryDrawer('${config.key}')">史</button></div></td></tr>`;
      }

      function secretReferenceRow(secret) {
        const statusClass = secret.status === "configured" ? "green" : secret.status === "missing" ? "warn" : "blue";
        const statusLabel = secret.status === "configured" ? "\u5df2\u914d\u7f6e" : secret.status === "missing" ? "\u7f3a\u5931" : "\u672a\u77e5";
        const checkedText = secret.lastCheckedAt ? new Date(secret.lastCheckedAt).toLocaleString("zh-CN") : "\u672a\u68c0\u6d4b";
        const secretValue = secret.secretValue || "\u672a\u4fdd\u5b58";
        return `<tr><td>${escapeHtml(secret.secretRef || "-")}<div class="metric-note">\u5f15\u7528\u952e\uff1a${escapeHtml(secret.envName || "-")}</div></td><td title="${escapeAttribute(secretValue)}">${escapeHtml(secretValue)}<div class="metric-note">${checkedText}</div></td><td>${escapeHtml(secret.requestDomain || secret.baseUrl || "-")}</td><td>${escapeHtml(secret.providerName || "-")}</td><td><span class="tag ${statusClass}">${statusLabel}</span></td><td class="actions"><div class="actions-row"><button class="icon-btn" title="\u63a2\u6d4b\u5bc6\u94a5" onclick="probeSecretReference('${secret.id}')" ${permissionAttrs("settings.write")}>\u6d4b</button><button class="icon-btn" title="\u7f16\u8f91\u5bc6\u94a5" onclick="openSecretReferenceDrawer('${secret.id}')" ${permissionAttrs("settings.write")}>\u6539</button><button class="icon-btn" title="\u5220\u9664\u5bc6\u94a5" onclick="deleteSecretReference('${secret.id}')" ${permissionAttrs("settings.write")}>\u5220</button></div></td></tr>`;
      }

      function adminAccountRow(account) {
        const statusLabel = account.status === "active" ? "启用" : account.status === "disabled" ? "禁用" : "归档";
        const nextStatus = account.status === "active" ? "disabled" : "active";
        return `<tr><td>${account.loginName}</td><td>${account.displayName}</td><td>${account.roles.join(" / ")}</td><td><span class="tag ${account.status === "active" ? "green" : "warn"}">${statusLabel}</span></td><td class="actions"><div class="actions-row"><button class="icon-btn" onclick="openAdminAccountEditDrawer('${account.id}')" ${permissionAttrs("admin_account.write")}>改</button><button class="icon-btn" onclick="openAdminAccountPasswordResetDrawer('${account.id}')" ${permissionAttrs("admin_account.write")}>密</button><button class="icon-btn" onclick="openAdminAccountEditDrawer('${account.id}','${nextStatus}')" ${permissionAttrs("admin_account.write")}>${nextStatus === "disabled" ? "停" : "启"}</button></div></td></tr>`;
      }

      function compactJson(value) {
        if (typeof value === "string") return value;
        if (value && typeof value === "object" && "contentHtml" in value) {
          const legalValue = normalizeLegalDocumentValue("", value);
          return JSON.stringify({
            title: legalValue.title,
            versionLabel: legalValue.versionLabel,
            contentPreview: stripHtmlToText(legalValue.contentHtml).slice(0, 80),
          });
        }
        return JSON.stringify(value);
      }

      function openLegalDocumentDrawer(configKey) {
        const { config, runtimeConfig, documentValue } = legalDocumentEditor(configKey);
        const drawer = document.getElementById("drawer");
        drawer.classList.remove("hidden");
        drawer.innerHTML = `<aside class="drawer-panel" style="width:min(980px,100%);">
          <div class="drawer-head">
            <h3>编辑${escapeHtml(config?.title || "协议文档")}</h3>
            <button class="icon-btn" onclick="closeDrawer()">×</button>
          </div>
          <p style="color:var(--muted);line-height:1.7">${escapeHtml(config?.description || "支持富文本编辑与登录页弹窗展示。")}</p>
          <form id="legal-document-form">
            <div class="form-grid">
              <label class="field"><span>协议标题</span><input name="title" value="${escapeAttribute(documentValue.title)}" required /></label>
              <label class="field"><span>版本标记</span><input name="versionLabel" value="${escapeAttribute(documentValue.versionLabel || "")}" placeholder="例如：2025-11-15" /></label>
            </div>
            <div class="toolbar" style="margin:12px 0 10px;">
              <div class="filters">
                <button class="btn ghost" type="button" data-legal-command="bold">B</button>
                <button class="btn ghost" type="button" data-legal-command="italic">I</button>
                <button class="btn ghost" type="button" data-legal-block="h2">H2</button>
                <button class="btn ghost" type="button" data-legal-block="blockquote">引用</button>
                <button class="btn ghost" type="button" data-legal-command="insertUnorderedList">列表</button>
                <button class="btn ghost" type="button" data-legal-link="true">链接</button>
                <button class="btn ghost" type="button" data-legal-command="removeFormat">清除</button>
              </div>
            </div>
            <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;">
              <div>
                <div class="metric-note" style="margin-bottom:8px;">富文本编辑器</div>
                <div id="legal-document-editor" class="agreement-rich-text" contenteditable="true" style="min-height:320px;border:1px solid var(--line);border-radius:8px;padding:14px;background:#fff;color:var(--text);overflow:auto;">${sanitizeRichTextHtml(documentValue.contentHtml)}</div>
                <textarea id="legal-document-html" name="contentHtml" hidden>${escapeHtml(documentValue.contentHtml)}</textarea>
              </div>
              <div>
                <div class="metric-note" style="margin-bottom:8px;">预览</div>
                <div id="legal-document-preview" class="agreement-rich-text" style="min-height:320px;border:1px solid var(--line);border-radius:8px;padding:14px;background:#fff;color:var(--text);overflow:auto;">${sanitizeRichTextHtml(documentValue.contentHtml)}</div>
              </div>
            </div>
            <div class="error-text" id="legal-document-error"></div>
            <div class="toolbar" style="margin-top:12px;">
              <button class="btn ghost" type="button" onclick="closeDrawer()">取消</button>
              <button class="btn primary" type="submit">保存协议</button>
            </div>
          </form>
        </aside>`;

        const form = document.getElementById("legal-document-form");
        const editor = document.getElementById("legal-document-editor");
        const preview = document.getElementById("legal-document-preview");
        const htmlInput = document.getElementById("legal-document-html");
        const error = document.getElementById("legal-document-error");

        const syncEditor = () => {
          const safeHtml = sanitizeRichTextHtml(editor.innerHTML);
          htmlInput.value = safeHtml;
          preview.innerHTML = safeHtml;
        };

        drawer.querySelectorAll("[data-legal-command]").forEach((button) => {
          button.addEventListener("click", () => {
            editor.focus();
            document.execCommand(button.dataset.legalCommand, false);
            syncEditor();
          });
        });
        drawer.querySelectorAll("[data-legal-block]").forEach((button) => {
          button.addEventListener("click", () => {
            editor.focus();
            document.execCommand("formatBlock", false, button.dataset.legalBlock);
            syncEditor();
          });
        });
        drawer.querySelectorAll("[data-legal-link]").forEach((button) => {
          button.addEventListener("click", () => {
            editor.focus();
            const url = window.prompt("请输入链接地址", "https://");
            if (!url) return;
            document.execCommand("createLink", false, url);
            syncEditor();
          });
        });
        editor.addEventListener("input", syncEditor);
        syncEditor();

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const formData = new FormData(event.currentTarget);
          syncEditor();
          await runAdminMutation(event.currentTarget, error, async () => {
            await api(`/api/admin/settings/${encodeURIComponent(configKey)}`, {
              method: "PATCH",
              headers: { "idempotency-key": `admin-ui-legal-document-${configKey}-${Date.now()}` },
              body: JSON.stringify({
                value: {
                  title: String(formData.get("title") || "").trim(),
                  contentHtml: htmlInput.value,
                  versionLabel: String(formData.get("versionLabel") || "").trim(),
                },
                valueType: "json",
                scope: String(runtimeConfig?.scope || "creator"),
                description: String(runtimeConfig?.description || config?.description || ""),
                reason: String(formData.get("reason") || ""),
              }),
            });
            await loadSettings();
            closeDrawer();
            renderShell();
          }, "协议内容已保存");
        });
      }

      function accountPage() {
        const sessions = state.adminSessions.length
          ? state.adminSessions.map((session) => `

                  <h3 style="margin:0;">登录会话</h3>

                </div>
                <button class="btn ghost" onclick="loadAdminSessions().then(renderShell)">刷新</button>
              </div>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>会话</th><th>IP</th><th>User-Agent</th><th>状态</th><th>过期时间</th></tr></thead>
                  <tbody>${sessions}</tbody>
                </table>
              </div>
            </section>
          </div>`;
      }

      async function revokeOtherAdminSessions() {
        try {
          const result = await api("/api/admin/auth/sessions/revoke-other", {
            method: "POST",
            headers: { "idempotency-key": `admin-ui-revoke-sessions-${Date.now()}` },
            body: "{}",
          });
          await loadAdminSessions();
          renderShell();
          openDrawer("其他会话已退出", `已失效 ${Number(result.data?.revokedCount || 0)} 个其他登录会话。`);
        } catch (err) {
          openDrawer("退出其他会话失败", err.payload?.error?.message || "请稍后重试");

      function renderUserModelRequestPanel(logs, options = {}) {
        const title = options.title || "模型请求记录";
        const rows = (logs || []).map((item) => {
          const usage = renderModelUsage(item.responseUsage);
          const requestBody = escapeHtml(JSON.stringify(item.requestBody || {}, null, 2));
          const requestText = escapeHtml(item.requestText || "");
          const responseText = escapeHtml(item.responseText || "");
          const finishReasons = (item.responseFinishReasons || []).length
            ? (item.responseFinishReasons || []).map((reason) => `<span class="tag blue">${escapeHtml(reason)}</span>`).join("")
            : `<span class="metric-note">无</span>`;
          return `
            <div class="card" style="padding:14px;margin-top:12px;">
              <div class="toolbar" style="align-items:flex-start;gap:12px;">
                <div>
                  <strong>${escapeHtml(item.modelId || "-")}</strong>
                  <div class="metric-note">${escapeHtml(item.providerName || "-")} / ${escapeHtml(item.providerModel || "-")}</div>
                </div>
                <div style="margin-left:auto;text-align:right;">
                  <span class="tag ${item.status === "succeeded" ? "green" : item.status === "failed" ? "warn" : "blue"}">${escapeHtml(item.status || "-")}</span>
                  <div class="metric-note">${escapeHtml(formatAdminDateTime(item.createdAt))}</div>
                </div>
              </div>
              <div class="check-list" style="margin-top:12px;">
                <div><span>请求摘要</span><span>${escapeHtml(item.payloadSummary || "-")}</span></div>
                <div><span>Provider Request ID</span><span>${escapeHtml(item.providerRequestId || "-")}</span></div>
                <div><span>组织 ID</span><span>${escapeHtml(item.organizationId || "-")}</span></div>
                <div><span>工作区 ID</span><span>${escapeHtml(item.workspaceId || "-")}</span></div>
                <div><span>项目 ID</span><span>${escapeHtml(item.projectId || "-")}</span></div>
                <div><span>请求标识</span><span>${escapeHtml(item.requestKey || "-")}</span></div>
                <div><span>请求哈希</span><span>${escapeHtml(item.requestHash || "-")}</span></div>
                <div><span>载荷哈希</span><span>${escapeHtml(item.payloadHash || "-")}</span></div>
                <div><span>操作</span><span>${escapeHtml(item.providerOperation || "-")}</span></div>
                <div><span>失败原因</span><span>${escapeHtml(item.failureCode || "-")}</span></div>
                <div><span>开始时间</span><span>${escapeHtml(formatAdminDateTime(item.startedAt))}</span></div>
                <div><span>完成时间</span><span>${escapeHtml(formatAdminDateTime(item.completedAt))}</span></div>
                <div><span>Finish Reasons</span><span>${finishReasons}</span></div>
              </div>
              <div style="margin-top:12px;">
                <div class="metric-note">请求参数</div>
                <pre style="white-space:pre-wrap;word-break:break-word;background:#f6f8fc;padding:10px;border-radius:12px;max-height:220px;overflow:auto;">${requestBody}</pre>
              </div>
              <div style="margin-top:12px;">
                <div class="metric-note">发送给模型的文本</div>
                <pre style="white-space:pre-wrap;word-break:break-word;background:#f6f8fc;padding:10px;border-radius:12px;max-height:220px;overflow:auto;">${requestText || "无"}</pre>
              </div>
              <div style="margin-top:12px;">
                <div class="metric-note">模型返回文本</div>
                <pre style="white-space:pre-wrap;word-break:break-word;background:#f6f8fc;padding:10px;border-radius:12px;max-height:260px;overflow:auto;">${responseText || "无"}</pre>
              </div>
              <div style="margin-top:12px;">
                <div class="metric-note">Token / Usage</div>
                <pre style="white-space:pre-wrap;word-break:break-word;background:#f6f8fc;padding:10px;border-radius:12px;overflow:auto;">${escapeHtml(usage)}</pre>
              </div>
            </div>
          `;
        }).join("");

        return `
          <h4>${escapeHtml(title)}</h4>
          ${rows || '<div class="metric-note" style="margin-top:10px;">暂无该用户的模型请求记录</div>'}
        `;
      }

      function renderModelUsage(value) {
        if (!value || typeof value !== "object") return "无";
        try {
          return JSON.stringify(value, null, 2);
        } catch {
          return "无";
        }
      }

      function formatAdminDateTime(value) {
        if (!value) return "-";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "-";
        return date.toLocaleString("zh-CN");
      }

      function renderTeamLimitDrawer(userId, summary) {
        const user = state.users.find((item) => item.userId === userId);
        const organizationId = user?.organizationId;
        const effectiveSeatLimit = Number(summary.effectiveSeatLimit ?? 0);
        const usedSeats = Number(summary.usedSeats ?? 0);
        const remainingSeats = Number(summary.remainingSeats ?? 0);
        const isOverride = summary.limitSource === "override";
        const overLimit = usedSeats > effectiveSeatLimit;
        const drawer = document.getElementById("drawer");
        drawer.classList.remove("hidden");
        drawer.innerHTML = `<aside class="drawer-panel">
          ${userDrawerHead("团队额度", userId)}
          <p style="color:var(--muted);line-height:1.7">为特殊团队单独配置可创建子账号数量。恢复默认后，该团队会重新跟随系统默认值。</p>
          <div class="check-list">
            <div><span>团队</span><span>${escapeHtml(summary.organizationName || user?.organizationName || "-")}</span></div>
            <div><span>额度来源</span><span class="tag ${isOverride ? "blue" : "green"}">${isOverride ? "特殊配置" : "系统默认"}</span></div>
            <div><span>系统默认上限</span><span>${Number(summary.defaultSeatLimit ?? 50).toLocaleString()}</span></div>
            <div><span>当前有效上限</span><span>${effectiveSeatLimit.toLocaleString()}</span></div>
            <div><span>当前已用子账号数</span><span>${usedSeats.toLocaleString()}</span></div>
            <div><span>剩余可创建</span><span>${remainingSeats.toLocaleString()}</span></div>
          </div>
          ${overLimit ? `<p class="error-text" style="margin:12px 0 0;">当前已用数量超过配置上限。系统不会删除已有账号，但前端会阻止继续创建，直到已用数量低于上限。</p>` : ""}
          <form id="team-limit-form" style="margin-top:16px;">
            <label class="field"><span>可创建子账号上限</span><input id="team-limit-seat-input" name="seatLimit" type="number" min="0" step="1" value="${effectiveSeatLimit}" required /></label>
            <small style="color:var(--muted);line-height:1.6;display:block;margin-top:-6px;">特殊团队可配置为任意非负整数；普通团队仍使用系统默认上限。</small>
            <div class="metric-note" id="team-limit-preview" style="margin-top:10px;"></div>
            <div class="error-text" id="team-limit-error"></div>
            <button class="btn primary full" type="submit">保存团队额度</button>
            <button class="btn ghost full" type="button" style="margin-top:10px;" onclick="restoreTeamLimitDefault('${userId}')">恢复系统默认</button>
          </form>
        </aside>`;
        const formElement = document.getElementById("team-limit-form");
        const input = document.getElementById("team-limit-seat-input");
        const preview = document.getElementById("team-limit-preview");
        const updatePreview = () => {
          const nextLimit = Number(input.value);
          if (!Number.isInteger(nextLimit) || nextLimit < 0) {
            preview.textContent = "请输入大于等于 0 的整数。";
            return;
          }
          const nextRemaining = Math.max(0, nextLimit - usedSeats);
          preview.textContent = nextLimit < usedSeats
            ? `保存后不会删除已有账号，但会禁止继续创建；当前已用 ${usedSeats.toLocaleString()}，新上限 ${nextLimit.toLocaleString()}。`
            : `保存后剩余可创建 ${nextRemaining.toLocaleString()} 个子账号。`;
        };
        input.addEventListener("input", updatePreview);
        updatePreview();
        formElement.addEventListener("submit", async (event) => {
          event.preventDefault();
          if (!guardUserAction(user, "teamLimit")) return;
          const form = new FormData(event.currentTarget);
          const error = document.getElementById("team-limit-error");
          const seatLimit = Number(form.get("seatLimit"));
          if (!Number.isInteger(seatLimit) || seatLimit < 0) {
            error.textContent = "子账号上限必须是大于等于 0 的整数";
            return;
          }
          await runAdminMutation(event.currentTarget, error, async () => {
            await api(`/api/admin/organizations/${encodeURIComponent(organizationId)}/team-plan-limit`, {
              method: "PATCH",
              headers: { "idempotency-key": `admin-ui-team-limit-${organizationId}-${Date.now()}` },
              body: JSON.stringify({
                seatLimit,
                reason: String(form.get("reason") || "").trim(),
              }),
            });
            await loadUsers();
            await openTeamLimitDrawer(userId);
          }, "团队额度已更新").catch(() => undefined);
        });
      }

      function openCreditSetBalanceDrawer(userId) {
        const user = state.users.find((item) => item.userId === userId);
        if (!guardUserAction(user, "credit")) return;
        const currentCredits = Number(user?.availableCredits || 0);
        const drawer = document.getElementById("drawer");
        drawer.classList.remove("hidden");
        drawer.innerHTML = `<aside class="drawer-panel">
          ${userDrawerHead("调整到目标积分", userId)}
          <p style="color:var(--muted);line-height:1.7">为 ${user?.displayName || userId} 手动修改可用积分。系统会自动计算差额，并通过添加或扣减接口写入 credit_ledger_entries，不直接改余额缓存。</p>
          <form id="credit-set-balance-form">
            <div class="check-list" style="margin-bottom:14px;">
              <div><span>当前可用积分</span><span id="credit-current-balance">${currentCredits.toLocaleString()}</span></div>
              <div><span>调整差额</span><span id="credit-balance-delta">-</span></div>
            </div>
            <label class="field"><span>目标可用积分</span><input name="targetBalance" type="number" min="0" step="1" required /></label>
            <label class="field"><span>调整场景</span><select name="adjustmentScenario">${adjustmentScenarioOptions("correction")}</select></label>
            <label class="field"><span>关联工单号（选填）</span><input name="workOrderNo" placeholder="例如：CS-20260605-001" /></label>
            <div class="error-text" id="credit-set-balance-error"></div>
            <button class="btn primary full" type="submit">确认调整积分</button>
          </form>
        </aside>`;
        const formElement = document.getElementById("credit-set-balance-form");
        const targetInput = formElement.elements.targetBalance;
        const deltaNode = document.getElementById("credit-balance-delta");
        const updateDelta = () => {
          const target = Number(targetInput.value);
          if (!Number.isFinite(target) || targetInput.value === "") {
            deltaNode.textContent = "-";
            return;
          }
          const delta = Math.trunc(target) - currentCredits;
          deltaNode.textContent = `${delta > 0 ? "+" : ""}${delta.toLocaleString()}`;
        };
        targetInput.addEventListener("input", updateDelta);
        formElement.addEventListener("submit", async (event) => {
          event.preventDefault();
          const form = new FormData(event.currentTarget);
          const error = document.getElementById("credit-set-balance-error");
          const workOrderNo = optionalWorkOrder(form, error);
          if (workOrderNo === null) return;
          const targetBalance = Number(form.get("targetBalance"));
          if (!Number.isInteger(targetBalance) || targetBalance < 0) {
            error.textContent = "目标可用积分必须是大于等于 0 的整数";
            return;
          }
          const delta = targetBalance - currentCredits;
          if (delta === 0) {
            error.textContent = "目标积分与当前积分一致，无需调整";
            return;
          }
          const direction = delta > 0 ? "grant" : "deduct";
          const payload = {
            amount: Math.abs(delta),
            reason: String(form.get("reason") || "").trim(),
            adjustmentScenario: String(form.get("adjustmentScenario") || "manual_adjustment"),
          };
          if (workOrderNo) payload.workOrderNo = workOrderNo;
          await runAdminMutation(event.currentTarget, error, async () => {
            await api(`/api/admin/users/${userId}/credits/${direction}`, {
              method: "POST",
              headers: { "idempotency-key": `admin-ui-credit-set-balance-${userId}-${Date.now()}` },
              body: JSON.stringify(payload),
            });
            await loadUsers();
            closeDrawer();
            renderShell();
          }, "积分已调整到目标值").catch(() => undefined);
        });
      }

      function syncModelEditorPricingJson() {
        const form = document.getElementById("model-editor-form");
        if (!form) return;
        const pricing = parseJsonTextarea(new FormData(form), "pricing");
        const baseCredits = Number(form.elements.pricingBaseCredits.value);
        if (!Number.isFinite(baseCredits) || baseCredits <= 0) {
          throw new Error("基础积分必须大于 0");
        }
        pricing.baseCredits = baseCredits;
        pricing.unit = String(form.elements.pricingUnit.value || "").trim() || String(form.elements.mediaType.value || "image");
        form.elements.pricing.value = JSON.stringify(pricing, null, 2);
      }

      function modelSecretReferenceOptions(selectedEnvName = "", selectedProviderName = "") {
        const secrets = [...(state.settings.secretReferences || [])].sort((left, right) => {
          const leftLabel = String(left.secretRef || left.envName || "");
          const rightLabel = String(right.secretRef || right.envName || "");
          return leftLabel.localeCompare(rightLabel, "zh-CN");
        });
        const options = [`<option value="">选择 API 密钥</option>`];
        for (const secret of secrets) {
          const envName = String(secret.envName || "");
          const providerName = String(secret.providerName || "").trim();
          const label = secret.secretRef || envName;
          const selected = envName === selectedEnvName;
          options.push(`<option value="${escapeAttribute(envName)}" data-provider-name="${escapeAttribute(providerName)}" ${selected ? "selected" : ""}>${escapeHtml(label)}</option>`);
        }
        return options.join("");
      }

      function parseConfigValue(rawValue, valueType) {
        if (valueType === "string") return rawValue;
        if (valueType === "number") {
          const value = Number(rawValue);
          if (!Number.isFinite(value)) throw new Error("请输入有效数字");
          return value;
        }
        if (valueType === "boolean") {
          if (rawValue === "true" || rawValue === "开启" || rawValue === "1") return true;
          if (rawValue === "false" || rawValue === "关闭" || rawValue === "0") return false;
          throw new Error("布尔值请输入 true 或 false");
        }
        if (valueType === "string_array") {
          const parsed = rawValue.trim().startsWith("[")
            ? JSON.parse(rawValue)
            : rawValue.split(",").map((item) => item.trim()).filter(Boolean);
          if (!Array.isArray(parsed) || parsed.some((item) => typeof item !== "string")) {
            throw new Error("字符串数组请输入 JSON 数组或逗号分隔文本");
          }
          return parsed;
        }
        return JSON.parse(rawValue);
      }

      function dangerConfirmField(expectedText) {
        return `<label class="field"><span>二次确认</span><input name="dangerConfirm" autocomplete="off" placeholder="请输入：${expectedText}" required /><small style="color:var(--muted);line-height:1.6">危险操作必须逐字输入“${expectedText}”后才能提交。</small></label>`;
      }

      function requireDangerConfirm(form, errorElement, expectedText) {
        const actual = String(form.get("dangerConfirm") || "").trim();
        if (actual !== expectedText) {
          errorElement.textContent = `请先输入二次确认文本：${expectedText}`;
          return false;
        }
        return true;
      }

      function optionalWorkOrder(form, errorElement) {
        const workOrderNo = String(form.get("workOrderNo") || "").trim();
        if (!workOrderNo) return "";
        if (!/^[A-Za-z]{2,8}-\d{8}-\d{3,8}$/.test(workOrderNo)) {
          errorElement.textContent = "工单号格式不正确，例如 CS-20260605-001";
          return null;
        }
        return workOrderNo.toUpperCase();
      }

          ["archived", "归档"],

      function userFilterAccountTypeOptions(selected = "all") {
        return [
          ["all", "全部账户"],
          ["normal_user", "普通用户"],
          ["team_user", "团队用户"],
        ].map(([value, label]) => `<option value="${value}" ${value === selected ? "selected" : ""}>${label}</option>`).join("");

      function adjustmentScenarioLabel(value) {
        return {
          manual_adjustment: "手动调整",
          compensation: "补偿积分",
          recharge_bonus: "充值赠送",
          default_grant: "默认赠送",
          correction: "财务修正",
          promotion: "活动赠送",
        }[value] || "手动调整";
      }

      function creditLedgerTypeLabel(value) {
        return {
          grant: "充值/发放",
          reservation: "预冻结",
          consume: "消费扣减",
          release: "冻结释放",
        }[value] || "积分变动";
      }

      function creditLedgerDisplayChange(entry = {}) {
        const availableDelta = Number(entry.availableDelta ?? 0);
        const reservedDelta = Number(entry.reservedDelta ?? 0);
        const consumedDelta = Number(entry.consumedDelta ?? 0);
        if (availableDelta) return availableDelta;
        if (reservedDelta < 0 && consumedDelta > 0) return -consumedDelta;
        if (reservedDelta < 0) return Math.abs(reservedDelta);
        if (reservedDelta > 0) return -reservedDelta;
        return Number(entry.amount ?? 0);
      }

      function formatSignedCredit(value) {
        const amount = Number(value || 0);
        const sign = amount > 0 ? "+" : amount < 0 ? "-" : "";
        return `${sign}${Math.abs(amount).toLocaleString()}`;
      }

      function creditLedgerSourceLabel(entry = {}) {
        const metadata = entry.metadata || {};
        const sourceType = String(entry.sourceType || "");
        const sourceText = [
          sourceType,
          metadata.mediaType,
          metadata.taskType,
          metadata.modelCode,
          metadata.providerOperation,
          metadata.operation,
          entry.reason,
        ].filter(Boolean).join(" ").toLowerCase();
        if (sourceType === "payment_order") return "充值订单";
        if (sourceType === "admin_manual_grant") return "后台发放";
        if (sourceType === "admin_manual_deduct") return "后台扣减";
        if (sourceText.includes("script") || sourceText.includes("story")) return "剧本生成";
        if (sourceText.includes("video")) return "视频生成";
        if (sourceText.includes("image")) return "图片生成";
        if (sourceText.includes("audio") || sourceText.includes("voice")) return "音频生成";
        if (sourceText.includes("episode")) return "剧集生成";
        if (entry.entryType === "reservation") return "任务预冻结";
        if (entry.entryType === "release") return "任务释放";
        if (entry.entryType === "consume") return "任务扣减";
        return sourceType || "-";
      }

      function creditLedgerReasonLabel(entry = {}) {
        const reason = String(entry.reason || "");
        const metadata = entry.metadata || {};
        const scenario = metadata.adjustmentScenario ? adjustmentScenarioLabel(metadata.adjustmentScenario) : "";
        if (scenario && entry.sourceType?.startsWith("admin_manual")) return scenario;
        const text = [reason, metadata.mediaType, metadata.modelCode].filter(Boolean).join(" ").toLowerCase();
        if (text.includes("image generation") || text.includes("image")) return "图片生成";
        if (text.includes("video generation") || text.includes("video")) return "视频生成";
        if (text.includes("script generation") || text.includes("script")) return "剧本生成";
        if (text.includes("manual support grant")) return "人工充值补发";
        if (text.includes("paid order")) return "充值到账";
        if (reason) return reason;
        return creditLedgerSourceLabel(entry);
      }

      function creditLedgerContentLabel(entry = {}) {
        const explicit = String(entry.content || "").trim();
        if (explicit) return explicit;
        const metadata = entry.metadata || {};
        const sourceType = String(entry.sourceType || "").toLowerCase();
        const text = [
          sourceType,
          entry.reason,
          metadata.mediaType,
          metadata.kind,
          metadata.taskType,
          metadata.operation,
          metadata.modelCode,
        ].filter(Boolean).join(" ").toLowerCase();
        if (sourceType === "payment_order") return "充值套餐增加积分";
        if (sourceType === "membership_gift") return "会员赠送积分";
        if (sourceType.includes("admin")) {
          return entry.entryType === "consume" ? "手动扣减积分" : "手动增加积分";
        }
        if (text.includes("storyboard")) return entry.entryType === "release" ? "AI分镜生成返还积分" : "生AI分镜扣减";
        if (text.includes("script")) return entry.entryType === "release" ? "生成剧本返还积分" : "生成剧本扣减";
        if (text.includes("video")) return entry.entryType === "release" ? "生视频返还积分" : "生视频扣减";
        if (text.includes("image")) return entry.entryType === "release" ? "生图返还积分" : "生图扣减";
        return creditLedgerReasonLabel(entry);
      }

        const memberAvailable = summary.memberAvailableCredits === null || summary.memberAvailableCredits === undefined

      function modelPayloadFromForm(form) {
        const mediaType = String(form.get("mediaType") || "image");
        const selectedVideoCategory = String(form.get("videoCategory") || "");
        const videoCategory = mediaType === "video" ? videoCategoryByValue(selectedVideoCategory) : null;
        const taskModes = String(form.get("taskModes") || "")
          .split(",")
          .map((item) => item.trim())
          .filter(Boolean);
        const uiConfig = parseJsonTextarea(form, "uiConfig");
        if (videoCategory) {
          uiConfig.videoCategory = videoCategory.value;
          uiConfig.videoCategoryLabel = videoCategory.label;
        }
        const providerConfig = parseJsonTextarea(form, "providerConfig");
        const requestPath = String(form.get("requestPath") || "").trim();
        if (requestPath) {
          providerConfig.requestPath = requestPath;
        } else {
          delete providerConfig.requestPath;
        }
        const apiKeyEnv = String(form.get("modelApiKeyEnv") || "").trim();
        if (apiKeyEnv) {
          providerConfig.apiKeyEnv = apiKeyEnv;
        } else {
          delete providerConfig.apiKeyEnv;
        }
        delete providerConfig.apiKey;
        return {
          modelCode: String(form.get("modelCode") || "").trim(),
          displayName: String(form.get("displayName") || "").trim(),
          providerName: String(form.get("providerName") || "").trim(),
          providerModel: String(form.get("providerModel") || "").trim(),
          providerProtocol: String(form.get("providerProtocol") || "custom_http"),
          invocationMode: String(form.get("invocationMode") || "sync"),
          mediaType,
          taskModes,
          status: String(form.get("status") || "disabled"),
          sortOrder: Number(form.get("sortOrder") || 100),
          parameterSchema: parameterSchemaFromForm(form),
          defaultParams: parseJsonTextarea(form, "defaultParams"),
          pricing: parseJsonTextarea(form, "pricing"),
          providerConfig,
          limits: parseJsonTextarea(form, "limits"),
          uiConfig,
          dispatchPolicy: {
            submitQueueName: String(form.get("submitQueueName") || "").trim(),
            pollQueueName: String(form.get("pollQueueName") || "").trim() || null,
            providerRpmLimit: Number(form.get("providerRpmLimit") || 60),
            providerConcurrentLimit: Number(form.get("providerConcurrentLimit") || 5),
            submitConcurrencyLimit: Number(form.get("submitConcurrencyLimit") || 5),
            pollingIntervalMs: Number(form.get("pollingIntervalMs") || 15000),
            pollingConcurrencyLimit: 20,
          },
          remark: String(form.get("remark") || ""),
          reason: String(form.get("reason") || ""),
        };
      }

      function parseJsonTextarea(form, name) {
        const raw = String(form.get(name) || "").trim();
        if (!raw) return {};
        const value = JSON.parse(raw);
        if (!value || typeof value !== "object" || Array.isArray(value)) {
          throw new Error(`${name} 必须是 JSON 对象`);
        }
        return value;
      }

      function parameterSchemaFromForm(form) {
        const schema = parseJsonTextarea(form, "parameterSchema");
        return addManualParameterToSchema(schema, {
          key: String(form.get("manualParameterKey") || ""),
          label: String(form.get("manualParameterLabel") || ""),
          type: String(form.get("manualParameterType") || "string"),
          options: String(form.get("manualParameterOptions") || ""),
          required: Boolean(form.get("manualParameterRequired")),
        });
      }

      function modelParameterDisplayName(key, parameter) {
        const knownNames = {
          prompt: "正向提示词",
          negativePrompt: "反向提示词",
          referenceImages: "参考图",
          editInstruction: "编辑指令",
          aspectRatio: "画面比例",
          quality: "质量档位",
          count: "生成数量",
        };
        return knownNames[key] || parameter.label || key;
      }

      function parameterTypeLabel(type) {
        const labels = {
          string: "文本",
          number: "数字",
          integer: "整数",
          boolean: "开关",
          enum: "选项",
          array: "列表",
          file: "文件",
          "file[]": "文件列表",
          json: "JSON",
        };
        return labels[type] || type || "JSON";
      }

      function parameterSchemaRows(schema) {
        const entries = Object.entries(schema || {});
        if (entries.length === 0) {
          return `<tr><td colspan="4">暂无现有参数</td></tr>`;
        }
        return entries.map(([key, value]) => {
          const parameter = value && typeof value === "object" ? value : {};
          const options = Array.isArray(parameter.options) ? parameter.options.join(", ") : "-";
          return `<tr><td>${escapeHtml(modelParameterDisplayName(key, parameter))}<div class="metric-note">${escapeHtml(key)}</div></td><td><span class="tag blue">${escapeHtml(parameterTypeLabel(parameter.type || "json"))}</span></td><td>${escapeHtml(options)}</td><td class="actions"><div class="actions-row"><button class="icon-btn" title="编辑参数" type="button" onclick="fillManualParameterEditor('${escapeAttribute(key)}')">编</button><button class="icon-btn" title="删除参数" type="button" onclick="removeManualParameterFromSchema('${escapeAttribute(key)}')">删</button></div></td></tr>`;
        }).join("");
      }

      function refreshParameterSchemaList(schema) {
        const list = document.querySelector("#parameter-schema-list tbody");
        if (list) list.innerHTML = parameterSchemaRows(schema);
      }

      function currentModelEditorSchema() {
        const form = document.getElementById("model-editor-form");
        return form ? parseJsonTextarea(new FormData(form), "parameterSchema") : {};
      }

      function fillManualParameterEditor(parameterKey) {
        const form = document.getElementById("model-editor-form");
        if (!form) return;
        const schema = currentModelEditorSchema();
        const parameter = schema[parameterKey] || {};
        form.elements.manualParameterKey.value = parameterKey;
        form.elements.manualParameterLabel.value = modelParameterDisplayName(parameterKey, parameter);
        form.elements.manualParameterType.value = parameter.type || "string";
        form.elements.manualParameterOptions.value = Array.isArray(parameter.options) ? parameter.options.join(", ") : "";
        form.elements.manualParameterRequired.checked = Boolean(parameter.required);
      }

      function removeManualParameterFromSchema(parameterKey) {
        const form = document.getElementById("model-editor-form");
        if (!form) return;
        const schema = currentModelEditorSchema();
        delete schema[parameterKey];
        form.elements.parameterSchema.value = JSON.stringify(schema, null, 2);
        refreshParameterSchemaList(schema);
      }

      function addManualParameterToSchema(schema, input) {
        const key = String(input.key || "").trim();
        if (!key) return schema;
        if (!/^[A-Za-z][A-Za-z0-9_]*$/.test(key)) {
          throw new Error("参数键只能使用英文、数字和下划线，并且必须以字母开头");
        }
        const type = String(input.type || "string").trim();
        const parameter = {
          label: String(input.label || key).trim(),
          type,
          required: Boolean(input.required),
          visible: true,
        };
        const options = String(input.options || "")
          .split(",")
          .map((item) => item.trim())
          .filter(Boolean);
        if (options.length > 0) {
          parameter.options = options;
          parameter.adminEditableOptions = true;
        }
        return {
          ...schema,
          [key]: parameter,
        };
      }

      function valueForTextarea(value, valueType) {
        if (value === undefined || value === null) return "";
        if (valueType === "string") return String(value);
        return JSON.stringify(value, null, 2);
      }

      function openScriptPromptPackageDrawer(packageId = "") {
        const existing = scriptPromptPackageById(packageId);
        const drawer = document.getElementById("drawer");
        drawer.classList.remove("hidden");
        drawer.innerHTML = `<aside class="drawer-panel" style="width:min(820px,100%);">
          <div class="drawer-head"><h3>${existing ? "编辑剧本提示词" : "新增剧本提示词"}</h3><button class="icon-btn" onclick="closeDrawer()">×</button></div>
          <form id="script-prompt-package-form">
            <div class="form-grid">
              <label class="field"><span>名称</span><input name="name" value="${escapeAttribute(existing?.name || "")}" required /></label>
              <label class="field"><span>编码</span><input name="code" value="${escapeAttribute(existing?.code || "")}" pattern="[a-z0-9_]+" required /></label>
              <label class="field"><span>类型</span><select name="package_type">${optionList(["genre", "emotion", "taboo"], existing?.package_type || existing?.packageType || "genre")}</select></label>
              <label class="field"><span>受众</span><select name="audience">${optionList(["", "male", "female", "general"], existing?.audience || "")}</select></label>
              <label class="field"><span>状态</span><select name="status">${optionList(["enabled", "disabled"], existing?.status || "enabled")}</select></label>
              <label class="field"><span>排序权重</span><input name="sort_order" type="number" value="${Number(existing?.sort_order || existing?.sortOrder || 100)}" /></label>
            </div>
            <label class="field"><span>封面</span><div class="prompt-cover-upload">${promptCoverMarkup(existing || {}, "剧")}<div><input name="cover_image_url" value="${escapeAttribute(existing?.cover_image_url || existing?.coverImageUrl || "")}" placeholder="https://... 或 data:image/..." /><input type="file" accept="image/*" onchange="readPromptCoverFile(this,'script-prompt-package-form')" /></div></div></label>
            <label class="field"><span>标签</span><input name="tags" value="${escapeAttribute((existing?.tags || []).join(", "))}" placeholder="爽点, 分镜, 情绪" /></label>
            <label class="field"><span>关键点</span><input name="key_points" value="${escapeAttribute((existing?.key_points || existing?.keyPoints || []).join(", "))}" placeholder="冲突升级, 反转, 高光" /></label>
            <label class="field"><span>适用场景</span><input name="applicable_scene" value="${escapeAttribute((existing?.applicable_scene || existing?.applicableScene || []).join(", "))}" placeholder="短剧, 漫剧, AI视频" /></label>
            <label class="field"><span>剧本提示词正文</span><textarea name="prompt_content" rows="9" required>${escapeHtml(existing?.prompt_content || existing?.promptContent || "")}</textarea></label>
            <label class="field"><span>负向提示词</span><textarea name="negative_prompt" rows="3">${escapeHtml(existing?.negative_prompt || existing?.negativePrompt || "")}</textarea></label>
            <label class="field"><span>内部备注</span><textarea name="remark" rows="3">${escapeHtml(existing?.remark || "")}</textarea></label>

              <button class="btn ghost" type="button" onclick="closeDrawer()">取消</button>
              <button class="btn primary" type="submit">保存剧本提示词</button>
            </div>
          </form>
        </aside>`;
        document.getElementById("script-prompt-package-form").addEventListener("submit", async (event) => {
          event.preventDefault();
          const form = new FormData(event.currentTarget);
          const error = document.getElementById("script-prompt-package-error");
          await runAdminMutation(event.currentTarget, error, async () => {
            const splitList = (name) => String(form.get(name) || "").split(",").map((item) => item.trim()).filter(Boolean);
            const payload = {
              name: String(form.get("name") || "").trim(),
              code: String(form.get("code") || "").trim(),
              package_type: String(form.get("package_type") || "genre"),
              audience: String(form.get("audience") || ""),
              tags: splitList("tags"),
              cover_image_url: String(form.get("cover_image_url") || "").trim(),
              key_points: splitList("key_points"),
              applicable_scene: splitList("applicable_scene"),
              prompt_content: String(form.get("prompt_content") || "").trim(),
              negative_prompt: String(form.get("negative_prompt") || "").trim(),

              sort_order: Number(form.get("sort_order") || 0),
              remark: String(form.get("remark") || ""),

              payload.is_default = Boolean(existing.is_default || existing.isDefault);

      async function setScriptPromptPackageDefault(packageId) {
        const existing = scriptPromptPackageById(packageId);
        if (!existing) return;
        const isTaboo = (existing.package_type || existing.packageType) === "taboo";
        const payload = {
          ...existing,
          is_default: true,
          isDefault: true,
          is_global_default: isTaboo,
          isGlobalDefault: isTaboo,
        };
        try {
          await api(`/api/admin/storyboard-prompt/packages/${encodeURIComponent(packageId)}`, {
            method: "PUT",
            headers: { "idempotency-key": `admin-ui-script-prompt-default-${packageId}-${Date.now()}` },
            body: JSON.stringify(payload),
          });
          await loadScriptPrompts();
        } catch {
          const type = existing.package_type || existing.packageType;
          state.scriptPromptPackages = setDefaultInList(state.scriptPromptPackages, packageId, (item) => (item.package_type || item.packageType) === type);
        }
        renderShell();
        showToast("默认提示词已更新");

      function setDefaultInList(items, id, sameGroup) {
        return (items || []).map((item) => sameGroup(item)
          ? {
            ...item,
            is_default: String(item.id) === String(id),
            isDefault: String(item.id) === String(id),
            is_global_default: (item.package_type || item.packageType) === "taboo" ? String(item.id) === String(id) : Boolean(item.is_global_default || item.isGlobalDefault),
            isGlobalDefault: (item.package_type || item.packageType) === "taboo" ? String(item.id) === String(id) : Boolean(item.is_global_default || item.isGlobalDefault),
          }
          : item);
      }
