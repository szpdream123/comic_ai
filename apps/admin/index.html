      function hydrateDrawerPanel() {
        const drawer = document.getElementById("drawer");
        const panel = drawer?.querySelector(".drawer-panel");
        if (!panel || drawer.querySelector(".drawer-resize-handle")) return;
        const handle = document.createElement("div");
        handle.className = "drawer-resize-handle";
        handle.setAttribute("role", "separator");
        handle.setAttribute("aria-orientation", "vertical");
        handle.setAttribute("title", "\u62d6\u52a8\u8fb9\u754c\u8c03\u6574\u7f16\u8f91\u533a\u5bbd\u5ea6");
        drawer.insertBefore(handle, panel);
      }

      function drawerBoundaryHit(event, panel) {
        if (!panel || !event) return false;
        const rect = panel.getBoundingClientRect();
        return Math.abs(event.clientX - rect.left) <= 22;
      }

      function activeDrawerElement() {
        const drawer = document.getElementById("drawer");
        return drawer && !drawer.classList.contains("hidden") ? drawer : null;
      }

      function beginDrawerResize(event, drawer, panel, dragHandle) {
        if (!drawer || !panel) return false;
        event.preventDefault();
        event.stopPropagation();
        dragHandle?.setPointerCapture?.(event.pointerId);
        dragHandle?.classList.add("is-dragging");
        drawer.classList.add("is-boundary-hover");
        document.body.classList.add("is-drawer-resizing");
        const resize = (moveEvent) => {
          const minWidth = Math.min(360, window.innerWidth);
          const maxWidth = Math.max(minWidth, window.innerWidth - 24);
          const width = Math.min(maxWidth, Math.max(minWidth, window.innerWidth - moveEvent.clientX));
          panel.style.width = `${width}px`;
        };
        const stop = () => {
          dragHandle?.releasePointerCapture?.(event.pointerId);
          dragHandle?.classList.remove("is-dragging");
          drawer.classList.remove("is-boundary-hover");
          document.body.classList.remove("is-drawer-resizing");
          drawer.dataset.dragJustEnded = "true";
          window.removeEventListener("pointermove", resize);
          window.removeEventListener("pointerup", stop);
          window.removeEventListener("pointercancel", stop);
          setTimeout(() => {
            if (drawer.dataset.dragJustEnded === "true") delete drawer.dataset.dragJustEnded;
          }, 0);
        };
        window.addEventListener("pointermove", resize);
        window.addEventListener("pointerup", stop);
        window.addEventListener("pointercancel", stop);
        resize(event);
        return true;
      }

      function setupDrawerInteractions() {
        if (setupDrawerInteractions.ready) {
          hydrateDrawerPanel();
          return;
        }
        setupDrawerInteractions.ready = true;
        document.addEventListener("click", (event) => {
          const drawer = activeDrawerElement();
          if (!drawer) return;
          if (drawer.dataset.dragJustEnded === "true") {
            delete drawer.dataset.dragJustEnded;
            return;
          }
          if (event.target === drawer) return;
        });
        document.addEventListener("pointermove", (event) => {
          const drawer = activeDrawerElement();
          if (!drawer) return;
          if (document.body.classList.contains("is-drawer-resizing")) return;
          const panel = drawer.querySelector(".drawer-panel");
          drawer.classList.toggle("is-boundary-hover", drawerBoundaryHit(event, panel));
        });
        document.addEventListener("pointerdown", (event) => {
          const drawer = activeDrawerElement();
          if (!drawer) return;
          const handle = event.target.closest?.(".drawer-resize-handle");
          const panel = drawer.querySelector(".drawer-panel");
          if (!panel) return;
          const boundaryHit = drawerBoundaryHit(event, panel);
          if (!handle && !boundaryHit) return;
          const dragHandle = handle || drawer.querySelector(".drawer-resize-handle");
          beginDrawerResize(event, drawer, panel, dragHandle);
        }, true);
        new MutationObserver(() => hydrateDrawerPanel()).observe(document.body, { childList: true, subtree: true });
        hydrateDrawerPanel();
      }

            <p class="legal-document-note">\u652f\u6301\u7b80\u5355\u5bcc\u6587\u672c\uff1a\u6807\u9898\u3001\u52a0\u7c97\u3001\u5217\u8868\u3001\u94fe\u63a5\u548c\u5f15\u7528\u3002\u53f3\u4fa7\u9884\u89c8\u533a\u4f1a\u540c\u6b65\u53cd\u6620\u767b\u5f55\u9875\u7684\u5b9e\u9645\u5c55\u73b0\u3002</p>

              </div>
              <div class="legal-document-preview-shell">
                <div class="legal-document-preview-head">
                  <h4>\u9884\u89c8</h4>
                  <span class="metric-note">\u6839\u636e\u767b\u5f55\u9875\u5f39\u7a97\u6837\u5f0f\u5b9e\u65f6\u9884\u6f14</span>
                </div>
                <div id="legal-document-preview" class="agreement-rich-text legal-document-surface">${initialContentHtml}</div>
              </div>
            </div>
            <div class="error-text" id="legal-document-error"></div>
            <div class="toolbar legal-document-actions">
              <button class="btn ghost" type="button" onclick="closeDrawer()">\u53d6\u6d88</button>
              <button class="btn primary" type="submit">\u4fdd\u5b58\u534f\u8bae</button>
            </div>
          </form>
        </aside>`;

        const form = document.getElementById("legal-document-form");
        const editor = document.getElementById("legal-document-editor");
        const preview = document.getElementById("legal-document-preview");
        const htmlInput = document.getElementById("legal-document-html");
        const error = document.getElementById("legal-document-error");
        const titleInput = form.elements.namedItem("title");
        const typeInput = form.elements.namedItem("type");
        let savedSelection = null;

        const saveSelection = () => {
          const selection = window.getSelection();
          if (!selection || selection.rangeCount === 0) return;
          const range = selection.getRangeAt(0);
          if (!editor.contains(range.commonAncestorContainer)) return;
          savedSelection = range.cloneRange();
        };

        const restoreSelection = () => {
          if (!savedSelection) return false;
          const selection = window.getSelection();
          if (!selection) return false;
          selection.removeAllRanges();
          selection.addRange(savedSelection);
          return true;
        };

        const focusEditor = () => {
          editor.focus();
          if (!restoreSelection()) {
            const range = document.createRange();
            range.selectNodeContents(editor);
            range.collapse(false);
            const selection = window.getSelection();
            selection?.removeAllRanges();
            selection?.addRange(range);
            saveSelection();
          }
        };

        const activeBlockTag = () => {
          const selection = window.getSelection();
          if (!selection || selection.rangeCount === 0) return "";
          let node = selection.anchorNode;
          if (!node) return "";
          if (node.nodeType === Node.TEXT_NODE) node = node.parentElement;
          while (node && node !== editor) {
            const tagName = node.nodeName?.toLowerCase?.() || "";
            if (["h1", "h2", "h3", "p", "blockquote"].includes(tagName)) return tagName;
            node = node.parentElement;
          }
          return "p";
        };

        const syncEditor = () => {
          const safeHtml = sanitizeRichTextHtml(editor.innerHTML);
          htmlInput.value = safeHtml;
          preview.innerHTML = safeHtml;
        };

        const syncToolbarState = () => {
          drawer.querySelectorAll("[data-legal-active-command]").forEach((button) => {
            const command = button.dataset.legalActiveCommand;
            let active = false;
            try {
              active = !!document.queryCommandState(command);
            } catch {
              active = false;
            }
            button.classList.toggle("is-active", active);
          });
          const blockTag = activeBlockTag();
          drawer.querySelectorAll("[data-legal-active-block]").forEach((button) => {
            button.classList.toggle("is-active", button.dataset.legalActiveBlock === blockTag);
          });
        };

        const runEditorCommand = (command, value = null) => {
          focusEditor();
          document.execCommand(command, false, value);
          saveSelection();
          syncEditor();
          syncToolbarState();
        };

        drawer.querySelectorAll("[data-legal-command]").forEach((button) => {
          button.addEventListener("mousedown", (event) => {
            event.preventDefault();
            saveSelection();
          });
          button.addEventListener("click", (event) => {
            event.preventDefault();
            runEditorCommand(button.dataset.legalCommand);
          });
        });
        drawer.querySelectorAll("[data-legal-block]").forEach((button) => {
          button.addEventListener("mousedown", (event) => {
            event.preventDefault();
            saveSelection();
          });
          button.addEventListener("click", (event) => {
            event.preventDefault();
            runEditorCommand("formatBlock", button.dataset.legalBlock);
          });
        });
        drawer.querySelectorAll("[data-legal-link]").forEach((button) => {
          button.addEventListener("mousedown", (event) => {
            event.preventDefault();
            saveSelection();
          });
          button.addEventListener("click", (event) => {
            event.preventDefault();
            focusEditor();
            const url = window.prompt("\u8bf7\u8f93\u5165\u94fe\u63a5\u5730\u5740", "https://");
            if (!url) return;
            document.execCommand("createLink", false, url);
            saveSelection();
            syncEditor();
            syncToolbarState();
          });
        });
        editor.addEventListener("mouseup", () => {
          saveSelection();
          syncToolbarState();
        });
        editor.addEventListener("keyup", () => {
          saveSelection();
          syncToolbarState();

      async function loadOfficialAssets() {
        const store = officialAssetState();
        setPageLoading("officialAssets", true);
        try {
          const params = new URLSearchParams();
          if (store.category && store.category !== "all") params.set("category", store.category);
          if (store.status && store.status !== "all") params.set("status", store.status);
          if (store.keyword) params.set("q", store.keyword);
          const suffix = params.toString() ? `?${params.toString()}` : "";
          const result = await api(`/api/admin/official-assets${suffix}`);
          store.data = Array.isArray(result.data) ? result.data : [];
          store.meta = result.meta || { total: store.data.length };
          store.loadError = "";
          clearPageForbidden("officialAssets");
        } catch (error) {
          if (!setPageForbidden("officialAssets", error)) {
            store.loadError = error.payload?.error?.message || "官方资产库加载失败";
          }
          store.data = [];
        } finally {
          setPageLoading("officialAssets", false);
        }
      }

      function officialAssetPayloadFromForm(formElement) {
        const form = new FormData(formElement);
        const detailViewItems = parseOfficialAssetJson(form.get("detailViewItems"), "详情图组必须是 JSON 数组");
        const metaRows = parseOfficialAssetJson(form.get("metaRows"), "详情页元信息必须是 JSON 数组");
        return {
          name: String(form.get("name") || "").trim(),
          category: String(form.get("category") || "character"),
          folder: String(form.get("folder") || "").trim(),
          description: String(form.get("description") || "").trim(),
          tags: String(form.get("tags") || "").split(",").map((item) => item.trim()).filter(Boolean),
          previewUrl: String(form.get("previewUrl") || "").trim(),
          storageObjectKey: String(form.get("storageObjectKey") || "").trim(),
          mimeType: String(form.get("mimeType") || "").trim(),
          width: Number(form.get("width") || 1024),
          height: Number(form.get("height") || 1024),
          sortOrder: Number(form.get("sortOrder") || 100),
          display: {
            kicker: String(form.get("displayKicker") || "").trim(),
            title: String(form.get("displayTitle") || "").trim(),
            description: String(form.get("displayDescription") || "").trim(),
            metaRows,
          },
          detailViewItems,
        };
      }

      function parseOfficialAssetJson(value, message) {
        const text = String(value || "").trim();
        if (!text) return [];
        try {
          const parsed = JSON.parse(text);
          if (!Array.isArray(parsed)) throw new Error("not_array");
          return parsed;
        } catch {
          throw new Error(message);
        }
      }

      function officialAssetDetailItemsFromForm(form) {
        const textarea = form?.querySelector('textarea[name="detailViewItems"]');
        if (!textarea) return [];
        try {
          return parseOfficialAssetJson(textarea.value, "详情图组必须是 JSON 数组");
        } catch {
          return [];
        }
      }

        const target = document.getElementById("official-asset-main-preview");
        if (!target) return;
        const previewUrl = form?.querySelector('input[name="previewUrl"]')?.value || "";

          target.innerHTML = `<div class="metric-note">暂无主图，上传后会在这里预览。</div>`;
          return;
        }
        target.innerHTML = `<article class="official-asset-main-preview-card">
          <img src="${escapeAttribute(previewUrl)}" alt="主图" loading="lazy" />
          <span>主图</span>
        </article>`;

          return;

        target.innerHTML = items.map((item, itemIndex) => ({ item, itemIndex })).filter(({ item }) => item?.imageUrl || item?.thumbnailUrl).map(({ item, itemIndex }, index) => {
          const imageUrl = item.thumbnailUrl || item.imageUrl || "";
          const label = item.label || item.key || `详情图 ${index + 1}`;
          return `<article class="official-asset-detail-preview-card">
            <button type="button" class="official-asset-detail-remove" aria-label="删除图片" title="删除图片" onclick="removeOfficialAssetDetailItem(this.closest('form'), ${itemIndex})" ${permissionAttrs("settings.write")}>×</button>

      function updateOfficialAssetDetailItemLabel(form, itemIndex, value) {
        const textarea = form?.querySelector('textarea[name="detailViewItems"]');
        const index = Number(itemIndex);
        if (!textarea || !Number.isInteger(index)) return "";
        const items = officialAssetDetailItemsFromForm(form);
        if (index < 0 || index >= items.length) return "";
        const existing = items[index] || {};
        const fallback = existing.key || `详情图 ${index + 1}`;
        const label = String(value || "").replace(/\s+/g, " ").trim() || fallback;
        items[index] = { ...existing, label };
        textarea.value = JSON.stringify(items, null, 2);
        return label;
      }

      function normalizeOfficialAssetDetailItemLabel(element, form, itemIndex) {
        const label = updateOfficialAssetDetailItemLabel(form, itemIndex, element?.textContent || "");

          element.textContent = label;
        }
      }

      function removeOfficialAssetDetailItem(form, itemIndex) {
        const textarea = form?.querySelector('textarea[name="detailViewItems"]');
        const index = Number(itemIndex);

        const items = officialAssetDetailItemsFromForm(form);

      async function uploadOfficialAssetImage(file) {
        if (!file) return null;
        if (!String(file.type || "").startsWith("image/")) {
          throw new Error("请选择图片文件");
        }
        const fileName = file.name || "official-asset.png";
        const response = await fetch(resolveAdminApiUrl(`/api/admin/official-assets/uploads?fileName=${encodeURIComponent(fileName)}`), {
          method: "POST",
          credentials: "include",
          headers: { "content-type": file.type || "application/octet-stream" },
          body: file,
        });
        const rawBody = await response.text().catch(() => "");
        let payload = {};
        try {
          payload = rawBody ? JSON.parse(rawBody) : {};
        } catch {
          payload = { message: rawBody };
        }
        if (!response.ok) {
          throw Object.assign(new Error(adminApiErrorMessage(payload, response)), { payload, status: response.status });
        }
        return payload.data || payload;
      }

      async function uploadOfficialAssetMainImage(input) {
        const file = input.files?.[0];
        if (!file) return;
        const form = input.closest("form");
        const error = document.getElementById("official-asset-error");
        try {
          input.disabled = true;
          if (error) error.textContent = "";
          const imageSize = await readOfficialAssetImageSize(file);
          const uploaded = await uploadOfficialAssetImage(file);
          if (!uploaded || !form) return;
          const previewInput = form.querySelector('input[name="previewUrl"]');
          const keyInput = form.querySelector('input[name="storageObjectKey"]');
          const mimeInput = form.querySelector('input[name="mimeType"]');
          const widthInput = form.querySelector('input[name="width"]');
          const heightInput = form.querySelector('input[name="height"]');
          const previousPreviewUrl = previewInput?.value || "";
          if (previewInput) previewInput.value = uploaded.previewUrl || uploaded.sourceUrl || "";
          if (keyInput) keyInput.value = uploaded.storageObjectKey || "";
          if (mimeInput) mimeInput.value = uploaded.mimeType || file.type || "";
          if (imageSize.width && widthInput) widthInput.value = String(imageSize.width);
          if (imageSize.height && heightInput) heightInput.value = String(imageSize.height);
          syncOfficialAssetMainDetailItem(form, uploaded, previousPreviewUrl);
          renderOfficialAssetMainPreview(form);
          renderOfficialAssetDetailPreview(form);
        } catch (uploadError) {
          if (error) error.textContent = uploadError.message || "主图上传失败";
          showToast(uploadError.message || "主图上传失败");
        } finally {
          input.disabled = false;
          input.value = "";
        }
      }

      async function uploadOfficialAssetDetailImage(input) {
        const file = input.files?.[0];
        if (!file) return;
        const form = input.closest("form");
        const error = document.getElementById("official-asset-error");
        try {
          input.disabled = true;
          if (error) error.textContent = "";
          const uploaded = await uploadOfficialAssetImage(file);
          if (!uploaded || !form) return;
          appendOfficialAssetDetailItem(form, uploaded, file);
          renderOfficialAssetDetailPreview(form);
        } catch (uploadError) {
          if (error) error.textContent = uploadError.message || "详情图上传失败";
          showToast(uploadError.message || "详情图上传失败");
        } finally {
          input.disabled = false;
          input.value = "";
        }
      }

      function syncOfficialAssetMainDetailItem(form, uploaded, previousPreviewUrl = "") {
        const textarea = form.querySelector('textarea[name="detailViewItems"]');
        if (!textarea) return;
        let items = [];
        try {
          items = parseOfficialAssetJson(textarea.value, "详情图组必须是 JSON 数组");
        } catch {
          items = [];
        }
        const nextUrl = uploaded.previewUrl || uploaded.sourceUrl || "";
        const nextItem = {
          key: "main",
          label: "主图",
          imageUrl: nextUrl,
          thumbnailUrl: nextUrl,
          sortOrder: 10,
          isDefault: true,
        };
        if (!items.length) {
          textarea.value = JSON.stringify([nextItem], null, 2);
          return;
        }
        const updatedItems = items.map((item, index) => {
          const isMain = index === 0 || item?.key === "main" || item?.isDefault === true;
          const canReplace = isMain && (!item?.imageUrl || item.imageUrl === previousPreviewUrl);
          return canReplace ? { ...item, ...nextItem, key: item?.key || "main", label: item?.label || "主图" } : item;
        });
        textarea.value = JSON.stringify(updatedItems, null, 2);
      }

      function appendOfficialAssetDetailItem(form, uploaded, file) {
        const textarea = form.querySelector('textarea[name="detailViewItems"]');
        if (!textarea) return;
        const items = parseOfficialAssetJson(textarea.value, "详情图组必须是 JSON 数组");
        const imageUrl = uploaded.previewUrl || uploaded.sourceUrl || "";
        const label = String(file?.name || "详情图").replace(/\.[^.]+$/, "") || "详情图";
        items.push({
          key: `detail-${Date.now()}`,
          label,
          imageUrl,
          thumbnailUrl: imageUrl,
          sortOrder: (items.length + 1) * 10,
          isDefault: !items.some((item) => item?.isDefault),
        });
        textarea.value = JSON.stringify(items, null, 2);
      }

      function readOfficialAssetImageSize(file) {
        return new Promise((resolve) => {
          if (!file || typeof Image === "undefined" || typeof URL === "undefined" || !URL.createObjectURL) {
            resolve({ width: 0, height: 0 });
            return;
          }
          const objectUrl = URL.createObjectURL(file);
          const image = new Image();
          image.onload = () => {
            URL.revokeObjectURL(objectUrl);
            resolve({ width: image.naturalWidth || 0, height: image.naturalHeight || 0 });
          };
          image.onerror = () => {
            URL.revokeObjectURL(objectUrl);
            resolve({ width: 0, height: 0 });
          };
          image.src = objectUrl;
        });
      }

      function parameterTemplateConfig() {
        return state.settings.configs.find((config) => config.key === MODEL_PARAMETER_TEMPLATES_CONFIG_KEY) || {
          key: MODEL_PARAMETER_TEMPLATES_CONFIG_KEY,
          value: { templates: DEFAULT_MODEL_PARAMETER_TEMPLATES },
          valueType: "json",
          scope: "creator",
          description: "\u6a21\u578b\u53c2\u6570\u6a21\u677f\u5e93",
        };
      }

      function parameterTemplates() {
        const value = parameterTemplateConfig().value || {};
        const configuredTemplates = Array.isArray(value.templates) ? value.templates : [];
        const merged = new Map(
          DEFAULT_MODEL_PARAMETER_TEMPLATES
            .map((template) => normalizeParameterTemplate(template))
            .map((template) => [template.key, template]),
        );
        configuredTemplates
          .map((template) => normalizeParameterTemplate(template))
          .forEach((template) => {
            const existing = merged.get(template.key);
            merged.set(template.key, existing
              ? {
                ...existing,
                ...template,
                mediaTypes: template.mediaTypes.length ? template.mediaTypes : existing.mediaTypes,
                options: template.options.length ? template.options : existing.options,
              }
              : template);
          });
        return [...merged.values()]
          .sort((left, right) => Number(left.sortOrder || 100) - Number(right.sortOrder || 100) || left.key.localeCompare(right.key));
      }

      function normalizeParameterTemplate(template = {}) {
        return {
          key: String(template.key || "").trim(),
          label: String(template.label || template.key || "").trim(),
          type: String(template.type || "string").trim(),
          mediaTypes: Array.isArray(template.mediaTypes) ? template.mediaTypes.map(String) : ["image", "video"],
          required: template.required === true,
          visible: template.visible !== false,
          options: Array.isArray(template.options) ? template.options.map(String) : [],
          defaultValue: template.defaultValue ?? "",
          sortOrder: Number(template.sortOrder || 100),
          remark: String(template.remark || ""),
        };
      }

      function parameterTemplatesPage() {
        const rows = parameterTemplates().length
          ? parameterTemplates().map(parameterTemplateRow).join("")

        </section>`;

      function parameterTemplateRow(template) {

        const drawer = document.getElementById("drawer");

        drawer.innerHTML = `<aside class="drawer-panel" style="width:min(720px,100%);">

            <div class="form-grid">
              <label class="field"><span>\u53c2\u6570\u952e</span><input name="key" value="${escapeAttribute(template.key)}" ${existing ? "readonly" : ""} placeholder="aspectRatio" required /></label>

        document.getElementById("parameter-template-form").addEventListener("submit", async (event) => {
          event.preventDefault();
          const form = new FormData(event.currentTarget);
          const error = document.getElementById("parameter-template-error");
          await runAdminMutation(event.currentTarget, error, async () => {
            const key = String(form.get("key") || "").trim();
            if (!/^[A-Za-z][A-Za-z0-9_]*$/.test(key)) throw new Error("\u53c2\u6570\u952e\u53ea\u80fd\u4f7f\u7528\u82f1\u6587\u3001\u6570\u5b57\u548c\u4e0b\u5212\u7ebf\uff0c\u5e76\u4e14\u5fc5\u987b\u4ee5\u5b57\u6bcd\u5f00\u5934");
            const next = normalizeParameterTemplate({
              key,
              label: String(form.get("label") || "").trim(),
              type: String(form.get("type") || "string"),
              mediaTypes: splitCsv(form.get("mediaTypes")),
              options: readParameterOptionEditorValues(event.currentTarget),
              defaultValue: String(form.get("defaultValue") || "").trim(),

            templates.push(next);
            await saveParameterTemplates(templates, String(form.get("reason") || ""));
            closeDrawer();
            renderShell();
          }, "\u53c2\u6570\u6a21\u677f\u5df2\u4fdd\u5b58").catch(() => undefined);

      async function saveParameterTemplates(templates, reason) {
        const config = parameterTemplateConfig();
        const result = await api(`/api/admin/settings/${encodeURIComponent(MODEL_PARAMETER_TEMPLATES_CONFIG_KEY)}`, {
          method: "PATCH",
          headers: { "idempotency-key": `admin-ui-parameter-template-${Date.now()}` },
          body: JSON.stringify({
            value: { templates: templates.map(normalizeParameterTemplate) },
            valueType: "json",
            scope: String(config.scope || "creator"),
            description: String(config.description || "\u6a21\u578b\u53c2\u6570\u6a21\u677f\u5e93"),
            reason: reason || "\u66f4\u65b0\u6a21\u578b\u53c2\u6570\u6a21\u677f\u5e93",
          }),
        });
        const savedConfig = result.data || {
          ...config,
          value: { templates: templates.map(normalizeParameterTemplate) },
          valueType: "json",
          scope: String(config.scope || "creator"),
          description: String(config.description || "\u6a21\u578b\u53c2\u6570\u6a21\u677f\u5e93"),
        };
        const configs = Array.isArray(state.settings.configs) ? [...state.settings.configs] : [];
        const index = configs.findIndex((item) => item.key === MODEL_PARAMETER_TEMPLATES_CONFIG_KEY);
        if (index >= 0) {
          configs[index] = savedConfig;
        } else {
          configs.push(savedConfig);
        }
        state.settings = settingsWithRuntimeConfigHints({
          ...(state.settings || {}),
          configs,
          secretReferences: state.settings?.secretReferences || [],
        });
      }

      function splitCsv(value) {

      function refreshParameterOptionEditor(editor) {
        const list = editor?.querySelector("[data-parameter-option-editor-list]");
        if (!list) return;
        list.querySelectorAll("[data-parameter-option-editor-empty]").forEach((item) => item.remove());
        const rows = [...list.querySelectorAll("[data-parameter-option-row]")];
        rows.forEach((row, index) => {
          const marker = row.querySelector("[data-parameter-option-index]");
          if (marker) marker.textContent = String(index + 1);
        });
        if (!rows.length) {
          list.insertAdjacentHTML("beforeend", `<div class="parameter-option-editor-empty" data-parameter-option-editor-empty>\u6682\u65e0\u9009\u9879\uff0c\u53ef\u624b\u52a8\u6dfb\u52a0</div>`);
        }
      }

      function addParameterTemplateOption(button) {
        const editor = button.closest("[data-parameter-option-editor]");
        const input = editor?.querySelector("[data-parameter-option-new]");
        const list = editor?.querySelector("[data-parameter-option-editor-list]");
        const value = String(input?.value || "").trim();
        if (!editor || !list || !value) return;
        list.querySelectorAll("[data-parameter-option-editor-empty]").forEach((item) => item.remove());
        list.insertAdjacentHTML("beforeend", parameterOptionEditorRow(value));
        input.value = "";
        refreshParameterOptionEditor(editor);
      }

      function moveParameterTemplateOption(button, direction) {
        const row = button.closest("[data-parameter-option-row]");
        const editor = button.closest("[data-parameter-option-editor]");
        if (!row || !editor) return;
        if (direction < 0 && row.previousElementSibling?.matches("[data-parameter-option-row]")) {
          row.parentNode.insertBefore(row, row.previousElementSibling);
        }
        if (direction > 0 && row.nextElementSibling?.matches("[data-parameter-option-row]")) {
          row.parentNode.insertBefore(row.nextElementSibling, row);
        }
        refreshParameterOptionEditor(editor);
      }

      function removeParameterTemplateOption(button) {
        const editor = button.closest("[data-parameter-option-editor]");
        button.closest("[data-parameter-option-row]")?.remove();
        refreshParameterOptionEditor(editor);
      }

      function readParameterOptionEditorValues(form) {
        const seen = new Set();
        return [...form.querySelectorAll("[data-parameter-option-row] input[name='options']")]
          .map((input) => input.value.trim())
          .filter((value) => {
            if (!value || seen.has(value)) return false;
            seen.add(value);
            return true;
          });
      }

      function isLingdongProviderName(providerName = "") {
        const provider = String(providerName || "").trim().toLowerCase();
        return provider.includes("lingdong") || provider.includes("灵动");
      }

      function fixedModelTemplate(mediaType, providerName = "") {
        const provider = String(providerName || "").trim().toLowerCase();
        const isVideo = mediaType === "video";
        const isText = mediaType === "text";
        const protocol = isText
          ? "openai_compatible_chat"
          : isVideo
          ? (
            isLingdongProviderName(providerName)
              ? "lingdong_api"
              : provider.includes("aliyun") || provider.includes("bailian")
              ? "aliyun_bailian_video"
              : provider.includes("volc") || provider.includes("doubao") || provider.includes("jimeng")
              ? "volcengine_ark_video"
              : "custom_http"
          )
          : (provider === "openai" ? "openai_images" : isLingdongProviderName(providerName) ? "lingdong_api" : "custom_http");
        return {
          providerProtocol: protocol,
          invocationMode: isText ? "stream" : isVideo ? "async_polling" : "sync",
          taskModes: isText ? ["text.script"] : isVideo ? ["video.text_to_video", "video.image_to_video"] : ["image.generate", "image.edit", "image.reference_generate"],
          status: "disabled",
          sortOrder: 100,
          capabilities: isText ? { input: ["prompt", "outline"], output: ["text", "json"] } : isVideo ? { input: ["prompt", "image"], output: ["video"] } : { input: ["prompt", "image"], output: ["image"] },
          defaultParams: {},
          providerConfig: isText
            ? { baseURL: "", requestPath: "/chat/completions", apiKeyEnv: "", requestFormat: "openai_compatible_chat", timeoutMs: 120000 }
            : isVideo
            ? (
              protocol === "lingdong_api"
                ? { baseURL: "https://www.lingdongapi.com", mediaType: "video", requestPath: "/v1/videos", createTaskEndpoint: "/v1/videos", queryTaskEndpoint: "/v1/video/generations/{taskId}", apiKeyEnv: "", requestFormat: "lingdong_video", timeoutMs: 600000 }
                : { baseURL: "", requestPath: "", createTaskEndpoint: "", queryTaskEndpoint: "", apiKeyEnv: "", requestFormat: "json", timeoutMs: 600000 }
            )
            : (
              protocol === "lingdong_api"
                ? { baseURL: "https://www.lingdongapi.com", mediaType: "image", requestPath: "/v1/images/generations", endpoint: "/v1/images/generations", apiKeyEnv: "", requestFormat: "lingdong_image", resultFormat: "url", timeoutMs: 600000 }
                : { baseURL: "", requestPath: "/v1/images/edits", endpoint: "/v1/images/generations", editEndpoint: "/v1/images/edits", apiKeyEnv: "", requestFormat: protocol === "openai_images" ? "openai_images" : "json", resultFormat: "b64_json", contentType: "multipart/form-data", timeoutMs: 600000 }
            ),
          pricing: { unit: mediaType, baseCredits: isText ? 20 : isVideo ? 120 : 90 },
          limits: {},
          uiConfig: isText ? { modelKind: "text.script", modelKindLabel: "\u5267\u672c\u6a21\u578b", supportedModes: ["script"] } : isVideo ? { videoCategory: "first_frame", videoCategoryLabel: "\u9996\u5e27\u89c6\u9891" } : {},
          dispatchPolicy: {
            submitQueueName: isText ? "generation-submit-text" : isVideo ? "generation-submit-video" : "generation-submit-image",
            pollQueueName: isVideo ? "generation-poll-video" : null,
            providerRpmLimit: 60,
            providerConcurrentLimit: 5,
            submitConcurrencyLimit: 5,
            pollingIntervalMs: 15000,
            pollingConcurrencyLimit: 20,
          },
        };
      }

      function schemaFromSelectedParameterTemplates(form, existingSchema = {}) {
        const schema = {};
        const defaults = {};
        parameterTemplates().forEach((template) => {
          if (!form.get(`parameterSupported:${template.key}`)) return;
          const required = Boolean(form.get(`parameterRequired:${template.key}`));
          const visible = existingSchema[template.key]?.visible ?? template.visible !== false;
          const selectedOptionValues = form.getAll(`parameterOptions:${template.key}`).map(String).filter(Boolean);
          const options = selectedOptionValues.length ? selectedOptionValues : splitCsv(form.get(`parameterOptions:${template.key}`));
          const defaultValue = String(form.get(`parameterDefault:${template.key}`) || "").trim();
          const parameter = {
            ...(existingSchema[template.key] && typeof existingSchema[template.key] === "object" ? existingSchema[template.key] : {}),
            label: template.label,
            type: template.type,
            required,
            visible,
          };
          if (options.length) {
            parameter.options = options;
            parameter.adminEditableOptions = true;
          }
          schema[template.key] = parameter;
          if (defaultValue !== "") {
            if (template.type === "integer" || template.type === "number") {
              defaults[template.key] = Number(defaultValue);
            } else if (template.type === "boolean") {
              defaults[template.key] = defaultValue === "true";
            } else {
              defaults[template.key] = defaultValue;
            }
          }
        });
        return { schema, defaults };
      }

      function parameterOptionSelectMarkup(template, selectedOptions) {
        if (!template.options.length) {
          return `<span class="metric-note">\u65e0\u56fa\u5b9a\u9009\u9879</span>`;
        }
        const selected = new Set(selectedOptions.length ? selectedOptions : template.options);
        return `<div class="parameter-option-picker" data-parameter-options="${escapeAttribute(template.key)}">
          <details>
            <summary><span data-parameter-option-summary="${escapeAttribute(template.key)}">${selected.size ? `\u5df2\u9009 ${selected.size} \u9879` : "\u9009\u62e9\u9009\u9879"}</span></summary>
            <div class="parameter-option-menu">
              ${template.options.map((option) => `<label class="parameter-option-item"><input name="parameterOptions:${escapeAttribute(template.key)}" type="checkbox" value="${escapeAttribute(option)}" ${selected.has(option) ? "checked" : ""} /> <span>${escapeHtml(option)}</span></label>`).join("")}
            </div>
          </details>
        </div>`;
      }

      function parameterSelectedValuesMarkup(parameterKey, selectedOptions) {
        const values = selectedOptions.filter(Boolean);
        if (!values.length) {
          return `<div class="parameter-selected-values" data-parameter-selected-values="${escapeAttribute(parameterKey)}"><span class="parameter-empty-note">\u524d\u53f0\u6682\u65e0\u53ef\u9009\u503c</span></div>`;
        }
        return `<div class="parameter-selected-values" data-parameter-selected-values="${escapeAttribute(parameterKey)}">${values.map((value) => `<span class="parameter-value-chip">${escapeHtml(value)}</span>`).join("")}</div>`;
      }

      function parameterTemplateSelectionRows(mediaType, schema = {}, defaultParams = {}, useDefaultSelections = false) {
        const defaultSupportedKeys = useDefaultSelections
          ? (mediaType === "text"
            ? ["scriptPrompt", "scriptGenre", "episodeCount", "scriptStyle"]
            : mediaType === "video"
            ? ["prompt", "ratio", "resolution", "durationSec", "orientation", "referenceImages", "sourceVideo", "referenceAudio"]
            : ["prompt", "aspectRatio", "quality", "count", "referenceImages", "size", "responseFormat"])
          : [];
        const rows = parameterTemplates()
          .filter((template) => template.mediaTypes.includes(mediaType))
          .map((template) => {
            const current = schema[template.key] || {};
            const supported = Object.prototype.hasOwnProperty.call(schema, template.key) || defaultSupportedKeys.includes(template.key);
            const required = current.required ?? template.required;
            const visible = current.visible ?? template.visible;
            const options = Array.isArray(current.options) ? current.options : template.options;
            const defaultValue = defaultParams[template.key] ?? template.defaultValue ?? "";
            return `<tr>
              <td><label class="parameter-visible-toggle"><input name="parameterSupported:${escapeAttribute(template.key)}" type="checkbox" ${supported ? "checked" : ""} /> ${escapeHtml(template.label)}</label><div class="metric-note">${escapeHtml(template.key)} · ${escapeHtml(template.mediaTypes.join(", "))}</div></td>
              <td><span class="tag blue">${escapeHtml(parameterTypeLabel(template.type))}</span></td>
              <td>${parameterOptionSelectMarkup(template, options)}</td>
              <td>${parameterSelectedValuesMarkup(template.key, options)}</td>
              <td><input name="parameterDefault:${escapeAttribute(template.key)}" value="${escapeAttribute(String(defaultValue || ""))}" /></td>
              <td class="parameter-visible-cell"><label class="parameter-visible-toggle"><input name="parameterRequired:${escapeAttribute(template.key)}" type="checkbox" ${required ? "checked" : ""} /> \u5fc5\u586b</label></td>
            </tr>`;
          }).join("");
        return rows || `<tr><td colspan="6">\u53c2\u6570\u6a21\u677f\u5e93\u6682\u65e0\u53ef\u9009\u53c2\u6570</td></tr>`;
      }

      function cssAttributeValue(value) {
        return String(value).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
      }

      function updateParameterSelectedPreview(parameterKey) {
        const form = document.getElementById("model-editor-form");
        if (!form) return;
        const values = new FormData(form).getAll(`parameterOptions:${parameterKey}`).map(String).filter(Boolean);
        const selectorKey = cssAttributeValue(parameterKey);
        const preview = document.querySelector(`[data-parameter-selected-values="${selectorKey}"]`);
        if (preview) {
          preview.innerHTML = values.length
            ? values.map((value) => `<span class="parameter-value-chip">${escapeHtml(value)}</span>`).join("")
            : `<span class="parameter-empty-note">\u524d\u53f0\u6682\u65e0\u53ef\u9009\u503c</span>`;
        }
        const summary = document.querySelector(`[data-parameter-option-summary="${selectorKey}"]`);
        if (summary) {
          summary.textContent = values.length ? `\u5df2\u9009 ${values.length} \u9879` : "\u9009\u62e9\u9009\u9879";
        }
      }

      function providerNameForSecretKey(secretKey) {
        const key = String(secretKey || "").trim();
        if (!key) return "";
        const secret = (state.settings.secretReferences || []).find((item) => item.envName === key);
        return String(secret?.providerName || "").trim();
      }

      function resolveVideoTaskModes(kind, existing) {
        if (kind.mediaType !== "video") return kind.taskModes;
        if (kind.videoCategory !== "reference") return kind.taskModes;
        const existingTaskModes = Array.isArray(existing?.taskModes) ? existing.taskModes.map(String) : [];
        const preservedModes = existingTaskModes.filter((taskMode) => [
          "video.text_to_video",
          "video.video_to_video",
          "video.image_video_to_video",
        ].includes(taskMode));
        return [...new Set([...kind.taskModes, ...preservedModes])];
      }

      function videoSupportedModesByTaskModes(videoCategory, taskModes) {
        const supportedModes = [];
        if (videoCategory === "first_frame") supportedModes.push("first_frame");
        if (videoCategory === "first_last_frame") supportedModes.push("first_last_frame");
        if (videoCategory === "reference") supportedModes.push("reference");
        if (taskModes.includes("video.text_to_video")) supportedModes.push("text_to_video");
        if (taskModes.includes("video.image_to_video")) supportedModes.push("image_to_video");
        if (taskModes.includes("video.first_last_frame_to_video")) supportedModes.push("first_last_frame_to_video");
        if (taskModes.includes("video.reference_image_to_video")) supportedModes.push("reference_image_to_video");
        if (taskModes.includes("video.video_to_video")) supportedModes.push("video_to_video");
        if (taskModes.includes("video.image_video_to_video")) supportedModes.push("image_video_to_video");
        return [...new Set(supportedModes)];
      }

      const MODEL_KIND_OPTIONS = [
        { value: "image.text_to_image", mediaType: "image", label: "\u6587\u751f\u56fe", taskModes: ["image.generate"] },
        { value: "image.reference_image", mediaType: "image", label: "\u53c2\u8003\u751f\u56fe", taskModes: ["image.edit", "image.reference_generate", "image.image_to_image"] },
        { value: "video.first_frame", mediaType: "video", label: "\u9996\u5e27\u751f\u89c6\u9891", videoCategory: "first_frame", taskModes: ["video.image_to_video"] },
        { value: "video.first_last_frame", mediaType: "video", label: "\u9996\u5c3e\u5e27\u751f\u89c6\u9891", videoCategory: "first_last_frame", taskModes: ["video.first_last_frame_to_video", "video.image_to_video"] },
        { value: "video.reference", mediaType: "video", label: "\u53c2\u8003\u751f\u89c6\u9891", videoCategory: "reference", taskModes: ["video.reference_image_to_video", "video.image_to_video"] },
        { value: "text.script", mediaType: "text", label: "\u5267\u672c\u6a21\u578b", taskModes: ["text.script"] },
      ];

      function modelKindOption(value) {
        return MODEL_KIND_OPTIONS.find((item) => item.value === value) || MODEL_KIND_OPTIONS[0];
      }

      function inferModelKind(model = {}) {
        const mediaType = String(model.mediaType || "image");
        const uiConfig = model.uiConfig || {};
        const modes = Array.isArray(model.taskModes) ? model.taskModes.map(String) : [];
        const supportedModes = Array.isArray(uiConfig.supportedModes) ? uiConfig.supportedModes.map(String) : [];
        const allModes = [...modes, ...supportedModes];
        if (mediaType === "text") {
          const configuredKind = String(uiConfig.modelKind || "");
          if (configuredKind === "text.script" || allModes.some((mode) => mode.includes("script"))) return "text.script";
          return "text.script";
        }
        if (mediaType === "video") {
          const category = String(uiConfig.modelKind || uiConfig.videoCategory || "");
          if (category === "video.first_last_frame" || category === "first_last_frame" || allModes.some((mode) => mode.includes("first_last"))) return "video.first_last_frame";
          if (category === "video.reference" || category === "reference" || allModes.some((mode) => mode.includes("reference"))) return "video.reference";
          return "video.first_frame";
        }
        if (String(uiConfig.modelKind || "").startsWith("image.")) return String(uiConfig.modelKind);
        if (allModes.some((mode) => mode.includes("reference") || mode.includes("image_to_image") || mode.includes("multi_reference") || mode.includes("edit"))) {
          return "image.reference_image";
        }
        return "image.text_to_image";
      }

      function modelKindOptionsMarkup(selectedValue) {
        return MODEL_KIND_OPTIONS.map((item) => `<option value="${escapeAttribute(item.value)}" ${item.value === selectedValue ? "selected" : ""}>${escapeHtml(item.label)}</option>`).join("");
      }

      function modelKindLabel(model) {
        return modelKindOption(inferModelKind(model)).label;
      }

          <form id="model-editor-form">

                <label class="field"><span>API \u5bc6\u94a5</span><select name="modelApiKeyEnv">${modelSecretReferenceOptions(selectedApiKeyEnv, base.providerName)}</select></label>

              </div>
            </section>
            <section class="card" style="box-shadow:none;border:1px solid var(--border);">
              <div class="toolbar"><h4>\u7ed3\u6784\u914d\u7f6e</h4><span class="metric-note">\u7528 JSON \u5bf9\u8c61\u8bb0\u5f55\u6a21\u578b\u8bf7\u6c42\u5165\u53c2\u548c\u54cd\u5e94\u51fa\u53c2\u7ed3\u6784\u3002</span></div>
              <label class="field"><span>\u5165\u53c2\u7ed3\u6784</span><textarea name="inputSchema" rows="8" placeholder='{"prompt":{"type":"string","required":true}}'>${escapeHtml(inputSchemaText)}</textarea></label>
              <label class="field"><span>\u51fa\u53c2\u7ed3\u6784</span><textarea name="outputSchema" rows="8" placeholder='{"images":{"type":"array","items":{"type":"string"}}}'>${escapeHtml(outputSchemaText)}</textarea></label>
            </section>
            <div class="error-text" id="model-editor-error"></div>
            <button class="btn primary full" type="submit">${isEdit ? "\u4fdd\u5b58\u6a21\u578b\u914d\u7f6e" : "\u521b\u5efa\u6a21\u578b\u914d\u7f6e"}</button>

        });
        form.addEventListener("change", (event) => {
          const name = event.target?.name || "";
          if (name.startsWith("parameterOptions:")) {
            updateParameterSelectedPreview(name.slice("parameterOptions:".length));
          }

        form.addEventListener("submit", async (event) => {

            const result = await api(isEdit ? `/api/admin/models/${encodeURIComponent(model.id)}` : "/api/admin/models", {
              method: isEdit ? "PATCH" : "POST",

          }, isEdit ? "\u6a21\u578b\u914d\u7f6e\u5df2\u4fdd\u5b58" : "\u6a21\u578b\u914d\u7f6e\u5df2\u521b\u5efa").catch(() => undefined);
        });

      function simplifiedModelPayloadFromForm(form, existing) {
        const kind = modelKindOption(String(form.get("modelKind") || ""));
        const mediaType = kind.mediaType;
        const providerName = String(form.get("providerName") || "").trim() || providerNameForSecretKey(form.get("modelApiKeyEnv")) || String(existing?.providerName || "").trim() || "custom";
        const fixed = fixedModelTemplate(mediaType, providerName);
        const taskModes = kind.mediaType === "video" ? resolveVideoTaskModes(kind, existing) : kind.taskModes;
        const selected = schemaFromSelectedParameterTemplates(form, existing?.parameterSchema || {});
        const providerConfig = { ...fixed.providerConfig, ...(existing?.providerConfig || {}) };
        const requestPath = String(form.get("requestPath") || "").trim();
        if (requestPath) {
          providerConfig.requestPath = requestPath;
        } else {
          delete providerConfig.requestPath;
        }
        const apiKeyEnv = String(form.get("modelApiKeyEnv") || "").trim();
        if (apiKeyEnv) {
          providerConfig.apiKeyEnv = apiKeyEnv;
        } else {
          delete providerConfig.apiKeyEnv;
        }
        providerConfig.inputSchema = parseJsonTextarea(form, "inputSchema");
        providerConfig.outputSchema = parseJsonTextarea(form, "outputSchema");
        delete providerConfig.apiKey;
        const pricing = { ...fixed.pricing, ...(existing?.pricing || {}), unit: mediaType, baseCredits: Number(form.get("baseCredits") || 0) };
        const uiConfig = {
          ...fixed.uiConfig,
          ...(existing?.uiConfig || {}),
          modelKind: kind.value,
          modelKindLabel: kind.label,
          supportedModes: kind.mediaType === "text"
            ? ["script"]
            : kind.value.startsWith("image.")
            ? (kind.value === "image.text_to_image" ? ["text_to_image"] : ["reference_image", "multi_reference", "image_to_image"])
            : videoSupportedModesByTaskModes(kind.videoCategory, taskModes),
        };
        if (kind.mediaType === "video") {
          uiConfig.videoCategory = kind.videoCategory;
          uiConfig.videoCategoryLabel = kind.label;
        } else {
          delete uiConfig.videoCategory;
          delete uiConfig.videoCategoryLabel;
        }
        return {
          modelCode: String(form.get("modelCode") || "").trim(),
          displayName: String(form.get("displayName") || "").trim(),
          providerName,
          providerModel: String(form.get("providerModel") || "").trim(),
          providerProtocol: fixed.providerProtocol,
          invocationMode: fixed.invocationMode,
          mediaType,
          taskModes,
          status: existing?.status || fixed.status,
          sortOrder: Number(existing?.sortOrder || fixed.sortOrder),
          parameterSchema: selected.schema,
          defaultParams: { ...fixed.defaultParams, ...selected.defaults },
          capabilities: fixed.capabilities,
          pricing,
          providerConfig,
          limits: fixed.limits,
          uiConfig,
          dispatchPolicy: existing?.dispatchPolicy ? { ...fixed.dispatchPolicy, ...existing.dispatchPolicy } : fixed.dispatchPolicy,
          remark: String(form.get("remark") || ""),
          reason: String(form.get("reason") || ""),
        };
      }

      modelsPage = function modelsPage() {
        const rows = state.models.length
          ? sortedModelRows().map((model) => modelRow(model)).join("")
          : `<tr><td colspan="8">${state.modelLoadError || "\u6682\u65e0\u6a21\u578b\u914d\u7f6e"}</td></tr>`;
        const mediaSection = mediaModelSection();
        return `<div class="toolbar"><div class="filters"><input placeholder="\u641c\u7d22\u6a21\u578b\u540d\u79f0 / \u7f16\u7801" /><select><option>\u5168\u90e8\u72b6\u6001</option><option>\u542f\u7528</option><option>\u7981\u7528</option></select><select><option>\u5168\u90e8\u7c7b\u578b</option><option>\u6587\u751f\u56fe</option><option>\u53c2\u8003\u751f\u56fe</option><option>\u9996\u5e27\u751f\u89c6\u9891</option><option>\u9996\u5c3e\u5e27\u751f\u89c6\u9891</option><option>\u53c2\u8003\u751f\u89c6\u9891</option><option>\u5267\u672c\u6a21\u578b</option></select></div><button class="btn primary" onclick="openModelEditorDrawer()" ${permissionAttrs("model.write")}>\u65b0\u589e\u6a21\u578b</button></div>
           ${mediaSection}`;
      };

      function modelSortValue(model) {
        const value = Number(model?.sortOrder ?? model?.sort_order ?? 100);
        return Number.isFinite(value) ? value : 100;
      }

      function sortedModelRows() {
        return [...state.models].sort((left, right) => modelSortValue(left) - modelSortValue(right) || String(left.modelCode || "").localeCompare(String(right.modelCode || "")));
      }

      const modelMediaTabs = [
        { key: "image", title: "图片模型", note: "查看全部图片模型。" },
        { key: "video", title: "视频模型", note: "查看全部视频模型。" },
        { key: "text", title: "文本模型", note: "查看全部文本模型。" },
      ];

      function modelsByMediaTab(tabKey) {
        if (tabKey === "video") {
          return sortedModelRows().filter((model) => String(model.mediaType || "").trim() === "video");
        }
        if (tabKey === "text") {
          return sortedModelRows().filter((model) => {
            const mediaType = String(model.mediaType || "").trim();
            return mediaType !== "image" && mediaType !== "video";
          });
        }
        return sortedModelRows().filter((model) => String(model.mediaType || "").trim() === "image");
      }

      function updateModelMediaTab(tabKey) {
        state.modelMediaTab = modelMediaTabs.some((item) => item.key === tabKey) ? tabKey : "image";
        renderShell();
      }

      function mediaModelSection() {
        const activeTab = modelMediaTabs.find((item) => item.key === state.modelMediaTab) || modelMediaTabs[0];
        const mediaRows = modelsByMediaTab(activeTab.key);
        const rows = mediaRows.length
          ? mediaRows.map((model) => modelRow(model, true)).join("")
          : `<tr><td colspan="8">当前分类下暂无模型</td></tr>`;
        return `<section class="card" style="margin-bottom:12px;">
          <div class="toolbar">
            <div class="prompt-toolbar-title">
              <h3 style="margin:0;">按媒体类型查看</h3>
              <div class="metric-note">${escapeHtml(activeTab.note)}</div>
            </div>
            <div class="filters"><span class="metric-note">共 ${mediaRows.length} 个</span></div>
          </div>
          <div class="model-tab-list" style="margin-bottom:12px;">
            ${modelMediaTabs.map((item) => `<button class="model-tab-btn ${item.key === activeTab.key ? "active" : ""}" onclick="updateModelMediaTab('${item.key}')">${item.title}<span class="tag blue" style="margin-left:6px;">${modelsByMediaTab(item.key).length}</span></button>`).join("")}
          </div>
          <div class="table-wrap models dense"><table><thead><tr><th>模型编码</th><th>展示名</th><th>API秘钥</th><th>类型</th><th>价格摘要</th><th>排序</th><th>状态</th><th class="actions">操作</th></tr></thead><tbody>${rows}</tbody></table></div>
        </section>`;
      }

      modelRow = function modelRow(model) {
        const price = priceSummary(model.pricing);
        const apiKeyName = modelApiKeyName(model);
        const statusLabel = model.status === "active" ? "\u542f\u7528" : model.status === "disabled" ? "\u7981\u7528" : "\u5f52\u6863";
        const nextStatus = model.status === "active" ? "disabled" : "active";
        return `<tr><td>${escapeHtml(model.modelCode || "-")}</td><td>${escapeHtml(model.displayName || "-")}</td><td>${apiKeyName ? escapeHtml(apiKeyName) : ""}</td><td><span class="tag blue">${escapeHtml(modelKindLabel(model))}</span></td><td>${price}</td><td><div class="actions-row"><button class="icon-btn" title="\u4e0a\u79fb" onclick="moveModelSortOrder('${model.id}', -1)" ${permissionAttrs("model.write")}>\u2191</button><input style="width:64px;height:28px;padding:4px 6px;" type="number" value="${modelSortValue(model)}" onchange="saveModelSortOrder('${model.id}', this.value)" ${hasPermission("model.write") ? "" : "disabled"} /><button class="icon-btn" title="\u4e0b\u79fb" onclick="moveModelSortOrder('${model.id}', 1)" ${permissionAttrs("model.write")}>\u2193</button></div></td><td><span class="tag ${model.status === "active" ? "green" : "warn"}">${statusLabel}</span></td><td class="actions"><div class="actions-row"><button class="icon-btn" onclick="openModelEditorDrawer('${model.id}')" ${permissionAttrs("model.write")}>\u7f16</button><button class="icon-btn" onclick="openModelDuplicateDrawer('${model.id}')" ${permissionAttrs("model.write")}>\u590d</button><button class="icon-btn" onclick="updateModelStatusDirectly('${model.id}','${nextStatus}')" ${permissionAttrs("model.publish")}>${model.status === "active" ? "\u505c" : "\u542f"}</button><button class="icon-btn danger" onclick="openModelDeleteDrawer('${model.id}')" ${permissionAttrs("model.write")}>\u5220</button></div></td></tr>`;
      };

      async function saveModelSortOrder(modelId, value) {
        const model = state.models.find((item) => item.id === modelId);
        if (!model) return;
        const sortOrder = Number(value);
        if (!Number.isFinite(sortOrder)) {
          showToast("\u8bf7\u8f93\u5165\u6709\u6548\u6392\u5e8f\u503c");
          renderShell();
          return;
        }
        await api(`/api/admin/models/${encodeURIComponent(modelId)}`, {
          method: "PATCH",
          headers: { "idempotency-key": `admin-ui-model-sort-${modelId}-${Date.now()}` },
          body: JSON.stringify({ sortOrder, reason: "\u8c03\u6574\u6a21\u578b\u6392\u5e8f" }),
        });
        model.sortOrder = sortOrder;
        await loadModels();
        renderShell();
        showToast("\u6392\u5e8f\u5df2\u66f4\u65b0");
      }

      async function moveModelSortOrder(modelId, direction) {
        const rows = sortedModelRows();
        const index = rows.findIndex((item) => item.id === modelId);
        const target = rows[index + direction];
        if (index < 0 || !target) return;
        const current = rows[index];
        const currentSort = modelSortValue(current);
        const targetSort = modelSortValue(target);
        await Promise.all([
          api(`/api/admin/models/${encodeURIComponent(current.id)}`, {
            method: "PATCH",
            headers: { "idempotency-key": `admin-ui-model-sort-${current.id}-${Date.now()}` },
            body: JSON.stringify({ sortOrder: targetSort, reason: "\u8c03\u6574\u6a21\u578b\u6392\u5e8f" }),
          }),
          api(`/api/admin/models/${encodeURIComponent(target.id)}`, {
            method: "PATCH",
            headers: { "idempotency-key": `admin-ui-model-sort-${target.id}-${Date.now()}` },
            body: JSON.stringify({ sortOrder: currentSort, reason: "\u8c03\u6574\u6a21\u578b\u6392\u5e8f" }),
          }),
        ]);
        current.sortOrder = targetSort;
        target.sortOrder = currentSort;
        await loadModels();
        renderShell();
        showToast("\u6392\u5e8f\u5df2\u66f4\u65b0");
      }

      function openModelDeleteDrawer(modelId) {
        const model = state.models.find((item) => item.id === modelId);
        if (!model) return;
        const drawer = document.getElementById("drawer");
        drawer.classList.remove("hidden");
        drawer.innerHTML = `<aside class="drawer-panel">
          <div class="drawer-head"><h3>\u5220\u9664\u6a21\u578b</h3><button class="icon-btn" onclick="closeDrawer()">\u00d7</button></div>
          <p style="color:var(--muted);line-height:1.7">\u5220\u9664\u540e\u8be5\u6a21\u578b\u5c06\u4ece\u914d\u7f6e\u5217\u8868\u79fb\u9664\uff0c\u5386\u53f2\u751f\u6210\u4efb\u52a1\u4f1a\u4fdd\u7559\u6a21\u578b\u7f16\u7801\u8bb0\u5f55\u3002</p>
          <form id="model-delete-form">
            <div class="error-text" id="model-delete-error"></div>
            <button class="btn danger full" type="submit">\u786e\u8ba4\u5220\u9664</button>
          </form>
        </aside>`;
        document.getElementById("model-delete-form").addEventListener("submit", async (event) => {
          event.preventDefault();
          const form = new FormData(event.currentTarget);
          const error = document.getElementById("model-delete-error");
          await runAdminMutation(event.currentTarget, error, async () => {
            await api(`/api/admin/models/${encodeURIComponent(modelId)}`, {
              method: "DELETE",
              headers: { "idempotency-key": `admin-ui-model-delete-${modelId}-${Date.now()}` },
              body: JSON.stringify({ reason: String(form.get("reason") || "") }),
            });
            await loadModels();
            closeDrawer();
            renderShell();
          }, "\u6a21\u578b\u5df2\u5220\u9664").catch(() => undefined);
        });
      }

      window.openParameterTemplateDrawer = openParameterTemplateDrawer;
      window.deleteParameterTemplate = deleteParameterTemplate;
      window.parameterTemplatesPage = parameterTemplatesPage;
      window.addParameterTemplateOption = addParameterTemplateOption;
      window.moveParameterTemplateOption = moveParameterTemplateOption;
      window.removeParameterTemplateOption = removeParameterTemplateOption;
      window.openModelEditorDrawer = openModelEditorDrawer;
      window.openModelDeleteDrawer = openModelDeleteDrawer;
      window.updateModelStatusDirectly = updateModelStatusDirectly;
      window.saveModelSortOrder = saveModelSortOrder;
      window.moveModelSortOrder = moveModelSortOrder;
      const DEFAULT_ADMIN_OPERATION_REASON = "\u540e\u53f0\u7ba1\u7406\u5458\u64cd\u4f5c";

      function stripAdminReasonFields(root = document) {
        const forms = new Set();
        root.querySelectorAll?.('textarea[name="reason"]').forEach((textarea) => {
          const form = textarea.closest("form");
          if (form) forms.add(form);
          const field = textarea.closest(".field");
          (field || textarea).remove();
        });
        root.querySelectorAll?.("form").forEach((form) => forms.add(form));
        forms.forEach((form) => {
          if (!form.querySelector('input[type="hidden"][name="reason"]')) {
            const hidden = document.createElement("input");
            hidden.type = "hidden";
            hidden.name = "reason";
            hidden.value = DEFAULT_ADMIN_OPERATION_REASON;
            form.appendChild(hidden);
          }
        });
        root.querySelectorAll?.("p").forEach((paragraph) => {
          paragraph.textContent = paragraph.textContent
            .replace(/\u654f\u611f\u64cd\u4f5c\u5fc5\u987b\u586b\u5199\u539f\u56e0/g, "\u7cfb\u7edf\u4f1a\u81ea\u52a8\u8bb0\u5f55\u5ba1\u8ba1\u539f\u56e0")
            .replace(/\u5371\u9669\u64cd\u4f5c\u5fc5\u987b\u586b\u5199\u539f\u56e0/g, "\u7cfb\u7edf\u4f1a\u81ea\u52a8\u8bb0\u5f55\u5ba1\u8ba1\u539f\u56e0");
        });
      }

      const adminReasonObserver = new MutationObserver((mutations) => {
        for (const mutation of mutations) {
          mutation.addedNodes.forEach((node) => {
            if (node.nodeType === Node.ELEMENT_NODE) stripAdminReasonFields(node);
          });
        }
      });
      adminReasonObserver.observe(document.body, { childList: true, subtree: true });
      stripAdminReasonFields(document);
      setupDrawerInteractions();
      window.openPasswordChangeDrawer = openPasswordChangeDrawer;
      window.loadAdminSessions = loadAdminSessions;
      window.revokeOtherAdminSessions = revokeOtherAdminSessions;
      window.logout = logout;
      window.closeDrawer = closeDrawer;

      bootstrap();
    </script>
  </body>
</html>
