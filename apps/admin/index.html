      function resourcePreviewModal() {
        if (!state.resourcePreviewOpen) return "";
        const selected = state.resources.find((item) => item.id === state.resourceSelectedId) || null;
        if (!selected) return "";
        const previewUrl = storagePreviewUrl(selected);
        if (!previewUrl) return "";
        const isVideo = resourceKindLabel(selected) === "视频";
        const media = isVideo
          ? `<video controls autoplay playsinline preload="metadata" src="${escapeAttribute(previewUrl)}"></video>`
          : `<img src="${escapeAttribute(previewUrl)}" alt="${escapeAttribute(selected.fileName || selected.objectKey || "资源预览")}" referrerpolicy="no-referrer" />`;
        return `<div class="resource-preview-modal" onclick="if(event.target===this) closeResourcePreview()">
          <div class="resource-preview-dialog">
            <div class="resource-preview-head">
              <div class="resource-preview-title">
                <strong>${escapeHtml(selected.fileName || selected.objectKey || "资源预览")}</strong>
                <span>${escapeHtml(previewUrl)}</span>
              </div>
              <button class="btn resource-preview-close" type="button" onclick="closeResourcePreview()">关闭</button>
            </div>
            <div class="resource-preview-stage">${media}</div>
          </div>
        </div>`;
      }

      function resourcesPage() {
        const items = Array.isArray(state.resources) ? state.resources : [];
        const pageSize = Number(state.resourcePageSize) || 10;
        const totalCount = Math.max(0, Number(state.resourceTotal) || 0);
        const totalPages = Math.max(1, Math.ceil(totalCount / pageSize));
        const currentPage = Math.min(Math.max(1, Number(state.resourcePage) || 1), totalPages);
        state.resourcePage = currentPage;
        const tableContent = items.length
          ? `<div class="resource-table-wrap"><table class="resource-table"><thead><tr><th class="preview-col">图片/视频</th><th>链接</th><th class="size-col">大小</th><th class="type-col">类型</th><th class="user-col">用户</th><th class="phone-col">手机</th><th class="time-col">创建时间</th><th class="actions">操作</th></tr></thead><tbody>${items.map((item) => resourceTableRow(item)).join("")}</tbody></table></div>`
          : `<div class="resource-inspector-empty">${state.resourceLoadError || "暂无资源"}</div>`;
        const stats = state.resourceStats || {};
        return `<div class="section-stack resources-layout">
          <section class="card">
            <div class="toolbar">
              <div>
                <h3 style="margin:0;">资源列表</h3>
                <div class="metric-note">以列表形式集中查看图片和视频资源，支持放大预览、复制链接与删除。</div>
              </div>
              <div class="filters">
                <input value="${escapeAttribute(state.resourceSearch || "")}" placeholder="搜索文件名 / 对象键 / 项目 / 上传人" oninput="updateResourceSearch(this.value)" />
                <select onchange="updateResourceMediaFilter(this.value)">${resourceFilterOptions(state.resourceMediaFilter || "all", [{ value: "all", label: "全部资源" }, { value: "image", label: "图片" }, { value: "video", label: "视频" }])}</select>
                <select onchange="updateResourceRangeFilter(this.value)">${resourceFilterOptions(state.resourceRangeFilter || "all", [{ value: "all", label: "全部时间" }, { value: "day", label: "今日" }, { value: "month", label: "本月" }])}</select>
                <button class="btn ghost" onclick="loadResources().then(renderShell)">刷新</button>
              </div>
            </div>
            <div class="resource-stat-grid" style="margin-bottom:12px;">
              <div class="resource-stat"><div class="metric-note">资源总数</div><div>${Number(stats.total || 0)}</div></div>
              <div class="resource-stat"><div class="metric-note">图片总数</div><div>${Number(stats.imageCount || 0)}</div></div>
              <div class="resource-stat"><div class="metric-note">视频总数</div><div>${Number(stats.videoCount || 0)}</div></div>
              <div class="resource-stat"><div class="metric-note">图片占用</div><div>${formatBytes(Number(stats.imageBytes || 0))}</div></div>
              <div class="resource-stat"><div class="metric-note">视频占用</div><div>${formatBytes(Number(stats.videoBytes || 0))}</div></div>
            </div>
            <div class="resources-list">${tableContent}</div>
            ${totalCount ? `<div class="resource-pagination">
              <span class="metric-note">第 ${currentPage} / ${totalPages} 页 · 共 ${totalCount} 条</span>
              <button class="btn ghost" type="button" onclick="setResourcePage(${currentPage - 1})" ${currentPage <= 1 ? "disabled" : ""}>上一页</button>
              <button class="btn ghost" type="button" onclick="setResourcePage(${currentPage + 1})" ${currentPage >= totalPages ? "disabled" : ""}>下一页</button>
            </div>` : ""}
          </section>
        </div>${resourcePreviewModal()}`;
      }

      async function updateRiskStatusFilter(value) {
        state.riskStatusFilter = value || "all";
        const content = document.getElementById("risk-workspace-content");
        if (content) content.innerHTML = riskWorkspaceContent();
      }

      function riskStatusOptions() {
        return [
          ["all", "全部状态"],
          ["open", "待复核"],
          ["reviewed", "已复核"],
          ["ignored_with_reason", "有原因忽略"],
        ].map(([value, label]) => `<option value="${value}" ${state.riskStatusFilter === value ? "selected" : ""}>${label}</option>`).join("");
      }

      function paymentRiskRow(risk) {
        return `<tr><td class="risk-primary"><div class="risk-title">${escapeHtml(riskTypeLabel(risk.riskType))}</div><div class="risk-code">${escapeHtml(risk.riskType)}</div><div class="risk-context">${escapeHtml(riskContextSummary(risk))}</div></td><td><div class="risk-code">${escapeHtml(risk.orderId || "-")}</div><div class="risk-context">${escapeHtml(risk.paymentIntentId || risk.providerEventId || "无支付单记录")}</div></td><td><span class="tag ${riskSeverityTone(risk.severity)}">${riskSeverityLabel(risk.severity)}</span></td><td>${escapeHtml(riskDecisionLabel(risk.decision))}</td><td><span class="tag ${risk.status === "open" ? "warn" : "green"}">${riskStatusLabel(risk.status)}</span></td><td class="risk-time">${escapeHtml(formatAdminDateTime(risk.createdAt))}</td><td class="actions"><button class="btn ghost risk-action" onclick="openRiskReviewDrawer('${escapeAttribute(risk.id)}')" ${permissionAttrs("risk.review")} ${risk.status !== "open" ? "disabled" : ""}>${risk.status === "open" ? "复核" : "已处理"}</button></td></tr>`;
      }

      function taskExceptionRow(task) {
        const recommendation = taskRecommendedAction(task);
        const attempts = Number.isFinite(Number(task.maxAttempts)) ? `${Number(task.attemptCount || 0)} / ${Number(task.maxAttempts || 0)}` : "-";
        return `<tr><td class="risk-primary"><div class="risk-title">${escapeHtml(taskTypeLabel(task.taskType))}</div><div class="risk-code">${escapeHtml(task.id)}</div><div class="risk-context">项目 ${escapeHtml(task.projectId || "-")} · 工作流 ${escapeHtml(task.workflowId || "-")}</div></td><td><div class="risk-title">${escapeHtml(taskFailureLabel(task.failureCode))}</div><div class="risk-code">${escapeHtml(task.failureCode || "no_failure_code")}</div></td><td>${escapeHtml(task.providerName || "-")}<div class="risk-context">${escapeHtml(task.providerStatus ? `供应商状态：${task.providerStatus}` : task.providerOperation || "")}</div></td><td><div class="risk-code">${escapeHtml(task.queueName || "-")}</div></td><td><span class="tag warn">${escapeHtml(taskStatusLabel(task.status))}</span><div class="risk-context">尝试 ${attempts}</div></td><td class="risk-time">${escapeHtml(formatAdminDateTime(task.updatedAt))}</td><td class="actions"><button class="btn ${recommendation.tone === "warn" ? "primary" : "ghost"} risk-action" onclick="openTaskOpsDrawer('${escapeAttribute(task.id)}')" ${permissionAttrs("ops.task.retry")}>${escapeHtml(recommendation.label)}</button></td></tr>`;
      }

      function paymentIssueRow(issue) {
        const statusLabel = issue.status === "resolved" ? "已修复" : "待修复";
        return `<tr><td class="risk-primary"><div class="risk-title">${escapeHtml(issue.orderNo || "未记录订单号")}</div><div class="risk-code">${escapeHtml(issue.orderId)}</div></td><td><div class="risk-code">${escapeHtml(issue.successfulPaymentIntentId || "-")}</div></td><td>${Number(issue.credits || 0).toLocaleString()}</td><td>${money(issue.amountMinor)} <span class="risk-context">${escapeHtml(issue.currency || "CNY")}</span></td><td class="risk-time">${escapeHtml(formatAdminDateTime(issue.paidAt))}</td><td><span class="tag ${issue.status === "resolved" ? "green" : "warn"}">${statusLabel}</span></td><td class="actions"><button class="btn primary risk-action" onclick="openPaymentRepairDrawer('${escapeAttribute(issue.orderId)}')" ${permissionAttrs("risk.review")} ${issue.status === "resolved" ? "disabled" : ""}>${issue.status === "resolved" ? "已补发" : "补发积分"}</button></td></tr>`;
      }

      function auditEventRow(event) {
        const metadata = event.metadata || {};
        const adminName = event.adminDisplayName || metadata.adminDisplayName || metadata.loginName || "系统";
        return `<tr><td class="risk-primary"><div class="risk-title">${escapeHtml(dashboardEventLabel({ type: event.eventType }))}</div><div class="risk-code">${escapeHtml(event.eventType)}</div></td><td>${escapeHtml(adminName)}</td><td>${escapeHtml(event.targetType)}<div class="risk-code">${escapeHtml(event.targetId)}</div></td><td>${escapeHtml(event.reason || "未填写原因")}</td><td class="risk-time">${escapeHtml(formatAdminDateTime(event.createdAt))}</td><td class="actions"><button class="btn ghost risk-action" title="查看审计详情" onclick="openAuditEventDrawer('${escapeAttribute(event.id)}')">详情</button></td></tr>`;
      }

      function riskTypeLabel(value) {
        return ({ merchant_mismatch: "商户订单信息不一致", amount_mismatch: "支付金额不一致", currency_mismatch: "支付币种不一致", duplicate_callback: "重复支付回调", payment_replay: "疑似支付事件重放", provider_event_conflict: "供应商事件冲突" })[value] || "未分类支付风险";
      }

      function riskSeverityLabel(value) {
        return value === "critical" ? "高风险" : value === "warning" ? "中风险" : "低风险";
      }

      function riskSeverityTone(value) {
        return value === "critical" ? "warn" : value === "warning" ? "blue" : "green";
      }

      function riskDecisionLabel(value) {
        return ({ manual_review: "需要人工复核", reject: "拒绝处理", allow: "允许继续", ignore: "有原因忽略" })[value] || value || "未给出处置决策";
      }

      function riskStatusLabel(value) {
        return value === "open" ? "待复核" : value === "reviewed" ? "已复核" : value === "ignored_with_reason" ? "有原因忽略" : value || "未知";
      }

      function riskContextSummary(risk) {
        const metadata = risk.metadata || {};
        const provider = metadata.provider || metadata.providerName || "未记录供应商";
        const orderNo = metadata.merchantOrderNo || metadata.orderNo || risk.orderId || "未记录订单";
        const amount = metadata.callbackAmountMinor ?? metadata.amountMinor;
        return `${provider} · ${orderNo}${amount === undefined ? "" : ` · 回调金额 ${money(amount)}`}`;
      }

      function taskTypeLabel(value) {
        return ({ episode_generate_image: "分镜图片生成", episode_generate_video: "分镜视频生成", episode_export_storyboard_videos: "分镜视频导出", generate_image: "图片生成", generate_video: "视频生成" })[value] || value || "未知任务";
      }

      function taskStatusLabel(value) {
        return ({ failed: "执行失败", canceled: "已取消", result_unknown: "供应商结果未知", manual_review_required: "需要人工复核", queued: "等待执行", running: "执行中", succeeded: "已成功" })[value] || value || "未知状态";
      }

      function taskFailureLabel(value) {
        return ({ task_timeout: "任务执行超时", provider_submission_failed: "供应商提交失败", provider_submission_ambiguous: "供应商提交结果不明确", lease_expired_after_external_start: "外部请求已开始但本地租约过期", provider_result_unknown: "供应商结果未知", provider_output_storage_failed: "生成结果存储失败", provider_output_download_failed: "供应商结果下载失败", provider_output_upload_failed: "结果上传对象存储失败", provider_output_persist_failed: "资产记录写入失败", provider_failed: "供应商生成失败", provider_poll_timeout: "供应商查询超时", provider_api_key_env_required: "供应商密钥未配置", model_reference_video_required: "缺少参考视频" })[value] || value || "未记录失败原因";
      }

      function taskOpsActions(task) {
        const actions = [];
        const providerInFlight = ["submitted", "accepted", "running", "result_unknown"].includes(task.providerStatus);
        const providerTerminalFailure = ["failed", "canceled"].includes(task.providerStatus);
        const externalStarted = Boolean(task.externalSubmissionStartedAt);
        const hasExternalId = Boolean(task.externalRequestId);
        const isGenerationTask = ["episode_generate_image", "episode_generate_video", "episode_generate_audio"].includes(task.taskType);
        if (["provider_output_storage_failed", "provider_output_download_failed", "provider_output_upload_failed"].includes(task.failureCode)) {
          actions.push({ value: "retry_finalize", label: "重新下载并归档产物", badge: "产物恢复", summary: "复用供应商已经生成的结果，重新执行下载、对象存储上传和任务收尾。", prerequisite: "供应商结果中仍有可访问的产物地址", effects: "任务 → 人工复核；新增归档 Outbox；积分暂不变更" });
        }
        if (task.failureCode === "provider_output_persist_failed") {
          actions.push({ value: "retry_persist_asset", label: "补写资产与任务结果", badge: "数据修复", summary: "对象存储已有文件，仅补写资产记录、任务结果和工作流聚合。", prerequisite: "生成快照中存在 storageObjectKey", effects: "新增仅落库归档 Outbox；不会重复下载或调用供应商" });
        }
        if (task.providerStatus === "succeeded" && hasExternalId && !actions.some((item) => item.value === "retry_finalize")) {
          actions.push({ value: "rebuild_finalize", label: "从供应商成功结果重建终态", badge: "结果同步", summary: "供应商已经成功，但本地终态或归档任务缺失，重新创建归档工作。", prerequisite: "最新供应商请求为 succeeded 且存在外部请求 ID", effects: "任务 → 人工复核；新增归档 Outbox；不重新提交生成" });
        }
        if (isGenerationTask && providerInFlight && externalStarted && hasExternalId && ["running", "failed", "result_unknown", "manual_review_required"].includes(task.status)) {
          actions.push({ value: "resume_provider_poll", label: "重新拉取供应商状态", badge: "供应商同步", summary: "沿用原外部请求 ID 恢复轮询；成功后自动进入产物归档。", prerequisite: "外部请求已受理，状态仍为执行中或结果未知", effects: "任务/工作流 → 执行中；新增轮询 Outbox；不会再次提交生成" });
        }
        const redispatchableStatus = task.status === "queued" || (["failed", "canceled"].includes(task.status) && Number(task.attemptCount || 0) < Number(task.maxAttempts || 0));
        if (isGenerationTask && redispatchableStatus && (!externalStarted || providerTerminalFailure)) {
          actions.push({ value: "redispatch", label: task.status === "queued" ? "补投递到生成队列" : "修复状态并重新投递", badge: "队列恢复", summary: "以 PostgreSQL 任务为事实源重新创建生成 Outbox，再由调度器投递 BullMQ。", prerequisite: externalStarted ? "供应商请求已明确失败或取消" : "当前尝试尚未开始外部提交", effects: "任务/工作流 → 等待执行；新增带独立令牌的生成 Outbox；可能产生新尝试" });
        }
        if (["result_unknown", "manual_review_required"].includes(task.status)) {
          actions.push({ value: "manual_settle", label: "人工确认结果与积分", badge: "账务决策", summary: "在供应商后台核验最终结果后，人工决定释放、扣减或保留异常成本。", prerequisite: "操作人已取得可验证的供应商结果或成本凭据", effects: "更新任务、尝试、供应商请求与积分预占；写入敏感审计" });
        }
        return actions;
      }

      function taskOpsUnavailableActions(task) {
        const unavailable = [];
        const externalStarted = Boolean(task.externalSubmissionStartedAt);
        const hasExternalId = Boolean(task.externalRequestId);
        if (externalStarted && !["failed", "canceled"].includes(task.providerStatus)) unavailable.push({ label: "重新提交供应商", reason: "外部请求已开始且未明确失败，禁止重复生成和重复扣费" });
        if (!hasExternalId) unavailable.push({ label: "重新拉取供应商状态", reason: "没有外部请求 ID，无法定向查询原请求" });
        if (task.providerStatus !== "succeeded") unavailable.push({ label: "直接重建归档", reason: "供应商尚未返回成功状态，不能假设已有可用产物" });
        if (!["result_unknown", "manual_review_required"].includes(task.status)) unavailable.push({ label: "人工积分结算", reason: "当前任务不在结果未知或人工复核状态" });
        return unavailable;
      }

      function taskRecommendedAction(task) {
        const action = taskOpsActions(task)[0];
        if (!action) return { label: "查看", note: "当前状态没有可安全执行的自动操作", tone: "blue" };
        if (action.value === "retry_finalize") return { label: "重新归档", note: "复用供应商结果，重新下载并上传平台存储", tone: "warn" };
        if (action.value === "retry_persist_asset") return { label: "重新落库", note: "对象已上传，仅重新写入资产和任务结果", tone: "warn" };
        if (action.value === "rebuild_finalize") return { label: "重建终态", note: "供应商已成功，重新创建归档任务", tone: "warn" };
        if (action.value === "resume_provider_poll") return { label: "重新拉取", note: "沿用外部请求 ID 恢复供应商结果查询", tone: "blue" };
        if (action.value === "redispatch") return { label: "补投队列", note: "从任务事实重新创建 Outbox 并投递", tone: "blue" };
        if (action.value === "manual_settle") return { label: "人工结算", note: "确认供应商结果，并决定积分消耗或释放", tone: "warn" };
        return { label: "重新排队", note: "清理任务锁并重新投递生成任务", tone: "blue" };
      }

      function taskProgressStageLabel(value) {
        return ({ provider_result_unknown: "等待供应商结果", provider_accepted: "供应商已受理", provider_rendering: "供应商生成中", saving_asset: "正在归档产物", asset_transfer_retry_pending: "等待重试产物传输", asset_persist_failed: "资产记录待修复" })[value] || value || "未记录生成阶段";
      }

      function taskOutboxLabel(task) {
        if (!task.outboxStatus) return "未发现活动记录";
        const type = ({ "generation.task.created": "生成投递", "generation.task.poll_requested": "结果轮询", "generation.task.finalize_requested": "产物归档" })[task.outboxEventType] || task.outboxEventType || "Outbox";
        const status = ({ pending: "待投递", processing: "投递中", processed: "已投递", failed: "投递失败" })[task.outboxStatus] || task.outboxStatus;
        return `${type} · ${status}`;
      }

      function queueRoleLabel(value) {
        return ({ submit_image: "图片提交队列", submit_video: "视频提交队列", poll_image: "图片结果查询队列", poll_video: "视频结果查询队列", poll_audio: "音频结果查询队列", finalize_artifact: "生成结果归档队列", dead_letter: "死信队列" })[value] || value || "未知队列";
      }

      function downloadRiskExport(scope) {
        const url = new URL(
          scope === "audit-events" ? "/api/admin/exports/audit-events.csv" : "/api/admin/exports/risks.csv",
          window.location.origin,
        );
        if (scope === "risks" && state.riskStatusFilter && state.riskStatusFilter !== "all") {
          url.searchParams.set("riskStatus", state.riskStatusFilter);
        }
        window.location.assign(url.toString());
      }

      function openAuditEventDrawer(eventId) {
        const event = state.auditEvents.find((item) => item.id === eventId);
        if (!event) return;
        const metadata = event.metadata || {};
        const ipAddress = event.ipAddress || metadata.ipAddress || "-";
        const userAgent = event.userAgent || metadata.userAgent || "-";
        const adminDisplayName = event.adminDisplayName || metadata.adminDisplayName || metadata.loginName || "-";
        const result = event.result || metadata.result || "success";
        const drawer = document.getElementById("drawer");
        drawer.classList.remove("hidden");
        drawer.innerHTML = `<aside class="drawer-panel" style="width:min(720px,100%);">
          <div class="drawer-head"><h3>审计详情</h3><button class="icon-btn" onclick="closeDrawer()">×</button></div>
          <section class="card">
            <h4>审计主体</h4>
            <div class="check-list">
              <div><span>管理员</span><span>${adminDisplayName}</span></div>
              <div><span>动作</span><span>${event.eventType}</span></div>
              <div><span>结果</span><span class="tag ${result === "success" ? "green" : "warn"}">${result}</span></div>
            </div>
          </section>
          <section class="card">
            <h4>目标对象</h4>
            <div class="check-list">
              <div><span>类型</span><span>${event.targetType}</span></div>
              <div><span>ID</span><span>${event.targetId}</span></div>
              <div><span>原因</span><span>${event.reason || "-"}</span></div>
              <div><span>时间</span><span>${new Date(event.createdAt).toLocaleString("zh-CN")}</span></div>
            </div>
          </section>
          <section class="card">
            <h4>请求上下文</h4>
            <div class="check-list">
              <div><span>ipAddress</span><span>${ipAddress}</span></div>
              <div><span>userAgent</span><span style="word-break:break-all;">${userAgent}</span></div>
            </div>
          </section>

            <div class="table-wrap settings compact"><table><thead><tr><th>&#24341;&#29992;&#21517;</th><th>&#23494;&#38053;</th><th>&#35831;&#27714;&#22495;&#21517;</th><th>&#20379;&#24212;&#21830;</th><th>&#29366;&#24577;</th><th class="actions">&#25805;&#20316;</th></tr></thead><tbody>${secretRows}</tbody></table></div>

      function configRow(config) {
        const value = compactJson(config.value);
        return `<tr><td>${config.key}<div class="metric-note">${config.description || "无说明"}</div></td><td>${config.scope}</td><td><span class="tag blue">${config.valueType}</span></td><td title="${escapeHtml(value)}">${escapeHtml(value)}</td><td class="actions"><div class="actions-row"><button class="icon-btn" onclick="openRuntimeConfigDrawer('${config.key}')" ${permissionAttrs("settings.write")}>改</button><button class="icon-btn" title="历史" onclick="openRuntimeConfigHistoryDrawer('${config.key}')">史</button></div></td></tr>`;
      }

      function secretReferenceRow(secret) {
        const statusClass = secret.status === "configured" ? "green" : secret.status === "missing" ? "warn" : "blue";
        const statusLabel = secret.status === "configured" ? "\u5df2\u914d\u7f6e" : secret.status === "missing" ? "\u7f3a\u5931" : "\u672a\u77e5";
        const checkedText = secret.lastCheckedAt ? new Date(secret.lastCheckedAt).toLocaleString("zh-CN") : "\u672a\u68c0\u6d4b";
        return `<tr><td>${escapeHtml(secret.secretRef || "-")}<div class="metric-note">\u5f15\u7528\u952e\uff1a${escapeHtml(secret.envName || "-")}</div></td><td>${secretValueControl(secret)}<div class="metric-note">${checkedText}</div></td><td>${escapeHtml(secret.requestDomain || secret.baseUrl || "-")}</td><td>${escapeHtml(secret.providerName || "-")}</td><td><span class="tag ${statusClass}">${statusLabel}</span></td><td class="actions"><div class="actions-row"><button class="icon-btn" title="\u63a2\u6d4b\u5bc6\u94a5" onclick="probeSecretReference('${secret.id}')" ${permissionAttrs("settings.write")}>\u6d4b</button><button class="icon-btn" title="\u7f16\u8f91\u5bc6\u94a5" onclick="openSecretReferenceDrawer('${secret.id}')" ${permissionAttrs("settings.write")}>\u6539</button><button class="icon-btn" title="\u5220\u9664\u5bc6\u94a5" onclick="deleteSecretReference('${secret.id}')" ${permissionAttrs("settings.write")}>\u5220</button></div></td></tr>`;
      }

      function secretValueControl(secret) {
        const revealedValue = state.revealedSecretValues?.[secret.id];
        const isRevealed = typeof revealedValue === "string" && revealedValue.length > 0;
        const displayValue = isRevealed
          ? revealedValue
          : secret.maskedSecretValue || (secret.hasSecret ? "\u5df2\u4fdd\u5b58\uff08\u5df2\u9690\u85cf\uff09" : "\u672a\u4fdd\u5b58");
        const label = isRevealed ? "\u9690\u85cf\u5bc6\u94a5" : "\u67e5\u770b\u5bc6\u94a5";
        return `<span class="secret-value-control" data-secret-value-id="${escapeAttribute(secret.id)}"><code class="secret-value-text">${escapeHtml(displayValue)}</code><button class="icon-btn secret-visibility-btn" type="button" title="${label}" aria-label="${label}" aria-pressed="${isRevealed ? "true" : "false"}" onclick="toggleSecretValue('${secret.id}')" ${permissionAttrs("settings.write")}>${secretVisibilityIcon(isRevealed)}</button></span>`;
      }

      function secretVisibilityIcon(isRevealed) {
        const slash = isRevealed ? '<path d="m3 3 18 18"></path>' : "";
        return `<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2.1 12s3.6-7 9.9-7 9.9 7 9.9 7-3.6 7-9.9 7-9.9-7-9.9-7Z"></path><circle cx="12" cy="12" r="3"></circle>${slash}</svg>`;
      }

      function adminAccountRow(account) {
        const statusLabel = account.status === "active" ? "启用" : account.status === "disabled" ? "禁用" : "归档";
        const nextStatus = account.status === "active" ? "disabled" : "active";
        const protectedLabel = account.isProtectedSuperAdmin
          ? `<span class="tag blue">受保护超级管理员</span>`
          : escapeHtml((account.roles || []).join(" / "));
        const actions = account.isProtectedSuperAdmin
          ? `<span class="metric-note">${account.id === state.session?.account?.id ? "请到账户页修改本人资料" : "受保护账号"}</span>`
          : `<div class="actions-row"><button class="icon-btn" onclick="openAdminAccountEditDrawer('${account.id}')" ${permissionAttrs("admin_account.write")}>改</button><button class="icon-btn" onclick="openAdminAccountPasswordResetDrawer('${account.id}')" ${permissionAttrs("admin_account.write")}>密</button><button class="icon-btn" onclick="openAdminAccountEditDrawer('${account.id}','${nextStatus}')" ${permissionAttrs("admin_account.write")}>${nextStatus === "disabled" ? "停" : "启"}</button></div>`;
        return `<tr><td>${escapeHtml(account.loginName || "-")}</td><td>${escapeHtml(account.displayName || "-")}</td><td>${protectedLabel}</td><td><span class="tag ${account.status === "active" ? "green" : "warn"}">${statusLabel}</span></td><td class="actions">${actions}</td></tr>`;
      }

      function compactJson(value) {
        if (typeof value === "string") return value;
        if (value && typeof value === "object" && "contentHtml" in value) {
          const legalValue = normalizeLegalDocumentValue("", value);
          return JSON.stringify({
            title: legalValue.title,
            versionLabel: legalValue.versionLabel,
            contentPreview: stripHtmlToText(legalValue.contentHtml).slice(0, 80),
          });
        }
        return JSON.stringify(value);
      }

      function normalizeCustomerSupportConfig(value) {
        const source = value && typeof value === "object" && !Array.isArray(value) ? value : {};
        const communitySubtitle = String(source.communitySubtitle || DEFAULT_CUSTOMER_SUPPORT_CONFIG.communitySubtitle).trim();
        return {
          onlineServiceLabel: String(source.onlineServiceLabel || DEFAULT_CUSTOMER_SUPPORT_CONFIG.onlineServiceLabel).trim(),
          communityTitle: String(source.communityTitle || DEFAULT_CUSTOMER_SUPPORT_CONFIG.communityTitle).trim(),
          communitySubtitle: communitySubtitle === CUSTOMER_SUPPORT_LEGACY_COMMUNITY_SUBTITLE
            ? DEFAULT_CUSTOMER_SUPPORT_CONFIG.communitySubtitle
            : communitySubtitle,
          communityImageUrl: String(source.communityImageUrl || "").trim(),
          enterpriseContactImageUrl: String(source.enterpriseContactImageUrl || "").trim(),
        };
      }

      function customerSupportConfigEntry() {
        return state.settings.configs.find((config) => config.key === CUSTOMER_SUPPORT_CONFIG_KEY) || null;
      }

      function customerSupportConfig() {
        return normalizeCustomerSupportConfig(customerSupportConfigEntry()?.value || DEFAULT_CUSTOMER_SUPPORT_CONFIG);
      }

                ${config.communityImageUrl ? `<img src="${escapeAttribute(config.communityImageUrl)}" alt="客服二维码" style="display:block;width:100%;height:160px;object-fit:contain;" />` : "暂无二维码"}

                ${config.enterpriseContactImageUrl ? `<img src="${escapeAttribute(config.enterpriseContactImageUrl)}" alt="联系商务二维码" style="display:block;width:100%;height:160px;object-fit:contain;" />` : "暂无二维码"}

        const enterpriseImageFile = document.getElementById("enterprise-contact-image-file");
        const enterpriseImagePreview = document.getElementById("enterprise-contact-image-preview");

          const url = String(imageInput.value || "").trim();
          imagePreview.innerHTML = url
            ? `<img src="${escapeAttribute(url)}" alt="二维码预览" style="display:block;width:100%;height:100%;object-fit:contain;" />`
            : "二维码预览";

          const file = imageFile.files?.[0];
          if (!file) return;
          if (!file.type.startsWith("image/")) return;
          try {
            imageFile.disabled = true;
            const uploaded = await uploadAdminImage(file, "/api/admin/settings/assets/uploads");
            imageInput.value = uploaded.sourceUrl || uploaded.previewUrl || "";
            renderImagePreview();
            showToast("二维码已上传，保存后生效");

            showToast(error.message || "二维码上传失败");
          } finally {
            imageFile.disabled = false;
            imageFile.value = "";

              method: "PATCH",
              headers: { "idempotency-key": `admin-ui-customer-support-${Date.now()}` },
              body: JSON.stringify({
                value: {
                  onlineServiceLabel: String(data.get("onlineServiceLabel") || "").trim(),
                  communityTitle: String(data.get("communityTitle") || "").trim(),
                  communitySubtitle: String(data.get("communitySubtitle") || "").trim(),
                  communityImageUrl: String(data.get("communityImageUrl") || "").trim(),
                  enterpriseContactImageUrl: String(data.get("enterpriseContactImageUrl") || "").trim(),

                scope: existing?.scope || "creator",
                description: existing?.description || "前台客服与联系商务二维码配置",

              }),
            });
            await loadSettings();
            closeDrawer();
            renderShell();
          }, "客服与商务二维码配置已保存");

        const recommendation = isDeadLetter ? deadLetterRecommendation(job, task) : null;
        const replayReady = isDeadLetter && canReplayDeadLetterJob(job, task);
        const actionOptions = isDeadLetter
          ? `${replayReady ? `<option value="replay">重放到原队列</option>` : ""}<option value="remove">归档并移除死信</option>`
          : `<option value="retry">重试失败任务</option><option value="remove">从队列移除任务</option>`;
        drawer.innerHTML = `<aside class="drawer-panel" style="width:min(760px,100%);">

          <p style="color:var(--muted);line-height:1.7">这里操作的是 BullMQ 队列记录。${isDeadLetter ? "先处置 PostgreSQL 业务任务，再决定是否重放或归档死信" : "重试会重新执行失败 job"}；移除不会改写业务任务事实。</p>

            <div><span>已尝试</span><span>${Number(job.attemptsMade || 0).toLocaleString()} 次</span></div>

          ${recommendation ? `<div class="queue-job-guidance"><strong>${escapeHtml(recommendation.label)}</strong>${escapeHtml(recommendation.note)}${!replayReady ? "。业务任务恢复到可执行状态前，系统不会开放死信重放。" : "。当前业务状态已通过重放前置校验。"}</div>` : ""}
          ${task ? `<div class="toolbar"><button class="btn ghost" type="button" onclick="openTaskOpsDrawer('${escapeAttribute(task.id)}')">先处置业务任务</button></div>` : ""}

            await api("/api/admin/ops/generation-queues/jobs", {
              method: "POST",
              headers: { "idempotency-key": adminIdempotencyKey(`queue-${action}-${queueName}-${jobId}`) },
              body: JSON.stringify({ queueName, jobId, action, reason: String(form.get("reason") || "") }),
            });
            await loadRiskAudit();
            closeDrawer();
            renderShell();
          }, action === "retry" ? "队列任务已重试" : action === "replay" ? "死信任务已重放" : "队列任务已移除").catch(() => undefined);
        });
      }

      function canReplayDeadLetterJob(job, task) {
        if (!task) return false;
        const sourceJobName = String(job?.data?.sourceJobName || "");
        if (sourceJobName.includes(".poll")) {
          return task.status === "running"
            && task.outboxStatus === "failed"
            && Boolean(task.externalRequestId)
            && ["submitted", "accepted", "running", "result_unknown"].includes(task.providerStatus);
        }
        if (sourceJobName.includes(".submit")) {
          return task.status === "queued"
            && task.outboxStatus === "failed"
            && !task.externalSubmissionStartedAt;
        }
        return false;
      }

      function openCreditAdjustDrawer(userId, initialAction = "grant") {
        const targetUser = state.users.find((user) => user.userId === userId);

        const displayName = targetUser?.displayName || userId;
        const currentCredits = Number(targetUser?.availableCredits || 0);
        const drawer = document.getElementById("drawer");
        drawer.classList.remove("hidden");
        drawer.innerHTML = `<aside class="drawer-panel">
          ${userDrawerHead("调整积分", userId)}
          <p style="color:var(--muted);line-height:1.7">调整 ${displayName} 的可用积分。提交后会写入 credit_ledger_entries、更新余额并记录后台审计。</p>
          <form id="credit-adjust-form">
            <div class="check-list" style="margin-bottom:14px;">
              <div><span>当前可用积分</span><span id="credit-current-balance">${currentCredits.toLocaleString()}</span></div>

            <label class="field"><span>调整方式</span><select name="adjustmentType" id="credit-adjust-type">
              ${optionPairs([["grant", "增加积分"], ["deduct", "扣减积分"], ["setBalance", "调整到目标积分"]], initialAction)}
            </select></label>
            <label class="field"><span id="credit-adjust-amount-label">积分数量</span><input name="amount" type="number" min="1" step="1" required /></label>
            <label class="field"><span>调整场景</span><select name="adjustmentScenario" id="credit-adjust-scenario">${adjustmentScenarioOptions(initialAction === "grant" ? "compensation" : "correction")}</select></label>
            <label class="field"><span>关联工单号（选填）</span><input name="workOrderNo" placeholder="例如：CS-20260605-001" /></label>
            <div class="error-text" id="credit-adjust-error"></div>
            <button class="btn primary full" type="submit">确认调整积分</button>
          </form>
        </aside>`;
        const formElement = document.getElementById("credit-adjust-form");
        const typeInput = document.getElementById("credit-adjust-type");
        const amountInput = formElement.elements.amount;
        const amountLabel = document.getElementById("credit-adjust-amount-label");
        const deltaNode = document.getElementById("credit-adjust-delta");
        const scenarioInput = document.getElementById("credit-adjust-scenario");
        const updateCreditAdjustPreview = () => {
          const adjustmentType = String(typeInput.value || "grant");
          const amount = Number(amountInput.value);
          amountLabel.textContent = adjustmentType === "setBalance" ? "目标可用积分" : "积分数量";
          amountInput.min = adjustmentType === "setBalance" ? "0" : "1";
          if (!Number.isFinite(amount) || amountInput.value === "") {
            deltaNode.textContent = "-";
            return;
          }
          const delta = adjustmentType === "setBalance"
            ? Math.trunc(amount) - currentCredits
            : adjustmentType === "grant" ? Math.trunc(amount) : -Math.trunc(amount);
          deltaNode.textContent = `${delta > 0 ? "+" : ""}${delta.toLocaleString()}`;
        };
        typeInput.addEventListener("change", () => {
          scenarioInput.innerHTML = adjustmentScenarioOptions(typeInput.value === "grant" ? "compensation" : "correction");
          updateCreditAdjustPreview();
        });
        amountInput.addEventListener("input", updateCreditAdjustPreview);
        updateCreditAdjustPreview();
        formElement.addEventListener("submit", async (event) => {
          event.preventDefault();
          const form = new FormData(event.currentTarget);
          const error = document.getElementById("credit-adjust-error");
          const workOrderNo = optionalWorkOrder(form, error);
          if (workOrderNo === null) return;
          const adjustmentType = String(form.get("adjustmentType") || "grant");
          const amount = Number(form.get("amount"));
          if (!Number.isInteger(amount) || amount < (adjustmentType === "setBalance" ? 0 : 1)) {
            error.textContent = adjustmentType === "setBalance" ? "目标可用积分必须是大于等于 0 的整数" : "积分数量必须是大于 0 的整数";
            return;
          }
          const delta = adjustmentType === "setBalance"
            ? amount - currentCredits
            : adjustmentType === "grant" ? amount : -amount;
          if (delta === 0) {
            error.textContent = "目标积分与当前积分一致，无需调整";
            return;
          }
          const direction = delta > 0 ? "grant" : "deduct";
          const payload = {
            amount: Math.abs(delta),
            reason: String(form.get("reason") || "").trim(),
            adjustmentScenario: String(form.get("adjustmentScenario") || "manual_adjustment"),
          };
          if (workOrderNo) payload.workOrderNo = workOrderNo;
          await runAdminMutation(event.currentTarget, error, async () => {
            await api(`/api/admin/users/${userId}/credits/${direction}`, {
              method: "POST",
              headers: { "idempotency-key": `admin-ui-credit-adjust-${userId}-${Date.now()}` },
              body: JSON.stringify(payload),
            });
            await loadUsers();
            closeDrawer();
            renderShell();
          }, "积分已调整").catch(() => undefined);
        });
      }

      function renderUserModelRequestPanel(logs, options = {}) {
        const title = options.title || "模型记录";
        const meta = options.meta || {};
        const currentPage = Math.max(1, Number(meta.page || options.page || 1));
        const pageSize = Math.max(1, Number(meta.pageSize || options.pageSize || 15));
        const total = Math.max(0, Number(meta.total || 0));
        const totalPages = Math.max(1, Number(meta.totalPages || Math.ceil(total / pageSize) || 1));
        const modelType = String(options.modelType || "all");
        const rows = (logs || []).map((item) => {
          const requestContent = renderModelRequestContent(item);
          const providerRequestContent = renderModelProviderRequestContent(item);
          const responseContent = renderModelProviderResponseContent(item);
          return `
            <tr>
              <td>
                <div>${escapeHtml(item.modelName || item.modelId || "-")}</div>
                <div class="metric-note">${escapeHtml(modelTypeLabel(item.modelType))}</div>
              </td>
              <td>${Number(item.creditsCost || 0).toLocaleString()}</td>
              <td>${renderModelProviderSubmissionStatus(item)}</td>
              <td><pre style="white-space:pre-wrap;word-break:break-word;background:#f6f8fc;padding:10px;border-radius:12px;max-height:220px;overflow:auto;margin:0;">${escapeHtml(truncateModelRequestDisplayContent(requestContent || "无"))}</pre></td>
              <td><pre style="white-space:pre-wrap;word-break:break-word;background:#f6f8fc;padding:10px;border-radius:12px;max-height:220px;overflow:auto;margin:0;">${escapeHtml(truncateModelRequestDisplayContent(providerRequestContent))}</pre></td>
              <td><pre style="white-space:pre-wrap;word-break:break-word;background:#f6f8fc;padding:10px;border-radius:12px;max-height:260px;overflow:auto;margin:0;">${escapeHtml(truncateModelRequestDisplayContent(responseContent || "无"))}</pre></td>
              <td>${escapeHtml(formatAdminDateTime(item.createdAt))}</td>
            </tr>
          `;
        }).join("");

        return `
          <h4>${escapeHtml(title)}</h4>
          <div class="toolbar" style="margin-top:12px;">
            <div class="filters">
              <select onchange="changeUserModelRequestFilter('${escapeAttribute(options.userId || "")}','${escapeAttribute(options.elementId || "")}', this.value)">
                ${userModelTypeOptions(modelType)}
              </select>
            </div>
          </div>
          <div class="table-wrap dense" style="margin-top:12px;">
            <table>
              <thead><tr><th>模型名称</th><th>积分消耗</th><th>发送状态</th><th>业务任务参数</th><th>供应商实际请求</th><th>返回内容</th><th>请求时间</th></tr></thead>
              <tbody>${rows || '<tr><td colspan="7">暂无该用户的模型记录</td></tr>'}</tbody>
            </table>
          </div>
          <div class="resource-pagination">
            ${total ? `<span class="metric-note">第 ${currentPage} / ${totalPages} 页 · 共 ${total} 条</span>
            <button class="btn ghost" type="button" onclick="changeUserModelRequestPage('${escapeAttribute(options.userId || "")}','${escapeAttribute(options.elementId || "")}', ${currentPage - 1}, '${escapeAttribute(modelType)}')" ${currentPage <= 1 ? "disabled" : ""}>上一页</button>
            <button class="btn ghost" type="button" onclick="changeUserModelRequestPage('${escapeAttribute(options.userId || "")}','${escapeAttribute(options.elementId || "")}', ${currentPage + 1}, '${escapeAttribute(modelType)}')" ${currentPage >= totalPages ? "disabled" : ""}>下一页</button>` : ""}
          </div>
        `;
      }

      function renderModelUsage(value) {
        if (!value || typeof value !== "object") return "无";
        try {
          return JSON.stringify(value, null, 2);
        } catch {
          return "无";
        }
      }

      function renderModelRequestContent(item) {
        const requestBody = item?.businessRequestBody || item?.requestBody;
        if (requestBody && typeof requestBody === "object" && Object.keys(requestBody).length > 0) {
          try {
            return JSON.stringify(requestBody, null, 2);
          } catch {
            return item?.requestText || "";
          }
        }
        return item?.requestText || "";
      }

      function renderModelProviderRequestContent(item) {
        const requestBody = item?.providerRequestBody;
        const requestUrl = String(item?.providerRequestUrl || "").trim();
        const sections = requestUrl ? [`请求 URL：\n${requestUrl}`] : [];
        if (requestBody && typeof requestBody === "object" && Object.keys(requestBody).length > 0) {
          try {
            sections.push(`请求 Body：\n${JSON.stringify(requestBody, null, 2)}`);
            return sections.join("\n\n");
          } catch {
            return "供应商请求参数无法解析";
          }
        }
        if (sections.length > 0) return sections.join("\n\n");
        return item?.externalSubmissionStartedAt
          ? "已开始发送，但未记录最终供应商请求体"
          : "未发送到供应商";
      }

      function renderModelProviderResponseContent(item) {
        const providerResponse = item?.providerResponseBody;
        if (providerResponse !== null && providerResponse !== undefined) {
          if (typeof providerResponse === "string") return providerResponse;
          try {
            return JSON.stringify(providerResponse, null, 2);
          } catch {
            return String(providerResponse);
          }
        }
        return item?.responseText || renderModelUsage(item?.responseUsage);
      }

      const MODEL_REQUEST_DISPLAY_MAX_CHARACTERS = 20_000;

      function truncateModelRequestDisplayContent(value) {
        const content = String(value ?? "");
        if (content.length <= MODEL_REQUEST_DISPLAY_MAX_CHARACTERS) return content;
        return `${content.slice(0, MODEL_REQUEST_DISPLAY_MAX_CHARACTERS)}\n...[truncated: ${content.length} chars total]`;
      }

      function renderModelProviderSubmissionStatus(item) {
        const sent = Boolean(item?.externalSubmissionStartedAt);
        const hasProviderBody = Boolean(item?.providerRequestBody && Object.keys(item.providerRequestBody).length > 0);
        const label = !sent ? "未发送" : hasProviderBody ? "已发送" : "发送已开始";
        const tagClass = !sent ? "warn" : hasProviderBody ? "green" : "blue";
        const failureCode = item?.taskFailureCode || item?.providerFailureCode || item?.failureCode || "";
        const details = [
          item?.providerRequestStatus ? `供应商状态：${item.providerRequestStatus}` : "",
          item?.taskStatus ? `任务状态：${item.taskStatus}` : "",
          failureCode ? `失败原因：${failureCode}` : "",
          item?.requestFormat ? `记录格式：${item.requestFormat}` : "",
        ].filter(Boolean);
        return `<span class="tag ${tagClass}">${label}</span>${details.length ? `<div class="metric-note" style="margin-top:6px;line-height:1.6;">${details.map(escapeHtml).join("<br>")}</div>` : ""}`;
      }

      function formatAdminDateTime(value) {
        if (!value) return "-";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "-";
        return date.toLocaleString("zh-CN");
      }

      function modelTypeLabel(value) {
        return {
          text: "文本模型",
          image: "图片模型",
          video: "视频模型",
        }[String(value || "").trim()] || "文本模型";
      }

      function userModelTypeOptions(value) {
        const current = String(value || "all");
        const options = [
          { value: "all", label: "全部模型" },
          { value: "video", label: "只看视频模型" },
          { value: "image", label: "只看图片模型" },
          { value: "text", label: "只看文本模型" },
        ];
        return options.map((item) => `<option value="${item.value}" ${item.value === current ? "selected" : ""}>${item.label}</option>`).join("");
      }

            <small style="color:var(--muted);line-height:1.6;display:block;margin-top:-6px;">特殊团队可配置为任意非负整数；普通团队仍使用系统默认上限。</small>

            <div class="error-text" id="team-limit-error"></div>
            <button class="btn primary full" type="submit">保存团队额度</button>

          </form>
        </aside>`;
        const formElement = document.getElementById("team-limit-form");
        const input = document.getElementById("team-limit-seat-input");
        const preview = document.getElementById("team-limit-preview");
        const updatePreview = () => {
          const nextLimit = Number(input.value);
          if (!Number.isInteger(nextLimit) || nextLimit < 0) {
            preview.textContent = "请输入大于等于 0 的整数。";
            return;
          }
          const nextRemaining = Math.max(0, nextLimit - usedSeats);
          preview.textContent = nextLimit < usedSeats
            ? `保存后不会删除已有账号，但会禁止继续创建；当前已用 ${usedSeats.toLocaleString()}，新上限 ${nextLimit.toLocaleString()}。`
            : `保存后剩余可创建 ${nextRemaining.toLocaleString()} 个子账号。`;
        };
        input.addEventListener("input", updatePreview);
        updatePreview();
        formElement.addEventListener("submit", async (event) => {
          event.preventDefault();
          if (!guardUserAction(user, "teamLimit")) return;
          const form = new FormData(event.currentTarget);
          const error = document.getElementById("team-limit-error");
          const seatLimit = Number(form.get("seatLimit"));
          if (!Number.isInteger(seatLimit) || seatLimit < 0) {

            return;

              method: "PATCH",

            });
            await loadUsers();
            await openTeamLimitDrawer(userId);

        });
      }

      async function toggleSecretValue(secretId) {
        if (Object.prototype.hasOwnProperty.call(state.revealedSecretValues, secretId)) {
          const nextValues = { ...state.revealedSecretValues };
          delete nextValues[secretId];
          state.revealedSecretValues = nextValues;
          const secret = state.settings.secretReferences.find((item) => item.id === secretId);
          const control = document.querySelector(`[data-secret-value-id="${secretId}"]`);
          if (secret && control) control.outerHTML = secretValueControl(secret);
          return;
        }
        try {
          const result = await api(`/api/admin/secret-references/${encodeURIComponent(secretId)}/reveal`, {
            method: "POST",
            headers: { "idempotency-key": adminIdempotencyKey("secret-reveal") },
            body: JSON.stringify({ reason: "\u540e\u53f0\u67e5\u770b\u5bc6\u94a5\u660e\u6587" }),
          });
          const secretValue = String(result.data?.secretValue || "");
          if (!secretValue) throw new Error("\u5bc6\u94a5\u503c\u4e3a\u7a7a\uff0c\u8bf7\u91cd\u65b0\u4fdd\u5b58");
          state.revealedSecretValues = { ...state.revealedSecretValues, [secretId]: secretValue };
          const secret = state.settings.secretReferences.find((item) => item.id === secretId);
          const control = document.querySelector(`[data-secret-value-id="${secretId}"]`);
          if (secret && control) control.outerHTML = secretValueControl(secret);
        } catch (error) {
          showToast(error.payload?.error?.message || error.message || "\u5bc6\u94a5\u67e5\u770b\u5931\u8d25");
        }
      }

      function syncModelEditorPricingJson() {
        const form = document.getElementById("model-editor-form");
        if (!form) return;
        const pricing = parseJsonTextarea(new FormData(form), "pricing");
        const baseCredits = Number(form.elements.pricingBaseCredits.value);
        if (!Number.isFinite(baseCredits) || baseCredits <= 0) {
          throw new Error("基础积分必须大于 0");
        }
        pricing.baseCredits = baseCredits;
        pricing.billingMode = String(form.elements.pricingBillingMode?.value || "fixed") === "duration" ? "duration" : "fixed";
        pricing.unit = String(form.elements.pricingUnit.value || "").trim() || String(form.elements.mediaType.value || "image");
        const resolutionCredits = resolutionCreditsFromForm(new FormData(form));
        if (Object.keys(resolutionCredits).length > 0) {
          pricing.resolutionCredits = resolutionCredits;
        } else {
          delete pricing.resolutionCredits;
        }
        form.elements.pricing.value = JSON.stringify(pricing, null, 2);
      }

      function modelResolutionPriceOptions(mediaType, schema = {}, defaultParams = {}, pricing = {}, useDefaultSelections = false) {
        if (String(mediaType || "") !== "video") return [];
        const options = new Set();
        const resolutionParameter = schema?.resolution && typeof schema.resolution === "object" && !Array.isArray(schema.resolution)
          ? schema.resolution
          : null;
        const configuredOptions = Array.isArray(resolutionParameter?.options) ? resolutionParameter.options.map(String) : [];
        const templateOptions = parameterTemplates().find((template) => template.key === "resolution")?.options || [];
        (configuredOptions.length ? configuredOptions : templateOptions).forEach((option) => {
          const value = String(option || "").trim();
          if (value) options.add(value);
        });
        const defaultResolution = String(defaultParams?.resolution || "").trim();
        if (defaultResolution) options.add(defaultResolution);
        Object.keys(pricing?.resolutionCredits || {}).forEach((resolution) => {
          const value = String(resolution || "").trim();
          if (value) options.add(value);
        });
        if (useDefaultSelections && !options.size) {
          templateOptions.forEach((option) => {
            const value = String(option || "").trim();
            if (value) options.add(value);
          });
        }
        return [...options];
      }

      function resolutionCreditsFieldsMarkup(pricing = {}, options = []) {
        return `<div class="field" style="grid-column:1 / -1;"><span>分辨率价格</span><div data-resolution-credit-fields>${resolutionCreditInputsMarkup(pricing, options)}</div></div>`;
      }

      function resolutionCreditInputsMarkup(pricing = {}, options = []) {
        if (!options.length) return `<div class="metric-note">当前模型类型无需配置分辨率价格。</div>`;
        const table = pricing?.resolutionCredits && typeof pricing.resolutionCredits === "object" && !Array.isArray(pricing.resolutionCredits)
          ? pricing.resolutionCredits
          : {};
        const rows = options.map((resolution) => {
          const value = table[resolution] ?? "";
          return `<tr><td><strong>${escapeHtml(resolution)}</strong></td><td><input name="resolutionCredit:${escapeAttribute(resolution)}" type="number" min="0" step="0.01" value="${escapeAttribute(value === "" ? "" : String(value))}" placeholder="使用积分" style="max-width:160px;" /></td><td class="metric-note">不填则使用基础积分</td></tr>`;
        }).join("");
        return `<div class="table-wrap dense"><table><thead><tr><th>分辨率</th><th>特殊积分</th><th>规则</th></tr></thead><tbody>${rows}</tbody></table></div>`;
      }

      function resolutionCreditsFromForm(form) {
        const credits = {};
        for (const [name, value] of form.entries()) {
          if (!String(name).startsWith("resolutionCredit:")) continue;
          const resolution = String(name).slice("resolutionCredit:".length).trim();
          const raw = String(value || "").trim();
          if (!resolution || raw === "") continue;
          const amount = Number(raw);
          if (!Number.isFinite(amount) || amount < 0) {
            throw new Error("分辨率价格必须大于等于 0");
          }
          credits[resolution] = amount;
        }
        return credits;
      }

      function baseCreditsFromForm(form, fallbackCredits, resolutionCredits = {}) {
        const explicitCredits = Number(form.get("baseCredits") || 0);
        if (Number.isFinite(explicitCredits) && explicitCredits > 0) return explicitCredits;
        const defaultResolution = String(form.get("parameterDefault:resolution") || "").trim();
        const defaultResolutionCredits = Number(resolutionCredits[defaultResolution]);
        if (Number.isFinite(defaultResolutionCredits) && defaultResolutionCredits > 0) return defaultResolutionCredits;
        const firstResolutionCredits = Object.values(resolutionCredits)
          .map(Number)
          .find((value) => Number.isFinite(value) && value > 0);
        if (firstResolutionCredits) return firstResolutionCredits;
        const fallback = Number(fallbackCredits);
        return Number.isFinite(fallback) && fallback > 0 ? fallback : 1;
      }

      function refreshResolutionCreditInputs(formElement, options, pricing = {}) {
        const container = formElement?.querySelector("[data-resolution-credit-fields]");
        if (!container) return;
        const currentPricing = {
          ...(pricing || {}),
          resolutionCredits: {
            ...(pricing?.resolutionCredits || {}),
            ...resolutionCreditsFromForm(new FormData(formElement)),
          },
        };
        container.innerHTML = resolutionCreditInputsMarkup(currentPricing, options);
      }

      function selectedResolutionPriceOptionsFromForm(formElement, pricing = {}) {
        const form = new FormData(formElement);
        const kind = modelKindOption(String(form.get("modelKind") || ""));
        if (kind.mediaType !== "video" || !form.has("parameterSupported:resolution")) return [];
        const selectedOptions = form.getAll("parameterOptions:resolution").map(String).filter(Boolean);
        if (selectedOptions.length) return selectedOptions;
        return modelResolutionPriceOptions(kind.mediaType, {}, {}, pricing, true);
      }

      function modelSecretReferenceOptions(selectedEnvName = "", selectedProviderName = "") {
        const secrets = [...(state.settings.secretReferences || [])].sort((left, right) => {
          const leftLabel = String(left.secretRef || left.envName || "");
          const rightLabel = String(right.secretRef || right.envName || "");
          return leftLabel.localeCompare(rightLabel, "zh-CN");
        });
        const options = [`<option value="">选择 API 密钥</option>`];
        for (const secret of secrets) {
          const envName = String(secret.envName || "");
          const providerName = String(secret.providerName || "").trim();
          const label = secret.secretRef || envName;
          const selected = envName === selectedEnvName;
          options.push(`<option value="${escapeAttribute(envName)}" data-provider-name="${escapeAttribute(providerName)}" ${selected ? "selected" : ""}>${escapeHtml(label)}</option>`);
        }
        return options.join("");
      }

      function parseConfigValue(rawValue, valueType) {
        if (valueType === "string") return rawValue;
        if (valueType === "number") {
          const value = Number(rawValue);
          if (!Number.isFinite(value)) throw new Error("请输入有效数字");
          return value;
        }
        if (valueType === "boolean") {
          if (rawValue === "true" || rawValue === "开启" || rawValue === "1") return true;
          if (rawValue === "false" || rawValue === "关闭" || rawValue === "0") return false;
          throw new Error("布尔值请输入 true 或 false");
        }
        if (valueType === "string_array") {
          const parsed = rawValue.trim().startsWith("[")
            ? JSON.parse(rawValue)
            : rawValue.split(",").map((item) => item.trim()).filter(Boolean);
          if (!Array.isArray(parsed) || parsed.some((item) => typeof item !== "string")) {
            throw new Error("字符串数组请输入 JSON 数组或逗号分隔文本");
          }
          return parsed;
        }
        return JSON.parse(rawValue);
      }

      }

      function requireDangerConfirm(form, errorElement, expectedText) {
        const actual = String(form.get("dangerConfirm") || "").trim();
        if (actual !== expectedText) {
          errorElement.textContent = `请先输入二次确认文本：${expectedText}`;
          return false;
        }
        return true;
      }

      function optionalWorkOrder(form, errorElement) {
        const workOrderNo = String(form.get("workOrderNo") || "").trim();
        if (!workOrderNo) return "";
        if (!/^[A-Za-z]{2,8}-\d{8}-\d{3,8}$/.test(workOrderNo)) {
          errorElement.textContent = "工单号格式不正确，例如 CS-20260605-001";
          return null;
        }
        return workOrderNo.toUpperCase();
      }

          ["experience", "体验会员"],
          ["professional", "专业会员"],
        ].map(([value, label]) => `<option value="${value}" ${value === selected ? "selected" : ""}>${label}</option>`).join("");

      function adjustmentScenarioLabel(value) {
        return {
          manual_adjustment: "手动调整",
          compensation: "补偿积分",
          recharge_bonus: "充值赠送",
          default_grant: "默认赠送",
          correction: "财务修正",
          promotion: "活动赠送",
        }[value] || "手动调整";
      }

      function creditLedgerTypeLabel(value) {
        return {
          grant: "充值/发放",
          reservation: "预冻结",
          consume: "消费扣减",
          release: "冻结释放",
        }[value] || "积分变动";
      }

      function creditLedgerDisplayChange(entry = {}) {
        const availableDelta = Number(entry.availableDelta ?? 0);
        const reservedDelta = Number(entry.reservedDelta ?? 0);
        const consumedDelta = Number(entry.consumedDelta ?? 0);
        if (availableDelta) return availableDelta;
        if (reservedDelta < 0 && consumedDelta > 0) return -consumedDelta;
        if (reservedDelta < 0) return Math.abs(reservedDelta);
        if (reservedDelta > 0) return -reservedDelta;
        return Number(entry.amount ?? 0);
      }

      function formatSignedCredit(value) {
        const amount = Number(value || 0);
        const sign = amount > 0 ? "+" : amount < 0 ? "-" : "";
        return `${sign}${Math.abs(amount).toLocaleString()}`;
      }

      function creditLedgerSourceLabel(entry = {}) {
        const metadata = entry.metadata || {};
        const sourceType = String(entry.sourceType || "");
        const sourceText = [
          sourceType,
          metadata.mediaType,
          metadata.taskType,
          metadata.modelCode,
          metadata.providerOperation,
          metadata.operation,
          entry.reason,
        ].filter(Boolean).join(" ").toLowerCase();
        if (sourceType === "payment_order") return "充值订单";
        if (sourceType === "admin_manual_grant") return "后台发放";
        if (sourceType === "admin_manual_deduct") return "后台扣减";
        if (sourceText.includes("script") || sourceText.includes("story")) return "剧本生成";
        if (sourceText.includes("video")) return "视频生成";
        if (sourceText.includes("image")) return "图片生成";
        if (sourceText.includes("audio") || sourceText.includes("voice")) return "音频生成";
        if (sourceText.includes("episode")) return "剧集生成";
        if (entry.entryType === "reservation") return "任务预冻结";
        if (entry.entryType === "release") return "任务释放";
        if (entry.entryType === "consume") return "任务扣减";
        return sourceType || "-";
      }

      function creditLedgerReasonLabel(entry = {}) {
        const reason = String(entry.reason || "");
        const metadata = entry.metadata || {};
        const scenario = metadata.adjustmentScenario ? adjustmentScenarioLabel(metadata.adjustmentScenario) : "";
        if (scenario && entry.sourceType?.startsWith("admin_manual")) return scenario;
        const text = [reason, metadata.mediaType, metadata.modelCode].filter(Boolean).join(" ").toLowerCase();
        if (text.includes("image generation") || text.includes("image")) return "图片生成";
        if (text.includes("video generation") || text.includes("video")) return "视频生成";
        if (text.includes("script generation") || text.includes("script")) return "剧本生成";
        if (text.includes("manual support grant")) return "人工充值补发";
        if (text.includes("paid order")) return "充值到账";
        if (reason) return reason;
        return creditLedgerSourceLabel(entry);
      }

      function creditLedgerContentLabel(entry = {}) {
        const explicit = String(entry.content || "").trim();
        if (explicit) return explicit;
        const metadata = entry.metadata || {};
        const sourceType = String(entry.sourceType || "").toLowerCase();
        const text = [
          sourceType,
          entry.reason,
          metadata.mediaType,
          metadata.kind,
          metadata.taskType,
          metadata.operation,
          metadata.modelCode,
        ].filter(Boolean).join(" ").toLowerCase();
        if (sourceType === "payment_order") return "充值套餐增加积分";
        if (sourceType === "membership_gift") return metadata.adminGift === true ? "会员赠送" : "会员赠送积分";
        if (sourceType.includes("admin")) {
          return entry.entryType === "consume" ? "手动扣减积分" : "手动增加积分";
        }
        if (text.includes("storyboard")) return entry.entryType === "release" ? "AI分镜生成返还积分" : "生AI分镜扣减";
        if (text.includes("script")) return entry.entryType === "release" ? "生成剧本返还积分" : "生成剧本扣减";
        if (text.includes("video")) return entry.entryType === "release" ? "生视频返还积分" : "生视频扣减";
        if (text.includes("image")) return entry.entryType === "release" ? "生图返还积分" : "生图扣减";
        return creditLedgerReasonLabel(entry);
      }

      function modelPayloadFromForm(form) {
        const mediaType = String(form.get("mediaType") || "image");
        const selectedVideoCategory = String(form.get("videoCategory") || "");
        const videoCategory = mediaType === "video" ? videoCategoryByValue(selectedVideoCategory) : null;
        const taskModes = String(form.get("taskModes") || "")
          .split(",")
          .map((item) => item.trim())
          .filter(Boolean);
        const uiConfig = parseJsonTextarea(form, "uiConfig");
        if (videoCategory) {
          uiConfig.videoCategory = videoCategory.value;
          uiConfig.videoCategoryLabel = videoCategory.label;
        }
        const providerConfig = parseJsonTextarea(form, "providerConfig");
        const requestPath = String(form.get("requestPath") || "").trim();
        if (requestPath) {
          providerConfig.requestPath = requestPath;
        } else {
          delete providerConfig.requestPath;
        }
        const apiKeyEnv = String(form.get("modelApiKeyEnv") || "").trim();
        if (apiKeyEnv) {
          providerConfig.apiKeyEnv = apiKeyEnv;
        } else {
          delete providerConfig.apiKeyEnv;
        }
        delete providerConfig.apiKey;
        return {
          modelCode: String(form.get("modelCode") || "").trim(),
          displayName: String(form.get("displayName") || "").trim(),
          providerName: String(form.get("providerName") || "").trim(),
          providerModel: String(form.get("providerModel") || "").trim(),
          providerProtocol: String(form.get("providerProtocol") || "custom_http"),
          invocationMode: String(form.get("invocationMode") || "sync"),
          mediaType,
          taskModes,
          status: String(form.get("status") || "disabled"),
          sortOrder: Number(form.get("sortOrder") || 100),
          parameterSchema: parameterSchemaFromForm(form),
          defaultParams: parseJsonTextarea(form, "defaultParams"),
          pricing: parseJsonTextarea(form, "pricing"),
          providerConfig,
          limits: parseJsonTextarea(form, "limits"),
          uiConfig,
          dispatchPolicy: {
            submitQueueName: String(form.get("submitQueueName") || "").trim(),
            pollQueueName: String(form.get("pollQueueName") || "").trim() || null,
            providerRpmLimit: Number(form.get("providerRpmLimit") || 60),
            providerConcurrentLimit: Number(form.get("providerConcurrentLimit") || 5),
            submitConcurrencyLimit: Number(form.get("submitConcurrencyLimit") || 5),
            pollingConcurrencyLimit: 20,
          },
          remark: String(form.get("remark") || ""),
          reason: String(form.get("reason") || ""),
        };
      }

      function parseJsonTextarea(form, name) {
        const raw = String(form.get(name) || "").trim();
        if (!raw) return {};
        const value = JSON.parse(raw);
        if (!value || typeof value !== "object" || Array.isArray(value)) {
          throw new Error(`${name} 必须是 JSON 对象`);
        }
        return value;
      }

      function parameterSchemaFromForm(form) {
        const schema = parseJsonTextarea(form, "parameterSchema");
        return addManualParameterToSchema(schema, {
          key: String(form.get("manualParameterKey") || ""),
          label: String(form.get("manualParameterLabel") || ""),
          type: String(form.get("manualParameterType") || "string"),
          options: String(form.get("manualParameterOptions") || ""),
          required: Boolean(form.get("manualParameterRequired")),
        });
      }

      function modelParameterDisplayName(key, parameter) {
        const knownNames = {
          prompt: "正向提示词",
          negativePrompt: "反向提示词",
          referenceImages: "参考图",
          editInstruction: "编辑指令",
          aspectRatio: "画面比例",
          quality: "质量档位",
          count: "生成数量",
        };
        return knownNames[key] || parameter.label || key;
      }

      function parameterTypeLabel(type) {
        const labels = {
          string: "文本",
          number: "数字",
          integer: "整数",
          boolean: "开关",
          enum: "选项",
          array: "列表",
          file: "文件",
          "file[]": "文件列表",
          json: "JSON",
        };
        return labels[type] || type || "JSON";
      }

      function parameterSchemaRows(schema) {
        const entries = Object.entries(schema || {});
        if (entries.length === 0) {
          return `<tr><td colspan="4">暂无现有参数</td></tr>`;
        }
        return entries.map(([key, value]) => {
          const parameter = value && typeof value === "object" ? value : {};
          const options = Array.isArray(parameter.options) ? parameter.options.join(", ") : "-";
          return `<tr><td>${escapeHtml(modelParameterDisplayName(key, parameter))}<div class="metric-note">${escapeHtml(key)}</div></td><td><span class="tag blue">${escapeHtml(parameterTypeLabel(parameter.type || "json"))}</span></td><td>${escapeHtml(options)}</td><td class="actions"><div class="actions-row"><button class="icon-btn" title="编辑参数" type="button" onclick="fillManualParameterEditor('${escapeAttribute(key)}')">编</button><button class="icon-btn" title="删除参数" type="button" onclick="removeManualParameterFromSchema('${escapeAttribute(key)}')">删</button></div></td></tr>`;
        }).join("");
      }

      function refreshParameterSchemaList(schema) {
        const list = document.querySelector("#parameter-schema-list tbody");
        if (list) list.innerHTML = parameterSchemaRows(schema);
      }

      function currentModelEditorSchema() {
        const form = document.getElementById("model-editor-form");
        return form ? parseJsonTextarea(new FormData(form), "parameterSchema") : {};
      }

      function fillManualParameterEditor(parameterKey) {
        const form = document.getElementById("model-editor-form");
        if (!form) return;
        const schema = currentModelEditorSchema();
        const parameter = schema[parameterKey] || {};
        form.elements.manualParameterKey.value = parameterKey;
        form.elements.manualParameterLabel.value = modelParameterDisplayName(parameterKey, parameter);
        form.elements.manualParameterType.value = parameter.type || "string";
        form.elements.manualParameterOptions.value = Array.isArray(parameter.options) ? parameter.options.join(", ") : "";
        form.elements.manualParameterRequired.checked = Boolean(parameter.required);
      }

      function removeManualParameterFromSchema(parameterKey) {
        const form = document.getElementById("model-editor-form");
        if (!form) return;
        const schema = currentModelEditorSchema();
        delete schema[parameterKey];
        form.elements.parameterSchema.value = JSON.stringify(schema, null, 2);
        refreshParameterSchemaList(schema);
      }

      function addManualParameterToSchema(schema, input) {
        const key = String(input.key || "").trim();
        if (!key) return schema;
        if (!/^[A-Za-z][A-Za-z0-9_]*$/.test(key)) {
          throw new Error("参数键只能使用英文、数字和下划线，并且必须以字母开头");
        }
        const type = String(input.type || "string").trim();
        const parameter = {
          label: String(input.label || key).trim(),
          type,
          required: Boolean(input.required),
          visible: true,
        };
        const options = String(input.options || "")
          .split(",")
          .map((item) => item.trim())
          .filter(Boolean);
        if (options.length > 0) {
          parameter.options = options;
          parameter.adminEditableOptions = true;
        }
        return {
          ...schema,
          [key]: parameter,
        };
      }

      function valueForTextarea(value, valueType) {
        if (value === undefined || value === null) return "";
        if (valueType === "string") return String(value);
        return JSON.stringify(value, null, 2);
      }

      function promptPublishingFields(item) {
        const priceCredits = Number(item?.price_credits ?? item?.priceCredits ?? 0);
        const usageCount = Number(item?.usage_count ?? item?.usageCount ?? 0);
        const isPublished = Boolean(item?.is_published ?? item?.isPublished);
        return `<div class="form-grid">

          <label class="field"><span>使用次数</span><input name="usage_count" type="number" min="0" max="2147483647" step="1" inputmode="numeric" value="${Number.isInteger(usageCount) && usageCount >= 0 && usageCount <= 2147483647 ? usageCount : 0}" required /></label>
        </div>
        <label class="inline-check"><input name="is_published" type="checkbox" ${isPublished ? "checked" : ""} /> 发布提示词</label>`;
      }

      function promptPublishingPayloadFromForm(form) {
        const priceCredits = Number(form.get("price_credits") || 0);
        const usageCount = Number(form.get("usage_count") || 0);
        if (!Number.isInteger(priceCredits) || priceCredits < 0 || priceCredits > 99999) throw new Error("积分价格必须是 0 到 99999 之间的整数");
        if (!Number.isInteger(usageCount) || usageCount < 0 || usageCount > 2147483647) throw new Error("使用次数必须是非负整数");
        return {
          price_credits: priceCredits,
          usage_count: usageCount,
          is_published: form.get("is_published") === "on",
        };
      }

      function hydrateDrawerPanel() {
        const drawer = document.getElementById("drawer");
        const panel = drawer?.querySelector(".drawer-panel");
        if (!panel || drawer.querySelector(".drawer-resize-handle")) return;
        const handle = document.createElement("div");
        handle.className = "drawer-resize-handle";
        handle.setAttribute("role", "separator");
        handle.setAttribute("aria-orientation", "vertical");
        handle.setAttribute("title", "\u62d6\u52a8\u8fb9\u754c\u8c03\u6574\u7f16\u8f91\u533a\u5bbd\u5ea6");
        drawer.insertBefore(handle, panel);
      }

      function drawerBoundaryHit(event, panel) {
        if (!panel || !event) return false;
        const rect = panel.getBoundingClientRect();
        return Math.abs(event.clientX - rect.left) <= 22;
      }

      function activeDrawerElement() {
        const drawer = document.getElementById("drawer");
        return drawer && !drawer.classList.contains("hidden") ? drawer : null;
      }

      function beginDrawerResize(event, drawer, panel, dragHandle) {
        if (!drawer || !panel) return false;
        event.preventDefault();
        event.stopPropagation();
        dragHandle?.setPointerCapture?.(event.pointerId);
        dragHandle?.classList.add("is-dragging");
        drawer.classList.add("is-boundary-hover");
        document.body.classList.add("is-drawer-resizing");
        const resize = (moveEvent) => {
          const minWidth = Math.min(360, window.innerWidth);
          const maxWidth = Math.max(minWidth, window.innerWidth - 24);
          const width = Math.min(maxWidth, Math.max(minWidth, window.innerWidth - moveEvent.clientX));
          panel.style.width = `${width}px`;
        };
        const stop = () => {
          dragHandle?.releasePointerCapture?.(event.pointerId);
          dragHandle?.classList.remove("is-dragging");
          drawer.classList.remove("is-boundary-hover");
          document.body.classList.remove("is-drawer-resizing");
          drawer.dataset.dragJustEnded = "true";
          window.removeEventListener("pointermove", resize);
          window.removeEventListener("pointerup", stop);
          window.removeEventListener("pointercancel", stop);
          setTimeout(() => {
            if (drawer.dataset.dragJustEnded === "true") delete drawer.dataset.dragJustEnded;
          }, 0);
        };
        window.addEventListener("pointermove", resize);
        window.addEventListener("pointerup", stop);
        window.addEventListener("pointercancel", stop);
        resize(event);
        return true;
      }

      function setupDrawerInteractions() {
        if (setupDrawerInteractions.ready) {
          hydrateDrawerPanel();
          return;
        }
        setupDrawerInteractions.ready = true;
        document.addEventListener("click", (event) => {
          const drawer = activeDrawerElement();
          if (!drawer) return;
          if (drawer.dataset.dragJustEnded === "true") {
            delete drawer.dataset.dragJustEnded;
            return;
          }
          if (event.target === drawer) return;
        });
        document.addEventListener("pointermove", (event) => {
          const drawer = activeDrawerElement();
          if (!drawer) return;
          if (document.body.classList.contains("is-drawer-resizing")) return;
          const panel = drawer.querySelector(".drawer-panel");
          drawer.classList.toggle("is-boundary-hover", drawerBoundaryHit(event, panel));
        });
        document.addEventListener("pointerdown", (event) => {
          const drawer = activeDrawerElement();
          if (!drawer) return;
          const handle = event.target.closest?.(".drawer-resize-handle");
          const panel = drawer.querySelector(".drawer-panel");
          if (!panel) return;
          const boundaryHit = drawerBoundaryHit(event, panel);
          if (!handle && !boundaryHit) return;
          const dragHandle = handle || drawer.querySelector(".drawer-resize-handle");
          beginDrawerResize(event, drawer, panel, dragHandle);
        }, true);
        new MutationObserver(() => hydrateDrawerPanel()).observe(document.body, { childList: true, subtree: true });
        hydrateDrawerPanel();
      }

        return `<div class="table-wrap dense"><table><thead><tr><th>\u9884\u89c8</th><th>\u534f\u8bae\u540d\u79f0</th><th>\u534f\u8bae\u7c7b\u578b</th><th>\u534f\u8bae\u72b6\u6001</th><th>\u7248\u672c</th><th>\u66f4\u65b0\u65f6\u95f4</th><th class="actions">\u64cd\u4f5c</th></tr></thead><tbody>${rows}</tbody></table></div>`;

      agreementsPage = function agreementsPage() {
        const selected = state.legalDocuments.find((item) => item.id === state.selectedLegalDocumentId) || state.legalDocuments[0] || null;
        const previewHtml = selected?.document?.contentHtml ? sanitizeRichTextHtml(selected.document.contentHtml) : "";

        return `<div class="agreements-layout">

                </div>

              ${selected ? `<div class="legal-document-surface agreement-rich-text">${previewHtml}</div>` : `<div class="legal-document-empty">\u6682\u65e0\u53ef\u9884\u89c8\u7684\u534f\u8bae\u6587\u6863</div>`}
            </div>

      openLegalDocumentDrawer = function openLegalDocumentDrawer(documentId) {
        const existing = state.legalDocuments.find((item) => item.id === documentId) || null;
        const defaultType = existing?.type || "service";
        const defaultTitle = existing?.title || "";
        const defaultVersionLabel = existing?.versionLabel || "";
        const initialContentHtml = sanitizeRichTextHtml(existing?.document?.contentHtml || "");
        const typeChoices = legalDocumentTypeChoices(defaultType);
        const drawer = document.getElementById("drawer");
        drawer.classList.remove("hidden");
        drawer.innerHTML = `<aside class="drawer-panel legal-document-drawer-panel">
          <div class="drawer-head">
            <h3>${existing ? "\u7f16\u8f91\u534f\u8bae" : "\u65b0\u589e\u534f\u8bae"}</h3>
            <button class="icon-btn" onclick="closeDrawer()">\u00d7</button>
          </div>
          <p style="color:var(--muted);line-height:1.7">\u652f\u6301\u65b0\u589e\u3001\u7f16\u8f91\u4e0d\u540c\u7248\u672c\u7684\u534f\u8bae\u5185\u5bb9\uff0c\u542f\u7528\u540e\u4f1a\u7acb\u5373\u540c\u6b65\u5230\u767b\u5f55\u9875\u3002</p>
          <form id="legal-document-form" class="legal-document-form">
