<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>后台管理</title>
    <style>
      :root {
        --navy: #12243d;
        --navy-2: #1b3559;
        --bg: #eef4f9;
        --panel: #ffffff;
        --line: #d9e3ee;
        --text: #1f2d3d;
        --muted: #6b7c90;
        --primary: #246bfe;
        --primary-soft: #e8f0ff;
        --danger: #d92d20;
        --warning: #b7791f;
        --success: #15803d;
        --radius: 8px;
        font-family: "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", sans-serif;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      .hidden { display: none !important; }

      .login-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(180deg, rgba(255,255,255,.72), rgba(238,244,249,.9)),
          var(--bg);
      }
      .login-card {
        width: min(420px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 32px;
        box-shadow: 0 20px 50px rgba(18, 36, 61, .12);
      }
      .login-card h1 { margin: 0 0 8px; font-size: 26px; }
      .login-card p { margin: 0 0 28px; color: var(--muted); }
      .field { display: grid; gap: 8px; margin-bottom: 16px; }
      .field label { font-size: 13px; color: #30445f; font-weight: 600; }
      .field input, .field select, .field textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px 12px;
        background: #fff;
        outline: none;
      }
      .field input:focus, .field select:focus, .field textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-soft);
      }
      .password-field-control { position: relative; display: block; }
      .password-field-control input { padding-right: 58px; }
      .password-visibility-toggle {
        position: absolute;
        top: 50%;
        right: 8px;
        transform: translateY(-50%);
        border: 0;
        background: transparent;
        color: var(--primary);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .password-visibility-toggle:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
        border-radius: 4px;
      }
      .login-options {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: -4px 0 14px;
      }
      .remember-option {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
      }
      .remember-option input {
        width: 16px;
        height: 16px;
        accent-color: var(--primary);
      }
      .btn {
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 9px 12px;
        background: #f7f9fc;
        color: var(--text);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 36px;
      }
      .btn.primary { background: var(--primary); color: #fff; }
      .btn.danger { color: var(--danger); background: #fff5f5; border-color: #ffd0d0; }
      .btn.ghost { background: transparent; border-color: var(--line); }
      .btn.full { width: 100%; }
      .btn[disabled] { opacity: .58; cursor: not-allowed; }
      .error-text { color: var(--danger); font-size: 13px; min-height: 18px; }
      .toast-message {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 12;
        max-width: min(360px, calc(100vw - 36px));
        padding: 12px 14px;
        border: 1px solid #bde8c8;
        border-radius: 8px;
        background: #f0fff4;
        color: var(--success);
        box-shadow: 0 18px 40px rgba(18, 36, 61, .14);
      }

      .admin-shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 236px minmax(0, 1fr);
      }
      .sidebar {
        background: var(--navy);
        color: #dce8f7;
        padding: 18px 14px;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .brand {
        height: 48px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
        font-weight: 700;
        color: #fff;
      }
      .brand-mark {
        width: 30px;
        height: 30px;
        border-radius: 6px;
        background: var(--primary);
        display: grid;
        place-items: center;
      }
      .nav { margin-top: 18px; display: grid; gap: 4px; }
      .nav button {
        width: 100%;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #dce8f7;
        text-align: left;
        padding: 11px 12px;
      }
      .nav button.active, .nav button:hover {
        background: var(--navy-2);
        color: #fff;
      }
      .main { min-width: 0; display: grid; grid-template-rows: 60px minmax(0, 1fr); }
      .topbar {
        background: rgba(255,255,255,.88);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 22px;
        position: sticky;
        top: 0;
        z-index: 3;
      }
      .topbar h2 { margin: 0; font-size: 18px; }
      .account-menu { display: flex; align-items: center; gap: 10px; color: var(--muted); }
      .content { padding: 20px; min-width: 0; }
      .page-grid { min-width: 0; }
      .state-panel {
        min-height: 260px;
        display: grid;
        place-items: center;
        gap: 8px;
        text-align: center;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        color: var(--muted);
      }
      .state-panel strong { color: var(--text); font-size: 16px; }
      .state-panel[data-state="forbidden"] { border-color: #ffd0d0; background: #fffafa; }

      .grid { display: grid; gap: 14px; }
      .cards { grid-template-columns: repeat(4, minmax(150px, 1fr)); }
      .dashboard-workspace { display: grid; gap: 16px; max-width: 1680px; margin: 0 auto; }
      .dashboard-masthead {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        padding: 2px 0 18px;
        border-bottom: 1px solid #cfd9e5;
      }
      .dashboard-heading { min-width: 0; }
      .dashboard-eyebrow {
        margin: 0 0 6px;
        color: #58708c;
        font-size: 12px;
        font-weight: 700;
      }
      .dashboard-heading h1 { margin: 0; font-size: 27px; line-height: 1.25; letter-spacing: 0; }
      .dashboard-heading p { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
      .dashboard-masthead-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
      .dashboard-status {
        min-height: 34px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid currentColor;
        border-radius: 6px;
        padding: 7px 10px;
        font-size: 12px;
        font-weight: 700;
        background: #fff;
      }
      .dashboard-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
      .dashboard-status.success { color: #167047; }
      .dashboard-status.warning { color: #9a5b08; }
      .dashboard-status.danger { color: #b42318; }
      .dashboard-sync-note { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
      .dashboard-queue-panel { display: grid; gap: 16px; }
      .dashboard-queue-summary { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .dashboard-queue-badge { display: inline-flex; align-items: center; gap: 7px; min-height: 30px; padding: 6px 9px; border: 1px solid #d8e2ec; border-radius: 5px; background: #f8fafc; color: #52687f; font-size: 12px; font-weight: 700; }
      .dashboard-queue-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
      .dashboard-queue-badge.success { color: #167047; border-color: #b9dfca; background: #f4fbf6; }
      .dashboard-queue-badge.warning { color: #9a5b08; border-color: #ead19c; background: #fffaf0; }
      .dashboard-queue-badge.danger { color: #b42318; border-color: #f0b8b2; background: #fff6f5; }
      .dashboard-queue-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
      .dashboard-queue-item { min-width: 0; padding: 13px; border: 1px solid #e0e7ef; border-radius: 5px; background: #fbfcfe; }
      .dashboard-queue-item.degraded { border-color: #e8c98e; background: #fffaf1; }
      .dashboard-queue-item.unavailable { border-color: #efb7b1; background: #fff7f6; }
      .dashboard-queue-item-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
      .dashboard-queue-item-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #263b54; font-size: 12px; font-weight: 750; }
      .dashboard-queue-item-role { margin-top: 3px; color: var(--muted); font-size: 11px; }
      .dashboard-queue-item-status { color: #167047; font-size: 11px; font-weight: 700; white-space: nowrap; }
      .dashboard-queue-item.degraded .dashboard-queue-item-status { color: #9a5b08; }
      .dashboard-queue-item.unavailable .dashboard-queue-item-status { color: #b42318; }
      .dashboard-queue-counts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
      .dashboard-queue-count span { display: block; color: #718399; font-size: 10px; }
      .dashboard-queue-count strong { display: block; margin-top: 3px; color: #1d3047; font-size: 16px; font-variant-numeric: tabular-nums; }
      .dashboard-queue-item-actions { display: flex; justify-content: flex-end; margin-top: 12px; padding-top: 10px; border-top: 1px solid #eadfca; }
      .dashboard-queue-manage { border: 0; background: transparent; color: #8a5108; cursor: pointer; font-size: 11px; font-weight: 750; }
      .dashboard-queue-manage:hover { color: #663900; text-decoration: underline; }
      .dashboard-queue-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 2px; color: var(--muted); font-size: 11px; }
      .dashboard-queue-foot strong { color: var(--text); font-variant-numeric: tabular-nums; }
      .dashboard-kpi-strip {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        overflow: hidden;
        border: 1px solid #d4deea;
        border-radius: 6px;
        background: #fff;
      }
      .dashboard-kpi { min-width: 0; min-height: 126px; padding: 18px; border-right: 1px solid #e1e8f0; }
      .dashboard-kpi:last-child { border-right: 0; }
      .dashboard-kpi-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .dashboard-kpi-label { color: #526980; font-size: 13px; font-weight: 700; }
      .dashboard-kpi-index { color: #98a7b8; font: 11px/1 Consolas, monospace; }
      .dashboard-kpi-value { margin-top: 14px; color: #16263a; font-size: 30px; line-height: 1; font-weight: 750; font-variant-numeric: tabular-nums; }
      .dashboard-kpi-note { margin-top: 10px; color: var(--muted); font-size: 12px; line-height: 1.5; }
      .dashboard-layout { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(320px, .75fr); gap: 16px; align-items: stretch; }
      .dashboard-lower-layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(340px, .75fr); gap: 16px; align-items: start; }
      .dashboard-panel {
        min-width: 0;
        background: #fff;
        border: 1px solid #d4deea;
        border-radius: 6px;
        padding: 18px;
      }
      .dashboard-panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
      .dashboard-panel-title h3 { margin: 0; font-size: 16px; line-height: 1.35; }
      .dashboard-panel-title p { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
      .dashboard-panel-value { color: #17283d; font-size: 22px; font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .production-meter { display: flex; width: 100%; height: 12px; overflow: hidden; border-radius: 3px; background: #edf1f5; }
      .production-meter span { min-width: 0; height: 100%; }
      .production-meter .succeeded { background: #1e8f5a; }
      .production-meter .in-progress { background: #2f6fed; }
      .production-meter .failed { background: #d04437; }
      .production-meter .other { background: #a7b2bf; }
      .production-breakdown { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 18px; border-top: 1px solid #e2e8ef; }
      .production-stat { min-width: 0; padding: 15px 12px 0 0; }
      .production-stat + .production-stat { padding-left: 14px; border-left: 1px solid #e2e8ef; }
      .production-stat-label { display: flex; align-items: center; gap: 7px; color: #5d7085; font-size: 12px; }
      .production-stat-label::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: #a7b2bf; }
      .production-stat.succeeded .production-stat-label::before { background: #1e8f5a; }
      .production-stat.in-progress .production-stat-label::before { background: #2f6fed; }
      .production-stat.failed .production-stat-label::before { background: #d04437; }
      .production-stat strong { display: block; margin-top: 8px; color: #18293d; font-size: 20px; font-variant-numeric: tabular-nums; }
      .production-stat small { display: block; margin-top: 4px; color: #8796a7; font-size: 11px; }
      .dashboard-attention-list { display: grid; gap: 8px; }
      .dashboard-attention-item {
        width: 100%;
        min-height: 58px;
        display: grid;
        grid-template-columns: 8px minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        border: 1px solid #e0e7ef;
        border-radius: 5px;
        padding: 10px 11px;
        background: #fbfcfe;
        color: var(--text);
        text-align: left;
      }
      .dashboard-attention-item:hover { border-color: #afc1d7; background: #f6f9fc; }
      .dashboard-attention-marker { width: 8px; height: 30px; border-radius: 2px; background: #d04437; }
      .dashboard-attention-item.warning .dashboard-attention-marker { background: #d68a16; }
      .dashboard-attention-item.neutral .dashboard-attention-marker { background: #6f8298; }
      .dashboard-attention-copy { min-width: 0; }
      .dashboard-attention-copy strong { display: block; font-size: 13px; }
      .dashboard-attention-copy span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.4; }
      .dashboard-attention-count { color: #24384f; font-size: 18px; font-weight: 750; font-variant-numeric: tabular-nums; }
      .dashboard-clear-state { min-height: 132px; display: grid; place-items: center; text-align: center; border: 1px dashed #bad6c7; border-radius: 5px; background: #f6fbf8; color: #276348; }
      .dashboard-clear-state strong { display: block; font-size: 14px; }
      .dashboard-clear-state span { display: block; margin-top: 6px; color: #608171; font-size: 12px; }
      .dashboard-quick-actions { display: flex; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid #e2e8ef; flex-wrap: wrap; }
      .business-strip {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        overflow: hidden;
        border: 1px solid #d4deea;
        border-radius: 6px;
        background: #f8fafc;
      }
      .business-stat { min-width: 0; padding: 15px 16px; border-right: 1px solid #dfe6ee; }
      .business-stat:last-child { border-right: 0; }
      .business-stat span { display: block; color: #687b90; font-size: 11px; }
      .business-stat strong { display: block; margin-top: 7px; overflow-wrap: anywhere; color: #1b2d42; font-size: 18px; font-variant-numeric: tabular-nums; }
      .business-stat small { display: block; margin-top: 5px; color: #8a98a8; font-size: 11px; line-height: 1.4; }
      .dashboard-health-summary { display: flex; gap: 16px; margin: -2px 0 14px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
      .dashboard-health-summary strong { color: var(--text); }
      .dashboard-event-list { display: grid; border-top: 1px solid #e2e8ef; }
      .dashboard-event-row {
        width: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 14px;
        align-items: center;
        border: 0;
        border-bottom: 1px solid #e7edf3;
        padding: 12px 2px;
        background: transparent;
        color: var(--text);
        text-align: left;
      }
      .dashboard-event-row:hover { background: #f7f9fc; }
      .dashboard-event-row:last-child { border-bottom: 0; }
      .dashboard-event-main { min-width: 0; }
      .dashboard-event-main strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
      .dashboard-event-main span { display: block; margin-top: 4px; overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
      .dashboard-event-time { color: #75869a; font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .dashboard-empty { padding: 28px 8px; color: var(--muted); font-size: 12px; text-align: center; }
      .risk-workspace { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; width: 100%; max-width: 1680px; margin: 0 auto; }
      .risk-control-bar {
        min-width: 0;
        max-width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        border: 1px solid #d4deea;
        border-radius: 6px;
        padding: 10px;
        background: #fff;
      }
      .risk-tabs {
        min-width: 0;
        max-width: 100%;
        display: inline-flex;
        align-items: center;
        gap: 3px;
        overflow-x: auto;
        border-radius: 5px;
        padding: 3px;
        background: #edf2f7;
      }
      .risk-tab {
        min-height: 34px;
        border: 0;
        border-radius: 4px;
        padding: 7px 12px;
        background: transparent;
        color: #596d83;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }
      .risk-tab:hover { color: #1f3550; background: #f7f9fc; }
      .risk-tab.active { color: #fff; background: #1c3b63; }
      .risk-search { width: min(320px, 100%); flex: 0 1 320px; }
      .risk-search input {
        width: 100%;
        height: 40px;
        border: 1px solid #d4deea;
        border-radius: 5px;
        padding: 8px 11px;
        outline: none;
        background: #fbfcfe;
        color: var(--text);
      }
      .risk-search input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); background: #fff; }
      .risk-panel { min-width: 0; max-width: 100%; background: #fff; border: 1px solid #d4deea; border-radius: 6px; padding: 18px; }
      .risk-panel > .table-wrap { max-width: 100%; }
      .risk-panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
      .risk-panel-title h3 { margin: 0; font-size: 16px; }
      .risk-panel-title p { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
      .risk-panel-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
      .risk-status-filter { min-width: 140px; height: 38px; border: 1px solid #d4deea; border-radius: 5px; padding: 7px 10px; background: #fff; color: var(--text); }
      .risk-table { min-width: 900px; }
      .risk-table th { color: #536980; font-size: 12px; }
      .risk-table td { vertical-align: middle; }
      .risk-table .risk-primary { min-width: 230px; }
      .risk-title { color: #1a2d43; font-size: 13px; font-weight: 700; line-height: 1.45; }
      .risk-code { margin-top: 4px; color: #7c8ea2; font: 11px/1.45 Consolas, "Courier New", monospace; overflow-wrap: anywhere; }
      .risk-context { margin-top: 5px; color: #65798f; font-size: 11px; line-height: 1.45; overflow-wrap: anywhere; }
      .risk-time { color: #66798e; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .risk-action { min-width: 62px; }
      .risk-queue-kind { display: inline-flex; align-items: center; gap: 7px; color: #52687f; font-size: 12px; font-weight: 700; }
      .risk-queue-kind::before { content: ""; width: 7px; height: 22px; border-radius: 2px; background: #d68a16; }
      .risk-queue-kind.danger::before { background: #d04437; }
      .risk-queue-kind.neutral::before { background: #6f8298; }
      .risk-empty { min-height: 180px; display: grid; place-items: center; border: 1px dashed #c8d4e1; border-radius: 5px; background: #fafcfe; text-align: center; }
      .risk-empty strong { display: block; color: #2f465f; font-size: 14px; }
      .risk-empty span { display: block; margin-top: 6px; color: var(--muted); font-size: 12px; }
      .risk-count-note { color: #65798e; font-size: 12px; white-space: nowrap; }
      .task-recovery-diagnostics {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        border: 1px solid #d4deea;
        border-radius: 6px;
        background: #f8fafc;
        overflow: hidden;
      }
      .task-recovery-diagnostic { min-width: 0; padding: 12px; border-right: 1px solid #dce4ee; }
      .task-recovery-diagnostic:last-child { border-right: 0; }
      .task-recovery-diagnostic span { display: block; color: #74869a; font-size: 11px; }
      .task-recovery-diagnostic strong { display: block; margin-top: 5px; color: #20374f; font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }
      .task-recovery-action-list { display: grid; gap: 8px; margin-top: 8px; }
      .task-recovery-action {
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr);
        gap: 10px;

      const app = document.getElementById("admin-app");

      function readRememberedLogin() {
        try {
          const saved = localStorage.getItem(rememberedLoginStorageKey);
          if (!saved) return { enabled: false, loginName: "", password: "" };
          const parsed = JSON.parse(saved);
          return {
            enabled: Boolean(parsed?.enabled),
            loginName: typeof parsed?.loginName === "string" ? parsed.loginName : "",
            password: typeof parsed?.password === "string" ? parsed.password : "",
          };
        } catch {
          return { enabled: false, loginName: "", password: "" };
        }
      }

      function saveRememberedLogin(loginName, password) {
        localStorage.setItem(rememberedLoginStorageKey, JSON.stringify({
          enabled: true,
          loginName: String(loginName || ""),
          password: String(password || ""),
        }));
      }

      function clearRememberedLogin() {
        localStorage.removeItem(rememberedLoginStorageKey);
      }

      function routeFromPath() {
        const path = location.pathname;
        if (path.includes("/models/new") || /^\/admin\/models\/[^/]+/.test(path)) return "models";
        if (path.includes("/models")) return "models";
        if (path.includes("/users")) return "users";
        if (path.includes("/direct-recharge")) {
          state.membershipBenefitTab = "directRecharge";
          return "membership";
        }
        if (path.includes("/membership")) return "membership";
        if (path.includes("/prompts")) return "prompts";
        if (path.includes("/risks") || path.includes("/audit-events")) return "risks";
        if (path.includes("/sms-records")) return "smsRecords";
        if (path.includes("/resources")) return "resources";
        if (path.includes("/settings") || path.includes("/admin-accounts")) return "settings";
        if (path.includes("/account")) return "account";
        return "dashboard";
      }

      function resolveAdminApiUrl(path) {
        if (typeof window === "undefined" || /^https?:\/\//i.test(path)) {
          return path;
        }
        const backendOwnedPath = /^\/(?:api|uploads|vendor)(?:\/|$)/.test(path);
        const localHttpHost = /^(?:localhost|127\.0\.0\.1|\[::1\])(?::\d+)?$/i.test(
          window.location.host ?? "",
        );
        const isAlternateDevPort = /^(?:4311|4312|4313|4314|4315|4399)$/.test(window.location.port ?? "");
        const origin =
          window.location.protocol === "file:" ||
          (backendOwnedPath && localHttpHost && isAlternateDevPort)
            ? "http://127.0.0.1:4310"
            : window.location.origin;
        return new URL(path, origin).toString();
      }

      function storagePreviewUrl(item) {
        return item?.previewUrl || item?.sourceUrl || item?.downloadUrl || "";
      }

      function resourceKindLabel(item) {
        return item?.mediaKind === "video" || String(item?.contentType || "").startsWith("video/")
          ? "视频"
          : "图片";
      }

      function resourceKindTone(item) {
        return item?.mediaKind === "video" || String(item?.contentType || "").startsWith("video/")
          ? "warn"
          : "blue";
      }

      async function api(path, options = {}) {
        const response = await fetch(resolveAdminApiUrl(path), {
          credentials: "include",
          headers: { "content-type": "application/json", ...(options.headers || {}) },
          ...options,
        });
        const rawBody = await response.text().catch(() => "");
        let payload = {};
        try {
          payload = rawBody ? JSON.parse(rawBody) : {};
        } catch {
          payload = { error: { message: rawBody } };
        }
        if (!response.ok) throw Object.assign(new Error(adminApiErrorMessage(payload, response)), { payload, status: response.status });
        return payload;
      }

      function adminApiErrorMessage(payload, response) {
        if (response.status === 401) return "后台登录已过期，请重新登录";
        if (response.status === 403) return "当前管理员无权限执行该操作";
        if (response.status === 404) return "接口不存在，请确认后端服务已更新";
        if (response.status >= 500) return "服务器处理失败，请查看后端日志";
        const error = payload?.error;
        if (error?.message) return error.message;
        if (typeof error === "string") {
          return {
            idempotency_key_required: "请求缺少幂等键，请刷新页面后重试",
            invalid_json: "请求数据格式不正确",
            reason_required: "请填写本次处置原因",
            task_not_found: "异常任务不存在或已被清理",
            task_not_retryable: "任务当前状态或重试次数不允许执行该动作",
            task_not_settleable: "任务当前状态不允许人工结算",
            payment_risk_not_reviewable: "支付风险已经处理，不能重复复核",
            payment_issue_not_repairable: "该订单不满足积分补发条件，请重新核对支付记录",
            generation_queue_job_not_found: "队列任务不存在，可能已被 Worker 处理",
            generation_queue_job_state_mismatch: "队列任务状态已经变化，请刷新后重试",
            generation_queue_job_action_unsupported: "当前队列任务不支持该操作",
            generation_queue_not_allowed: "该队列不在平台允许操作的生成队列内",
          }[error] || error;
        }
        return "请求失败";
      }

      function adminIdempotencyKey(scope = "mutation") {
        const safeScope = String(scope || "mutation")
          .toLowerCase()
          .replace(/[^a-z0-9._-]+/g, "-")
          .replace(/^-+|-+$/g, "") || "mutation";
        return `admin-ui-${safeScope}-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      }

      function hasPermission(permission) {
        const permissions = state.session?.permissions || [];
        return permissions.includes(permission);
      }

      function permissionAttrs(permission) {
        if (hasPermission(permission)) {
          return `data-required-permission="${permission}"`;
        }
        return `data-required-permission="${permission}" disabled aria-disabled="true" title="无权限执行该操作"`;
      }

      function userStatusAllowsAction(user, action) {
        const status = user?.status || "active";
        if (action === "view") return true;
        if (status === "active") {
          return ["credit", "membershipGift", "profile", "reveal", "disable", "archive", "teamLimit"].includes(action);
        }
        if (status === "disabled") {
          return action === "enable";
        }
        return false;
      }

      function userStatusBlockedTitle(user) {
        return user?.status === "archived"
          ? "账户已归档，仅允许查看历史记录"
          : "账户禁用期间仅允许查看或启用";
      }

      function userActionAttrs(user, action, permission) {
        const requiredPermission = permission ? `data-required-permission="${permission}"` : "";
        if (!userStatusAllowsAction(user, action)) {
          return `${requiredPermission} disabled aria-disabled="true" title="${userStatusBlockedTitle(user)}"`;
        }
        return permission ? permissionAttrs(permission) : "";
      }

      function guardUserAction(user, action) {
        if (userStatusAllowsAction(user, action)) return true;
        showToast(userStatusBlockedTitle(user));
        return false;
      }

      function setPageLoading(page, loading) {
        state.loadingPages[page] = Boolean(loading);
      }

        const code = error?.payload?.error?.code;
        if (code === "admin_forbidden" || error?.status === 403) {
          state.forbiddenPages[page] = error.payload?.error?.message || "无权限访问该页面";
          return true;
        }
        delete state.forbiddenPages[page];
        return false;
      }

      function clearPageForbidden(page) {
        delete state.forbiddenPages[page];
      }

      function renderPageState(page) {
        if (state.loadingPages[page]) {
          return `<section class="state-panel" data-state="loading"><strong>正在加载后台数据</strong><span>${pages[page] || "后台页面"}</span></section>`;

        if (state.forbiddenPages[page]) {
          return `<section class="state-panel" data-state="forbidden"><strong>无权限访问该页面</strong><span>${state.forbiddenPages[page]}</span></section>`;
        }
        return "";

      function setSubmitting(form, submitting, submittingText = "正在提交") {
        form.setAttribute("data-submitting", submitting ? "true" : "false");
        form.querySelectorAll("button").forEach((button) => {
          if (submitting) {
            button.disabled = true;
            button.dataset.originalText = button.dataset.originalText || button.textContent;
            button.textContent = submittingText;
          } else if (button.dataset.originalText) {
            button.disabled = false;
            button.textContent = button.dataset.originalText;
          } else {
            button.disabled = false;
          }
        });
      }

      function showToast(message = "操作成功") {
        const toast = document.getElementById("toast");
        if (!toast) return;
        toast.textContent = message || "操作成功";
        toast.classList.remove("hidden");
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => toast.classList.add("hidden"), 2400);
      }

      async function runAdminMutation(form, errorElement, action, successMessage = "操作成功") {
        if (form.dataset.submitting === "true") return;
        errorElement.textContent = "";
        setSubmitting(form, true);
        try {
          const result = await action();
          showToast(successMessage || "操作成功");
          return result;
        } catch (err) {
          errorElement.textContent = err.payload?.error?.message || err.message || "操作失败";
          throw err;
        } finally {
          setSubmitting(form, false);
        }
      }

      async function bootstrap() {

        } catch {

          renderLogin("后台登录已过期，请重新登录");

            state.session = result.data;
            history.replaceState(null, "", "/admin/dashboard");
            state.page = "dashboard";

          }

      function settingsWithRuntimeConfigHints(settings) {
        const configs = Array.isArray(settings.configs) ? [...settings.configs] : [];
        for (const hint of runtimeConfigHints) {
          if (!configs.some((config) => config.key === hint.key)) configs.push(hint);
        }
        configs.sort((left, right) => {
          const scopeOrder = String(left.scope || "").localeCompare(String(right.scope || ""));
          return scopeOrder || String(left.key || "").localeCompare(String(right.key || ""));
        });
        return {
          ...settings,
          configs,
          secretReferences: Array.isArray(settings.secretReferences) ? settings.secretReferences : [],
        };
      }

          clearPageForbidden("smsRecords");
        } catch (error) {
          setPageForbidden("smsRecords", error);
          state.smsRecordLoadError = error.payload?.error?.message || "短信记录加载失败";
          state.smsRecords = [];
          state.smsRecordTotal = 0;
          state.smsRecordPage = 1;
        } finally {
          setPageLoading("smsRecords", false);
        }
      }

      function navButton(page, label) {
        return `<button class="${state.page === page ? "active" : ""}" data-page="${page}"><span>${label}</span></button>`;
      }

      function navigate(page) {
        state.page = page;
        const pathMap = {
          dashboard: "/admin/dashboard",
          models: "/admin/models",
          users: "/admin/users",
          membership: "/admin/membership",
          prompts: "/admin/prompts",
          risks: "/admin/risks",
          smsRecords: "/admin/sms-records",
          resources: "/admin/resources",
          settings: "/admin/settings",
          account: "/admin/account",
        };
        history.pushState(null, "", pathMap[page]);
        renderShell();
      }

      async function logout() {
        await api("/api/admin/auth/logout", { method: "POST", body: "{}" }).catch(() => {});
        state.session = null;
        history.replaceState(null, "", "/admin/login");
        renderLogin();
      }

      function renderPage() {
        const pageState = renderPageState(state.page);
        if (pageState) return pageState;
        if (state.page === "dashboard") return dashboardPage();
        if (state.page === "models") return modelsPage();
        if (state.page === "users") return usersPage();
        if (state.page === "membership") return renderMembershipPage();
        if (state.page === "prompts") return promptsPage();
        if (state.page === "risks") return risksPage();
        if (state.page === "smsRecords") return smsRecordsPage();
        if (state.page === "resources") return resourcesPage();
        if (state.page === "settings") return settingsPage();
        return accountPage();
      }

      function dashboardPage() {
        const metrics = state.dashboard.metrics;
        const operational = dashboardOperationalState(metrics);
        return `
          <div class="dashboard-workspace">
            <header class="dashboard-masthead">
              <div class="dashboard-heading">
                <div class="dashboard-eyebrow">今日运行 · ${new Date().toLocaleDateString("zh-CN", { month: "long", day: "numeric", weekday: "long" })}</div>
                <h1>创作平台运行控制台</h1>
                <p>${operational.summary}</p>
              </div>
              <div class="dashboard-masthead-actions">
                <span class="dashboard-status ${operational.tone}">${operational.label}</span>
                <button class="btn ghost" onclick="loadDashboard().then(renderShell)">刷新数据</button>
                <span class="dashboard-sync-note">${state.dashboardRefreshNote || "数据随页面进入自动更新"}</span>
              </div>
            </header>

            <section class="dashboard-kpi-strip" aria-label="今日核心指标">
              ${dashboardKpi("今日生产任务", Number(metrics.generationCountToday || 0).toLocaleString(), `${Number(metrics.projectsCreatedToday || 0).toLocaleString()} 个新项目`, "01")}
              ${dashboardKpi("任务成功率", percent(metrics.generationSuccessRate), `${Number(metrics.generationSucceededToday || 0).toLocaleString()} 成功 · ${Number(metrics.generationFailedToday || 0).toLocaleString()} 异常`, "02")}
              ${dashboardKpi("今日活跃用户", Number(metrics.activeUserCountToday || 0).toLocaleString(), `${Number(metrics.userCount || 0).toLocaleString()} 位平台注册用户`, "03")}
              ${dashboardKpi("今日实收", money(metrics.paidOrderAmountTodayMinor), `${Number(metrics.paidOrdersToday || 0).toLocaleString()} 笔已支付订单`, "04")}
            </section>

            <div class="dashboard-layout">
              <section class="dashboard-panel">
                <div class="dashboard-panel-head">
                  <div class="dashboard-panel-title"><h3>今日生产链路</h3><p>从任务创建到模型产出的实时完成情况</p></div>
                  <div class="dashboard-panel-value">${Number(metrics.generationCountToday || 0).toLocaleString()} <span class="metric-note">任务</span></div>
                </div>
                ${dashboardProductionHtml(metrics)}
              </section>
              <aside class="dashboard-panel">
                <div class="dashboard-panel-head">
                  <div class="dashboard-panel-title"><h3>需要处理</h3><p>按对生产链路的影响排序</p></div>
                  <div class="dashboard-panel-value">${operational.attentionCount}</div>
                </div>
                ${dashboardAttentionHtml(metrics)}
                <div class="dashboard-quick-actions">
                  <button class="btn ghost" data-page="models">模型配置</button>
                  <button class="btn ghost" data-page="users">用户管理</button>
                  <button class="btn ghost" data-page="risks">风控审计</button>
                </div>
              </aside>
            </div>

            ${dashboardBusinessHtml(metrics)}

            ${dashboardQueueHealthHtml()}

            <div class="dashboard-lower-layout">
              <section class="dashboard-panel">
                <div class="dashboard-panel-head">
                  <div class="dashboard-panel-title"><h3>模型与队列</h3><p>异常模型优先，最多展示 8 个</p></div>
                  <button class="btn ghost" onclick="loadDashboardModelHealth().then(renderShell)">刷新</button>
                </div>
                ${dashboardModelHealthSummary()}
                ${healthRows()}
              </section>
              <section class="dashboard-panel">
                <div class="dashboard-panel-head">
                  <div class="dashboard-panel-title"><h3>最近管理活动</h3><p>配置、账号与风控操作记录</p></div>
                  <button class="btn ghost" onclick="loadDashboardRecentEvents().then(renderShell)">刷新</button>
                </div>
                ${recentEventRows()}
              </section>
            </div>
          </div>
        `;
      }

      function dashboardKpi(label, value, note, index) {
        return `<article class="dashboard-kpi"><div class="dashboard-kpi-head"><span class="dashboard-kpi-label">${label}</span><span class="dashboard-kpi-index">${index}</span></div><div class="dashboard-kpi-value">${value}</div><div class="dashboard-kpi-note">${note}</div></article>`;
      }

      function dashboardOperationalState(metrics) {
        const storageFailures = Number(metrics.storageFailureCount || 0);
        const riskPending = Number(metrics.riskPendingCount || 0);
        const failedTasks = Number(metrics.failedTaskCount || 0);
        const modelAttention = state.dashboard.modelHealth.filter((item) => item.status !== "active" || Number(item.failedCount || 0) > 0).length;
        const queueRuntimeIssue = dashboardQueueRuntimeIssue(state.dashboardQueueHealth);
        const attentionCount = storageFailures + riskPending + failedTasks + modelAttention + (queueRuntimeIssue ? 1 : 0);
        if (queueRuntimeIssue) {
          return { tone: "danger", label: "生成链路中断", attentionCount, summary: queueRuntimeIssue };
        }
        if (storageFailures > 0) {
          return { tone: "danger", label: "生产链路异常", attentionCount, summary: `发现 ${storageFailures.toLocaleString()} 个生成结果存储失败，自动重试已停止，请优先处理。` };
        }
        if (attentionCount > 0) {
          return { tone: "warning", label: "有事项待处理", attentionCount, summary: `平台核心服务在线，当前有 ${attentionCount.toLocaleString()} 项风险、任务或模型问题需要确认。` };
        }
        return { tone: "success", label: "运行平稳", attentionCount: 0, summary: "平台核心服务在线，生产任务、模型队列与支付风险均无待处理异常。" };
      }

      function dashboardProductionHtml(metrics) {
        const total = Number(metrics.generationCountToday || 0);
        const succeeded = Number(metrics.generationSucceededToday || 0);
        const inProgress = Number(metrics.generationInProgressToday || 0);
        const failed = Number(metrics.generationFailedToday || 0);
        const other = Math.max(total - succeeded - inProgress - failed, 0);
        const share = (value) => total ? Math.max(0, Math.min(100, (value / total) * 100)) : 0;
        const rows = [
          { key: "succeeded", label: "已成功", value: succeeded },
          { key: "in-progress", label: "处理中", value: inProgress },
          { key: "failed", label: "异常", value: failed },
          { key: "other", label: "其他结束态", value: other },
        ];
        return `<div class="production-meter" role="img" aria-label="任务状态：成功 ${succeeded}，处理中 ${inProgress}，异常 ${failed}，其他 ${other}">${rows.map((item) => `<span class="${item.key}" style="width:${share(item.value).toFixed(2)}%"></span>`).join("")}</div><div class="production-breakdown">${rows.map((item) => `<div class="production-stat ${item.key}"><span class="production-stat-label">${item.label}</span><strong>${item.value.toLocaleString()}</strong><small>${total ? share(item.value).toFixed(1) : "0.0"}%</small></div>`).join("")}</div>`;
      }

      function dashboardAttentionHtml(metrics) {
        const modelAttention = state.dashboard.modelHealth.filter((item) => item.status !== "active" || Number(item.failedCount || 0) > 0).length;
        const queueRuntimeIssue = dashboardQueueRuntimeIssue(state.dashboardQueueHealth);
        const items = [
          { count: queueRuntimeIssue ? 1 : 0, title: "生成队列链路中断", note: queueRuntimeIssue || "", page: "risks", tone: "danger" },
          { count: Number(metrics.storageFailureCount || 0), title: "生成结果存储失败", note: "自动重试已停止，需要人工确认", page: "risks", tone: "danger" },
          { count: Number(metrics.riskPendingCount || 0), title: "支付风险待审核", note: "检查订单风险事件并记录结论", page: "risks", tone: "warning" },
          { count: Number(metrics.failedTaskCount || 0), title: "今日任务异常", note: "包含失败、结果未知和人工复核任务", page: "risks", tone: "warning" },
          { count: modelAttention, title: "模型或队列需关注", note: "模型停用、失败记录或队列积压", page: "models", tone: "neutral" },
        ].filter((item) => item.count > 0);
        if (!items.length) return `<div class="dashboard-clear-state"><div><strong>当前没有待处理异常</strong><span>生产、支付与模型队列状态正常</span></div></div>`;
        return `<div class="dashboard-attention-list">${items.map((item) => `<button class="dashboard-attention-item ${item.tone}" data-page="${item.page}"><span class="dashboard-attention-marker"></span><span class="dashboard-attention-copy"><strong>${item.title}</strong><span>${item.note}</span></span><span class="dashboard-attention-count">${item.count.toLocaleString()}</span></button>`).join("")}</div>`;
      }

      function dashboardBusinessHtml(metrics) {
        const items = [
          ["项目总数", Number(metrics.projectCount || 0).toLocaleString(), `今日新建 ${Number(metrics.projectsCreatedToday || 0).toLocaleString()}`],
          ["平台注册用户", Number(metrics.userCount || 0).toLocaleString(), `今日活跃 ${Number(metrics.activeUserCountToday || 0).toLocaleString()}`],
          ["有效会员", Number(metrics.activeMembershipCount || 0).toLocaleString(), "当前生效中的会员周期"],
          ["今日积分消耗", Number(metrics.creditsConsumedToday || 0).toLocaleString(), "已写入积分账本"],
          ["本月实收", money(metrics.paidOrderAmountMonthMinor), `累计实收 ${money(metrics.paidOrderAmountTotalMinor)}`],
        ];
        return `<section class="business-strip" aria-label="经营与使用概况">${items.map(([label, value, note]) => `<div class="business-stat"><span>${label}</span><strong>${value}</strong><small>${note}</small></div>`).join("")}</section>`;
      }

      function dashboardQueueHealthHtml() {
        const health = state.dashboardQueueHealth;
        if (!health) {
          return `<section class="dashboard-panel dashboard-queue-panel"><div class="dashboard-panel-head"><div class="dashboard-panel-title"><h3>队列实时健康</h3><p>Redis、BullMQ 与生成 outbox 的当前状态</p></div><button class="btn ghost" onclick="loadDashboardQueueHealth().then(renderShell)">刷新健康度</button></div><div class="dashboard-empty">${escapeHtml(state.dashboardQueueLoadError || "尚未读取队列健康状态")}</div></section>`;
        }
        const queues = Array.isArray(health.queues) ? health.queues : [];
        const platform = health.platformMetrics || {};
        const outboxPending = Number(platform.outbox?.pendingCount || 0);
        const outboxReady = Number(platform.outbox?.readyCount ?? outboxPending);
        const outboxOldestAgeMs = Number(platform.outbox?.oldestReadyAgeMs ?? platform.outbox?.oldestAgeMs ?? 0);
        const staleProcessingCount = Number(platform.outbox?.staleProcessingCount || 0);
        const outboxStale = platform.outbox?.status === "degraded";
        const dispatcherHealthy = health.outboxDispatcher?.status === "healthy";
        const disconnectedQueues = queues.filter((queue) => queue.role !== "dead_letter" && Number(queue.workerCount) === 0).length;
        const degraded = queues.filter((queue) => queue.status !== "healthy").length;
        const runtimeDegraded = health.status !== "healthy" || !dispatcherHealthy || outboxStale || disconnectedQueues > 0;
        const redisTone = health.redis?.status === "healthy" ? "success" : "danger";
        const overallTone = !runtimeDegraded ? "success" : health.status === "unavailable" || outboxStale ? "danger" : "warning";
        const workerCount = queues.reduce((sum, queue) => sum + (Number.isFinite(Number(queue.workerCount)) ? Number(queue.workerCount) : 0), 0);
        const queueItems = queues.map((queue) => {
          const counts = queue.counts || {};
          const isDeadLetter = queue.role === "dead_letter";
          const pendingDeadLetters = Number(counts.waiting || 0) + Number(counts.delayed || 0) + Number(counts.failed || 0);
          const status = isDeadLetter && pendingDeadLetters > 0
            ? "待人工处理"
            : queue.status === "healthy" ? "正常" : queue.status === "degraded" ? "需关注" : "不可用";
          const workers = isDeadLetter
            ? "隔离存储"
            : queue.workerCount == null ? "消费者未知" : `${Number(queue.workerCount).toLocaleString()} 个消费者`;
          const manageAction = isDeadLetter && pendingDeadLetters > 0
            ? `<div class="dashboard-queue-item-actions"><button class="dashboard-queue-manage" type="button" onclick="openDeadLetterWorkbench()">处理 ${pendingDeadLetters.toLocaleString()} 条死信</button></div>`
            : "";
          return `<article class="dashboard-queue-item ${escapeAttribute(queue.status || "unavailable")}"><div class="dashboard-queue-item-head"><div style="min-width:0"><div class="dashboard-queue-item-name" title="${escapeAttribute(queue.name)}">${escapeHtml(queue.name)}</div><div class="dashboard-queue-item-role">${escapeHtml(queueRoleLabel(queue.role))}</div></div><span class="dashboard-queue-item-status">${status} · ${workers}</span></div><div class="dashboard-queue-counts"><div class="dashboard-queue-count"><span>等待</span><strong>${Number(counts.waiting || 0).toLocaleString()}</strong></div><div class="dashboard-queue-count"><span>执行中</span><strong>${Number(counts.active || 0).toLocaleString()}</strong></div><div class="dashboard-queue-count"><span>延迟</span><strong>${Number(counts.delayed || 0).toLocaleString()}</strong></div><div class="dashboard-queue-count"><span>失败</span><strong>${Number(counts.failed || 0).toLocaleString()}</strong></div></div>${manageAction}</article>`;
        }).join("");
        const overallLabel = !runtimeDegraded
          ? "队列系统正常"
          : health.status === "unavailable"
            ? "队列系统不可用"
            : !dispatcherHealthy
              ? "Dispatcher 离线"
              : outboxStale
                ? "Outbox 投递异常"
                : `${Math.max(degraded, disconnectedQueues).toLocaleString()} 个队列需关注`;
        const outboxTone = !dispatcherHealthy || outboxStale ? "danger" : outboxReady > 0 ? "warning" : "success";
        const outboxLabel = !health.outboxDispatcherEnabled
          ? "Outbox 调度未启用"
          : !dispatcherHealthy
            ? "Outbox 调度器离线"
            : staleProcessingCount > 0
              ? `Outbox 投递卡住 ${staleProcessingCount.toLocaleString()} 条`
              : outboxStale
                ? `Outbox 超时未投递 ${outboxReady.toLocaleString()} 条`
                : outboxReady > 0
                  ? `Outbox 待投递 ${outboxReady.toLocaleString()} 条`
                  : "Outbox 正常";
        const checkedAt = state.dashboardQueueRefreshNote || (health.inspectedAt ? `检查时间 ${formatAdminDateTime(health.inspectedAt)}` : "");
        return `<section class="dashboard-panel dashboard-queue-panel"><div class="dashboard-panel-head"><div class="dashboard-panel-title"><h3>队列实时健康</h3><p>刷新时重新请求 Redis、BullMQ 和数据库 outbox 的当前状态</p></div><div class="dashboard-panel-actions"><button class="btn ghost" onclick="loadDashboardQueueHealth().then(renderShell)">刷新健康度</button></div></div><div class="dashboard-queue-summary"><span class="dashboard-queue-badge ${overallTone}">${overallLabel}</span><span class="dashboard-queue-badge ${redisTone}">Redis ${health.redis?.status === "healthy" ? "在线" : "不可用"}</span><span class="dashboard-queue-badge ${dispatcherHealthy ? "success" : "danger"}">Dispatcher ${dispatcherHealthy ? "运行中" : "无心跳"}</span><span class="dashboard-queue-badge ${health.workersEnabled && workerCount > 0 ? "success" : "danger"}">消费者 ${workerCount.toLocaleString()}</span><span class="dashboard-queue-badge ${outboxTone}">${outboxLabel}</span></div><div class="dashboard-queue-grid">${queueItems || `<div class="dashboard-empty">暂无 BullMQ 队列数据</div>`}</div><div class="dashboard-queue-foot"><span>Redis 命名空间 <strong>${escapeHtml(health.queuePrefix || "-")}</strong> · 数据库 outbox 待投递 <strong>${outboxReady.toLocaleString()}</strong>${outboxReady > 0 ? ` · 最旧等待 <strong>${formatQueueAge(outboxOldestAgeMs)}</strong>` : ""} · 活跃生成任务 <strong>${Number(platform.tasks?.activeCount || 0).toLocaleString()}</strong></span><span>${escapeHtml(checkedAt)}</span></div></section>`;
      }

      function dashboardQueueRuntimeIssue(health) {
        if (!health) return "";
        if (health.redis?.status !== "healthy") return "Redis 不可用，生成任务无法投递或轮询。";
        if (!health.outboxDispatcherEnabled) return "Outbox dispatcher 未启用，生成任务不会发送给供应商。";
        if (health.outboxDispatcher?.status !== "healthy") return "Outbox dispatcher 无心跳，生成任务可能停在提交阶段。";
        const outbox = health.platformMetrics?.outbox || {};
        if (Number(outbox.staleProcessingCount || 0) > 0) return `Outbox 有 ${Number(outbox.staleProcessingCount).toLocaleString()} 条投递卡住。`;
        if (outbox.status === "degraded") return `Outbox 有 ${Number(outbox.readyCount || 0).toLocaleString()} 条任务超时未投递。`;
        const queues = Array.isArray(health.queues) ? health.queues : [];
        const disconnected = queues.filter((queue) => queue.role !== "dead_letter" && Number(queue.workerCount) === 0).length;
        return disconnected > 0 ? `${disconnected.toLocaleString()} 个生成队列没有消费者。` : "";
      }

      function formatQueueAge(milliseconds) {
        const seconds = Math.max(0, Math.floor(Number(milliseconds || 0) / 1000));
        if (seconds < 60) return `${seconds} 秒`;
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `${minutes} 分钟`;
        const hours = Math.floor(minutes / 60);
        return `${hours} 小时 ${minutes % 60} 分钟`;
      }

      function healthRows() {
        const models = [...state.dashboard.modelHealth]
          .sort((left, right) => Number(right.status !== "active" || Number(right.failedCount || 0) > 0) - Number(left.status !== "active" || Number(left.failedCount || 0) > 0))
          .slice(0, 8);
        const seenQueues = new Set();
        const rows = models.length
          ? models.map((item) => {
              const needsAttention = item.status !== "active" || Number(item.failedCount || 0) > 0;
              const queueKey = dashboardQueueKey(item);
              const sharedQueue = seenQueues.has(queueKey);
              seenQueues.add(queueKey);
              const queueDepth = sharedQueue ? "共享" : Number(item.queueDepth || 0).toLocaleString();
              const failedCount = sharedQueue ? "共享" : Number(item.failedCount || 0).toLocaleString();
              return `<tr><td>${escapeHtml(item.displayName)}<div class="metric-note">${escapeHtml(item.modelCode)}</div></td><td>${escapeHtml(item.queueName)}</td><td><span class="tag ${needsAttention ? "warn" : "green"}">${needsAttention ? "需关注" : "可用"}</span></td><td>${queueDepth}</td><td>${failedCount}</td><td class="actions"><button class="icon-btn" title="查看模型健康详情" onclick="openDashboardModelHealthDrawer('${escapeAttribute(item.modelCode)}')">详</button></td></tr>`;
            }).join("")
          : `<tr><td colspan="6">${escapeHtml(state.dashboardLoadError || "暂无模型健康数据")}</td></tr>`;
        return `<div class="table-wrap compact"><table><thead><tr><th>模型</th><th>任务队列</th><th>状态</th><th>积压</th><th>失败</th><th class="actions">操作</th></tr></thead><tbody>${rows}</tbody></table></div>`;
      }

      function dashboardQueueKey(item) {
        return String(item?.queueName || "-");
      }

      function dashboardQueueTotals(models) {
        const totals = new Map();
        for (const item of models || []) {
          const key = dashboardQueueKey(item);
          if (totals.has(key)) continue;
          totals.set(key, {
            queueDepth: Number(item.queueDepth || 0),
            failedCount: Number(item.failedCount || 0),
          });
        }
        return [...totals.values()].reduce(
          (summary, item) => ({
            queueDepth: summary.queueDepth + item.queueDepth,
            failedCount: summary.failedCount + item.failedCount,
          }),
          { queueDepth: 0, failedCount: 0 },
        );
      }

      function dashboardModelHealthSummary() {
        const models = state.dashboard.modelHealth;
        const attention = models.filter((item) => item.status !== "active" || Number(item.failedCount || 0) > 0).length;
        const active = models.filter((item) => item.status === "active").length;
        const queued = dashboardQueueTotals(models).queueDepth;
        return `<div class="dashboard-health-summary"><span><strong>${active.toLocaleString()}</strong> 个启用</span><span><strong>${attention.toLocaleString()}</strong> 个需关注</span><span><strong>${queued.toLocaleString()}</strong> 个任务积压</span></div>`;
      }

      function openDashboardModelHealthDrawer(modelCode) {
        const item = state.dashboard.modelHealth.find((entry) => String(entry.modelCode) === String(modelCode));
        if (!item) return;
        const queueDepth = Number(item.queueDepth || 0);
        const failedCount = Number(item.failedCount || 0);
        const needsAttention = item.status !== "active" || failedCount > 0;
        const drawer = document.getElementById("drawer");
        drawer.classList.remove("hidden");
        drawer.innerHTML = `<aside class="drawer-panel" style="width:min(680px,100%);">
          <div class="drawer-head"><h3>模型健康详情</h3><button class="icon-btn" onclick="closeDrawer()">×</button></div>
          <section class="card">
            <h4>运行状态</h4>
            <div class="check-list">
              <div><span>模型</span><span>${escapeHtml(item.displayName || "-")}</span></div>
              <div><span>模型编码</span><span>${escapeHtml(item.modelCode || "-")}</span></div>
              <div><span>状态</span><span class="tag ${needsAttention ? "warn" : "green"}">${needsAttention ? "需要关注" : "正常"}</span></div>
            </div>
          </section>
          <section class="card">
            <h4>队列指标</h4>
            <div class="check-list">
              <div><span>队列名称</span><span>${escapeHtml(item.queueName || "-")}</span></div>
              <div><span>积压任务</span><span>${queueDepth.toLocaleString()}</span></div>
              <div><span>失败任务</span><span>${failedCount.toLocaleString()}</span></div>
            </div>
          </section>
          <div class="grid" style="grid-template-columns:1fr 1fr;">
            <button class="btn primary full" onclick="navigate('models')">进入模型配置</button>
            <button class="btn ghost full" onclick="navigate('risks')">进入风控审计</button>
          </div>
        </aside>`;
      }

      function recentEventRows() {

      function stripHtmlToText(html) {

          .replace(/<[^>]+>/g, "")

          .replace(/&gt;/g, ">")
          .replace(/&amp;/g, "&")
          .trim();

      function sanitizeRichTextHtml(html) {
        const template = document.createElement("template");
        template.innerHTML = String(html || "");
        const blockedTags = new Set(["SCRIPT", "STYLE", "IFRAME", "OBJECT", "EMBED", "LINK", "META"]);
        const blockTags = new Set(["P", "DIV", "SECTION", "ARTICLE", "HEADER", "FOOTER", "H1", "H2", "H3", "BLOCKQUOTE"]);
        const allowedTags = new Set(["P", "BR", "STRONG", "B", "EM", "I", "U", "S", "H1", "H2", "H3", "BLOCKQUOTE", "UL", "OL", "LI", "A"]);

        const unwrapElement = (element) => {
          const parent = element.parentNode;
          if (!parent) return;
          while (element.firstChild) {
            parent.insertBefore(element.firstChild, element);
          }
          element.remove();
        };

        const replaceTag = (element, tagName) => {
          const replacement = document.createElement(tagName);
          while (element.firstChild) {
            replacement.appendChild(element.firstChild);
          }
          element.replaceWith(replacement);
          return replacement;
        };

        Array.from(template.content.querySelectorAll("*")).forEach((originalElement) => {
          let element = originalElement;
          if (blockedTags.has(element.tagName)) {
            element.remove();
            return;
          }

          if (element.tagName === "SPAN" || element.tagName === "FONT") {
            unwrapElement(element);
            return;
          }

          if (element.tagName === "DIV") {
            const hasNestedBlocks = Array.from(element.children).some((child) => blockTags.has(child.tagName));
            if (hasNestedBlocks) {
              unwrapElement(element);
              return;
            }
            element = replaceTag(element, "p");
          }

          if (!allowedTags.has(element.tagName)) {
            unwrapElement(element);
            return;
          }

          Array.from(element.attributes).forEach((attribute) => {
            const attributeName = attribute.name.toLowerCase();
            if (/^on/i.test(attributeName)) {
              element.removeAttribute(attribute.name);
              return;
            }
            if (element.tagName === "A" && attributeName === "href") {
              if (/^\s*javascript:/i.test(attribute.value)) {
                element.removeAttribute(attribute.name);
              }
              return;
            }
            element.removeAttribute(attribute.name);
          });

          if (element.tagName === "A") {
            element.setAttribute("target", "_blank");
            element.setAttribute("rel", "noopener noreferrer");
            if (!element.getAttribute("href")) {
              unwrapElement(element);
              return;
            }
          }

          if (blockTags.has(element.tagName)) {
            const text = element.textContent.replace(/\u00a0/g, " ").trim();
            if (!text && !element.querySelector("ul,ol,li")) {
              element.remove();
            }
          }
        });

        Array.from(template.content.childNodes).forEach((node) => {
          if (node.nodeType !== Node.TEXT_NODE) return;
          const text = node.textContent.replace(/\u00a0/g, " ").trim();
          if (!text) {
            node.remove();
            return;
          }
          const paragraph = document.createElement("p");
          paragraph.textContent = text;
          node.replaceWith(paragraph);
        });

        return template.innerHTML;
      }

      function filteredUsers() {

        const status = filters.status || "all";
        const membershipTier = filters.membershipTier || "all";
        return state.users.filter((user) => {
          const haystack = [
            user.userId,
            user.displayName,
            user.phone,
            user.email,
            user.accountName,
            user.teamGroupName,
            user.teamRole,
            user.membershipRole,
            userMembershipStatusLabel(user),
          ].filter(Boolean).join(" ").toLowerCase();
          if (keyword && !haystack.includes(keyword)) return false;
          if (status !== "all" && user.status !== status) return false;
          if (membershipTier !== "all" && userMembershipTierKey(user) !== membershipTier) return false;
          return true;
        });

        if (count) {
