          </form>
        </aside>`;
        const form = document.getElementById("model-editor-form");
        form.elements.modelApiKeyEnv.addEventListener("change", (event) => {
          const providerName = event.target.selectedOptions[0]?.dataset?.providerName || "";
          if (providerName) form.elements.providerName.value = providerName;
        });
        form.elements.modelKind.addEventListener("change", () => {
          const kind = modelKindOption(form.elements.modelKind.value);
          form.querySelectorAll("[data-canvas-agent-pricing-field]").forEach((field) => {
            field.hidden = kind.mediaType !== "text";
          });
          form.elements.canvasAgentTokenCreditsPerMillion.required = kind.mediaType === "text";
          form.elements.providerAdapter.innerHTML = modelAdapterOptionsMarkup(kind.mediaType, form.elements.providerAdapter.value, form.elements.providerName.value);
          const template = fixedModelTemplate(kind.mediaType, form.elements.providerName.value, form.elements.providerAdapter.value);
          form.elements.requestPath.value = template.providerConfig.requestPath || template.providerConfig.createTaskEndpoint || template.providerConfig.endpoint || "";
          document.querySelector("#model-parameter-template-list tbody").innerHTML = parameterTemplateSelectionRows(kind.mediaType, base.parameterSchema || {}, base.defaultParams || {}, !isEdit, base.pricing || {});
          updateModelFrontendParameterPreview(base.parameterSchema || {}, !isEdit);
        });
        form.elements.providerAdapter.addEventListener("change", () => {
          const kind = modelKindOption(form.elements.modelKind.value);
          const template = fixedModelTemplate(kind.mediaType, form.elements.providerName.value, form.elements.providerAdapter.value);
          form.elements.requestPath.value = template.providerConfig.requestPath || template.providerConfig.createTaskEndpoint || template.providerConfig.endpoint || "";
        });
        form.addEventListener("change", (event) => {
          const name = event.target?.name || "";
          if (name.startsWith("parameterOptions:")) {
            updateParameterSelectedPreview(name.slice("parameterOptions:".length));
          }
          if (name.startsWith("parameterSupported:") || name.startsWith("parameterOptions:") || name.startsWith("parameterDefault:")) {
            updateModelFrontendParameterPreview(base.parameterSchema || {}, !isEdit);
          }
        });
        form.addEventListener("input", (event) => {
          const name = event.target?.name || "";
          if (name === "modelCode" || name === "displayName") {
            updateModelFrontendParameterPreview(base.parameterSchema || {}, !isEdit);
          }
        });
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const error = document.getElementById("model-editor-error");
          await runAdminMutation(event.currentTarget, error, async () => {
            const payload = simplifiedModelPayloadFromForm(new FormData(event.currentTarget), model);
            const result = await api(isEdit ? `/api/admin/models/${encodeURIComponent(model.id)}` : "/api/admin/models", {
              method: isEdit ? "PATCH" : "POST",
              headers: { "idempotency-key": `admin-ui-model-simple-${model?.id || payload.modelCode}-${Date.now()}` },
              body: JSON.stringify(payload),
            });
            await loadModels();
            state.selectedModelId = result.data?.id || model?.id || state.selectedModelId;
            closeDrawer();
            renderShell();
          }, isEdit ? "\u6a21\u578b\u914d\u7f6e\u5df2\u4fdd\u5b58" : "\u6a21\u578b\u914d\u7f6e\u5df2\u521b\u5efa").catch(() => undefined);
        });
      };

      function modelTransportFields(existing, fixed, transportChanged) {
        const source = existing && !transportChanged ? existing : fixed;
        return {
          providerProtocol: source.providerProtocol || fixed.providerProtocol,
          invocationMode: source.invocationMode || fixed.invocationMode,
          capabilities: source.capabilities || fixed.capabilities,
          limits: source.limits || fixed.limits,
          dispatchPolicy: {
            ...fixed.dispatchPolicy,
            ...(source.dispatchPolicy || {}),
          },
        };
      }

      function fixedBananaRouterImageTransportFields(existing, fixed) {
        return {
          providerProtocol: fixed.providerProtocol,
          invocationMode: fixed.invocationMode,
          capabilities: {
            ...(existing?.capabilities || {}),
            ...fixed.capabilities,
          },
          limits: existing?.limits || fixed.limits,
          dispatchPolicy: {
            ...fixed.dispatchPolicy,
            ...(existing?.dispatchPolicy || {}),
            submitQueueName: fixed.dispatchPolicy.submitQueueName,
            pollQueueName: fixed.dispatchPolicy.pollQueueName,
          },
        };
      }

      function modelKindTransportFields(existing, kind) {
        const kindChanged = Boolean(existing) && kind.value !== inferModelKind(existing);
        const existingTaskModes = Array.isArray(existing?.taskModes) ? existing.taskModes.map(String) : [];
        const taskModes = existing && !kindChanged && existingTaskModes.length > 0
          ? existingTaskModes
          : kind.mediaType === "video"
          ? resolveVideoTaskModes(kind, existing)
          : kind.taskModes;
        const existingSupportedModes = Array.isArray(existing?.uiConfig?.supportedModes)
          ? existing.uiConfig.supportedModes.map(String)
          : [];
        const supportedModes = existing && !kindChanged && existingSupportedModes.length > 0
          ? existingSupportedModes
          : kind.mediaType === "text"
          ? ["script"]
          : kind.value.startsWith("image.")
          ? (kind.value === "image.text_to_image" ? ["text_to_image"] : ["reference_image", "multi_reference", "image_to_image"])
          : videoSupportedModesByTaskModes(kind.videoCategory, taskModes);
        return { taskModes, supportedModes };
      }

      function modelTransportChanged(existing, mediaType, providerAdapter) {
        const existingProtocol = String(existing?.providerProtocol || "").trim().replaceAll("-", "_");
        const existingConfig = existing?.providerConfig || {};
        const providerPath = (value) => {
          const raw = String(value || "").trim();
          if (!raw) return "";
          try {
            return decodeURIComponent(new URL(raw, "https://provider.invalid").pathname).replace(/\/+$/g, "");
          } catch {
            return "";
          }
        };
        const createPaths = [existingConfig.requestPath, existingConfig.endpoint, existingConfig.createTaskEndpoint]
          .map(providerPath)
          .filter(Boolean);
        const repairsMixedBananaRouterImage = providerAdapter === "banana_router"
          && mediaType === "image"
          && (
            String(existing?.invocationMode || "sync") !== "async_polling"
            || existing?.capabilities?.asyncPolling !== true
            || createPaths.length === 0
            || createPaths.some((path) => path !== "/v1/images/generations/async")
            || providerPath(existingConfig.editEndpoint) !== "/v1/images/edits/async"
            || providerPath(existingConfig.queryTaskEndpoint) !== "/v1/async-tasks/{taskId}"
            || String(existingConfig.resultFormat || "") !== "url"
            || String(existing?.dispatchPolicy?.pollQueueName || "") !== "generation-poll-image"
          );
        return Boolean(existing) && (
          providerAdapter !== inferModelAdapter(existing)
          || providerAdapter !== existingProtocol
          || mediaType !== String(existing.mediaType || "")
          || repairsMixedBananaRouterImage
        );
      }

      function simplifiedModelPayloadFromForm(form, existing) {
        const kind = modelKindOption(String(form.get("modelKind") || ""));
        const mediaType = kind.mediaType;
        const providerName = String(form.get("providerName") || "").trim() || providerNameForSecretKey(form.get("modelApiKeyEnv")) || String(existing?.providerName || "").trim() || "custom";
        const providerAdapter = String(form.get("providerAdapter") || "").trim() || defaultModelAdapter(mediaType, providerName);
        const fixed = fixedModelTemplate(mediaType, providerName, providerAdapter);
        const kindTransport = modelKindTransportFields(existing, kind);
        const taskModes = kindTransport.taskModes;
        const selected = schemaFromSelectedParameterTemplates(form, existing?.parameterSchema || {}, existing?.defaultParams || {});
        const transportChanged = modelTransportChanged(existing, mediaType, providerAdapter);
        const fixedBananaRouterImageTransport = mediaType === "image" && providerAdapter === "banana_router";
        const transport = fixedBananaRouterImageTransport
          ? fixedBananaRouterImageTransportFields(existing, fixed)
          : modelTransportFields(existing, fixed, transportChanged);
        const providerConfig = fixedBananaRouterImageTransport
          ? { ...(existing?.providerConfig || {}), ...fixed.providerConfig }
          : { ...fixed.providerConfig, ...(transportChanged ? {} : existing?.providerConfig || {}) };
        const requestPath = String(form.get("requestPath") || "").trim();
        if (fixedBananaRouterImageTransport) {
          providerConfig.requestPath = fixed.providerConfig.requestPath;
        } else if (requestPath) {
          providerConfig.requestPath = requestPath;
        } else {
          delete providerConfig.requestPath;
        }
        const apiKeyEnv = String(form.get("modelApiKeyEnv") || "").trim();
        if (apiKeyEnv) {
          providerConfig.apiKeyEnv = apiKeyEnv;
        } else {
          delete providerConfig.apiKeyEnv;
        }
        delete providerConfig.apiKey;
        const resolutionCredits = resolutionCreditsFromForm(form);
        const pricing = {
          ...fixed.pricing,
          ...(existing?.pricing || {}),
          unit: mediaType,
          billingMode: String(form.get("billingMode") || "fixed") === "duration" ? "duration" : "fixed",
          baseCredits: baseCreditsFromForm(form, existing?.pricing?.baseCredits ?? fixed.pricing.baseCredits, resolutionCredits),
        };
        if (mediaType === "text") {
          pricing.canvasAgentBillingMode = String(form.get("canvasAgentBillingMode") || "token");
          pricing.canvasAgentTokenCreditsPerMillion = Number(form.get("canvasAgentTokenCreditsPerMillion"));
          delete pricing.tokenCreditsPerMillion;
          delete pricing.inputCreditsPerMillion;
          delete pricing.outputCreditsPerMillion;
        } else {
          delete pricing.canvasAgentBillingMode;
          delete pricing.canvasAgentTokenCreditsPerMillion;
          delete pricing.tokenCreditsPerMillion;
        }
        if (Object.keys(resolutionCredits).length > 0) {
          pricing.resolutionCredits = resolutionCredits;
        } else {
          delete pricing.resolutionCredits;
        }
        const uiConfig = {
          ...fixed.uiConfig,
          ...(existing?.uiConfig || {}),
          modelKind: kind.value,
          modelKindLabel: kind.label,
          supportedModes: kindTransport.supportedModes,
        };
        if (kind.mediaType === "video") {
          uiConfig.videoCategory = kind.videoCategory;
          uiConfig.videoCategoryLabel = kind.label;
        } else {
          delete uiConfig.videoCategory;
          delete uiConfig.videoCategoryLabel;
        }
        return {
          modelCode: String(form.get("modelCode") || "").trim(),
          displayName: String(form.get("displayName") || "").trim(),
          providerName,
          providerModel: String(form.get("providerModel") || "").trim(),
          providerProtocol: transport.providerProtocol,
          invocationMode: transport.invocationMode,
          mediaType,
          taskModes,
          status: existing?.status || fixed.status,
          sortOrder: Number(existing?.sortOrder || fixed.sortOrder),
          parameterSchema: selected.schema,
          defaultParams: { ...fixed.defaultParams, ...selected.defaults },
          capabilities: transport.capabilities,
          pricing,
          providerConfig,
          limits: transport.limits,
          uiConfig,
          dispatchPolicy: transport.dispatchPolicy,
          remark: String(form.get("remark") || ""),
          reason: String(form.get("reason") || ""),
        };
      }

      modelsPage = function modelsPage() {
        const rows = state.models.length
          ? sortedModelRows().map((model) => modelRow(model)).join("")
          : `<tr><td colspan="8">${state.modelLoadError || "\u6682\u65e0\u6a21\u578b\u914d\u7f6e"}</td></tr>`;
        const mediaSection = mediaModelSection();
        return `<div class="toolbar"><div class="filters"><input placeholder="\u641c\u7d22\u6a21\u578b\u540d\u79f0 / \u7f16\u7801" /><select><option>\u5168\u90e8\u72b6\u6001</option><option>\u542f\u7528</option><option>\u7981\u7528</option></select><select><option>\u5168\u90e8\u7c7b\u578b</option><option>\u6587\u751f\u56fe</option><option>\u53c2\u8003\u751f\u56fe</option><option>\u9996\u5e27\u751f\u89c6\u9891</option><option>\u9996\u5c3e\u5e27\u751f\u89c6\u9891</option><option>\u53c2\u8003\u751f\u89c6\u9891</option><option>\u5267\u672c\u6a21\u578b</option></select><select aria-label="按 API 秘钥筛选" onchange="updateModelApiKeyFilter(this.value)">${modelApiKeyFilterOptions()}</select></div><button class="btn primary" onclick="openModelEditorDrawer()" ${permissionAttrs("model.write")}>\u65b0\u589e\u6a21\u578b</button></div>
           ${mediaSection}`;
      };

      function modelSortValue(model) {
        const value = Number(model?.sortOrder ?? model?.sort_order ?? 100);
        return Number.isFinite(value) ? value : 100;
      }

      function sortedModelRows() {
        return [...state.models].sort((left, right) => modelSortValue(left) - modelSortValue(right) || String(left.modelCode || "").localeCompare(String(right.modelCode || "")));
      }

      function modelApiKeyFilterOptions() {
        const names = [...new Set(sortedModelRows().map(modelApiKeyName).filter(Boolean))]
          .sort((left, right) => left.localeCompare(right, "zh-CN"));
        const options = [
          { value: "all", label: "全部秘钥" },
          ...names.map((name) => ({ value: name, label: name })),
        ];
        if (sortedModelRows().some((model) => !modelApiKeyName(model))) {
          options.push({ value: "__unconfigured__", label: "未配置秘钥" });
        }
        return options.map((option) => `<option value="${escapeAttribute(option.value)}" ${option.value === state.modelApiKeyFilter ? "selected" : ""}>${escapeHtml(option.label)}</option>`).join("");
      }

      function updateModelApiKeyFilter(value) {
        state.modelApiKeyFilter = String(value || "all");
        renderShell();
      }

      function modelMatchesApiKeyFilter(model) {
        const filter = String(state.modelApiKeyFilter || "all");
        const apiKeyName = modelApiKeyName(model);
        if (filter === "all") return true;
        if (filter === "__unconfigured__") return !apiKeyName;
        return apiKeyName === filter;
      }

      const modelMediaTabs = [
        { key: "image", title: "图片模型", note: "查看全部图片模型。" },
        { key: "video", title: "视频模型", note: "查看全部视频模型。" },
        { key: "text", title: "文本模型", note: "查看全部文本模型。" },
      ];

      function modelsByMediaTab(tabKey) {
        const rows = sortedModelRows().filter(modelMatchesApiKeyFilter);
        if (tabKey === "video") {
          return rows.filter((model) => String(model.mediaType || "").trim() === "video");
        }
        if (tabKey === "text") {
          return rows.filter((model) => {
            const mediaType = String(model.mediaType || "").trim();
            return mediaType !== "image" && mediaType !== "video";
          });
        }
        return rows.filter((model) => String(model.mediaType || "").trim() === "image");
      }

      function updateModelMediaTab(tabKey) {
        state.modelMediaTab = modelMediaTabs.some((item) => item.key === tabKey) ? tabKey : "image";
        renderShell();
      }

      function mediaModelSection() {
        const activeTab = modelMediaTabs.find((item) => item.key === state.modelMediaTab) || modelMediaTabs[0];
        const mediaRows = modelsByMediaTab(activeTab.key);
        const rows = mediaRows.length
          ? mediaRows.map((model) => modelRow(model, true)).join("")
          : `<tr><td colspan="9">当前分类下暂无模型</td></tr>`;
        return `<section class="card" style="margin-bottom:12px;">
          <div class="toolbar">
            <div class="prompt-toolbar-title">
              <h3 style="margin:0;">按媒体类型查看</h3>
              <div class="metric-note">${escapeHtml(activeTab.note)}</div>
            </div>
            <div class="filters"><span class="metric-note">共 ${mediaRows.length} 个</span></div>
          </div>
          <div class="model-tab-list" style="margin-bottom:12px;">
            ${modelMediaTabs.map((item) => `<button class="model-tab-btn ${item.key === activeTab.key ? "active" : ""}" onclick="updateModelMediaTab('${item.key}')">${item.title}<span class="tag blue" style="margin-left:6px;">${modelsByMediaTab(item.key).length}</span></button>`).join("")}
          </div>
          <div class="table-wrap models dense"><table><thead><tr><th>模型编码</th><th>展示名</th><th>API秘钥</th><th>类型</th><th>价格摘要</th><th>排序</th><th>状态</th><th>兼容性诊断</th><th class="actions">操作</th></tr></thead><tbody>${rows}</tbody></table></div>
        </section>`;
      }

      function modelCompatibilityProbeMarkup(model) {
        if (!Array.isArray(model.taskModes) || !model.taskModes.includes("text.canvas_agent")) {
          return `<span class="metric-note">-</span>`;
        }
        const probe = model.compatibilityProbe;
        if (!probe) {
          return `<span class="tag warn">未探测</span><div class="metric-note">探测后才会自动隔离失败模型</div>`;
        }
        const failedChecks = Array.isArray(probe.checks)
          ? probe.checks.filter((check) => check && check.status === "failed")
          : [];
        const detail = failedChecks
          .map((check) => String(check.message || check.key || "探测失败"))
          .join("；");
        const checkedAt = probe.checkedAt
          ? new Date(probe.checkedAt).toLocaleString("zh-CN")
          : "-";
        const label = probe.status === "passed" ? "兼容" : "已隔离";
        return `<span class="tag ${probe.status === "passed" ? "green" : "warn"}" title="${escapeAttribute(detail)}">${label}</span><div class="metric-note">${escapeHtml(checkedAt)} · ${Number(probe.latencyMs || 0)} ms${detail ? `<br>${escapeHtml(detail)}` : ""}</div>`;
      }

      async function probeModelCompatibility(modelId) {
        const result = await api(`/api/admin/models/${encodeURIComponent(modelId)}/probe`, {
          method: "POST",
          body: JSON.stringify({ reason: "Canvas Agent 兼容性诊断" }),
        });
        await loadModels();
        renderShell();
        showToast(result.data?.ok ? "模型兼容性探测通过" : "模型探测失败，已从新 Canvas Agent 任务中隔离");
      }

      modelRow = function modelRow(model) {
        const price = priceSummary(model.pricing);
        const apiKeyName = modelApiKeyName(model);
        const statusLabel = model.status === "active" ? "\u542f\u7528" : model.status === "disabled" ? "\u7981\u7528" : "\u5f52\u6863";
        const nextStatus = model.status === "active" ? "disabled" : "active";
        const agentProbeButton = Array.isArray(model.taskModes) && model.taskModes.includes("text.canvas_agent")
          ? `<button class="icon-btn" title="Canvas Agent 兼容性探测" onclick="probeModelCompatibility('${model.id}')" ${permissionAttrs("model.write")}>测</button>`
          : "";
        return `<tr><td>${escapeHtml(model.modelCode || "-")}</td><td>${escapeHtml(model.displayName || "-")}</td><td>${apiKeyName ? escapeHtml(apiKeyName) : ""}</td><td><span class="tag blue">${escapeHtml(modelKindLabel(model))}</span></td><td>${price}</td><td><div class="actions-row"><button class="icon-btn" title="\u4e0a\u79fb" onclick="moveModelSortOrder('${model.id}', -1)" ${permissionAttrs("model.write")}>\u2191</button><input style="width:64px;height:28px;padding:4px 6px;" type="number" value="${modelSortValue(model)}" onchange="saveModelSortOrder('${model.id}', this.value)" ${hasPermission("model.write") ? "" : "disabled"} /><button class="icon-btn" title="\u4e0b\u79fb" onclick="moveModelSortOrder('${model.id}', 1)" ${permissionAttrs("model.write")}>\u2193</button></div></td><td><span class="tag ${model.status === "active" ? "green" : "warn"}">${statusLabel}</span></td><td>${modelCompatibilityProbeMarkup(model)}</td><td class="actions"><div class="actions-row">${agentProbeButton}<button class="icon-btn" onclick="openModelEditorDrawer('${model.id}')" ${permissionAttrs("model.write")}>\u7f16</button><button class="icon-btn" onclick="openModelDuplicateDrawer('${model.id}')" ${permissionAttrs("model.write")}>\u590d</button><button class="icon-btn" onclick="updateModelStatusDirectly('${model.id}','${nextStatus}')" ${permissionAttrs("model.publish")}>${model.status === "active" ? "\u505c" : "\u542f"}</button><button class="icon-btn danger" onclick="openModelDeleteDrawer('${model.id}')" ${permissionAttrs("model.write")}>\u5220</button></div></td></tr>`;
      };

      async function saveModelSortOrder(modelId, value) {
        const model = state.models.find((item) => item.id === modelId);
        if (!model) return;
        const sortOrder = Number(value);
        if (!Number.isFinite(sortOrder)) {
          showToast("\u8bf7\u8f93\u5165\u6709\u6548\u6392\u5e8f\u503c");
          renderShell();
          return;
        }
        await api(`/api/admin/models/${encodeURIComponent(modelId)}`, {
          method: "PATCH",
          headers: { "idempotency-key": `admin-ui-model-sort-${modelId}-${Date.now()}` },
          body: JSON.stringify({ sortOrder, reason: "\u8c03\u6574\u6a21\u578b\u6392\u5e8f" }),
        });
        model.sortOrder = sortOrder;
        await loadModels();
        renderShell();
        showToast("\u6392\u5e8f\u5df2\u66f4\u65b0");
      }

      async function moveModelSortOrder(modelId, direction) {
        const rows = sortedModelRows();
        const index = rows.findIndex((item) => item.id === modelId);
        const target = rows[index + direction];
        if (index < 0 || !target) return;
        const current = rows[index];
        const currentSort = modelSortValue(current);
        const targetSort = modelSortValue(target);
        await Promise.all([
          api(`/api/admin/models/${encodeURIComponent(current.id)}`, {
            method: "PATCH",
            headers: { "idempotency-key": `admin-ui-model-sort-${current.id}-${Date.now()}` },
            body: JSON.stringify({ sortOrder: targetSort, reason: "\u8c03\u6574\u6a21\u578b\u6392\u5e8f" }),
          }),
          api(`/api/admin/models/${encodeURIComponent(target.id)}`, {
            method: "PATCH",
            headers: { "idempotency-key": `admin-ui-model-sort-${target.id}-${Date.now()}` },
            body: JSON.stringify({ sortOrder: currentSort, reason: "\u8c03\u6574\u6a21\u578b\u6392\u5e8f" }),
          }),
        ]);
        current.sortOrder = targetSort;
        target.sortOrder = currentSort;
        await loadModels();
        renderShell();
        showToast("\u6392\u5e8f\u5df2\u66f4\u65b0");
      }

      function openModelDeleteDrawer(modelId) {
        const model = state.models.find((item) => item.id === modelId);
        if (!model) return;
        const drawer = document.getElementById("drawer");
        drawer.classList.remove("hidden");
        drawer.innerHTML = `<aside class="drawer-panel">
          <div class="drawer-head"><h3>\u5220\u9664\u6a21\u578b</h3><button class="icon-btn" onclick="closeDrawer()">\u00d7</button></div>
          <p style="color:var(--muted);line-height:1.7">\u5220\u9664\u540e\u8be5\u6a21\u578b\u5c06\u4ece\u914d\u7f6e\u5217\u8868\u79fb\u9664\uff0c\u5386\u53f2\u751f\u6210\u4efb\u52a1\u4f1a\u4fdd\u7559\u6a21\u578b\u7f16\u7801\u8bb0\u5f55\u3002</p>
          <form id="model-delete-form">
            <div class="error-text" id="model-delete-error"></div>
            <button class="btn danger full" type="submit">\u786e\u8ba4\u5220\u9664</button>
          </form>

        document.getElementById("model-delete-form").addEventListener("submit", async (event) => {

          const form = new FormData(event.currentTarget);

          await runAdminMutation(event.currentTarget, error, async () => {
            await api(`/api/admin/models/${encodeURIComponent(modelId)}`, {

              headers: { "idempotency-key": `admin-ui-model-delete-${modelId}-${Date.now()}` },
              body: JSON.stringify({ reason: String(form.get("reason") || "") }),
            });
            await loadModels();
            closeDrawer();
            renderShell();
          }, "\u6a21\u578b\u5df2\u5220\u9664").catch(() => undefined);
        });
      }

      window.openParameterTemplateDrawer = openParameterTemplateDrawer;
      window.deleteParameterTemplate = deleteParameterTemplate;
      window.parameterTemplatesPage = parameterTemplatesPage;
      window.addParameterTemplateOption = addParameterTemplateOption;

      const DEFAULT_ADMIN_OPERATION_REASON = "\u540e\u53f0\u7ba1\u7406\u5458\u64cd\u4f5c";

      function stripAdminReasonFields(root = document) {
        const forms = new Set();
        root.querySelectorAll?.('textarea[name="reason"]').forEach((textarea) => {
          const form = textarea.closest("form");
          if (form?.dataset.requiresOperationReason === "true") return;
          if (form) forms.add(form);
          const field = textarea.closest(".field");
          (field || textarea).remove();
        });
        root.querySelectorAll?.("form").forEach((form) => forms.add(form));
        forms.forEach((form) => {
          if (form.dataset.requiresOperationReason === "true") return;
          if (!form.querySelector('input[type="hidden"][name="reason"]')) {
            const hidden = document.createElement("input");
            hidden.type = "hidden";
            hidden.name = "reason";
            hidden.value = DEFAULT_ADMIN_OPERATION_REASON;
            form.appendChild(hidden);
          }
        });
        root.querySelectorAll?.("p").forEach((paragraph) => {
          paragraph.textContent = paragraph.textContent
            .replace(/\u654f\u611f\u64cd\u4f5c\u5fc5\u987b\u586b\u5199\u539f\u56e0/g, "\u7cfb\u7edf\u4f1a\u81ea\u52a8\u8bb0\u5f55\u5ba1\u8ba1\u539f\u56e0")
            .replace(/\u5371\u9669\u64cd\u4f5c\u5fc5\u987b\u586b\u5199\u539f\u56e0/g, "\u7cfb\u7edf\u4f1a\u81ea\u52a8\u8bb0\u5f55\u5ba1\u8ba1\u539f\u56e0");
        });
      }

      const adminReasonObserver = new MutationObserver((mutations) => {
        for (const mutation of mutations) {
          mutation.addedNodes.forEach((node) => {
            if (node.nodeType === Node.ELEMENT_NODE) stripAdminReasonFields(node);
          });
        }
      });
      adminReasonObserver.observe(document.body, { childList: true, subtree: true });
      stripAdminReasonFields(document);
      setupDrawerInteractions();
      window.openPasswordChangeDrawer = openPasswordChangeDrawer;
      window.loadAdminSessions = loadAdminSessions;
      window.revokeOtherAdminSessions = revokeOtherAdminSessions;
      window.logout = logout;
      window.closeDrawer = closeDrawer;

      bootstrap();
    </script>
  </body>
</html>
