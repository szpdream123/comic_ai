<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>灵曦剧厂抖音宣传视频</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #08090d; }
    canvas { display: block; width: 540px; height: 960px; margin: 0 auto; }
    #status { position: fixed; left: 12px; bottom: 12px; color: #fff; font: 12px Consolas, monospace; }
  </style>
</head>
<body>
  <canvas id="video" width="1080" height="1920"></canvas>
  <audio id="narration" preload="auto" src="douyin-promo-narration.wav"></audio>
  <div id="status">loading</div>
  <script>
    const canvas = document.getElementById("video");
    const ctx = canvas.getContext("2d");
    const narration = document.getElementById("narration");
    const status = document.getElementById("status");
    const W = canvas.width;
    const H = canvas.height;
    const DURATION = 18;
    const FPS = 30;

    const sources = {
      chinese: "../../apps/admin/assets/prompt-covers/chinese_style.webp",
      portrait: "../../apps/admin/assets/prompt-covers/cinematic_portrait.webp",
      cyber: "../../apps/admin/assets/prompt-covers/cyberpunk.webp",
      storyboard: "../../docs/product/assets/creator-guide/10-storyboard.png",
      export: "../../docs/product/assets/creator-guide/14-export-modal.png"
    };

    const images = {};
    const clamp = (v, min = 0, max = 1) => Math.max(min, Math.min(max, v));
    const ease = v => 1 - Math.pow(1 - clamp(v), 3);
    const lerp = (a, b, v) => a + (b - a) * v;

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    function alphaFor(t, start, end, fade = 0.45) {
      return clamp((t - start) / fade) * clamp((end - t) / fade);
    }

    function background(accent = "cyan") {
      ctx.fillStyle = "#08090d";
      ctx.fillRect(0, 0, W, H);
      const g = ctx.createRadialGradient(accent === "cyan" ? 900 : 170, 220, 0, accent === "cyan" ? 900 : 170, 220, 650);
      g.addColorStop(0, accent === "cyan" ? "rgba(0,190,255,.20)" : "rgba(240,76,63,.17)");
      g.addColorStop(1, "rgba(8,9,13,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = "rgba(255,255,255,.035)";
      ctx.lineWidth = 1;
      for (let x = 0; x <= W; x += 72) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = 0; y <= H; y += 72) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    }

    function brand(y = 78) {
      ctx.fillStyle = "#5e8dff";
      ctx.beginPath(); ctx.roundRect(72, y, 44, 44, 11); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "700 23px 'Microsoft YaHei UI'";
      ctx.textAlign = "center";
      ctx.fillText("灵", 94, y + 30);
      ctx.textAlign = "left";
      ctx.fillStyle = "#d9dce4";
      ctx.font = "700 23px 'Microsoft YaHei UI'";
      ctx.fillText("灵曦剧厂", 128, y + 31);
    }

    function label(text, x, y, color = "#67ddff") {
      ctx.fillStyle = color;
      ctx.font = "20px Consolas, 'Microsoft YaHei UI'";
      ctx.fillText(text, x, y);
    }

    function coverImage(img, x, y, w, h, radius = 4) {
      ctx.save();
      ctx.beginPath(); ctx.roundRect(x, y, w, h, radius); ctx.clip();
      const scale = Math.max(w / img.width, h / img.height);
      const dw = img.width * scale;
      const dh = img.height * scale;
      ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
      ctx.restore();
      ctx.strokeStyle = "rgba(255,255,255,.28)";
      ctx.strokeRect(x, y, w, h);
    }

    function fitImage(img, x, y, w, h) {
      const scale = Math.min(w / img.width, h / img.height);
      const dw = img.width * scale;
      const dh = img.height * scale;
      ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
    }

    function sceneOne(t) {
      const a = alphaFor(t, 0, 3.55, .35);
      if (!a) return;
      ctx.save(); ctx.globalAlpha = a;
      background("cyan"); brand();
      const p = ease(t / 1.15);
      label("AI 漫剧全流程工作台", 72, 270);
      ctx.fillStyle = "#f7f8fb";
      ctx.font = "700 88px 'Microsoft YaHei UI'";
      ctx.fillText("一个人，也能把剧本", 72, lerp(510, 455, p));
      ctx.fillStyle = "#68dfff";
      ctx.font = "700 106px 'Microsoft YaHei UI'";
      ctx.fillText("推进到成片", 72, lerp(660, 595, p));
      ctx.fillStyle = "#b7bbc5";
      ctx.font = "29px 'Microsoft YaHei UI'";
      ctx.fillText("真正费时间的，不是生成一张图", 74, 760);
      ctx.fillText("而是把每一个镜头稳稳接起来", 74, 815);
      const lineP = ease(clamp((t - .6) / 1.2));
      ctx.fillStyle = "#67ddff";
      ctx.fillRect(72, 900, 690 * lineP, 4);
      ctx.fillStyle = "#7e838d";
      ctx.font = "20px Consolas, 'Microsoft YaHei UI'";
      ctx.fillText("SCRIPT / ASSET / SHOT / VIDEO / EXPORT", 72, 947);
      ctx.restore();
    }

    function sceneTwo(t) {
      const start = 3.05, end = 7.25;
      const a = alphaFor(t, start, end, .5);
      if (!a) return;
      ctx.save(); ctx.globalAlpha = a;
      background("warm"); brand();
      label("01 / 先把核心资产管起来", 72, 245, "#ff776d");
      ctx.fillStyle = "#fff";
      ctx.font = "700 68px 'Microsoft YaHei UI'";
      ctx.fillText("风格可以不同", 72, 365);
      ctx.fillStyle = "#ff766d";
      ctx.fillText("角色必须统一", 72, 455);
      const imgs = [images.chinese, images.portrait, images.cyber];
      const xs = [50, 390, 730];
      imgs.forEach((img, i) => {
        const p = ease(clamp((t - start - .25 - i * .16) / .8));
        const y = lerp(760, 620, p);
        ctx.save();
        ctx.translate(xs[i] + 150, y + 240);
        ctx.scale(lerp(.88, 1, p), lerp(.88, 1, p));
        coverImage(img, -150, -240, 300, 480);
        ctx.restore();
      });
      ctx.fillStyle = "rgba(255,255,255,.07)";
      ctx.fillRect(72, 1210, 936, 135);
      ctx.fillStyle = "#fff";
      ctx.font = "700 31px 'Microsoft YaHei UI'";
      ctx.fillText("角色  /  场景  /  道具", 112, 1270);
      ctx.fillStyle = "#aeb2bc";
      ctx.font = "24px 'Microsoft YaHei UI'";
      ctx.fillText("集中管理，后续镜头反复引用", 112, 1315);
      ctx.restore();
    }

    function sceneThree(t) {
      const start = 6.75, end = 11.25;
      const a = alphaFor(t, start, end, .5);
      if (!a) return;
      ctx.save(); ctx.globalAlpha = a;
      background("cyan"); brand();
      label("02 / 真实工作台", 72, 245);
      ctx.fillStyle = "#fff";
      ctx.font = "700 68px 'Microsoft YaHei UI'";
      ctx.fillText("逐镜推进，不丢上下文", 72, 365);
      const p = ease(clamp((t - start) / 3.5));
      const x = lerp(36, 62, p);
      const y = 500;
      const w = 956;
      const h = 598;
      ctx.fillStyle = "#151722";
      ctx.fillRect(x - 10, y - 10, w + 20, h + 20);
      ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
      const scale = Math.max(w / images.storyboard.width, h / images.storyboard.height) * 1.08;
      const dw = images.storyboard.width * scale;
      const dh = images.storyboard.height * scale;
      ctx.drawImage(images.storyboard, x + (w - dw) / 2 - p * 42, y + (h - dh) / 2, dw, dh);
      ctx.restore();
      const chips = ["分镜可追踪", "首帧生视频", "全能参考"];
      chips.forEach((text, i) => {
        const cx = 72 + i * 306;
        ctx.fillStyle = i === 0 ? "#67ddff" : "rgba(255,255,255,.09)";
        ctx.beginPath(); ctx.roundRect(cx, 1180, 270, 76, 38); ctx.fill();
        ctx.fillStyle = i === 0 ? "#071017" : "#fff";
        ctx.font = "700 23px 'Microsoft YaHei UI'";
        ctx.textAlign = "center"; ctx.fillText(text, cx + 135, 1228); ctx.textAlign = "left";
      });
      ctx.fillStyle = "#aeb2bc";
      ctx.font = "27px 'Microsoft YaHei UI'";
      ctx.fillText("每条分镜都有明确画面、首帧和视频结果", 72, 1370);
      ctx.restore();
    }

    function sceneFour(t) {
      const start = 10.75, end = 15.35;
      const a = alphaFor(t, start, end, .5);
      if (!a) return;
      ctx.save(); ctx.globalAlpha = a;
      background("warm"); brand();
      label("03 / 一条完整生产链", 72, 245, "#ff776d");
      ctx.fillStyle = "#fff";
      ctx.font = "700 72px 'Microsoft YaHei UI'";
      ctx.fillText("从剧本，到可剪辑结果", 72, 375);
      const steps = [
        ["01", "剧本"], ["02", "角色资产"], ["03", "拆分镜"], ["04", "图转视频"], ["05", "剪映导出"]
      ];
      steps.forEach((step, i) => {
        const p = ease(clamp((t - start - .2 - i * .14) / .7));
        const y = 520 + i * 172;
        ctx.globalAlpha = a * p;
        ctx.fillStyle = i === 4 ? "#f5f6f8" : "rgba(255,255,255,.075)";
        ctx.fillRect(72, y, 936, 128);
        ctx.fillStyle = i === 4 ? "#ef4e45" : "#67ddff";
        ctx.font = "22px Consolas";
        ctx.fillText(step[0], 108, y + 74);
        ctx.fillStyle = i === 4 ? "#111217" : "#fff";
        ctx.font = "700 35px 'Microsoft YaHei UI'";
        ctx.fillText(step[1], 210, y + 79);
        if (i < 4) {
          ctx.fillStyle = "#777c86";
          ctx.font = "26px Consolas";
          ctx.fillText("↓", 936, y + 78);
        }
      });
      ctx.globalAlpha = a;
      ctx.fillStyle = "#aeb2bc";
      ctx.font = "25px 'Microsoft YaHei UI'";
      ctx.fillText("MP4 / 剪映工程，按镜头继续完成后期", 72, 1465);
      ctx.restore();
    }

    function sceneFive(t) {
      const start = 14.85, end = 18.1;
      const a = alphaFor(t, start, end, .45);
      if (!a) return;
      ctx.save(); ctx.globalAlpha = a;
      background("cyan");
      const p = ease(clamp((t - start) / 1.1));
      label("AI COMIC STUDIO / 灵曦剧厂", 72, 320);
      ctx.fillStyle = "#fff";
      ctx.font = "700 84px 'Microsoft YaHei UI'";
      ctx.fillText("不是只出一张图", 72, lerp(620, 560, p));
      ctx.fillStyle = "#69dfff";
      ctx.fillText("是把作品做下去", 72, lerp(745, 680, p));
      ctx.fillStyle = "#b7bbc5";
      ctx.font = "29px 'Microsoft YaHei UI'";
      ctx.fillText("剧本 · 资产 · 分镜 · 视频 · 剪映导出", 74, 810);
      ctx.fillStyle = "rgba(255,255,255,.07)";
      ctx.fillRect(72, 940, 936, 2);
      brand(1010);
      ctx.fillStyle = "#7f848e";
      ctx.font = "21px 'Microsoft YaHei UI'";
      ctx.fillText("适合短剧、漫剧与分镜视频创作者", 72, 1120);
      ctx.restore();
    }

    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      sceneOne(t);
      sceneTwo(t);
      sceneThree(t);
      sceneFour(t);
      sceneFive(t);
    }

    async function start() {
      for (const [key, src] of Object.entries(sources)) images[key] = await loadImage(src);
      await new Promise((resolve, reject) => {
        if (narration.readyState >= 3) resolve();
        else {
          narration.addEventListener("canplay", resolve, { once: true });
          narration.addEventListener("error", reject, { once: true });
        }
      });
      const videoStream = canvas.captureStream(0);
      const videoTrack = videoStream.getVideoTracks()[0];
      const audioContext = new AudioContext();
      const audioSource = audioContext.createMediaElementSource(narration);
      const audioDestination = audioContext.createMediaStreamDestination();
      audioSource.connect(audioDestination);
      const stream = new MediaStream([
        videoTrack,
        ...audioDestination.stream.getAudioTracks()
      ]);
      const mimeCandidates = [
        'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',
        "video/mp4;codecs=avc1.42E01E",
        "video/mp4",
        "video/webm;codecs=vp9",
        "video/webm;codecs=vp8"
      ];
      const mimeType = mimeCandidates.find(type => MediaRecorder.isTypeSupported(type));
      if (!mimeType) throw new Error("No supported video recording format");
      const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 9000000 });
      const chunks = [];
      recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: mimeType });
        const ext = mimeType.startsWith("video/mp4") ? "mp4" : "webm";
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `douyin-promo-video-narrated.${ext}`;
        document.body.appendChild(link);
        link.click();
        status.textContent = `done:${ext}:${blob.size}`;
        document.title = `DONE-${ext}-${blob.size}`;
      };
      await audioContext.resume();
      recorder.start(1000);
      narration.currentTime = 0;
      await narration.play();
      const started = performance.now();
      function frame() {
        const t = (performance.now() - started) / 1000;
        draw(Math.min(t, DURATION));
        videoTrack.requestFrame();
        status.textContent = `${mimeType} ${t.toFixed(1)} / ${DURATION}s`;
        if (t < DURATION) setTimeout(frame, 1000 / FPS);
        else recorder.stop();
      }
      frame();
    }

    start().catch(error => {
      status.textContent = `error:${error.message}`;
      document.title = `ERROR-${error.message}`;
    });
  </script>
</body>
</html>
