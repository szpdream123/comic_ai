<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>灵曦剧厂 - 抖音宣传图</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
    body {
      font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif;
      color: #f7f8fb;
      background: #08090d;
    }
    .poster {
      position: relative;
      width: 1080px;
      height: 1920px;
      padding: 76px 72px 70px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(8,9,13,.04) 0%, #08090d 87%),
        radial-gradient(circle at 87% 13%, rgba(0,192,255,.20), transparent 24%),
        radial-gradient(circle at 12% 45%, rgba(255,91,77,.16), transparent 26%),
        #08090d;
    }
    .poster::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .22;
      background-image:
        linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(to bottom, black, transparent 72%);
    }
    .topline, .copy, .stage, .bottom { position: relative; z-index: 2; }
    .topline { display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 23px; font-weight: 700; color: #d8dbe2; }
    .mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 11px;
      font-size: 22px;
      background: linear-gradient(145deg, #844fff, #00c8ff);
      box-shadow: 0 12px 35px rgba(82,112,255,.35);
    }
    .mode {
      padding: 12px 18px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 999px;
      color: #c8cbd3;
      font: 16px Consolas, monospace;
    }
    .copy { margin-top: 90px; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: #61ddff;
      font: 20px Consolas, monospace;
      letter-spacing: 0;
    }
    .eyebrow::before { content: ""; width: 46px; height: 2px; background: #61ddff; }
    h1 {
      margin: 28px 0 28px;
      max-width: 900px;
      font-size: 92px;
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: 0;
    }
    h1 span { color: #83e7ff; }
    .subtitle {
      max-width: 800px;
      color: #b9bdc7;
      font-size: 29px;
      line-height: 1.7;
      letter-spacing: 0;
    }
    .stage { height: 780px; margin-top: 68px; }
    .frame {
      position: absolute;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.22);
      background: #151722;
      box-shadow: 0 34px 90px rgba(0,0,0,.5);
    }
    .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .f1 { left: 0; top: 50px; width: 300px; height: 410px; transform: rotate(-7deg); }
    .f2 { left: 318px; top: 0; width: 300px; height: 410px; transform: rotate(1deg); z-index: 2; }
    .f3 { right: 0; top: 55px; width: 300px; height: 410px; transform: rotate(7deg); }
    .screen {
      left: 48px;
      top: 390px;
      width: 840px;
      height: 470px;
      transform: rotate(-1.5deg);
      border-radius: 6px;
      z-index: 4;
    }
    .screen img { object-position: 72% center; }
    .screen::after {
      content: "剧本  →  资产  →  分镜  →  视频  →  导出";
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 24px;
      padding: 18px 22px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(7,8,12,.88);
      color: #fff;
      font-size: 22px;
      text-align: center;
      backdrop-filter: blur(16px);
    }
    .result {
      position: absolute;
      right: 2px;
      top: 564px;
      z-index: 6;
      padding: 22px 28px;
      border: 1px solid rgba(255,255,255,.20);
      background: #f6f7f9;
      color: #101116;
      font-size: 24px;
      font-weight: 700;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    .result b { color: #ec4e3d; }
    .bottom { margin-top: 55px; display: flex; align-items: flex-end; }
    .promise { font-size: 34px; line-height: 1.45; font-weight: 700; }
    .promise small { display: block; margin-top: 12px; color: #8f949f; font-size: 19px; font-weight: 400; }
  </style>
</head>
<body>
  <main class="poster">
    <header class="topline">
      <div class="brand"><span class="mark">灵</span><span>灵曦剧厂</span></div>
      <div class="mode">AI COMIC STUDIO / 01</div>
    </header>
    <section class="copy">
      <div class="eyebrow">AI 漫剧全流程工作台</div>
      <h1>一个人，也能把剧本<br><span>推进到成片</span></h1>
      <div class="subtitle">角色不乱、镜头不丢、素材可复用。<br>从第一行剧本，到最后一个可剪辑镜头。</div>
    </section>
    <section class="stage">
      <div class="frame f1"><img src="../../apps/admin/assets/prompt-covers/chinese_style.webp" alt="中国风角色"></div>
      <div class="frame f2"><img src="../../apps/admin/assets/prompt-covers/cinematic_portrait.webp" alt="电影人像角色"></div>
      <div class="frame f3"><img src="../../apps/admin/assets/prompt-covers/cyberpunk.webp" alt="赛博角色"></div>
      <div class="frame screen"><img src="../../docs/product/assets/creator-guide/10-storyboard.png" alt="灵曦剧厂分镜工作台"></div>
      <div class="result"><b>MP4</b> / 剪映工程 一键导出</div>
    </section>
    <footer class="bottom">
      <div class="promise">不是只出一张图<br>是把整部作品做下去<small>适合短剧 · 漫剧 · 分镜视频创作者</small></div>
    </footer>
  </main>
</body>
</html>
